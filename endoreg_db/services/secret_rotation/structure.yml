version: 1
tier: service
path: endoreg_db/services/secret_rotation
parent: ../structure.yml
summary: Transactional identity-salt migration and encrypted-storage rotation.
responsibilities:
- Preview or apply encrypted-storage rotation using managed key generations.
- Serialize reviewed identity-salt migration while preserving clinical relationships.
boundaries:
- Keep workflow ownership in services; preserve existing model compatibility wrappers.
entrypoints:
- name: rotate_identity_salt
  file: migration.py
  purpose: Typed preview and apply service used by the command with explicit compromised recovery.
- name: rotate_storage
  file: storage.py
  purpose: Preview or apply encrypted-artifact rotation using the configured master keyring.
- name: identity_rotation_transaction
  file: identity.py
  purpose: Serialize identity migration and resolution in a transaction with a fixed keyring snapshot.
files:
- file: legacy_hashes.py
  role: Strict whole-inventory HMAC preflight, collision detection, atomic batched publication and post-flight verification.
- file: migration.py
  role: Whole-run migration with immutable salt snapshot, generation pin, reviewed compromised recovery and rollback.
- file: historical_resolution.py
  role: Source patient recognition across retained salts, legacy aliases and canonical HMACs without restoring erased identifiers.
- file: __init__.py
  role: Explicit online rotation workflows; never provision or publish secrets.
- file: identity.py
  role: Transactional identity rotation with legacy and HMAC source resolution and canonical patient, examination and examiner HMAC targets.
- file: storage.py
  role: Exports rotate_storage.
dependencies:
  internal:
  - endoreg_db/config
  - endoreg_db/models
  - endoreg_db/services/media
  - endoreg_db/services/streaming
  - endoreg_db/utils
  external:
  - cryptography
  - django
  - pydantic
submodules: []
contracts:
- name: Service ownership and compatibility
  doc: feature-tracking/CodeQuality.yml
- name: Managed key rotation
  doc: docs/key_rotation.md
- name: Identity keyring enrollment
  doc: docs/identity_ring_enrollment.md
tests:
  directory: tests
  fast_lane_command: .devenv/state/venv/bin/pytest tests/services/test_identity_salt_rotation.py tests/services/test_hls_media.py
    tests/services/test_secret_rotation.py
  files:
  - tests/services/test_migrate_legacy_hashes.py
  - tests/services/test_identity_salt_rotation.py
  - tests/services/test_hls_media.py
  - tests/services/test_secret_rotation.py
