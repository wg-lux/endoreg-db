schema_version: '1.0'
feature_definition: ../../feature-tracking/CodeQuality.yml
criterion: helper_class_boundaries
rules:
- Die Wurzel enthält keine Workflow-Implementierungen.
- Module nach fachlicher Aufgabe öffnen; konkrete Funktionen aus dem zuständigen Modul
  importieren.
- Unterpakete initialisieren keine Datenbank-, Netzwerk- oder Medienoperationen.
- Bestehende Modellfassaden und Import-Einstiegspunkte behalten ihr Verhalten.
domains:
  datasets:
    purpose: Trainingsauswahl, Active Learning und Datensatzexporte
  annotations:
    purpose: Frame- und Segmentannotation, Auswahl und Validierungsabläufe
  privacy:
    purpose: Anonymisierung, Pseudonymisierung und Qualitätsmessung
  patient_identity:
    purpose: Patientenkennungen und verifizierte sensible Metadaten
  cases:
    purpose: Falllebenszyklus, Dokumentzuordnung und Untersuchungsbeziehungen
  centers:
    purpose: Zentrumszugriff, Importzuordnung und Mitarbeiter
  reference_data:
    purpose: Klinische Referenzen und versionierte Referenzkataloge
  studies:
    purpose: Studienvorgaben und Kohortenabfragen
  reports:
    purpose: Berichtimport, klinischer Kontext, Persistenz und PDF-Ausgabe
  runtime:
    purpose: Deployment, Betriebsbereitschaft und Dienstkoordination
  imports:
    purpose: Gemeinsame Importausführung, Besitzprüfung und tabellarische Eingaben
  interoperability:
    purpose: FHIR, DICOM, SAP IS-H und Medical Ledger
  streaming:
    purpose: HTTP Live Streaming, streambare Medien und seekbare Eingaben
  media:
    purpose: Medienintegrität, Operationsleases und Exportfreigabe
  frames:
    purpose: Trainingsframes, Aufbewahrung und Segmentabgleich
  video_files:
    purpose: Videodateien, direkter Import, Reimport und Verarbeitung
  video_storage:
    purpose: Speicherprofile, Normalisierung, Transcoding und Generationenbereinigung
  ai:
    purpose: Bereitstellung von Modellgewichten
  audit:
    purpose: Integritätsprüfung des Audit-Ledgers
  hub:
    purpose: Knotenkommunikation, Transfer, Aufnahme und Speicherverteilung
  jobs:
    purpose: Hintergrundaufträge, Budgets, Zeitlimits und Wiederaufnahme
  queue:
    purpose: Warteschlange für Frame-Annotationen
  raw_pdf_files:
    purpose: 'Roh-PDF-Dateien: Import, Metadaten, Integrität und Zustand'
  secret_rotation:
    purpose: Rotation von Speicher- und Identitätsgeheimnissen
  application_settings:
    purpose: Anwendungseinstellungen für Datensatzexporte
