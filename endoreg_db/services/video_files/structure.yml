version: 1
tier: service
path: endoreg_db/services/video_files
parent: ../structure.yml
summary: Canonical video import, processing, frame operations and clinical coordinates.
responsibilities:
- Own direct video imports, reimports and processing workflows.
- Manage protected video access, frame extraction and persisted clinical coordinates.
boundaries:
- Keep workflow ownership in services; preserve existing model compatibility wrappers.
- Use runtime-path and typed filesystem helpers; preserve encrypted storage and canonical generation ownership.
- Persisted presentation timestamps define clinical coordinates; streaming derivatives cannot replace canonical
  masters.
entrypoints:
- name: VideoImportService
  file: direct_import.py
  purpose: Own durable direct-import claims while importing or reanonymizing canonical videos.
- name: VideoReimportOrchestrator
  file: reimport_orchestrator.py
  purpose: Coordinate explicit video reimport after source availability and integrity checks.
files:
- file: annotation_timeline_recovery.py
  role: Explicit two-second processed-ordinal correction preserving labels and recording typed segment mappings; the backfill transaction clears review/export validation.
- file: __init__.py
  role: Package marker only; callers import the owning module directly.
- file: _ai.py
  role: Streaming frame scores with observed exclusive score boundaries and canonical raw-frame metadata recognition.
- file: _anonymization.py
  role: Streamed raw anonymization using the shared outside-interval collector and typed region-of-interest validation.
- file: _imports.py
  role: Raw import and capacity helpers; register the actual raw storage name as retained UploadJob intent before writing, preserving ownership across ambiguous publication without automatic orphan reclamation.
- file: _segments.py
  role: Exports get_outside_frames, get_outside_segments, convert_sequences_to_db_segments.
- file: _time.py
  role: Shared generation-bound source evidence, canonical mapping construction and per-boundary/neighborhood coordinate resolution.
- file: ai.py
  role: Exports predict_video, extract_text_from_video_frames.
- file: anonymization.py
  role: Exports anonymize_video_file, cleanup_video_raw_assets, merge_outside_frame_intervals.
- file: clinical_contracts.py
  role: Build clinical ledger exports with batched exact segment coordinates bound to current provenance.
- file: deletion.py
  role: Explicit video deletion using persisted ownership, with synchronous frame-directory removal and retryable failures, never filename searches.
- file: direct_import.py
  role: Direct video imports bind the resolved center key and acquire the same durable ownership as queued imports.
- file: frame_coordinates.py
  role: Exact generation-bound artifact timelines, annotation artifact selection and persisted prediction windows.
- file: frames.py
  role: Exports extract_video_frames, initialize_video_frames, delete_video_frames.
- file: imports.py
  role: Exports create_video_file_from_path, create_initialized_video_file_from_path, initialize_video_file.
- file: io.py
  role: Protected file access and shared owned-file deletion for full record removal or verified post-transfer reclamation.
- file: metadata.py
  role: Exports get_video_ffmpeg_meta, update_video_meta, initialize_video_specs.
- file: post_validation_blackening.py
  role: Merged outside intervals and generation-bound blackening publication; verified output checkpoints resume streaming and cleanup without re-encoding.
- file: processor_resolution.py
  role: Resolve explicit video processor names or the configured application default; missing configuration fails closed.
- file: queries.py
  role: Exports video_hash_exists, get_video_by_pk, get_video_by_content_hash.
- file: reimport_orchestrator.py
  role: Exports VideoReimportOrchestrator.
- file: segment_coordinates.py
  role: Pure exact segment ticks on the processed generation and composed original-recording frames from verified
    provenance, or explicit unresolved status; single conversion into the lx-dtypes wire contract.
- file: segment_blackening.py
  role: Typed configuration boundary for outside-frame video blackening.
- file: segments.py
  role: Exports get_video_outside_segments.
- file: source_hash.py
  role: Reuse verified plaintext hashes within one encrypted-filesystem process.
- file: state.py
  role: Exports get_or_create_video_state.
- file: streaming.py
  role: Exports get_active_raw_video_file, get_active_video_file, get_active_video_file_path.
- file: temporal_inference.py
  role: Generation-bound clinical score timelines, fenced prediction publication and durable upload prediction replay.
- file: timestamp_backfill.py
  role: Reconcile missing frame coordinates under publication locking; explicit operator-confirmed processed ordinals support two-second legacy annotation correction with cleared review/export validation and rollback-only preview.
- file: timeline_backfill.py
  role: Read-only classification of video timelines plus operator-applied recovery through timestamp_backfill; unverifiable media is reported, never estimated.
- file: timeline_index.py
  role: Request-scoped native TimelineIndex per video generation; one meta validation and one frame query for
    populated coordinates, with absent coordinates delegated to timestamp_backfill.
- file: types.py
  role: Exports parse_video_artifact_kind.
- file: validation.py
  role: Native integrity admission and checked correction of inferred video identity.
- file: video_masks.py
  role: Host persistence for immutable masks validated and loaded by lx-dtypes.
dependencies:
  internal:
  - endoreg_db
  - endoreg_db/config
  - endoreg_db/import_files
  - endoreg_db/import_files/context
  - endoreg_db/import_files/file_storage
  - endoreg_db/models
  - endoreg_db/schemas
  - endoreg_db/services/annotations
  - endoreg_db/services/cases
  - endoreg_db/services/centers
  - endoreg_db/services/hub
  - endoreg_db/services/imports
  - endoreg_db/services/jobs
  - endoreg_db/services/media
  - endoreg_db/services/secret_rotation
  - endoreg_db/services/streaming
  - endoreg_db/services/video_storage
  - endoreg_db/utils
  external:
  - cv2
  - django
  - lx_anonymizer
  - lx_dtypes
  - numpy
  - pydantic
  - rest_framework
  - yaml
submodules:
- name: _frames
  path: _frames
  manifest: _frames/structure.yml
  summary: Internal frame extraction, initialization and cache ownership helpers.
- name: _metadata
  path: _metadata
  manifest: _metadata/structure.yml
  summary: Internal video specification, crop, region and metadata helpers.
contracts:
- name: Service ownership and compatibility
  doc: feature-tracking/CodeQuality.yml
- name: Video storage and timeline contract
  doc: docs/video_storage_normalization.md
- name: Video readiness evidence
  doc: feature-tracking/VideoStorageNormalization.yml
- name: Presentation timestamp call sites
  doc: docs/video_pts_fps_callsite_inventory.md
tests:
  directory: tests
  fast_lane_command: .devenv/state/venv/bin/pytest tests/services/test_video_file_services_contract.py tests/services/test_canonical_playback_selection.py
    tests/services/test_segment_frame_extraction.py tests/services/test_segment_coordinates.py
    tests/rust_backend/test_timeline_index.py tests/services/test_video_owned_deletion.py
  files:
  - tests/services/test_video_owned_deletion.py
  - tests/services/test_lx_video_contracts.py
  - tests/services/test_video_file_services_contract.py
  - tests/services/test_canonical_playback_selection.py
  - tests/services/test_segment_frame_extraction.py
