version: 1
tier: service
path: endoreg_db/services/audit
parent: ../structure.yml
summary: Audit-ledger integrity status and refresh workflows.
responsibilities:
- Cache and refresh audit-ledger integrity checks.
boundaries:
- Keep workflow ownership in services; preserve existing model compatibility wrappers.
entrypoints:
- name: get_audit_ledger_integrity_status
  file: integrity.py
  purpose: Return the cached ledger integrity status without running a full chain scan.
files:
- file: __init__.py
  role: Integritätsprüfung des Audit-Ledgers.
- file: integrity.py
  role: Exports get_audit_ledger_integrity_status, refresh_audit_ledger_integrity_status, refresh_audit_ledger_integrity_status_once.
dependencies:
  internal:
  - endoreg_db/models
  - endoreg_db/utils
  external:
  - django
submodules: []
contracts:
- name: Service ownership and compatibility
  doc: feature-tracking/CodeQuality.yml
tests:
  directory: tests
  fast_lane_command: .devenv/state/venv/bin/pytest tests/services/test_audit_integrity.py tests/views/misc/test_stats_endpoints.py
    tests/test_tasks.py
  files:
  - tests/services/test_audit_integrity.py
  - tests/views/misc/test_stats_endpoints.py
  - tests/test_tasks.py
