version: 1
tier: service
path: endoreg_db/services/ai
parent: ../structure.yml
summary: Model-weight acquisition and model metadata provisioning.
responsibilities:
- Acquire model weights and persist matching model configuration.
boundaries:
- Keep workflow ownership in services; preserve existing model compatibility wrappers.
entrypoints:
- name: ensure_model_meta_from_hf
  file: model_meta_from_hf.py
  purpose: Acquire model weights and persist ModelMeta for the validated configuration.
files:
- file: __init__.py
  role: Bereitstellung von Modellgewichten.
- file: model_meta_from_hf.py
  role: Exports hf_hub_download, ensure_model_meta_from_hf.
dependencies:
  internal:
  - endoreg_db/models
  - endoreg_db/utils
  external:
  - django
  - lx_dtypes
submodules: []
contracts:
- name: Service ownership and compatibility
  doc: feature-tracking/CodeQuality.yml
tests:
  directory: tests
  fast_lane_command: .devenv/state/venv/bin/pytest tests/services/test_model_meta_from_hf.py tests/ai/test_ai_model_get_latest_version.py
  files:
  - tests/services/test_model_meta_from_hf.py
  - tests/ai/test_ai_model_get_latest_version.py
