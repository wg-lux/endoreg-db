version: 1
tier: service
path: endoreg_db/services/interoperability
parent: ../structure.yml
summary: FHIR, DICOM, SAP IS-H and typed medical-ledger integrations.
responsibilities:
- Validate anonymized DICOM imports and pseudonymized FHIR exports.
- Normalize SAP IS-H inputs and project typed medical-ledger records.
boundaries:
- Keep workflow ownership in services; preserve existing model compatibility wrappers.
entrypoints:
- name: build_patient_examination_fhir_bundle
  file: fhir_r4.py
  purpose: Build and validate one read-only, pseudonymized FHIR R4 Bundle.
- name: import_dicom_export_manifest
  file: dicom_import.py
  purpose: Validate and idempotently catalogue one anonymized DICOM study.
files:
- file: __init__.py
  role: Package imports and compatibility exports.
- file: dicom_import.py
  role: Exports import_dicom_export_manifest.
- file: dicom_manifest_backfill.py
  role: Exports backfill_dicom_export_manifests_v2.
- file: fhir_r4.py
  role: Exports build_patient_examination_fhir_bundle.
- file: medical_ledger.py
  role: Typed medical ledger projection and transactional, idempotent persistence of medication, laboratory, disease and event records.
- file: sap_ish_clinical.py
  role: Exports persist_sap_ish_clinical_rows.
- file: sap_ish_import.py
  role: Exports sap_ish_external_id_origin, convert_sap_ish_txt_directory_to_preanonymized_drop, convert_sap_ish_zip_to_preanonymized_drop.
dependencies:
  internal:
  - endoreg_db
  - endoreg_db/models
  - endoreg_db/schemas
  - endoreg_db/services/imports
  - endoreg_db/services/reference_data
  - endoreg_db/utils
  external:
  - django
  - lx_dtypes
  - pydantic
  - yaml
submodules: []
contracts:
- name: Service ownership and compatibility
  doc: feature-tracking/CodeQuality.yml
tests:
  directory: tests
  fast_lane_command: .devenv/state/venv/bin/pytest tests/services/test_fhir_r4_export.py tests/services/test_medical_ledger_transactions.py
    tests/services/test_sap_ish_clinical.py
  files:
  - tests/services/test_fhir_r4_export.py
  - tests/services/test_medical_ledger_transactions.py
  - tests/services/test_sap_ish_clinical.py
