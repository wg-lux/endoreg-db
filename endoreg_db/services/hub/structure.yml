version: 1
tier: service
path: endoreg_db/services/hub
parent: ../structure.yml
summary: Center intake, authenticated transfer and distributed processed-media placement.
responsibilities:
- Coordinate fenced center uploads and local watcher intake.
- Authenticate processed-media transfers and reconcile distributed storage placements.
boundaries:
- Keep workflow ownership in services; preserve existing model compatibility wrappers.
- Use runtime-path and typed filesystem helpers; preserve encrypted storage and canonical generation ownership.
- Persisted presentation timestamps define clinical coordinates; streaming derivatives cannot replace canonical
  masters.
- Export only approved anonymized processed media; authentication secrets never encrypt payloads.
- Preserve ingest helper re-exports and fenced import ownership; helpers do not import ingest.py.
entrypoints:
- name: process_upload_job
  file: ingest.py
  purpose: Run fenced upload ingestion and publish validated media through the existing import services.
- name: process_watcher_file
  file: ingest.py
  purpose: Resolve a settled local watcher source into the upload ingestion workflow.
- name: attach_enveloped_transfer_media
  file: transfers.py
  purpose: Authenticate and atomically publish one processed-media envelope.
- name: reserve_storage_placement
  file: storage_placement.py
  purpose: Atomically reserve capacity and persist the primary placement intent.
files:
- file: video_provenance_recovery.py
  role: Explicit audited acknowledgment of unresolved frame mapping with current hashes and retained original timestamps.
- file: __init__.py
  role: Package imports and compatibility exports.
- file: audit.py
  role: Exports emit_hub_audit_event.
- file: cleanup.py
  role: Exports additional_source_paths, inspect_upload_job_source, apply_upload_job_source_cleanup.
- file: deployment.py
  role: Exports get_deployment_role, hub_mode_enabled, local_study_server_mode_enabled.
- file: import_monitoring.py
  role: Exports can_dismiss_upload_job, dismissed_upload_job_filter, safe_import_error_detail.
- file: ingest.py
  role: Upload and watcher orchestration with historical helper re-exports.
- file: ingest_provenance.py
  role: Upload provenance construction and updates; orchestration lives in ingest.py.
- file: media_integrity.py
  role: Exports video_integrity_failure_allows_existing_video_reprocessing, require_reusable_video_raw_source, has_verified_processed_video_transfer.
- file: network_nodes.py
  role: Exports create_network_node, update_network_node, delete_network_node.
- file: payloads.py
  role: Internal helpers and compatibility imports.
- file: preanonymized_metadata.py
  role: Preanonymized metadata normalization and external patient identity linking.
- file: quarantine.py
  role: Exports quarantine_dir, index_quarantine_file, sync_quarantine_inventory.
- file: remote_processed_media.py
  role: Dependency-inverted provider boundary for a remotely placed video master.
- file: remote_processed_report.py
  role: Dependency-inverted provider boundary for a remotely placed processed PDF.
- file: storage_artifact_resolution.py
  role: Exact, non-network resolution of current processed-media placements.
- file: storage_balancing.py
  role: Exports plan_storage_balancing, cancel_storage_balance_work, reconcile_storage_balancing.
- file: storage_operator_control.py
  role: Exports set_storage_balancing_paused, request_manual_storage_action, request_storage_balance_retry.
- file: storage_placement.py
  role: Exports plan_storage_placement, reserve_storage_placement, transition_storage_reservation.
- file: storage_reconciliation.py
  role: Exports reconcile_storage_state.
- file: storage_rotation.py
  role: Exports request_storage_rotation, record_storage_rotation_verification, record_storage_rotation_cleanup_readiness.
- file: storage_telemetry.py
  role: Exports record_storage_node_telemetry, record_storage_node_probe_failure.
- file: storage_transfer.py
  role: Exports record_stored_transfer_evidence, record_verified_transfer_evidence, replace_verified_transfer_evidence.
- file: transfer_envelope.py
  role: Fail-closed receiver boundary for site-to-hub media envelopes.
- file: transfer_logging.py
  role: Exports enabled, sanitize, section.
- file: transfers.py
  role: Exports create_or_reuse_transfer_job, authenticate_network_node, apply_transfer_metadata.
- file: upload_job_cancellation.py
  role: Persist import cancellation intent; only the owning worker acknowledges it.
- file: upload_job_files.py
  role: Central ownership inventory shared by import staging and source cleanup.
- file: upload_job_import_lease.py
  role: Exports acquire_upload_job_import_lease, heartbeat_upload_job_import_lease, locked_upload_job_import_lease.
- file: upload_job_state_machine.py
  role: Exports validate_upload_job_status_transition, mark_upload_job_processing, mark_upload_job_completed.
- file: video_provenance.py
  role: Privacy-limited video ancestry exchange and explicit independent-clock joins.
- file: watcher_handoff.py
  role: Exports watcher_path_reference_text, is_in_progress_handoff_path, reject_in_progress_handoff_path.
dependencies:
  internal:
  - endoreg_db
  - endoreg_db/config
  - endoreg_db/import_files
  - endoreg_db/models
  - endoreg_db/schemas
  - endoreg_db/services/cases
  - endoreg_db/services/centers
  - endoreg_db/services/imports
  - endoreg_db/services/jobs
  - endoreg_db/services/media
  - endoreg_db/services/raw_pdf_files
  - endoreg_db/services/reports
  - endoreg_db/services/runtime
  - endoreg_db/services/streaming
  - endoreg_db/services/video_files
  - endoreg_db/services/video_storage
  - endoreg_db/utils
  external:
  - cryptography
  - django
  - lx_dtypes
  - pydantic
  - yaml
submodules: []
contracts:
- name: Service ownership and compatibility
  doc: feature-tracking/CodeQuality.yml
- name: Video storage and timeline contract
  doc: docs/video_storage_normalization.md
- name: Video readiness evidence
  doc: feature-tracking/VideoStorageNormalization.yml
- name: Hub ingest operations
  doc: docs/hub_ingest_operations.md
- name: Typed transfer contract
  doc: docs/hub_transfer_typed_contract.en.md
tests:
  directory: tests
  fast_lane_command: .devenv/state/venv/bin/pytest tests/services/test_hub_ingest_unit.py tests/services/test_ingest_helper_compatibility.py
  files:
  - tests/hub/test_ingest_postgresql_policy.py
  - tests/management/commands/test_import_sap_ish_txt.py
  - tests/management/commands/test_kcache_video_import.py
  - tests/management/commands/test_reap_upload_job_sources.py
  - tests/models/metadata/file_import/test_create_video_file.py
  - tests/services/test_audit_integrity.py
  - tests/services/test_hub_ingest_active_learning_provenance.py
  - tests/services/test_hub_ingest_dispatch.py
  - tests/services/test_hub_ingest_import_job_contract.py
  - tests/services/test_hub_ingest_unit.py
  - tests/services/test_ingest_helper_compatibility.py
  - tests/services/test_preanonymized_external_identity.py
  - tests/services/test_preanonymized_watcher_ingest.py
  - tests/services/test_watcher_storage_import.py
schema_version: '1.0'
feature_definition: ../../../feature-tracking/ImportPipelineRobustness.yml
criterion: ingest_helper_modules
entrypoint: ingest.py
rules:
- Historical ingest.py helper names explicitly re-export the canonical function or type object.
- Helper modules must not import ingest.py; orchestration owns transactions and publication order.
- Use this map to select files; readiness and verification evidence belong in the feature definition.
modules:
  ingest.py:
    owns: API center resolution, upload reuse, watcher entrypoints, job dispatch and media publication
    entrypoints:
    - create_or_reuse_upload_job
    - create_or_reuse_watcher_upload_job
    - process_upload_job
    - process_watcher_file
    - process_preanonymized_watcher_file
    - start_upload_job_processing
    tests:
    - tests/services/test_hub_ingest_import_job_contract.py
    - tests/services/test_hub_ingest_dispatch.py
    - tests/services/test_watcher_storage_import.py
  ingest_provenance.py:
    owns: UploadProvenance and provenance copying, normalization, mutation and active-learning recording
    effects: Helpers mutate the supplied job; active-learning recording saves only when save is true.
    tests:
    - tests/services/test_hub_ingest_unit.py
    - tests/services/test_hub_ingest_active_learning_provenance.py
    - tests/services/test_ingest_helper_compatibility.py
  preanonymized_metadata.py:
    owns: Sensitive metadata normalization, application and external patient/examination identity linking
    effects: Caller owns media publication; external identity linking retains its atomic transaction and center
      lock.
    tests:
    - tests/services/test_preanonymized_external_identity.py
    - tests/services/test_preanonymized_watcher_ingest.py
    - tests/services/test_ingest_helper_compatibility.py
  watcher_handoff.py:
    owns: Temporary-name rejection, source settling and stat snapshot checks
  upload_job_import_lease.py:
    owns: Execution ownership, heartbeat and fenced row access
  upload_job_cancellation.py:
    owns: Cancellation intent and owner acknowledgement
  upload_job_state_machine.py:
    owns: Validated job-state transitions
  upload_job_files.py:
    owns: Source and media artifact ledger registration
  cleanup.py:
    owns: Retention eligibility and source cleanup
