version: 1
tier: module
path: endoreg_db/models/other
summary: Shared reference rows, studies and import receipts.
responsibilities:
- Persist domain entities and enforce their constraints.
boundaries:
- Workflow implementations belong in the service layer; validate persisted payloads at the model boundary.
files:
- file: study_collection_entry.py
  role: Immutable shared typed study ledger snapshots and server-computed evaluations linked to existing examinations.
- file: unit.py
  role: Measurement-unit catalog.
- file: study.py
  role: Study definition.
- file: study_cohort.py
  role: Study cohort persistence.
- file: study_setup_import.py
  role: Canonically validated immutable study setup identities, digests and row mappings.
- file: reference_catalog_import.py
  role: Reference catalog import receipts.
- file: clinical_reference_import.py
  role: Clinical reference import receipts.
dependencies:
  internal:
  - endoreg_db/schemas
  - endoreg_db/services
  external:
  - django
contracts:
- name: Model ownership and dependency map
  doc: docs/model_layer_map_for_agents.md
tests:
  directory: tests/models/other
  fast_lane_command: .devenv/state/venv/bin/pytest tests/models/other
parent: ../structure.yml
submodules: []
