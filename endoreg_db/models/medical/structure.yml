version: 1
tier: module
path: endoreg_db/models/medical
summary: Clinical terminology and patient examination aggregates.
responsibilities:
- Persist domain entities and enforce their constraints.
boundaries:
- Workflow implementations belong in the service layer; validate persisted payloads at the model boundary.
files:
- file: disease.py
  role: Disease definitions and classifications.
- file: event.py
  role: Clinical event definitions.
- file: examination/__init__.py
  role: Examination definitions and indication vocabulary.
- file: finding/__init__.py
  role: Finding and intervention vocabulary.
- file: patient/__init__.py
  role: Patient examination, finding, medication and laboratory aggregates.
dependencies:
  internal:
  - endoreg_db/schemas
  - endoreg_db/services
  external:
  - django
  - lx_dtypes
contracts:
- name: Model ownership and dependency map
  doc: docs/model_layer_map_for_agents.md
tests:
  directory: tests/examination
  fast_lane_command: .devenv/state/venv/bin/pytest tests/examination
parent: ../structure.yml
submodules: []
