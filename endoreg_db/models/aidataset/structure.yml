version: 1
tier: module
path: endoreg_db/models/aidataset
summary: Dataset, split-plan, training-run and export-artifact persistence.
responsibilities:
- Persist domain entities and enforce their constraints.
boundaries:
- Workflow implementations belong in the service layer; validate persisted payloads at the model boundary.
files:
- file: aidataset.py
  role: Dataset lifecycle rows and existing service compatibility wrappers.
- file: ai_dataset_split_plan.py
  role: Validated deterministic split-plan persistence.
dependencies:
  internal:
  - endoreg_db/schemas
  - endoreg_db/services
  external:
  - django
  - lx_dtypes
contracts:
- name: Model ownership and dependency map
  doc: docs/model_layer_map_for_agents.md
tests:
  directory: tests/models
  fast_lane_command: .devenv/state/venv/bin/pytest tests/models
parent: ../structure.yml
submodules: []
