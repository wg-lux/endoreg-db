version: 1
tier: module
path: endoreg_db/schemas
summary: Validated local API, workflow and persisted-payload contracts.
responsibilities:
- Normalize external input once and validate persisted JSON (JavaScript Object Notation) at owning boundaries.
boundaries:
- Shared clinical contracts belong in lx_dtypes; local schemas do not own ORM queries or workflows.
files:
- file: annotation_comparisons.py
  role: Typed annotation and clinical finding comparison results shared by service and API.
- file: persisted_json.py
  role: Persistence-specific payload validators.
- file: hub_payloads.py
  role: Hub request and provenance shapes.
- file: video_storage.py
  role: Video profile, timeline and quality evidence.
- file: import_file.py
  role: Import source snapshot contract.
- file: report_persistence.py
  role: Persisted report contract.
- file: medical_ledger.py
  role: Clinical ledger payload adapters.
dependencies:
  internal:
  - endoreg_db/integrations
  external:
  - pydantic
  - lx_dtypes
contracts:
- name: Model ownership and dependency map
  doc: docs/model_layer_map_for_agents.md
tests:
  directory: tests/schemas
  fast_lane_command: .devenv/state/venv/bin/pytest tests/schemas
parent: ../structure.yml
submodules: []
