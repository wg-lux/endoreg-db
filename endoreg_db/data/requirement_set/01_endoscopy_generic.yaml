- models: endoreg_db.requirement_set
  fields:
    name: "patient_gender_generic"
    name_de: "Patientengeschlecht (männlich/weiblich)"
    name_en: "Patient gender generic"
    description: "Patient gender (generic)"
    requirement_set_type: "any"
    requirements:
      - patient_gender_is_male
      - patient_gender_is_female

- models: endoreg_db.requirement_set
  fields:
    name: "patient_names_generic"
    name_de: "Patientennamen (Vorname, Nachname)"
    name_en: "Patient names generic"
    description: "Patient names (generic)"
    requirement_set_type: "all"
    requirements:
      - patient_has_first_name
      - patient_has_last_name

- models: endoreg_db.requirement_set
  fields:
    name: "patient_dob_generic"
    name_de: "Patienten-Geburtsdatum"
    name_en: "Patient date of birth generic"
    description: "Patient date of birth (generic)"
    requirement_set_type: "all"
    requirements:
      - patient_has_dob

- models: endoreg_db.requirement_set
  fields:
    name: "patient_information_generic"
    requirement_set_type: "all"
    description: "Generic patient requirement set"
    name_de: "Generische Patientenanforderung"
    name_en: "Generic Patient Requirement"
    links_to_sets:
      - "patient_names_generic"
      - "patient_gender_generic"
      - "patient_dob_generic"
