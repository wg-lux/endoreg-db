######## Location

- model: endoreg_db.requirement
  fields:
    name: "colon_polyp_has_location"
    name_de: "Kolonpolyp hat Lageinformation"
    name_en: "Colon polyp has location information"
    description: "Checks if the colon polyp has location classification information."
    operator: "patient_examination_specific_findings_have_classifications_any"
    finding_classifications:
      - colonoscopy_location_default
      - colonoscopy_location_coarse
    findings:
      - "colon_polyp"

- model: endoreg_db.requirement
  fields:
    name: "colon_polyp_location_rectosigmoid"
    name_de: "Kolonpolyp Lage im Rektosigmoid"
    name_en: "Colon polyp location in rectosigmoid"
    description: "Checks if the colon polyp is located in the rectosigmoid."
    operator: "patient_examination_specific_findings_have_specific_classification_choices_any"
    finding_classification_choices:
      - rectum
      - sigmoid_colon
      - anal_canal
    findings:
      - "colon_polyp"

