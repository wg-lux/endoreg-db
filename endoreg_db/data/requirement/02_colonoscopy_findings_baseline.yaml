# examination_bowel_prep_recorded
- model: endoreg_db.requirement
  fields:
    name: "colonoscopy_has_bowel_prep_information_detailed_lc"
    name_de: "Untersuchung hat Darmvorbereitungsinformation (Colon Ascendens)"
    name_en: "Examination has bowel preparation information (Colon Ascending)"
    description: "Checks if the examination has bowel preparation classification information."
    requirement_types:
      - "patient_examination"
    operator: "model_attribute_array_match_all"
    operator_instructions: "?patient_findings;\
      !finding_classifications;\
      $array_object_target:classifications.[any].classification;\
      $filter_array_objects_by_field:finding;\
      $filter_source_field:findings;\
      "
    finding_classifications:
      - bowel_prep_boston
    findings:
      - "bowel_preparation_lc"

