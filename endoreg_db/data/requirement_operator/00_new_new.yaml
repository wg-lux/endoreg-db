##### Patient Examination Specific Findings Have Classifications
- model: endoreg_db.requirement_operator
  fields:
    name: "patient_examination_specific_findings_have_classifications_all"
    name_de: "Patienten-Untersuchung hat Befund mit Klassifikation (alle)"
    name_en: "Patient examination has finding with classification (all)"
    valid_input_types: "patient_examination"
    description: "
      Checks if all PatientFindings of the PatientExamination after applying the filter
      have all of the linked FindingClassifications.
      The Requirement using this operator must define:
      - finding_classifications (All Linked FindingClassifications must be present in each filtered PatientFinding)
      - findings (Optional: Used to filter PatientFindings by their Finding)
      "
    eval_functions: "" # Äquivalent zu gestrigem Operator
    eval_modes: "all"
    evaluation_input_fields: patient_findings[].classifications[].classification;
    evaluation_requirement_fields: finding_classifications;
    filter_functions: exact_match;
    filter_input_fields: patient_findings[].finding;
    filter_requirement_fields: findings;

- model: endoreg_db.requirement_operator
  fields:
    name: "patient_examination_specific_findings_have_classifications_any"
    name_de: "Patienten-Untersuchung hat Befund mit Klassifikation (min. eines)"
    name_en: "Patient examination has finding with classification (any)"
    expected_input: "patient_examination"
    description: "
      Checks if all PatientFindings of the PatientExamination after applying the filter
      have at least one of the linked FindingClassifications.
      The Requirement using this operator must define:
      - finding_classifications (At least one linked FindingClassification must be present in each filtered PatientFinding)
      - findings (Optional: Used to filter PatientFindings by their Finding)
      "
    eval_functions: ""
    eval_modes: "any"
    evaluation_input_fields: patient_findings[].classifications[].classification;
    evaluation_requirement_fields: finding_classifications;
    filter_functions: exact_match;
    filter_input_fields: patient_findings[].finding;
    filter_requirement_fields: findings;

