# Portable mapping example; replace mapping_id when creating an independent mapping.
# One stable record_id per examination row; no patient values belong in this file.
schema_version: '1.0'
mapping_id: dcaf470d-a6fd-4a72-a2cf-9349307e7652
name: Koloskopie-Studientabelle
knowledge_base:
  knowledge_base_module: dgvs_reporting
  knowledge_base_version: 0.1.0
source:
  delimiter: ';'
  encoding: utf-8-sig
  header_row: 1
row_id: record_id
first_name: Patient.Vorname
last_name: Patient.Nachname
dob:
  columns: [Patient.Geburtsdatum]
  date_format: '%d.%m.%Y'
gender:
  columns: [Patient.Geschlecht]
  values:
    w: female
    m: male
    d: other
    unbekannt: unknown
examination_date:
  columns: [Untersuchungsdatum]
  date_format: '%d.%m.%Y'
examination:
  columns: [Untersuchung]
# Add finding groups with explicit value-to-finding mappings for the selected package.
# A generic polyp observation must never imply a resection or follow-up.
