version: 1
tier: domain
path: endoreg_db
summary: Django application, clinical persistence, ingestion and scoped APIs.
responsibilities:
- Register Django models and checks; compose API and worker entrypoints.
boundaries:
- Clinical workflow ownership belongs to services and import_files; preserve encrypted media and typed
  boundaries.
files:
- file: migrations/0114_uploadjob_processing_stack.py
  role: Persist Rust-owned remaining import work and stable checkpoint references on upload jobs.
- file: migrations/0111_delete_frameextractionrequest.py
  role: Retire the unused frame extraction request table; frame files are export-only.
- file: migrations/0112_alter_center_center_key.py
  role: Align required center-key model validation with canonical state while retaining database uniqueness.
- file: migrations/0110_report_concept_embedding.py
  role: Persist versioned report-only vectors with exactly one clinical annotation and cascading source deletion.
- file: migrations/0109_medication_bmp.py
  role: Add validated BMP medication fields and ordered plan blocks while preserving legacy dosage and membership.
- file: migrations/0104_patient_matching.py
  role: Persist matching budgets, sessions and UUID relationship edges.
- file: migrations/0107_matching_worker_state.py
  role: Persist single-use matching execution claims and source completion state.
- file: migrations/0106_study_transfer.py
  role: Add standalone study ledger transfers to authenticated hub receipts.
- file: migrations/0105_study_collection_entry.py
  role: Add immutable study collection snapshots linked to existing clinical identities.
- file: migrations/0103_patient_examination_uuid.py
  role: Backfill unique persistent patient and examination UUIDs without changing local primary keys.
- file: migrations/0102_patient_hash_alias.py
  role: Add center-scoped historical patient hash aliases without backfilling unauthenticated identity links.
- file: tasks.py
  role: Celery task adapters; there is no tasks directory.
- file: api_urls.py
  role: Public API routing composition.
- file: root_urls.py
  role: Deployment URL root.
- file: celery.py
  role: Worker application setup.
- file: celery_worker.py
  role: Pre-consumption media worker pool and executable validation.
- file: checks.py
  role: Django runtime checks.
- file: integrations/lx_dtypes_host_models.py
  role: Host integration registration for shared clinical types.
- file: migrations/__init__.py
  role: Schema migrations package; review schema changes with owning model manifest.
- file: export/frames/export_frames_with_labels.py
  role: Frame export workflow with one annotation selection and shared media integrity and CSV encoding services.
- file: helpers/data_loader.py
  role: Reference-data loader helpers.
- file: factories/__init__.py
  role: Test fixture factories.
- file: admin.py
  role: Django admin registration.
entrypoints:
- name: EndoregDbConfig
  file: apps.py
  purpose: Application startup registration.
- name: urlpatterns
  file: urls/__init__.py
  purpose: Application API routes.
dependencies:
  internal:
  - endoreg_db/config
  - endoreg_db/utils
  external:
  - django
  - celery
  - rest_framework
  - ninja
  - lx_dtypes
contracts:
- name: Model ownership and dependency map
  doc: docs/model_layer_map_for_agents.md
tests:
  directory: tests/app
  fast_lane_command: .devenv/state/venv/bin/pytest tests/app
parent: ../structure.yml
submodules:
- name: models
  path: models
  manifest: models/structure.yml
  summary: Persistence models grouped by clinical and operational ownership.
- name: import_files
  path: import_files
  manifest: import_files/structure.yml
  summary: Concurrent video and report import orchestration.
- name: utils
  path: utils
  manifest: utils/structure.yml
  summary: Shared runtime paths, file integrity, protected storage and narrow utilities.
- name: schemas
  path: schemas
  manifest: schemas/structure.yml
  summary: Validated local API, workflow and persisted-payload contracts.
- name: views
  path: views
  manifest: views/structure.yml
  summary: HTTP request adaptation, authorization and domain-service delegation.
- name: serializers
  path: serializers
  manifest: serializers/structure.yml
  summary: REST framework representation and typed request adapters.
- name: urls
  path: urls
  manifest: urls/structure.yml
  summary: Application route composition and public media URL ownership.
- name: authz
  path: authz
  manifest: authz/structure.yml
  summary: Authentication, authorization policy and identity middleware.
- name: management
  path: management
  manifest: management/structure.yml
  summary: Django management commands and shared command adapters.
- name: config
  path: config
  manifest: config/structure.yml
  summary: Environment, private keyring and identity-salt configuration boundaries.
- name: data
  path: data
  manifest: data/structure.yml
  summary: Packaged YAML reference data and versioned study presets.
- name: services
  path: services
  manifest: services/structure.yml
  summary: Domain services and explicit workflow side effects.
