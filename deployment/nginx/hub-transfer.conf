# Include this file once in the nginx `http` context for the dedicated central
# hub transfer hostname. Adjust only the listen address, credential paths, and
# upstream address for the deployment. Django must not be exposed directly.

upstream endoreg_hub_transfer_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name hub-transfer.example.invalid;

    ssl_certificate /run/credentials/endoreg-hub-transfer/server.crt;
    ssl_certificate_key /run/credentials/endoreg-hub-transfer/server.key;
    ssl_client_certificate /run/credentials/endoreg-hub-transfer/client-ca.crt;
    # Request certificates at server scope and enforce them at the transfer
    # location. This pattern is also safe on a shared browser/API hostname.
    ssl_verify_client optional;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;

    client_max_body_size 50g;

    location ^~ /api/media/hub/transfers/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        proxy_pass http://endoreg_hub_transfer_backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # These assignments replace untrusted client-supplied values. The
        # attestation can only be SUCCESS after nginx verified the presented
        # client certificate against ssl_client_certificate above.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
    }

    location / {
        return 404;
    }
}
