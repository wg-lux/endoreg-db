[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lx-anonymizer"
version = "0.0.0"
description = "Workspace package for lx_anonymizer (monorepo member)"
authors = [{ name = "WG Lux" }]
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["lx_anonymizer*"]
