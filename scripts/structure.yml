version: 1
tier: domain
path: scripts
parent: ../structure.yml
summary: Repository checks, diagnostics and development utilities.
responsibilities:
- Provide reusable read-only quality and contract checks.
- Export synthetic image-hash and patient-HMAC experiments with publication artifacts.
boundaries:
- Quality checks must not perform clinical import or mutate runtime storage.
submodules:
- name: reidentification
  path: reidentification
  manifest: reidentification/structure.yml
  summary: Isolated synthetic incremental reidentification and baseline comparison.
files:
- file: evaluate_patient_hmac.py
  role: Synthetic complete candidate scans through production HMAC helpers with shared/local keys; exports measurements and scientific figures.
- file: benchmark_sha256.py
  role: Standalone bounded UTF-8 candidate-search timing for known-key HMAC and SHA-256 variants; no application identity writes.
- file: benchmark_sha256.md
  role: German benchmark usage, historical payload contract and measurement limits.
- file: collect_image_hash_publication.py
  role: Run existing image-hash tests with observation-only capture and export verified scientific artifacts.
- file: lint_structure.py
  role: Typed structure graph and path validator
- file: check_documentation_governance.py
  role: Documentation policy and inventory validation
- file: check_lx_dtypes_contract_boundaries.py
  role: Canonical type ownership guard
- file: check_django_startup_imports.py
  role: Import and startup smoke checks
contracts:
- name: Agent workflow
  doc: AGENTS.md
tests:
  directory: tests/scripts
  fast_lane_command: .devenv/state/venv/bin/pytest tests/scripts/test_lint_structure.py
    -q
