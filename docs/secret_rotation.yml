schema_version: '1.0'
feature: ../feature-tracking/Anonymization.yml#online_secret_rotation
title: Online-Rotation von Medienschlüsseln, Django Salt und Django-Signaturschlüsseln
scope:
  - Dieses Dokument beschreibt Bedienung und Grenzen; Bereitschaftsnachweise stehen ausschließlich im Feature-Tracker.
  - Keine automatische Bereitstellung, Veröffentlichung oder Löschung von Geheimnissen.
  - Ein gestohlener Schlüssel bleibt für bereits entwendete alte Kopien wirksam.
  - Django Salt erzeugt Hashes. Django SECRET_KEY signiert Sitzungen und Token. Mediendateien verwenden unabhängige Master- und Dateischlüssel.
private_manifest:
  format: YAML, schema_version als Ganzzahl 1; unbekannte Felder werden abgewiesen.
  active: Absoluter Pfad einer privaten Datei mit dem neuen aktiven Geheimnis.
  retiring: Liste mit höchstens acht absoluten Pfaden explizit zugelassener alter Geheimnisse.
  allow_legacy_default_salt: Nur für Django Salt; true erlaubt default_salt ausschließlich in retiring.
  permissions: Reguläre Dateien ohne symbolische Links, Eigentümer root oder Dienstbenutzer, keine Gruppen- oder Fremdrechte.
  publication: Generationen in getrennten unveränderlichen Dateien provisionieren. Anschließend ausschließlich das Manifest atomar ersetzen. Geheimnisse niemals in CLI-Argumenten, Logs oder Git ablegen.
  master_format: URL-sichere Base64-Kodierung von 16, 24 oder 32 zufälligen Bytes; neue Generationen vorzugsweise 32 Bytes.
  identity_format: Eine nichtleere UTF-8-Zeile; aktive Standardwerte bleiben verboten.
  signing_format: Eine UTF-8-Zeile mit mindestens 32 Zeichen, kein Django-Entwicklungsschlüssel.
environment:
  LX_ANNOTATE_MASTER_KEYRING_FILE: Privates Manifest für Medienverschlüsselung; ersetzt explizit die einzelne Master-Key-Konfiguration, solange es gesetzt ist.
  DJANGO_IDENTITY_SALT_KEYRING_FILE: Privates Manifest für Identitätsmigration; die normale DJANGO_SALT_FILE-Konfiguration bleibt ohne Manifest gültig.
  DJANGO_SIGNING_KEYRING_FILE: Privates Manifest für SECRET_KEY und SECRET_KEY_FALLBACKS in endoreg_db.config.settings.prod.
rollout:
  - Zuerst Schema 0081 und die additive Migration 0082_examiner_identity_generation installieren; beide ändern keine bestehenden Hashes.
  - Alle Web-, Import-, Worker-, Wartungs- und externen Storage-Leser müssen die neue Leselogik verwenden, bevor neue Medienschlüssel aktiv werden.
  - Bei einer regulären Rotation zunächst den bisherigen Schlüssel aktiv lassen und den neuen als zusätzliche Lesegeneration verteilen. Erst nach bestätigtem Leser-Rollout active und retiring atomar tauschen.
  - Ein Legacy-default_salt-Upgrade benötigt einen koordinierten Übergang aller Identitätsschreiber. Alte Software nimmt nicht an den neuen Datenbanksperren teil; gleichzeitiger Betrieb alter Schreiber während der Hashmigration ist nicht freigegeben. Web-/Medienzugriff kann über kompatible Leser fortgeführt werden.
  - Für die Legacy-Migration einen neuen gültigen aktiven Salzschlüssel und die explizit freigegebene default_salt-Datei als retiring konfigurieren. Keine normale Produktionsvalidierung abschalten.
  - Master-Key- und Salz-Manifeste werden während des Betriebs neu gelesen. Identitätsoperationen verwenden innerhalb einer Transaktion einen konsistenten Snapshot.
  - Der Django-Signaturschlüssel wird beim Laden der Einstellungen gelesen; seine Aktivierung erfordert einen koordinierten rollenden Prozessneustart und Host-Settings mit diesem Adapter.
commands:
  execution_context: Im installierten Dienstkontext mit der tatsächlichen Produktionseinstellung und dem Dienstbenutzer ausführen; keine Testsettings gegen Produktionsdaten verwenden.
  media_preview: python -m django rotate_storage_secrets --include-hls
  media_apply: python -m django rotate_storage_secrets --include-hls --apply
  identity_preview: python -m django rotate_identity_salt
  identity_apply: python -m django rotate_identity_salt --apply
  reviewed_identity_input: Optional --review-file mit einem absoluten privaten YAML-Dateipfad ergänzen.
media_contract:
  - Nur registrierte LXENC01-Dateien innerhalb des geschützten Storage-Roots werden automatisch ersetzt. Nicht zugeordnete verschlüsselte Dateien führen zu einem unvollständigen Ergebnis.
  - Jeder betroffene Videodateiersatz benötigt eine exklusive erneuerte Medien-Lease. Aktive Wiedergabe und Segmentänderungen verschieben ihn; erneutes Ausführen setzt die Arbeit fort.
  - Während der exklusiven Verarbeitung können neue Zugriffe auf genau dieses Video zurückgestellt werden. Andere Videos bleiben verfügbar; ein globales Wartungsfenster ist nicht erforderlich.
  - Jeder Dateichunk wird authentifiziert. Die neue Datei erhält einen frischen Dateischlüssel und Nonces; Klartext existiert nur begrenzt im Arbeitsspeicher.
  - Vor Veröffentlichung werden Länge und SHA-256 des gesamten Klartexts verglichen. Bei Videos wird zusätzlich der bekannte Datenbankhash geprüft. Andere Dateien benötigen für die Erkennung bereits vorher verlorener vollständiger Chunks eine unabhängige Inventarreferenz.
  - Die Quelle bleibt bis zur erfolgreichen Prüfung unverändert. Staging liegt neben der Quelle auf demselben geschützten Dateisystem; freier Platz mindestens für eine zusätzliche verschlüsselte Datei ist erforderlich.
  - Der veröffentlichte Pfad wird atomar ersetzt. Offene Leser behalten ihre Dateigeneration. In Keyring-Betrieb verwenden Byte-Range-Leser den Python-Pfad mit festem Dateideskriptor statt erneutem Öffnen im nativen Leser.
  - Prozessabbruch kann eine verschlüsselte .stage-Datei hinterlassen. Solche Dateien werden gemeldet und müssen vor Schlüsselstilllegung geprüft werden; es gibt keine automatische destruktive Bereinigung.
  - HTTP Live Streaming (HLS) erhält neue Inhaltsschlüssel und Segmente durch die bestehende geprüfte Generierung. Das kann Transcoding erfordern und ist nicht konstant schnell. Ältere Generationen bleiben Gegenstand der bestehenden Lease- und Cleanup-Regeln.
  - MP4-Dateien ohne LXENC01-Hülle gehören zum Dateisystemschutz. Eine Rotation des LUKS-Datenträgerschlüssels ist eine getrennte LuxNix-/Storage-Operation und wird hier nicht ausgeführt.
identity_contract:
  - PostgreSQL-Transaktionssperren koordinieren neue Identitätsschreiber und die Migration. Patienten- und Untersuchungs-Primärschlüssel sowie klinische Verknüpfungen bleiben bestehen.
  - Die gesamte verbundene Patientengruppe wird vor einer Änderung geprüft. Fehlende Quelldaten, widersprüchliche Fingerprints, Kollisionen und nicht abgedeckte Untersuchungen verhindern Änderungen dieser Gruppe.
  - Gelöschte Identifikatoren werden nicht aus Hashes rekonstruiert und nicht wieder in der Datenbank gespeichert.
  - Ein privates Review-Manifest enthält identities mit sensitive_meta_id, first_name, last_name, dob, optional examination_date, reviewed_by und review_reference. Originale müssen aus einer autorisierten geprüften Quelle stammen.
  - Optional enthält dasselbe Manifest examiners mit examiner_id, first_name, last_name, reviewed_by und review_reference. Untersucher mit unbekannter Generation verhindern eine vollständige Stilllegungsfreigabe.
  - Source-scoped externe Patientenidentitäten werden nicht als demografische Salz-Hashes umgeschrieben.
  - Append-only Audit-Einträge werden nicht rückwirkend verändert. Replikate, Exporte und historische Hashreferenzen benötigen eine gesonderte abgestimmte Migration.
signing_contract:
  - Geplante Rotation kann alte Signaturschlüssel vorübergehend als SECRET_KEY_FALLBACKS behalten.
  - Bei Schlüsselkompromittierung den gestohlenen Schlüssel niemals als Fallback behalten; bestehende Sitzungen und signierte Token müssen ungültig werden.
  - Der Adapter configured_signing_keys aus endoreg_db.config.secret_keyring löst Keyring, Einzeldatei und Inline-Wert mit derselben Validierung auf. Er ist in abweichenden Host-Settings explizit einzubinden. Ein Environment-Eintrag allein ändert fremde Django-Settings nicht.
retirement:
  - Kein Kommando löscht alte Schlüssel oder bescheinigt allein die vollständige Flottenstilllegung.
  - Wiederholte Inventarisierung muss fehlende/defekte Dateien, aktive Leases, Staging-Reste, nicht migrierte Identitäten und alte HLS-Generationen vollständig erklären.
  - Backups, Replikate, pausierte Worker und externe Leser getrennt prüfen. Alte Schlüssel erst nach dokumentierter Abdeckung entfernen.
  - Rückkehr zur alten Anwendung ohne Keyring-Unterstützung ist nach neuen Schreibvorgängen keine sichere Rückfallstrategie.
references:
  - https://docs.djangoproject.com/en/5.2/ref/settings/#secret-key-fallbacks
  - https://cryptography.io/en/latest/hazmat/primitives/aead/
secret_resolution_contract:
  - Einzeldateien und Keyrings verwenden read_private_file und read_secret_line; absolute Pfade, private reguläre Dateien, Eigentümerprüfung und maximal 4096 Bytes gelten für alle Geheimnisdateien.
  - Ein abschließendes LF oder CRLF ist zulässig. Andere Leerzeichen und zusätzliche Zeilen werden nicht stillschweigend entfernt.
  - Identitätssalz und Signaturschlüssel verwenden je einen gemeinsamen Validator für Einzelkonfiguration und Keyring. Master-Key-Material wird in beiden Pfaden strikt als Base64 dekodiert.
  - Die Quellenpriorität bleibt erhalten. Master-Keyring vor Inline-Master-Key vor Master-Key-Datei; Identitäts-Keyring vor Salzdatei vor optionalem Inline-Salz; Signatur-Keyring vor Signaturschlüsseldatei vor Inline-Signaturschlüssel.
  - Produktions-Signaturschlüssel benötigen unabhängig von der Quelle mindestens 32 Zeichen und dürfen nicht mit django-insecure- beginnen.
  - Der Health-Check bildet den Fingerprint aus settings.SECRET_KEY. Eine auf Datenträger ersetzte Datei ändert den Fingerprint erst nach dem Laden der neuen Einstellungen.
  - Fehlende Signaturschlüssel verhindern das Laden der Produktionssettings auch unter pytest. Entwicklungs- und Testsettings behalten ihre ausdrücklich profilspezifischen Testschlüssel.
  - Keyring-Manifeste lehnen doppelte Felder und YAML-Merges ab. Schema-Version und Legacy-Freigabe werden ohne implizite Typumwandlung geprüft.
  - Ein einmal gesetzter Identitäts-Snapshot bleibt auch ohne konfigurierten Keyring stabil. Ein neu bereitgestelltes Manifest wird erst außerhalb dieses Snapshots sichtbar.
reliability_analysis:
  feature: ../feature-tracking/Anonymization.yml#online_secret_rotation
  method: Radon-Komplexitätsmessung und Vergleich der typisierten Ein- und Ausgabegrenzen; niedrige Komplexität allein beweist keine Pfadgleichheit.
  complexity:
    load_keyring: 'D/22 vor Zusammenführung, B/10 danach'
    load_identity_salt: 'C/11 vor Zusammenführung, B/7 danach'
    load_master_key: 'B/6 nach erster Runde, A/1 nach Zentralisierung; gemeinsame Quellenauflösung configured_master_keys A/5'
    build_chunk_index: 'A/5 vor zweiter Runde, A/4 mit gemeinsamer Layoutvalidierung'
  encryption_magic:
    feature: ../feature-tracking/StorageSecurity.yml#storage_contract
    meaning: LXENC01 mit abschließendem Zeilenumbruch kennzeichnet das Dateiformat; es ist kein Geheimnis und kein Integritätsnachweis.
    probe: Alle Dateipfad-Probes verwenden utils.rust_backend.encryption_status mit den typisierten Ergebnissen encrypted und plaintext. Der boolesche Adapter delegiert an dieselbe Funktion.
    errors: Fehlendes Rust-Backend, ungültige native Ergebnisse, nicht reguläre Dateien und Lesefehler lösen Fehler aus; es gibt keinen Python-Probe-Fallback. Ein vollständiges Präfix wird auch bei kurzen Einzel-Lesevorgängen gelesen. Das Öffnen des Probes verwendet den nicht blockierenden Modus, damit benannte Pipes keinen Worker blockieren.
    boundary: Formatparser prüfen weiterhin Header und authentifizieren Chunks. Ein positives Magic-Ergebnis allein bestätigt keine Integrität.
    header_contract: Python-, native Range- und native Hashleser verwenden encrypted_format.rs. Der Vertrag fordert maximal 64 KiB Header, echte positive Ganzzahlen für Chunk-Größen, exakt Version 1, das bekannte Verfahren, eindeutige bekannte Felder, kanonisches URL-sicheres Base64 und feste Schlüssel-/Nonce-Längen. Zusätzliche oder automatisch konvertierte Werte werden abgewiesen.
    chunk_contract: Vollständige Leser authentifizieren jeden Chunk, begrenzen dessen Größe und akzeptieren nur den letzten Chunk als kürzer. Unvollständige Längenfelder sind Fehler. Python füllt kurze Lesevorgänge zu vollständigen Records auf; der Index prüft deklarierte Chunk-Geometrie und Dateigrenzen.
    empty_files: Auch die Größenabfrage im verschlüsselten Storage authentifiziert den verpackten Dateischlüssel. Eine leere Klartextdatei umgeht die Schlüsselprüfung nicht.
    format_limit: LXENC01 authentifiziert keinen abschließenden Gesamtlängenwert. Das Entfernen ganzer letzter Chunks lässt sich allein aus dem verbleibenden Ciphertext nicht erkennen; unabhängiger erwarteter Klartexthash oder Inventarreferenz bleibt erforderlich. Range-Leser authentifizieren die angeforderten Chunks, nicht automatisch die ganze Datei.
  native_identity_reader:
    path: rust/endoreg_rust_backend/src/file_identity.rs
    key_contract: Der Python-Adapter löst configured_master_keys einmal pro Einzel- oder Batch-Operation auf und übergibt aktive sowie ausdrücklich auslaufende Schlüssel als Byte-Liste. Rust liest keine Schlüsseldateien oder Schlüssel-Environment-Werte. Alle drei unterstützten Schlüssellängen verwenden dieselbe Kryptoroutine wie der native Range-Leser.
    direct_native_api: Direkte native Aufrufer müssen master_keys für verschlüsselte Dateien explizit übergeben. Ohne Schlüssel sind weiterhin Klartextdateien lesbar; verschlüsselte Dateien scheitern ausdrücklich. Native Erweiterung und Python-Adapter gemeinsam aktualisieren.
    metadata_contract: Größe und Änderungszeit beschreiben weiterhin die gespeicherte Datei; der Digest beschreibt den authentifizierten Klartext. Einzel- und Batch-Leser prüfen Dateigeneration und Metadaten vor und nach dem Lesen.
