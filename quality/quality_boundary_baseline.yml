broad_exception:
  count: 406
  fingerprint: a3891c013c1ac19e52b58c2f12d7140124dfdfe9150c1169507340e6b3f020c3
  owner: endoreg_db maintainers
  reason: >-
    Geprüfter Bestand nach der Exception-Reduktionskohorte und der Extraktion
    typisierter Workflow-Helfer sowie der Entfernung der ungemounteten
    NICE-/PARIS-Klassifikationsinsel. Drei neuere Boundary-Handler wurden
    einzeln geprüft: per-Video-Fehlerisolation im Migrations-Command,
    fail-closed Rollenauflösung an der lx-dtypes-Autorisierungsgrenze und
    atomarer Cleanup mit strukturiertem Fehlerprotokoll im Dateisystem-Wrapper.
    Sie ersetzen drei entfernte Altbefunde, verändern die Gesamtzahl nicht und
    erlauben keine breiten Handler in innerer Domainlogik.
    Der reproduzierbare API-Routenchecker fängt ausschließlich konkrete Datei-,
    Unicode-, JSON- und Vertragsfehler; sein früherer breiter CLI-Handler wurde
    entfernt.
    Der Namens-Gender-Adapter behandelt den regulären Bibliothekswert
    `unknown` fachlich, lässt unerwartete Detector- oder Datenfehler jedoch
    sichtbar propagieren, statt sie als gültige Unbekannt-Klassifikation zu
    maskieren.
    Die zentrale Konfigurationsgrenze ersetzt zwei breite numerische Parser-
    Handler durch konkrete ValueError-Übersetzung. Gesetzte ungültige Werte
    und nicht endliche Fließkommazahlen lösen einen datensparsamen typisierten
    Fehler aus, statt still den Default zu aktivieren.
  review_after: 2026-10-17
type_suppression:
  count: 140
  fingerprint: dddceaafd234083599b4a8e417eeb4825850cd1f8b298701f067deb255cf2774
  owner: endoreg_db maintainers
  reason: >-
    Geprüfter Altbestand nach Entfernung von vier Typunterdrückungen aus der
    Video-Inferenzkohorte und der privaten NinjaAPI-Registry-Unterdrückung.
    Die typisierte Django-Manager-Deklaration des Medical-Ledger-Receipts nutzt
    dieselbe eng begrenzte Framework-Unterdrückung wie vergleichbare Modelle;
    der verbleibende Bestand ist keine allgemeine Freigabe.
    Ein lokaler, enger gender_guesser-Stub ersetzt die frühere fehlende
    Third-Party-Typunterdrückung und hält den Adapter vollständig typisiert.
  review_after: 2026-10-17
