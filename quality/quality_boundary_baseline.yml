  owner: endoreg_db maintainers
  reason: >-
    Reviewed legacy inventory after removing four type suppressions from the
    video-inference cohort and the private NinjaAPI registry suppression.
    The typed Django manager declaration for the medical-ledger receipt uses
    the same narrowly scoped framework suppression as comparable models; the
    remaining inventory is not a general exemption.
    A local, narrow gender_guesser stub replaces the former missing third-party
    type suppression and keeps the adapter fully typed.
    Review 2026-09-23: Die 109 aktuellen Unterdrückungen stimmen bereits mit
    dem tatsächlichen Quellbestand von 4c84c423 überein; der damalige Zähler
    140 war veraltet. Die Berichtsauswahl fügt keine Unterdrückung hinzu.
    Review 2026-10-23 against 2a3a195b: two suppressions moved with their
    modules (privacy/metrics, video_files/temporal_inference). Four were
    removed (missing stubs in video anonymization, video correction jobs and
    the correction view; an unused-function marker in streamable_media). Two
    were added and reviewed: a missing lx_anonymizer stub at the lazy report
    reader import, and the DRF field declaration `label` in
    VideoMaskProfileSerializer that intentionally shadows Serializer.label.
    The two new
    suppressions from the clinical lifecycle commit were replaced by explicit
    casts after the existing isinstance checks in clinical_lifecycle/facts.py
    and audit_clinical_lifecycle.py, so the total decreases from 109 to 107.
  review_after: 2026-11-20
