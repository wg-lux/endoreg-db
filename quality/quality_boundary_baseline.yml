schema_version: "1.0"
scan:
  paths:
    - endoreg_db
    - scripts
  excluded_path_parts:
    - migrations
    - __pycache__
broad_exception:
  count: 343
  fingerprint: 4ab7d6ea49746094d662a5ab61651633edc09727b4796d35964270578ed5985d
  owner: endoreg_db maintainers
  reason: >-
    Reviewed inventory after the exception-reduction cohort, the extraction of
    typed workflow helpers, and removal of the unmounted NICE/PARIS
    classification island. Three newer boundary handlers were reviewed
    individually: per-video failure isolation in the migration command,
    fail-closed role resolution at the lx-dtypes authorization boundary, and
    atomic cleanup with structured error logging in the filesystem wrapper.
    They replace three removed legacy findings, leave the total unchanged, and
    do not permit broad handlers in inner domain logic.
    The reproducible API route checker catches only specific file, Unicode,
    JSON, and contract errors; its former broad command-line handler was
    removed.
    The name-gender adapter handles the library's regular `unknown` value as a
    domain case while allowing unexpected detector or data failures to
    propagate visibly instead of masking them as a valid unknown classification.
    The central configuration boundary replaces two broad numeric parser
    handlers with specific ValueError translation. Explicitly configured invalid
    values and non-finite floating-point numbers raise a data-minimizing typed
    error instead of silently activating the default.
    Two removed legacy findings are replaced by two reviewed handlers at the
    Hypertext Transfer Protocol (HTTP) integration boundary for remote processed
    reports. They catch unknown failures from a configurable external provider
    only at the view boundary, log only the report identifier and exception type,
    and translate fail-closed into the existing non-disclosing HTTP 404 contract.
    The materialization lifetime itself uses ExitStack and requires neither broad
    cleanup handlers nor manual __exit__ calls.
    Review 2026-09-23 gegen den Quellstand 4c84c423: 24 neue oder verschobene
    Handler-Signaturen und 34 entfernte Signaturen geprüft. Die verbleibenden
    Grenzen betreffen Import-Finalisierung, Transcode-/Storage-Cleanup, Lease-
    Heartbeats, HTTP-Adapter und Fehlertelemetrie. Fehler werden weitergereicht,
    als fehlgeschlagene Ergebnisse gemeldet oder an die besitzende Ausführung
    übertragen; Post-Commit-Cleanup behält seinen Wiederholungsbeleg.
    Zwei Report-HTTP-Handler wurden lediglich verschoben. Der Bestand bleibt
    technische Schuld; insbesondere ältere best-effort Löschpfade und HLS-
    Fehlertexte erhalten hierdurch keine Produktions- oder Sicherheitsfreigabe.
    Review 2026-10-23 against source state 2a3a195b (last baseline edit, actual
    count 387 there rather than the recorded 389): 63 added and 96 removed
    handler signatures. Most are relocations of services into subpackages
    (streaming, video_storage, video_files, media, privacy, annotations,
    frames, runtime, reports, datasets, audit) with unchanged handler bodies.
    Individually reviewed new boundaries: apply_deployment translates registry
    activation failure into DeploymentActivationError without implying a
    database rollback; VideoImportService._import_owned and
    ReportImportService._run_owned_import re-raise database recovery and lease
    ownership errors, record the failure and re-raise; the report import fence
    handlers mark the outcome or fence as failed and re-raise;
    run_with_optional_profile re-raises work failures and only logs profile
    write failures after failed work; _run_report_job re-raises once a content
    attempt exists. _run_prediction_refresh reports a post-commit dispatch
    failure as an explicit failed payload; its exception text in that payload
    remains technical debt. Removed handlers include the unused
    frame_anonymization_utils helpers, setup_config, load_master_key and
    secure_unlink_file. The total decreases; no handler is approved for inner
    domain logic.
    The reviewed Celery job-boundary handler in hub ingest is unchanged; its
    function was renamed from _run_video_upload_import_job to the public
    run_video_upload_import_job because endoreg_db.tasks imports it.
    Review 2026-11-02 against source state 854a8063 (last baseline edit; the
    scanner found 353 handlers there, not the recorded 354) plus the working
    tree: nine handlers removed (frame retention now catches OSError only,
    frame extraction jobs, outside-segment lookup, transcoding-directory
    cleanup, fenced reanonymization, report PDF persistence and operation-log
    recording) and one signature renamed with an unchanged body
    (annotation_exporter_client -> AnnotationExporterClient.run_export). One
    new handler was reviewed individually: prepared_import_artifact wraps the
    checkpoint artifact and receipt write, re-reads the persisted checkpoint
    before deleting the uniquely named artifact copy, and always re-raises, so
    an uncertain database commit never loses its referenced artifact.
    Review 2026-11-18 by codex-report-validation-20261118 against fbe6cd9b:
    _extract_text_from_video_frames no longer catches frame-path lookup errors;
    timeline_backfill._apply_backfill adds per-video batch failure isolation,
    logs only the exception type and returns an explicit FAILED result. The
    signature difference contains exactly this removal and addition (344 total).
    This inventory review does not approve clinical backfill readiness.
    Review 2026-11-18 by codex-opt-20261118-dead: removed only the
    _predict_video_entry handler with its unreferenced private facade;
    repository, package exports and lx-annotate consumers use ai.predict_video.
    All other handler signatures and type suppressions remain unchanged.
    Review 2026-11-24 by codex-publication-20261124-centralize against c8b3ca0c
    (the recorded fingerprint matches that source exactly): five added and five
    removed signatures, still 343 handlers. Electrical activation/measurement
    import boundaries remove their newly written source on failed persistence
    and re-raise. Report case-resolution logging moves unchanged into
    _publish_preanonymized_report; its new outer handler deletes only a new,
    unreferenced candidate and re-raises. Encrypted temporary-file cleanup moves
    unchanged from _save_locked to _write_encrypted_file. Removed handlers had
    swallowed annotation model lookup or required prediction dispatch failures.
    AST comparison also reviewed all four changed surviving handler scopes:
    video publication retains referenced artifacts; watcher quarantine receives
    expected content hashes; transfer cleanup checks committed ownership and
    requires a fence; temporal dispatch preserves durable upload prediction
    intent while returning explicit failure or re-raising. Other handler bodies
    are unchanged. Existing case-resolution exception text, best-effort paths
    and legacy handlers remain technical debt; this inventory review is not
    clinical or production approval and does not replace runtime regression.
  review_after: 2026-12-24
type_suppression:
  count: 74
  fingerprint: 6595b9e4f791e54b780740149a4cb4d6905e0b60779b7da566e4fa2d53cf7139
  owner: endoreg_db maintainers
  reason: >-
    Reviewed legacy inventory after removing four type suppressions from the
    video-inference cohort and the private NinjaAPI registry suppression.
    The typed Django manager declaration for the medical-ledger receipt uses
    the same narrowly scoped framework suppression as comparable models; the
    remaining inventory is not a general exemption.
    A local, narrow gender_guesser stub replaces the former missing third-party
    type suppression and keeps the adapter fully typed.
    Review 2026-09-23: Die 109 aktuellen Unterdrückungen stimmen bereits mit
    dem tatsächlichen Quellbestand von 4c84c423 überein; der damalige Zähler
    140 war veraltet. Die Berichtsauswahl fügt keine Unterdrückung hinzu.
    Review 2026-10-23 against 2a3a195b: two suppressions moved with their
    modules (privacy/metrics, video_files/temporal_inference). Four were
    removed (missing stubs in video anonymization, video correction jobs and
    the correction view; an unused-function marker in streamable_media). Two
    were added and reviewed: a missing lx_anonymizer stub at the lazy report
    reader import, and the DRF field declaration `label` in
    VideoMaskProfileSerializer that intentionally shadows Serializer.label.
    The two new
    suppressions from the clinical lifecycle commit were replaced by explicit
    casts after the existing isinstance checks in clinical_lifecycle/facts.py
    and audit_clinical_lifecycle.py, so the total decreases from 109 to 107.
    Review 2026-11-02: the suppression set is identical between source state
    854a8063 and the current working tree (73 findings, same fingerprint). The
    recorded 107 was already stale when it was written; no suppression was
    added, so only the snapshot is corrected.
    Review 2026-11-18 by codex-report-validation-20261118 against 854a8063:
    exactly one addition, export_ready._publish_committed_approval suppresses
    reportUnknownMemberType only on Django Signal.send. The event is a typed
    VideoReadyForExportCommitted dataclass dispatched by transaction.on_commit;
    callback errors are not swallowed. No other suppression changed. Retire this
    exception when the Django signal boundary has a fully typed send contract.
    Review 2026-11-24 by codex-publication-20261124-centralize against c8b3ca0c:
    the only signature change moves reportIncompatibleVariableOverride from
    VideoState.objects to the shared abstract GuardedStateModel.objects. Django
    specializes the guarded manager for concrete subclasses; the suppression
    remains restricted to that framework override. Retire it when the installed
    Django typing contract supports this manager specialization. The other 73
    suppression signatures are unchanged; no general type exemption is added.
  review_after: 2026-12-24
