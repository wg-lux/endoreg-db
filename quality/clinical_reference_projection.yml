schema_version: '1.0'
feature_id: dtypes_study_definitions
bootstrap_delegates:
  migrate_reference_catalog:
    owner: host_operations
    purpose: Explicit reconciliation of existing host rows against the versioned lx-dtypes catalogue.
    record_types: []
