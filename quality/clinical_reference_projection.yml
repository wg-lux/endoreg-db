bootstrap_commands:
  load_tag_data:
    owner: host_operations
    purpose: Tags used by host records.
    record_types:
    - tag
  load_information_source:
    owner: clinical_graph
    purpose: Clinical source catalog and host source identities.
    record_types:
    - information_source_type
    - information_source
  load_risk_data:
    owner: clinical_catalog
    purpose: Risk values and risk types; preserve existing clinical meanings.
    record_types:
    - risk_type
    - risk
  load_center_data:
    owner: study_preset
    purpose: Deployment-selected centers with immutable center keys.
    record_types:
    - center
  load_endoscope_data:
    owner: host_operations
    purpose: Installed hardware and anonymization coordinate profiles.
    record_types:
    - endoscope_type
    - endoscopy_processor
    - endoscope
  load_distribution_data:
    owner: clinical_catalog
    purpose: Distributions referenced by laboratory and synthetic case definitions.
    record_types:
    - numeric_value_distribution
    - single_categorical_value_distribution
    - multiple_categorical_value_distribution
    - date_value_distribution
  load_gender_data:
    owner: study_preset
    purpose: Shared gender reference identities.
    record_types:
    - gender
  load_report_reader_flag_data:
    owner: host_operations
    purpose: Report parsing configuration.
    record_types:
    - report_reader_flag
  load_pdf_type_data:
    owner: host_operations
    purpose: Report format and parsing configuration.
    record_types:
    - pdf_type
  load_unit_data:
    owner: clinical_graph
    purpose: Units used by descriptors, laboratory values, medications and resources.
    record_types:
    - unit
  load_disease_data:
    owner: clinical_catalog
    purpose: Diseases, classifications and choices referenced by patient records.
    record_types:
    - disease
    - disease_classification
    - disease_classification_choice
  load_event_data:
    owner: clinical_catalog
    purpose: Clinical event definitions.
    record_types:
    - event
  load_organ_data:
    owner: clinical_catalog
    purpose: Anatomical reference definitions.
    record_types:
    - organ
  load_contraindication_data:
    owner: clinical_catalog
    purpose: Contraindication definitions.
    record_types:
    - contraindication
  load_finding_data:
    owner: clinical_graph
    purpose: Finding, classification, choice and intervention graph.
    record_types:
    - finding_intervention_type
    - finding_intervention
    - finding_type
    - finding_classification_choice
    - finding_classification_type
    - finding_classification
    - finding
  load_examination_indication_data:
    owner: clinical_graph
    purpose: Indications and required interventions.
    record_types:
    - examination_indication_classification_choice
    - examination_indication_classification
    - examination_indication
  load_examination_data:
    owner: clinical_graph
    purpose: Examination graph plus legacy examination-time catalogs.
    record_types:
    - examination_type
    - examination_time_type
    - examination_time
    - examination
  load_lab_value_data:
    owner: clinical_catalog
    purpose: Laboratory value definitions, normal ranges and sample types.
    record_types:
    - lab_value
    - patient_lab_sample_type
  load_medication_data:
    owner: clinical_catalog
    purpose: Medication definitions, schedules and indication relationships.
    record_types:
    - medication
    - medication_indication_type
    - medication_intake_time
    - medication_schedule
    - medication_indication
  load_ai_model_label_data:
    owner: study_preset
    purpose: Label types, labels and versioned label sets.
    record_types:
    - label_type
    - label
    - label_set
  load_ai_model_data:
    owner: host_operations
    purpose: Model architecture and deployment-specific metadata.
    record_types:
    - model_type
    - video_segmentation_label
    - video_segmentation_label_set
    - ai_model
  load_disease_classification_data:
    owner: clinical_catalog
    purpose: Compatibility projection with complete relation dependency closure.
    record_types:
    - disease_classification
  load_disease_classification_choices_data:
    owner: clinical_catalog
    purpose: Compatibility projection with complete relation dependency closure.
    record_types:
    - disease_classification_choice
  load_green_endoscopy_wuerzburg_data:
    owner: host_operations
    purpose: Optional versioned reference package; excludes employees and assignments.
    record_types:
    - emission_factor
    - resource
    - waste
    - material
    - product_group
    - transport_route
    - product
    - reference_product
    - center_waste
    - center_resource
    - product_material
    - product_weight
  load_profession_data:
    owner: host_operations
    purpose: Optional versioned reference package; excludes employees and assignments.
    record_types:
    - profession
  load_qualification_data:
    owner: host_operations
    purpose: Optional versioned reference package; excludes employees and assignments.
    record_types:
    - qualification_type
    - qualification
  load_shift_data:
    owner: host_operations
    purpose: Optional versioned reference package; excludes employees and assignments.
    record_types:
    - shift_type
    - shift
