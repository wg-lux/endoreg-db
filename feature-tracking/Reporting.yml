schema_version: '1.0'
id: reporting
name: Klinisches Reporting
description: Sicherer Import, Bearbeitung, Materialisierung, LLM-Verarbeitung und Streaming klinischer
  Berichte. Die erste Version des Template-Builders bleibt ohne produktionsreife Administration;
  eine ausreichend garantierbare Rollen- und Berechtigungsverwaltung für Builder- und Lifecycle-
  Aktionen ist ausdrücklich für eine spätere Version geplant.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/report_import_concurrency_implementation.md
  disposition: reference
  note: Verbindliche Implementierungsleitlinie für stabile Snapshots, Fencing, native Laufzeit und den
    Vertrag mit lx-anonymizer.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Berichtslebenszyklus und unterstützte Dokumenttypen sind definiert
  acceptance:
  - Import, Entwurf, Finalisierung, PDF-Materialisierung und Historie haben explizite Invarianten.
  - LLM-Verarbeitung ist optional, nachverfolgbar und kein stiller Freigabeersatz.
  required: true
  verification:
    kind: manual
    instructions: Berichtszustände gegen Modelle, Services, API und Jobs prüfen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: report_workflow
  category: functionality
  title: Import bis Streaming funktioniert deterministisch und idempotent
  acceptance:
  - Finalisierung verlangt Untersuchung und Dokumenttyp.
  - Materialisierung und Reimport erzeugen nachvollziehbare Versionen ohne stille Duplikate.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_report_import_service_unit.py
    - tests/services/test_report_materialization_contracts.py
    - tests/views/report/test_patient_examination_report_ninja_api.py
    - -q
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: automated_tests
  category: testing
  title: Import, Persistenz, Materialisierung, LLM-Jobs und Streaming sind getestet
  acceptance:
  - Kritische positive und negative Pfade laufen in fokussierten Testlanes.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_report_persistence_service.py
    - tests/services/test_report_materialization_contracts.py
    - tests/views/report/test_report_stream.py
    - tests/services/test_report_llm_jobs.py
    - -q
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: report_template_selection_consistency
  category: functionality
  title: Berichtsvorlagen bleiben zwischen Auswahl, Draft und Laufzeitvalidierung konsistent
  acceptance:
  - Die klinische Auswahl enthält ausschließlich veröffentlichte und produktionsbereite Vorlagen.
  - Ein Draft mit abweichender, nicht veröffentlichter oder inkompatibler Template-Identität wird nicht
    aktiviert.
  - Template-Wechsel mit bestehenden Befunden oder Draft-Inhalten erfordert eine explizite Bestätigung.
  - Readiness, Veröffentlichen und Entveröffentlichen sind im Builder getrennte und getestete Aktionen.
  - Gespeicherte Draft-Templates können im Builder über die Preview-Route wieder geöffnet werden, ohne
    in der klinischen Auswahl zu erscheinen.
  required: true
  verification:
    kind: command
    command:
    - bash
    - -lc
    - cd /home/admin/dev/lx-annotate/frontend && devenv shell -- npm run test:unit -- src/api/__tests__/reportTemplateBuilderApi.test.ts
      src/api/__tests__/reportTemplatesApi.test.ts src/stores/__tests__/reportingFlow.template.spec.ts
      src/views/reporting/__tests__/ReportingShell.mediaPreload.test.ts src/views/reporting/__tests__/FindingsCapturePage.test.ts
      src/views/reporting/__tests__/ReportEditorPage.test.ts
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: bash -lc 'cd /home/admin/dev/lx-annotate/frontend && devenv shell -- npm run test:unit
        -- src/api/__tests__/reportTemplateBuilderApi.test.ts src/api/__tests__/reportTemplatesApi.test.ts
        src/stores/__tests__/reportingFlow.template.spec.ts src/views/reporting/__tests__/ReportingShell.mediaPreload.test.ts
        src/views/reporting/__tests__/FindingsCapturePage.test.ts src/views/reporting/__tests__/ReportEditorPage.test.ts'
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-30T06:59:22.614245Z'
- id: report_template_builder_administration
  category: security
  title: "Spätere Version: Rollenbasierte Administration des Template-Builders"
  acceptance:
  - Builder-Listen, Preview, Speichern, Veröffentlichen und Entveröffentlichen sind explizit authentifiziert.
  - Lesen, Ändern und Lifecycle-Aktionen besitzen getrennte, überprüfbare Rollen- und Berechtigungsregeln.
  - Unberechtigte und nicht authentifizierte Zugriffe werden serverseitig abgelehnt; Frontend-Ausblendung gilt nicht als Schutz.
  - Tests decken mindestens nicht authentifizierte, authentifizierte nicht berechtigte und berechtigte Aufrufer ab.
  required: true
  verification:
    kind: manual
    instructions: Nach Einführung der Administration die Ninja-Endpunkte, Deployment-Profile, Rollenregeln und negativen API-Tests prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/django/api/tests/test_report_template_routes_extra.py
      note: Builder-Routen prüfen anonymen Zugriff, getrennte Read-/Write-Kapazitäten und fail-closed Verhalten.
    - kind: test
      reference: /home/admin/endoreg-db/tests/authz/test_lx_dtypes_report_template_access.py
      note: Host-Integration prüft sechs Rollen- und Fail-Closed-Fälle.
    assessed_by: Codex
    assessed_at: '2026-07-30T12:00:00Z'
    note: Authentifizierung und Read-/Write-Trennung sind implementiert. Auditierung, explizite Modul-/Center-Scopes, CSRF-/Paralleländerungstests und ein vollständiger Produktionsnachweis stehen noch aus.
- id: access_controls
  category: security
  title: Berichtszugriff und LLM-Verarbeitung sind patienten- und center-bezogen
  acceptance:
  - Fremde Berichte können weder gelesen noch verarbeitet oder gestreamt werden.
  - Rohberichte verlassen den lokalen Schutzbereich nicht über Exportpfade.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/authz/test_report_llm_policy.py
    - tests/views/report/test_report_stream.py
    - -q
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: artifact_integrity
  category: data_integrity
  title: Berichtsversionen und PDF-Artefakte sind atomar und nachvollziehbar
  acceptance:
  - Hash, Version, Quelldokument und Renderergebnis bleiben konsistent.
  - Fehlgeschlagene Materialisierung hinterlässt kein freigegebenes Teilprodukt.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_report_artifact_integrity.py
    - tests/services/test_report_materialization_contracts.py
    - -q
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: stable_report_snapshot
  category: functionality
  title: Berichtsquellen werden als stabile, unveränderliche Snapshots übernommen
  acceptance:
  - Hashing und Kopieren lesen dieselbe geöffnete Quelldatei innerhalb eines versionierten, typisierten
    Snapshot-Vertrags.
  - Änderung, Austausch, symbolische Verknüpfung oder unzulässiger Dateityp der Quelle führen vor Datenbankmutation
    zu einem lauten Abbruch.
  - Der Snapshot wird ausschließlich innerhalb der freigegebenen verschlüsselten Speichergrenze atomar
    veröffentlicht.
  - Ein vom aktuellen Fencing-Versuch besessener Snapshot bleibt über Zustands- und Retry-Resets hinweg
    bis zur erfolgreichen Publikation oder zur endgültigen, besitzgeprüften Fehlerbereinigung erhalten.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_report_import_concurrency.py
    - tests/rust_backend/test_report_snapshot_parity.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: tests/rust_backend/test_report_snapshot_parity.py; tests/services/test_report_import_concurrency.py
    - kind: command
      reference: devenv tasks run rust:report-runtime
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_report_import_service.py
        (3 passed); tests/services/test_report_import_service_unit.py tests/models/metadata/file_import/test_create_report_file.py
        tests/import_files/test_storage_state_management.py (17 passed); full pyright (0 errors)
    note: Der aktive, versuchseigene Snapshot bleibt jetzt über den besitzgeprüften Retry-Reset erhalten;
      brandneue Imports führen keinen destruktiven Selbst-Reset mehr aus. Endgültige Fehlerbereinigung
      entfernt den Snapshot weiterhin. Der Reparaturpfad widerruft außerdem veraltete Readiness-Flags
      und den SHA-256 des entfernten Processed-PDFs.
    assessed_by: Codex
    assessed_at: '2026-07-27T10:04:10.365662Z'
- id: report_import_fencing
  category: data_integrity
  title: Parallele Berichtsimporte sind durch Sperren und Fencing gegen überholte Worker geschützt
  acceptance:
  - Pfadanspruch, inhaltsbezogene Deduplizierung und Datenbankpublikation besitzen eine dokumentierte,
    zyklusfreie Reihenfolge.
  - Ein abgelaufener oder ersetzter Worker kann keinen neueren Versuch finalisieren.
  - Zwei Prozesse erzeugen für denselben Inhalt höchstens ein kanonisches RawPdfFile und genau eine erfolgreiche
    Publikation.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_report_import_concurrency.py
    - tests/services/test_report_import_fencing.py
    - -q
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/services/test_report_import_fencing.py; tests/services/test_report_import_concurrency.py
    note: Persistiertes monotones Fencing, Lease-Erneuerung, bedingte Fehlerfreigabe und Prozess-Lock
      sind implementiert. Offen bleibt ein vollständiger Zwei-Prozess-Importtest bis zur kanonischen RawPdfFile-Publikation.
    assessed_by: Codex
    assessed_at: '2026-07-27T07:17:45.266117Z'
- id: native_report_runtime
  category: operations
  title: Native Berichtsfunktionen sind baubar, erkennbar und versionsfest
  acceptance:
  - Continuous Integration baut das PyO3-Modul aus demselben Commit und prüft Stub-, Capability- und Wheel-Import-Parität.
  - Das Produktionsprofil bricht beim Start ab, wenn eine verpflichtende native Fähigkeit fehlt; ein erlaubter
    Python-Fallback ist explizit konfiguriert und beobachtbar.
  - Artefaktmanifest und strukturierte Ereignisse enthalten Backend-, Vertrags- und Implementierungsversion
    ohne Patientendaten.
  required: true
  verification:
    kind: manual
    instructions: Wheel aus sauberem Checkout bauen, installieren und Capability-/Startup-Prüfung in Produktionskonfiguration
      ausführen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: devenv tasks run rust:report-runtime
    - kind: code
      reference: .github/workflows/ci.yml; scripts/check_report_native_runtime.sh
    - kind: code
      reference: endoreg_db/services/environment_readiness.py; endoreg_db/import_files/video_import_service.py
    - kind: test
      reference: tests/services/test_environment_readiness_unit.py; tests/utils/video/test_ffmpeg_wrapper.py
        (included in 65 passed focused lane)
    note: Wheel-, Stub- und Capability-Parität sowie fail-closed Prüfhelfer sind implementiert. Nicht
      nachgewiesen ist die automatische Erzwingung beim Start jedes Produktions-Web- und Worker-Prozesses;
      das lx-anonymizer-Video-Gate wird derzeit erst beim Laden des Importers geprüft. Für Verifizierung
      müssen die Pflichtfähigkeiten in einen verbindlichen Startup-Preflight aufgenommen und mit installiertem
      Release-Wheel in Web- und Worker-Profilen negativ getestet werden.
    assessed_by: Codex
    assessed_at: '2026-07-27T08:14:05.205607Z'
- id: anonymizer_report_contract
  category: documentation
  title: Die Grenze zu lx-anonymizer ist typisiert, isoliert und kompatibilitätsgeprüft
  acceptance:
  - endoreg-db besitzt Import, Snapshot, Sperren, Persistenz und kanonische Publikation; lx-anonymizer
    besitzt ausschließlich die inhaltliche Anonymisierung im zugewiesenen Versuchsverzeichnis.
  - Anfrage, Ergebnis, Fehlerklassen, Provenienz und Versionsaushandlung sind in beiden Repositories deckungsgleich
    dokumentiert.
  - Ein Cross-Repository-Vertragstest prüft mindestens die älteste unterstützte und die aktuelle lx-anonymizer-Version.
  required: true
  verification:
    kind: manual
    instructions: Beide Vertragsdokumente und die unterstützte Versionsmatrix gegen einen installierten
      Wheel-Vertrag prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: /home/admin/lx-data-models/lx_dtypes/models/contracts/report_anonymization.py; /home/admin/lx-anonymizer/lx_anonymizer/report_contracts.py;
        /home/admin/lx-anonymizer/lx_anonymizer/report_reader.py
    - kind: test
      reference: /home/admin/lx-data-models/lx_dtypes/models/contracts/tests/test_report_anonymization.py
        (5 passed); /home/admin/lx-anonymizer/tests/test_report_reader_contract_v2.py (7 passed)
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-data-models:/home/admin/lx-anonymizer python
        -m pytest tests/import_files/test_report_anonymization_contract.py -q (2 passed)
    - kind: document
      reference: docs/report_import_concurrency_implementation.md; /home/admin/lx-anonymizer/docs/report_pipeline_concurrency_contract.md
    note: Der serialisierbare V2-Vertrag liegt gemeinsam in lx_dtypes, lx-anonymizer konsumiert ihn ohne
      lokale Modellduplikate, und der aktuelle lokale Endoreg-Vertragstest besteht. Verifizierung bleibt
      bis zur Veröffentlichung einer neuen, unverbrauchten lx-dtypes-Version und einer CI-Matrix mit installierten
      ältester und aktueller unterstützter lx-anonymizer-Wheel-Version offen.
    assessed_by: Codex
    assessed_at: '2026-07-27T08:10:05.924121Z'
