schema_version: "1.0"
id: reporting
name: Klinisches Reporting
description: Sicherer Import, Bearbeitung, Materialisierung, LLM-Verarbeitung und Streaming klinischer Berichte.
owners:
  - endoreg_db maintainers
production_critical: true
source_documents:
  - path: docs/report_import_concurrency_implementation.md
    disposition: reference
    note: Verbindliche Implementierungsleitlinie für stabile Snapshots, Fencing, native Laufzeit und den Vertrag mit lx-anonymizer.
definition_of_done:
  - id: documented_scope
    category: requirements
    title: Berichtslebenszyklus und unterstützte Dokumenttypen sind definiert
    acceptance:
      - Import, Entwurf, Finalisierung, PDF-Materialisierung und Historie haben explizite Invarianten.
      - LLM-Verarbeitung ist optional, nachverfolgbar und kein stiller Freigabeersatz.
    required: true
    verification:
      kind: manual
      instructions: Berichtszustände gegen Modelle, Services, API und Jobs prüfen.
    assessment: &not_assessed
      status: not_assessed
  - id: report_workflow
    category: functionality
    title: Import bis Streaming funktioniert deterministisch und idempotent
    acceptance:
      - Finalisierung verlangt Untersuchung und Dokumenttyp.
      - Materialisierung und Reimport erzeugen nachvollziehbare Versionen ohne stille Duplikate.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/services/test_report_import_service_unit.py, tests/services/test_report_materialization_contracts.py, tests/views/report/test_patient_examination_report_ninja_api.py, -q]
      timeout_seconds: 900
    assessment: *not_assessed
  - id: automated_tests
    category: testing
    title: Import, Persistenz, Materialisierung, LLM-Jobs und Streaming sind getestet
    acceptance:
      - Kritische positive und negative Pfade laufen in fokussierten Testlanes.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/services/test_report_persistence_service.py, tests/services/test_report_materialization_contracts.py, tests/views/report/test_report_stream.py, tests/services/test_report_llm_jobs.py, -q]
      timeout_seconds: 900
    assessment: *not_assessed
  - id: access_controls
    category: security
    title: Berichtszugriff und LLM-Verarbeitung sind patienten- und center-bezogen
    acceptance:
      - Fremde Berichte können weder gelesen noch verarbeitet oder gestreamt werden.
      - Rohberichte verlassen den lokalen Schutzbereich nicht über Exportpfade.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/authz/test_report_llm_policy.py, tests/views/report/test_report_stream.py, -q]
      timeout_seconds: 600
    assessment: *not_assessed
  - id: artifact_integrity
    category: data_integrity
    title: Berichtsversionen und PDF-Artefakte sind atomar und nachvollziehbar
    acceptance:
      - Hash, Version, Quelldokument und Renderergebnis bleiben konsistent.
      - Fehlgeschlagene Materialisierung hinterlässt kein freigegebenes Teilprodukt.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/services/test_report_artifact_integrity.py, tests/services/test_report_materialization_contracts.py, -q]
      timeout_seconds: 600
    assessment: *not_assessed
  - id: stable_report_snapshot
    category: functionality
    title: Berichtsquellen werden als stabile, unveränderliche Snapshots übernommen
    acceptance:
      - Hashing und Kopieren lesen dieselbe geöffnete Quelldatei innerhalb eines versionierten, typisierten Snapshot-Vertrags.
      - Änderung, Austausch, symbolische Verknüpfung oder unzulässiger Dateityp der Quelle führen vor Datenbankmutation zu einem lauten Abbruch.
      - Der Snapshot wird ausschließlich innerhalb der freigegebenen verschlüsselten Speichergrenze atomar veröffentlicht.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/services/test_report_import_concurrency.py, tests/rust_backend/test_report_snapshot_parity.py, -q]
      timeout_seconds: 600
    assessment: *not_assessed
  - id: report_import_fencing
    category: data_integrity
    title: Parallele Berichtsimporte sind durch Sperren und Fencing gegen überholte Worker geschützt
    acceptance:
      - Pfadanspruch, inhaltsbezogene Deduplizierung und Datenbankpublikation besitzen eine dokumentierte, zyklusfreie Reihenfolge.
      - Ein abgelaufener oder ersetzter Worker kann keinen neueren Versuch finalisieren.
      - Zwei Prozesse erzeugen für denselben Inhalt höchstens ein kanonisches RawPdfFile und genau eine erfolgreiche Publikation.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/services/test_report_import_concurrency.py, tests/services/test_report_import_fencing.py, -q]
      timeout_seconds: 900
    assessment: *not_assessed
  - id: native_report_runtime
    category: operations
    title: Native Berichtsfunktionen sind baubar, erkennbar und versionsfest
    acceptance:
      - Continuous Integration baut das PyO3-Modul aus demselben Commit und prüft Stub-, Capability- und Wheel-Import-Parität.
      - Das Produktionsprofil bricht beim Start ab, wenn eine verpflichtende native Fähigkeit fehlt; ein erlaubter Python-Fallback ist explizit konfiguriert und beobachtbar.
      - Artefaktmanifest und strukturierte Ereignisse enthalten Backend-, Vertrags- und Implementierungsversion ohne Patientendaten.
    required: true
    verification:
      kind: manual
      instructions: Wheel aus sauberem Checkout bauen, installieren und Capability-/Startup-Prüfung in Produktionskonfiguration ausführen.
    assessment: *not_assessed
  - id: anonymizer_report_contract
    category: documentation
    title: Die Grenze zu lx-anonymizer ist typisiert, isoliert und kompatibilitätsgeprüft
    acceptance:
      - endoreg-db besitzt Import, Snapshot, Sperren, Persistenz und kanonische Publikation; lx-anonymizer besitzt ausschließlich die inhaltliche Anonymisierung im zugewiesenen Versuchsverzeichnis.
      - Anfrage, Ergebnis, Fehlerklassen, Provenienz und Versionsaushandlung sind in beiden Repositories deckungsgleich dokumentiert.
      - Ein Cross-Repository-Vertragstest prüft mindestens die älteste unterstützte und die aktuelle lx-anonymizer-Version.
    required: true
    verification:
      kind: manual
      instructions: Beide Vertragsdokumente und die unterstützte Versionsmatrix gegen einen installierten Wheel-Vertrag prüfen.
    assessment: *not_assessed
  - id: operational_readiness
    category: operations
    title: Jobfehler, Renderer und Wiederanlauf sind betreibbar
    acceptance:
      - Status, Fehlergrund, Retry-Entscheidung und Abhängigkeiten sind für Betreiber sichtbar.
      - Wiederholung ist idempotent und verliert keine Historie.
    required: true
    verification:
      kind: manual
      instructions: Renderer- und LLM-Fehler samt Wiederanlauf im Betriebsprofil durchführen.
    assessment: *not_assessed
  - id: user_documentation
    category: documentation
    title: API-, Nutzer- und Betriebsdokumentation entspricht dem Berichtsworkflow
    acceptance:
      - Unterstützte Formate, Status, Fehler und Berechtigungen sind vollständig beschrieben.
    required: true
    verification:
      kind: manual
      instructions: Dokumentation anhand eines vollständigen Import-bis-Stream-Ablaufs prüfen.
    assessment: *not_assessed
