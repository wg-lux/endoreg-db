- id: report_draft_persistence_contract
  category: data_integrity
  title: Berichtsentwürfe werden repositoryübergreifend strikt und kanonisch persistiert
  acceptance:
  - Der versionierte Pydantic-Vertrag für den Report-Draft besitzt genau einen kanonischen Owner in lx_dtypes;
    endoreg_db re-exportiert ihn ohne lokales Schema oder eigene Normalisierung.
  - Unbekannte Felder, skalare Typ-Coercion, nicht objektförmige Payloads sowie NaN und Infinity werden
    vor jedem normalen PatientExamination-JSONField-Schreibpfad abgelehnt.
  - Gültige snake_case- und dokumentierte Legacy-camelCase-Template-Identitäten werden ohne semantischen
    Verlust in eine kanonische snake_case-Persistenzform überführt.
  - lx-annotate validiert GET- und PUT-Antworten an derselben API-Grenze; der zentrale Axios-Adapter bleibt
    allein für camelCase-/snake_case-Transportkonvertierung zuständig.
  required: true
  verification:
    kind: command
    command:
    - bash
    - -lc
    - cd /home/admin/lx-data-models && devenv shell -- pytest -q lx_dtypes/models/contracts/tests/test_report_draft.py
      && cd /home/admin/endoreg-db && devenv shell -- env PYTHONPATH=/home/admin/lx-data-models .devenv/state/venv/bin/python
      -m pytest tests/views/patient_examination/test_patient_examination_draft_viewset.py -q && cd /home/admin/dev/lx-annotate/frontend
      && devenv shell -- npm exec -- vitest run src/api/__tests__/reportDraftApi.test.ts
    timeout_seconds: 900
  assessment:
    status: verified
