    Snapshot-Vertrags.
  - Änderung, Austausch, symbolische Verknüpfung oder unzulässiger Dateityp der Quelle führen vor Datenbankmutation
    zu einem lauten Abbruch.
  - Der Snapshot wird ausschließlich innerhalb der freigegebenen verschlüsselten Speichergrenze atomar
    veröffentlicht.
  - Ein vom aktuellen Fencing-Versuch besessener Snapshot bleibt über Zustands- und Retry-Resets hinweg
    bis zur erfolgreichen Publikation oder zur endgültigen, besitzgeprüften Fehlerbereinigung erhalten.
