        reale Videos und Encoderbelege; verschlüsselter Sender-/Empfänger-Roundtrip sowie Export-Lease
        gegen gleichzeitigen Generationenwechsel.'
    - kind: test
      reference: 'tests/services/test_hub_video_provenance.py; tests/services/test_frame_provenance.py:
        Sitzungs-/Uhr-/Einheitenbindung, Mehrstufen-Abstammung, Synchronisationspersistenz, Extrapolation,
        Mehrdeutigkeit, Fehlertoleranz und Datenschutzfelder.'
    - kind: code
