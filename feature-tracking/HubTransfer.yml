    Szenarien mit allen kompromittierten Schlüsseln geprüft (nur Registerdaten; zusätzlich alle Quelldaten).
    Speicheralternativen, Fallverknüpfung, Inhaltsinferenz und Grenzen der Lean-Aussagen werden getrennt
    ausgewiesen. Registerbetrieb benötigt konkrete Rechtsgrundlagen, Rollen, Datenschutz-Folgenabschätzung
    soweit erforderlich und überprüfte Schutzmaßnahmen; Tests oder Framework-Publikation gelten nicht
