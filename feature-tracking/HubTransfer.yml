    Metadaten und Wiederholungen.
  - Der Empfänger weist Identitätshashes vor Persistenz zurück; vorhandene lokale Identitäten und Datei-Prüfsummen
    bleiben erhalten.
  - Vertrag 5.0 überträgt persistierte UUIDs für Patienten und Untersuchungen gemäß lx-data-models. Lokale
    Ganzzahl-IDs werden abgewiesen; Wiederholungen behalten UUIDs und Inhalts-Hashes. UUID-Kollisionen
    mit fremden Besitzern oder Patienten werden vor Verknüpfung abgewiesen.
  - Sender und Empfänger verwenden den gemeinsamen lx_dtypes-Vertrag; Versionen 3.0 und 4.0 bleiben ungültig.
  required: true
  verification:
    kind: manual
    instructions: Run focused boundary regression tests and type checks before coordinated deployment.
