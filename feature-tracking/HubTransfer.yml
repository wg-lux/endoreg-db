- id: transfer_integrity_and_replay
  category: data_integrity
  title: Registration, media upload, acknowledgement, and replay preserve one canonical transfer
  acceptance:
  - The sender validates typed payload schema, immutable transfer identity, source ownership, processed-media
    hash, and resource rows before network transmission.
  - Video overview eligibility, marking, and payload construction consume one canonical readiness resolver;
    anonymization state, the canonical SegmentAnnotationStatus, and processed-media export integrity remain
    separate, and no video is eligible when transfer-time hash validation would reject it.
  - Polling overview requests never read complete processed-video files; the typed API exposes anonymization,
    SegmentAnnotationStatus, persisted export-integrity status, and derived eligibility, while marking
    and transfer perform fresh fail-closed byte verification.
  - Timeouts and retries reuse the same transfer key; changed canonical payloads and ownership collisions
    fail as INCONSISTENT rather than creating or mutating unrelated resources.
  - Completion and cleanup eligibility require a receiver acknowledgement tied to the same transfer, artifact
    hash, and verified apply outcome.
  - Videoexport überträgt eine streng typisierte Frame-Herkunft mit Bindung an den anonymisierten Inhalts-Hash;
    Hub-Import bewahrt diese Bindung und akzeptiert keine zusätzlichen Identitäts-, Pfad- oder Schlüsselfelder.
  - Elektrische Daten unabhängiger Geräte werden nur über explizite, aufnahmesitzungsgebundene Synchronisationsanker
    mit rationalen Zeitbasen und Fehlertoleranz zugeordnet. Fehlende Synchronisation, Extrapolation und
    mehrdeutige Zuordnung schlagen fehl; Präsentationszeitstempel allein begründen keine gemeinsame Uhr.
  required: true
  verification:
    kind: manual
    instructions: Run cross-repository registration, upload, exact replay, changed replay, hash mismatch,
      ownership collision, and lost-acknowledgement scenarios and compare both ledgers.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'endoreg-db pyright: 0 errors; tests/app/test_imports.py: 1 passed; lx-annotate pyright:
        0 errors; focused frontend Vitest: 15 passed; lx-annotate API pytest blocked by missing pytest
        executable (2026-08-13)'
    - kind: command
      reference: 'devenv shell -- pyright: 0 errors; tests/views/media/test_video_ready_export.py: 13
        passed, 4 subtests passed (2026-08-14)'
