- id: transfer_integrity_and_replay
  category: data_integrity
  title: Registration, media upload, acknowledgement, and replay preserve one canonical transfer
  acceptance:
  - The sender validates typed payload schema, immutable transfer identity, source ownership, processed-media
    hash, and resource rows before network transmission.
  - Video overview eligibility, marking, and payload construction consume one canonical readiness resolver;
    anonymization state, the canonical SegmentAnnotationStatus, and processed-media export integrity remain
    separate, and no video is eligible when transfer-time hash validation would reject it.
  - Polling overview requests never read complete processed-video files; the typed API exposes anonymization,
    SegmentAnnotationStatus, persisted export-integrity status, and derived eligibility, while marking
    and transfer perform fresh fail-closed byte verification.
  - Timeouts and retries reuse the same transfer key; changed canonical payloads and ownership collisions
    fail as INCONSISTENT rather than creating or mutating unrelated resources.
  - Completion and cleanup eligibility require a receiver acknowledgement tied to the same transfer, artifact
    hash, and verified apply outcome.
  required: true
  verification:
    kind: manual
    instructions: Run cross-repository registration, upload, exact replay, changed replay, hash mismatch,
      ownership collision, and lost-acknowledgement scenarios and compare both ledgers.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'endoreg-db pyright: 0 errors; tests/app/test_imports.py: 1 passed; lx-annotate pyright:
        0 errors; focused frontend Vitest: 15 passed; lx-annotate API pytest blocked by missing pytest
        executable (2026-08-13)'
    - kind: command
      reference: 'devenv shell -- pyright: 0 errors; tests/views/media/test_video_ready_export.py: 13
        passed, 4 subtests passed (2026-08-14)'
    note: The explicit ready-for-export action repairs missing or stale processed-content hash metadata
      only after anonymization validation and final segment blackening/cleanup. It locks the video, hashes
      the final managed processed artifact once, atomically aligns VideoFile.processed_video_hash and
      VideoState.processed_file_sha256, rejects client-proof mismatch and duplicate digest collisions,
      and leaves polling side-effect free. This covers the legacy Video 2 inconsistency without requiring
      a separate integrity command when the operator presses Exportfreigabe pruefen.
    assessed_by: codex-hub-bulk-video-offload
    assessed_at: '2026-08-14T07:14:36.399848Z'
- id: envelope_encrypted_media_transfer
  category: security
  title: Standalone processed media uses a replay-safe recipient envelope
  acceptance:
  - Every media upload uses a fresh per-transfer 256-bit Data Encryption Key and authenticated encryption;
    the key is wrapped exclusively for the configured central-hub recipient key and never derived from
    NetworkNode.shared_secret or an application master key.
  - Authenticated envelope metadata binds transfer key, source node, target node, resource kind, expected
    plaintext digest, plaintext size, recipient key identifier, and encryption profile so metadata substitution,
    cross-transfer replay, truncation, and ciphertext modification fail closed.
  - Sender retries reuse one atomically persisted mode-0600 ciphertext envelope for the same immutable
    transfer; plaintext media is never materialized outside the approved protected storage boundary or
    transmitted on the wire.
  - The receiver requires envelope metadata and its private unwrap key, rejects plaintext and malformed,
    tampered, wrong-recipient, or replay-inconsistent uploads before model-file publication, validates
    the decrypted digest and size, and persists through its own encrypted storage using its local master
    key.
  - Granular tests cover success, exact retry, changed-source replay, missing keys and metadata, wrong
    key, authenticated-metadata tampering, ciphertext tampering, truncation, atomic cleanup, and absence
    of source or receiver master keys from payloads, logs, configuration, and transfer records.
  required: true
  verification:
    kind: manual
    instructions: Run focused sender and receiver envelope unit suites, cross-repository endpoint tests,
      static typing, and a production-like mTLS transfer using distinct site and hub storage master keys.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'lx-data-models Hub envelope contracts: Pyright 0 errors; pytest 46 passed'
    - kind: command
      reference: endoreg-db locked-scope Pyright 0 errors; service/contract/provenance pytest 60 passed
        plus 5 subtests; endpoint/envelope/provenance pytest 55 passed plus 5 subtests
    - kind: command
      reference: lx-annotate Ruff passed; Pyright 0 errors; sender atomic/worker/cross-repository E2E
        pytest 25 passed
    - kind: command
      reference: LuxNix Hub eval 5 passed; rotation/CSV eval 2 passed; isolated Vault envelope nixtest
        1 passed; Nix parse/nixfmt/YAML/diff checks passed
    note: Phase 2 locally implemented across lx_dtypes, lx-annotate, endoreg-db, and LuxNix. Atomic sender/receiver
      tests and encrypted cross-repository E2E are green; production verification remains pending a clean
      coordinated lx-dtypes/endoreg package build plus deployed gs-02 current-and-retiring key rotation
      and live mTLS transfer evidence.
    assessed_by: codex-hub-envelope-20260817
    assessed_at: '2026-08-17T09:12:47.216984Z'
