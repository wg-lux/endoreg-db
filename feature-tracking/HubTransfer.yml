- id: guarded_patient_matching_resolver
  category: security
  title: Ausführbarer Patientenresolver nach dem Lean-Annahmevertrag
  acceptance:
  - Lokale Eingaben stammen aus autorisierten bestehenden Datensätzen und werden vor Ergebnisannahme erneut
    geprüft; fehlende oder gelöschte Originaldaten und unzulässige Schlüsselgenerationen werden abgewiesen.
  - Der Resolver nutzt die bestehende Kodierung und HMAC-Funktion mit A-Schlüssel und A-Zentrum; vollständige
    Aggregation offenbart nur dem Empfänger den Ergebnisstatus und gegebenenfalls einen einzelnen Kandidaten.
  - Signierte Ergebnisse binden Sitzung, Teilnehmer, Zweck, Publikum, Ablauf, Schema, Generation, Circuit
    und unveränderliche Datensatzreferenzen an einen lokal aufgezeichneten Workerabschluss.
  - Atomare persistierte Sitzungsannahme verhindert Replay und konkurrierende Doppelannahme; begrenzte
    kumulative Anfragen und explizite UUID-Beziehungen ersetzen automatische Zusammenführung.
  - Negative Tests decken Substitution, Manipulation, Ablauf, unzulässige Generationen, Mehrdeutigkeit
    und Abbruch ab; Backend- und Vertrauensannahmen bleiben explizit und die Funktion wird nicht automatisch
    ausgerollt.
  required: true
  verification:
    kind: manual
    instructions: Typprüfung, fokussierte ORM- und Workerprüfungen sowie tatsächliche Zwei-Prozess-Circuitprüfung
      ausführen; Bereitstellung und unabhängige Kryptografieprüfung separat bewerten.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
