- id: hub_pseudonym_lifecycle
  category: security
  title: Hubgebundene Pseudonyme bleiben über Bestand, Rotation und Deployment konsistent
  acceptance:
  - Unter Vertrag 5.0 empfangene Hub-Zeilen mit lokalen Quell-UUIDs werden inventarisiert und über einen
    geprüften, fail-closed Ablauf am Quellknoten auf hubgebundene UUIDv8-Pseudonyme abgebildet oder als
    LOST/quarantäniert markiert. Keine geratenen Zuordnungen; keine Löschung vor Hash-, Besitz- und Bestandsabgleich.
  - Eine Rotation des lokalen Identitätssalts teilt Hub-Patienten nicht still auf. Neue Transfers nach
    Rotation werden blockiert, bis eine auditierte, nur am Quellknoten berechnete Abbildung alter auf
    neue Pseudonyme am Hub atomar übernommen ist.
  - lx-data-models, endoreg-db und lx-annotate werden für Vertrag 6.0 mit gepinnten Commits gemeinsam
    ausgerollt; Tests belegen, dass gemischte Versionen in beiden Richtungen geschlossen scheitern.
  required: true
  verification:
    kind: manual
    instructions: Vor pytest Pyright ausführen; Migrations- und Rotationstests gegen PostgreSQL mit Unterbrechung,
      Wiederholung und Konflikten; Versionsmischungstests über alle drei Repositories.
    timeout_seconds: 1800
  assessment:
    status: not_assessed
    evidence: []
    note: Nur TODO-Erfassung am 22.10.2026; Implementierung zurückgestellt. Vertrag 6.0 selbst ist unter
      local_identity_hash_boundary belegt.
