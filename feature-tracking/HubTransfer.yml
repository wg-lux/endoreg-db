schema_version: '1.0'
id: hub_transfer
name: Multi-Center Hub Transfer
description: Production-readiness criteria for attributable, authenticated, integrity-checked outbound
  transfer of anonymized processed media from lx-annotate site nodes to an endoreg_db central hub.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/wiki/hub_ingest_current_state.md
  disposition: reference
  note: Defines the current receiver protocol, replay, ownership, and integrity boundary that the sender
    must satisfy.
- path: docs/deployment_note_hub_contract.md
  disposition: reference
  note: Defines deployment roles and the fail-closed mTLS boundary shared by sender and receiver.
- path: docs/hub_ingest_operations.md
  disposition: reference
  note: Provides the existing ingest operations model that outbound transfer operations must complement.
definition_of_done:
- id: recording_bound_export_preflight
  category: functionality
  title: Transfer-Vorprüfung bindet Herkunft an die Aufnahme und vermeidet erneutes Dekodieren am Sender
  acceptance:
  - Explicit unresolved recovery rejects replacement of a verified recording-bound mapping, but permits
    legacy provenance rooted at a different recording to be acknowledged without deleting historical evidence.
    API recovery, marking and encrypted receiver acceptance cover missing and mismatched legacy ancestry;
    human approvals, content integrity and exact receiver timestamps remain mandatory.
  - Herkunft und elektrische Synchronisation beginnen bei raw_video_hash; eine spätere kanonische Transformation
    ersetzt die Aufnahmeidentität nicht. Fehlende Ursprungsbelege bleiben ein Fehler.
  - Exklusive Medienoperationen und ungültige Herkunft werden vor teurer Inhaltsprüfung erkannt. Der Sender
    prüft weiterhin Freigabe und aktuellen Inhalts-Hash, verwendet danach die typisierten inhaltsgebundenen
    Zeitstempelbelege; der Empfänger dekodiert und prüft die empfangene Generation weiterhin.
  - Probe- und Lease-Fehler während der Sender-Vorbereitung werden über die bestehende Rust-Autorität
    persistiert statt als scheinbar wartender Job zurückzubleiben; begrenzte Wiederholung bleibt sichtbar.
  - Regressionen prüfen mehrstufige Herkunft trotz später beginnender Timeline-Historie, fehlende Ursprungsketten,
    unveränderte Integritätsgates und Dekodierungsprüfung am Empfänger.
  required: true
  verification:
    kind: manual
    instructions: Pyright vor Herkunfts-, Recovery-, Empfänger-, Cleanup- und Sender-Worker-Tests; veränderte
      Dateien und bestehende Deploymentgrenzen separat prüfen.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: '2026-11-17: Vollständiges Backend-Pyright: 0 Fehler, 2 bestehende Warnungen; finales
        Herkunftstest-Pyright: 0 Fehler/0 Warnungen. Fokussierte Backend-Integration (Herkunft, Recovery,
        Medien-Leases, Hub-Cleanup, Transfervertrag, Speichernormalisierung, kanonische Zeitstempel, Rust-Hub-Zustände,
        Importabschluss): zunächst 267 bestanden und 6 neue Fixture-Fehler. Nach Korrektur ausschließlich
        der Fixtures (Center und Dateiname) Herkunftssuite erneut: 27 bestanden in 53,96 s; damit alle
