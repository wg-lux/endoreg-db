- id: recovery_cleanup_and_capacity
  category: operations
  title: Recovery, retry exhaustion, cleanup, and capacity handling are production-ready
  acceptance:
  - Stale jobs are reconciled idempotently, exhausted retries remain visible, and inconsistent state fails
    loudly without unsafe automatic recovery.
  - Local processed media is retained until verified hub apply; cleanup uses typed atomic filesystem wrappers
    and emits structured JSON logs.
  - After a completed retained video transfer, an authorized center-scoped operator can explicitly remove
    all locally owned video files, including raw, processed, playback, frames and recorded upload copies.
    The hub must freshly verify its current received master against the original receipt before deletion.
    Retain local transfer and annotation records; active work, shared paths, missing proof and changed
    generations block deletion. Durable cleanup intent permits idempotent recovery after partial deletion.
  - Operators can handle storage pressure, hub outage, certificate rotation, worker restart, and database/media
    restore without losing transfer provenance.
  - With Hub transfer disabled or its Vault-backed provisioning unavailable, lx-annotate remains startable;
    Hub transfer workers remain fail-closed until their required credentials and node provisioning succeed.
  required: true
  verification:
    kind: manual
    instructions: Perform a production-like outage, restart, retry-exhaustion, capacity, cleanup, certificate-rotation,
      and backup/restore exercise across a site node and central hub.
    timeout_seconds: 1800
  assessment:
