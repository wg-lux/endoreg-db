- id: local_identity_hash_boundary
  category: security
  title: Patientenidentität bleibt am Quellknoten
  acceptance:
  - Patienten- und Untersuchungshashes werden vor jeder Hub-Übertragung abgewiesen, auch in verschachtelten
    Metadaten und Wiederholungen.
  - Der Empfänger weist Identitätshashes vor Persistenz zurück; vorhandene lokale Identitäten und Datei-Prüfsummen
    bleiben erhalten.
  - Vertrag 6.0 überträgt für Patienten und Untersuchungen ausschließlich hubgebundene UUIDv8-Pseudonyme,
    lokal per HMAC unter dem lokalen Identitätssalt aus lokaler UUID und Ziel-Hub abgeleitet. Persistierte
    lokale UUIDs verlassen den Sender nicht. Ganzzahl-IDs und andere UUID-Versionen werden abgewiesen;
    UUIDv8 allein beweist keine Hub-Ableitung, weshalb der Sender immer die separate Hub-Funktion verwendet.
    Wiederholungen und Folgeuntersuchungen desselben lokalen Datensatzes behalten am selben Hub ihr Pseudonym.
    Pseudonym-Kollisionen mit fremden Besitzern oder Patienten werden vor Verknüpfung abgewiesen.
  - Studienbündel an den Hub verwenden dieselben Pseudonyme wie Medientransfers und enthalten keine lokalen
    UUIDs.
  - Sender und Empfänger verwenden den gemeinsamen lx_dtypes-Vertrag; Versionen 3.0, 4.0 und 5.0 bleiben
    ungültig.
  - Neue lokale Patienten aus der hashbasierten Importanlage erhalten deterministische UUIDv8 aus einem
    zweckgetrennten HMAC über Zentrumsschlüssel und Patientenhash unter dem validierten lokalen Identitätssalt.
    Gleiche Eingaben ergeben gleiche UUIDs; andere Zentren und Schlüssel bleiben getrennt. Bestehende
    UUIDs und historische Aliasauflösung bleiben erhalten; konkurrierende Anlage wird pro Zentrum serialisiert.
    Hub-Pseudonyme bleiben separat. Die Werte sind personenbezogene Pseudonyme, keine Anonymisierung;
    notwendige und rechtmäßige Verknüpfung sowie getrennte Geheimnishaltung bleiben Betriebsanforderungen.
  required: true
  verification:
    kind: manual
    instructions: Run focused boundary regression tests and type checks before coordinated deployment.
    timeout_seconds: 300
  assessment:
    status: in_progress
