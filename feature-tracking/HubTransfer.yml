schema_version: '1.0'
id: hub_transfer
name: Multi-Center Hub Transfer
description: Production-readiness criteria for attributable, authenticated, integrity-checked outbound
  transfer of anonymized processed media from lx-annotate site nodes to an endoreg_db central hub.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/wiki/hub_ingest_current_state.md
  disposition: reference
  note: Defines the current receiver protocol, replay, ownership, and integrity boundary that the sender
    must satisfy.
- path: docs/deployment_note_hub_contract.md
  disposition: reference
  note: Defines deployment roles and the fail-closed mTLS boundary shared by sender and receiver.
- path: docs/hub_ingest_operations.md
  disposition: reference
  note: Provides the existing ingest operations model that outbound transfer operations must complement.
definition_of_done:
- id: guarded_patient_matching_resolver
  category: security
  title: Ausführbarer Patientenresolver nach dem Lean-Annahmevertrag
  acceptance:
  - Lokale Eingaben stammen aus autorisierten bestehenden Datensätzen und werden vor Ergebnisannahme erneut geprüft; fehlende oder gelöschte Originaldaten und unzulässige Schlüsselgenerationen werden abgewiesen.
  - Der Resolver nutzt die bestehende Kodierung und HMAC-Funktion mit A-Schlüssel und A-Zentrum; vollständige Aggregation offenbart nur dem Empfänger den Ergebnisstatus und gegebenenfalls einen einzelnen Kandidaten.
  - Signierte Ergebnisse binden Sitzung, Teilnehmer, Zweck, Publikum, Ablauf, Schema, Generation, Circuit und unveränderliche Datensatzreferenzen an einen lokal aufgezeichneten Workerabschluss.
  - Atomare persistierte Sitzungsannahme verhindert Replay und konkurrierende Doppelannahme; begrenzte kumulative Anfragen und explizite UUID-Beziehungen ersetzen automatische Zusammenführung.
  - Negative Tests decken Substitution, Manipulation, Ablauf, unzulässige Generationen, Mehrdeutigkeit und Abbruch ab; Backend- und Vertrauensannahmen bleiben explizit und die Funktion wird nicht automatisch ausgerollt.
  required: true
  verification:
    kind: manual
    instructions: Typprüfung, fokussierte ORM- und Workerprüfungen sowie tatsächliche Zwei-Prozess-Circuitprüfung ausführen; Bereitstellung und unabhängige Kryptografieprüfung separat bewerten.
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: existing_hmac_2pc_evaluation
  category: security
  title: Isolierte Bewertung privater Vergleiche bestehender Patienten-HMACs
  acceptance:
  - Referenztests stimmen mit produktiver JSON- und UTF-8-Kodierung sowie HMAC-SHA256 unter Quellschlüssel
    und Quellzentrum überein; bestehende UUIDs und Hashes bleiben unverändert.
  - Ein synthetischer Zwei-Prozess-Versuch oder ein konkreter Backend-Blocker wird dokumentiert; Referenzzeiten
    werden niemals als 2PC-Leistung bezeichnet.
  - Bewertung trennt Tupelgleichheit, Datensatzbindung, reale Identität, Protokollsicherheit, gemessene
    Leistung und Betriebsbereitschaft einschließlich Administratoren, historischen Schlüsseln und wiederholten
    Abfragen.
  - Signaturen, Wiederholungsschutz, autorisierte Eingaben und klinische Identität werden nur bei tatsächlich
    implementiertem Nachweis als unterstützt bezeichnet; diese Evaluation aktiviert keinen Produktionsabgleich.
  required: false
  verification:
    kind: manual
    instructions: Bericht und reproduzierbare synthetische Tests prüfen; produktive Freigabe bleibt ein
      separates Kriterium.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/patient_matching_2pc_assessment.md
    - kind: test
      reference: tests/scripts/test_patient_matching_2pc_reference.py
    - kind: code
      reference: scripts/patient_matching_2pc.mpc
    - kind: command
      reference: '39 reference tests passed; focused Pyright and Ruff passed; full Pyright 20 existing
        errors/24 warnings; real Tinier batches 1/10/100 completed, 100: 171.815s and 32482.8MB; structure65/tracker37
        valid'
    note: 'Isolierte Evaluation ausgeführt: exakter bestehender HMAC mit A-Key/A-Zentrum und in-circuit
      Epoch-Prüfung; UUIDs und lokale Hashes unverändert. Produktionsbindung, minimaler/atomarer Output,
      Signatur/Replay-Schutz, unabhängige Administration und vollständige Sicherheitsanalyse fehlen. Referenztests39
      bestanden; Backendmessungen sind synthetische Einzelläufe, keine Betriebsfreigabe.'
    assessed_by: codex-patient-uuid-20261019
    assessed_at: '2026-10-19T15:52:25.490456Z'
- id: cross_site_private_patient_matching
  category: security
  title: Privater zentrenübergreifender Abgleich verifizierter gemeinsamer Patientenkennungen
  acceptance:
  - Abgleichseingaben sind verifizierte gemeinsame Patientenkennungen mit festgelegtem Aussteller-Namensraum,
    Normalisierung und Verifikationsbeleg; Name, Geburtsdatum und unbestätigte externe IDs sind ausgeschlossen.
  - Das Betriebsmodell benennt Hub-, Schlüssel- und Quellsystem-Vertrauensgrenzen, Administratoren, Wiederherstellungsrechte
    und das Verhalten bei kompromittierten Quellen. Ein gemeinsamer Host oder Administrator wird nicht
    als unabhängige Schlüsselhaltung oder Schutz vor gemeinsamer Kompromittierung dargestellt.
  - Ein geprüftes privates Abgleichsprotokoll schützt Kennungseingaben und bindet Ergebnisse an ihren
    Verifikationsnachweis. Kryptografische Auswertungsnachweise werden nicht mit Kennungsverifikation
    verwechselt.
  - Signierte Meldungen binden Quellknoten, persistierte Patienten-UUID, Empfänger, Zweck, Abgleichsraum,
    Schlüsselgeneration, Ablaufzeit und Wiederholungsschutz. Schlüsselwiderruf und Rotation schlagen bei
    widersprüchlichen oder unbekannten Generationen geschlossen fehl.
  - Patienten-UUIDs bleiben unverändert; zentrenübergreifende Beziehungen werden separat und nachvollziehbar
    verwaltet. Inhalts-Hashes identifizieren Artefakte, niemals Patienten. Widersprüche verursachen keine
    stille Zusammenführung.
  - Passworthashes, Django SECRET_KEY, NetworkNode.shared_secret, lokale Master-Schlüssel und Patientenmerkmale
    werden nicht als Abgleichsschlüssel oder Saatwerte asymmetrischer Schlüssel verwendet.
  - Wiederholungen, konkurrierende Zuordnungen, gefälschte Belege, falsche Aussteller, unzulässige Schlüssel,
    Manipulation, Widerruf und gezielte Kennungsabfragen sind durch wiederverwendbare Tests abgedeckt;
    Gleichheitsleckage und autorisierte Rateversuche werden ausdrücklich bewertet.
  required: true
  verification:
    kind: manual
    instructions: Prüfe den verifizierten Ausstellervertrag, unabhängige Betriebsverantwortung, Protokoll-
      und Bibliotheksprüfung sowie adversariale Integrationstests vor Aktivierung.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/source_patient_matching.md
    - kind: review
      reference: /home/admin/luxnix/ansible/inventory/host_vars/gs-02.yml:84 and :146; /home/admin/luxnix/modules/nixos/luxnix/vault/default.nix:403;
        /home/admin/luxnix/docs/vault-hub-machine-enrollment.md:47. Read-only source review; no remote
        inspection or secret access.
    - kind: command
      reference: 37 feature definitions and 65 endoreg-db structure manifests validated; independent LuxNix
        review validated 23 manifests. Documentation-only change; no code tests run.
    - kind: document
      reference: docs/patient_matching_2pc_assessment.md
    note: Der Produktionsvertrag verlangt weiterhin verifizierte issuerqualifizierte Kennungen. Die separate
      synthetische Ansatz-A-Evaluation untersucht exakte Demografie-HMAC-Gleichheit mit bestehenden A-Schlüsseln;
      sie benötigt keinen zentralen gemeinsamen Matching-Key. Hub/Vault-Kolokation allein schließt A/B-2PC
      nicht aus. Effektive gemeinsame Administratorrechte, Record-Bindung und Verifikationsverfahren bleiben
      offen; keine Produktionsaktivierung.
    assessed_by: codex-patient-uuid-20261019
    assessed_at: '2026-10-19T15:50:07.310278Z'
- id: local_identity_hash_boundary
  category: security
  title: Patientenidentität bleibt am Quellknoten
  acceptance:
