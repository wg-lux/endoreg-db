- id: security_controls
  category: security
  title: Annotationen sind authentifiziert, dataset-übergreifend und quellengebunden
  acceptance:
  - Frame-Queues, Frame- und Box-Schreibpfade dürfen center-übergreifende Datasets bearbeiten; ausschließlich
    die Ansicht des Raw-Video-Streams bleibt center-bezogen.
  - Normale Nutzer annotieren unter ihrer serverseitig authentifizierten Identität; ein abweichender Annotator-Scope
    erfordert Staff-, Superuser- oder center_scope:admin-Rechte.
  - Interaktive Frame- und Box-Endpunkte akzeptieren ausschließlich manuelle Informationsquellen und können
    keine Prediction-Provenienz erzeugen.
  required: true
  verification:
    kind: manual
    instructions: Autorisierungs- und Provenienzreview für Erstellen, Ändern und Export durchführen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_annotation_access.py
        tests/services/test_segment_annotation_flow.py tests/views/video/test_frame_annotation_bulk_upsert.py
        tests/views/video/test_frame_annotation_task_endpoints.py tests/views/video/test_frame_box_annotation.py
        tests/views/video/test_annotation_access_controls.py tests/management/commands/test_reconcile_frame_segment_annotations.py
        tests/views/misc/test_export_annotated_contract.py -q (73 passed)
    - kind: command
      reference: tests/views/video/test_hls_stream.py::test_hls_playlist_rejects_video_outside_user_center_scope
        (passed)
    note: Cross-center annotation and processed export are allowed; authenticated principal and manual
      provenance remain enforced. Raw-stream foreign-center access returns privacy-preserving 404. The
      separate same-center raw HLS test currently exposes an existing artifact materialization-state failure
      and remains residual risk.
    assessed_by: Codex
    assessed_at: '2026-07-17T12:11:06.557955Z'
