- id: annotation_workflow
  category: functionality
  title: CRUD, Bulk-Upsert, Ableitung und Finalisierung sind konsistent
  acceptance:
  - Wiederholte Operationen sind idempotent und erhalten Provenienz.
  - Korrigierte KI-Segmente werden in einem eigenen Prediction-Correction-Track persistiert; ein erneuter
    Import ersetzt ausschließlich diesen Korrektur-Track und erhält sowohl ursprüngliche Predictions als
    auch gewöhnliche manuelle Annotationen.
  - Ungültige Zeitsegmente und unfertige Annotationen werden abgelehnt.
  - Das Speichern von Frame-Boxen erzeugt einen eindeutigen positiven oder negativen Review-Zustand und
    wechselt erst nach erfolgreicher Persistenz zur nächsten Aufgabe.
  - Vorab geladene Frame-Aufgaben enthalten innerhalb einer Queue-Generation keine doppelten Frame-IDs.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_segment_annotation_flow.py
    - tests/views/video/test_frame_annotation_bulk_upsert.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/services/test_segment_annotation_flow.py tests/views/video/test_frame_annotation_bulk_upsert.py
        -q
      note: Exit-Code 0
    - kind: command
      reference: PATH=/home/admin/dev/lx-annotate/.devenv/profile/bin:$PATH npm run test:unit -- --run
        src/views/__tests__/FrameAnnotationPage.test.ts src/views/__tests__/FrameAnnotationPage.usability.test.ts
        src/stores/__tests__/annotationQueue.test.ts
      note: 28 Tests bestanden; positive und negative Box-Reviews, Fortschaltung und Queue-Deduplizierung
        sind abgedeckt.
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/views/video/test_segments_crud.py
        -q (32 passed)
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/views/video/test_segments_crud.py
        -q (33 passed)
    note: Prediction corrections use an isolated source track; replacement is atomic and preserves ordinary
      manual and prediction rows.
    assessed_by: Codex
    assessed_at: '2026-07-21T07:01:46.259701Z'
