- id: ai_segment_acceptance
  category: testing
  title: KI-Segmentgenerierung, Korrekturimport und Frontend-Lebenszyklus sind fail-closed abgesichert
  acceptance:
  - 'Aufgabe Backend-Persistenz: Wenn auch nur ein von der temporalen Inferenz geliefertes Label oder
    Segment nicht materialisiert werden kann, schlägt der gesamte Lauf fehl; es werden weder Teilsegmente
    persistiert noch der Verarbeitungslauf als erfolgreich markiert.'
  - 'Aufgabe atomarer Korrekturimport: Ein ungültiges Element in einer Importliste bewirkt einen vollständigen
    Rollback; bestehende Prediction-Correction-, Prediction- und gewöhnliche manuelle Tracks bleiben unverändert.'
  - 'Aufgabe Zeitachsenintegrität: Importierte oder im Frontend korrigierte Segmentgrenzen werden bei
    Validierung ausschließlich über den kanonischen Präsentationszeitstempel-Resolver auf Frames abgebildet;
    eine Umrechnung mit nominalen Bildern pro Sekunde ist auch bei variabler Bildrate unzulässig.'
  - 'Aufgabe Frontend-Joblebenszyklus: Eine Antwort mit queued, already_queued oder pending_after_rebuild
    wird als laufender Hintergrundjob angezeigt; alte Segmente werden nicht als neues Ergebnis gemeldet
    und erst nach nachgewiesenem completed-Status neu geladen. failed und busy werden mit ihrer Backendmeldung
    dargestellt.'
  - Die Akzeptanztests liegen in tests/acceptance/test_ai_segment_workflow_acceptance.py und im lx-annotate-Frontend
    unter frontend/tests/components/VideoPredictionSegments.acceptance.spec.ts. Erwartete-Fehler-Markierungen
    werden im Rahmen der jeweiligen Aufgabe entfernt; erst danach darf dieses Kriterium verifiziert werden.
  required: true
  verification:
    kind: command
    command:
    - bash
    - -lc
    - devenv shell -- .devenv/state/venv/bin/pytest tests/acceptance/test_ai_segment_workflow_acceptance.py
      -q && cd /home/admin/dev/lx-annotate/frontend && devenv shell -- npm run test:unit -- --run tests/components/VideoPredictionSegments.acceptance.spec.ts
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: tests/acceptance/test_ai_segment_workflow_acceptance.py (3 passed)
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/acceptance/test_ai_segment_workflow_acceptance.py
        tests/services/test_video_temporal_inference.py tests/views/video/test_segments_crud.py -q (63
        passed)
    - kind: command
      reference: npm run test:unit -- --run tests/components/VideoPredictionSegments.acceptance.spec.ts
        src/stores/__tests__/VideoStoreOptimization.spec.ts tests/components/VideoExaminationAnnotation.functionality.spec.ts
        src/components/VideoExamination/__tests__/VideoExaminationAnnotation.dropdown.test.ts (29 passed)
    - kind: command
      reference: npm run type-check (exit 0)
    note: Fail-closed und atomare Materialisierung, transaktionaler Korrekturimport, präsentationszeitstempelbasierte
      Frame-Abbildung sowie asynchrones Frontend-Polling sind implementiert und durch fokussierte Backend-
      und Frontend-Tests nachgewiesen.
    assessed_by: Codex
    assessed_at: '2026-07-21T07:20:34.143734Z'
- id: security_controls
  category: security
  title: Annotationen sind authentifiziert, dataset-übergreifend und quellengebunden
  acceptance:
  - Frame-Queues, Frame- und Box-Schreibpfade dürfen center-übergreifende Datasets bearbeiten; ausschließlich
    die Ansicht des Raw-Video-Streams bleibt center-bezogen.
  - Normale Nutzer annotieren unter ihrer serverseitig authentifizierten Identität; ein abweichender Annotator-Scope
    erfordert Staff-, Superuser- oder center_scope:admin-Rechte.
  - Interaktive Frame- und Box-Endpunkte akzeptieren ausschließlich manuelle Informationsquellen und können
    keine Prediction-Provenienz erzeugen.
  - Direkt aus Rohvideo dekodierte Frames werden nur innerhalb des Center-Scopes des authentifizierten
    Nutzers ausgeliefert; verarbeitete Frames bleiben gemäß dem center-übergreifenden Annotationsvertrag
    verfügbar.
  required: true
  verification:
    kind: manual
    instructions: Autorisierungs- und Provenienzreview für Erstellen, Ändern und Export durchführen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_annotation_access.py
        tests/services/test_segment_annotation_flow.py tests/views/video/test_frame_annotation_bulk_upsert.py
        tests/views/video/test_frame_annotation_task_endpoints.py tests/views/video/test_frame_box_annotation.py
        tests/views/video/test_annotation_access_controls.py tests/management/commands/test_reconcile_frame_segment_annotations.py
        tests/views/misc/test_export_annotated_contract.py -q (73 passed)
    - kind: command
      reference: tests/views/video/test_hls_stream.py::test_hls_playlist_rejects_video_outside_user_center_scope
        (passed)
    - kind: command
      reference: devenv shell bash -lc '.devenv/state/venv/bin/pytest tests/views/media/test_frame_stream.py
        tests/views/video/test_frame_annotation_task_endpoints.py tests/views/video/test_frame_annotation_bulk_upsert.py
        tests/views/video/test_frame_box_annotation.py -q'
      note: 46 Tests bestanden; fremde Raw-Frames liefern 404, verarbeitete Frames bleiben center-übergreifend
        verfügbar.
    note: Cross-center annotation and processed export are allowed; authenticated principal and manual
      provenance remain enforced. Raw-stream foreign-center access returns privacy-preserving 404. The
      separate same-center raw HLS test currently exposes an existing artifact materialization-state failure
      and remains residual risk.
    assessed_by: Codex
    assessed_at: '2026-07-20T13:46:44+02:00'
