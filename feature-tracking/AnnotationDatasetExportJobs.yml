- id: center_scope_and_paths
  category: security
  title: Zentrumsumfang und Ausgabepfade sind serverseitig erzwungen
  acceptance:
  - Jeder Job hat genau einen Umfang; Zentrumsmitarbeitende dürfen nur eigene center_key-Werte nutzen,
    all_centers ist auf Staff- und Superuser beschränkt.
  - Erstellung und Worker-Start erfordern einen aktiven authentifizierten Anforderer. Deaktivierung oder
    Zentrumsrechteentzug nach dem Einreihen beendet den Job vor dem Export mit failed.
  - Jobliste und Jobdetail zeigen nur Jobs im Zentrumsumfang des Benutzers.
  - Ausgabeverzeichnis und Tabellenpfad bleiben unterhalb des geschützten Exportwurzelverzeichnisses;
    absolute, mehrsegmentige oder ausbrechende Pfade schlagen mit 400 fehl. Das vollständig aufgelöste
    Tabellenziel wird geprüft, sodass vorhandene Symlinks nicht aus der Wurzel führen.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/views/media/test_frame_annotation_export_jobs_api.py
    - tests/services/test_frame_annotation_export_jobs.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '2026-10-28: backend job/API 51 passed,18 subtests; reserved lock namespace 4 passed,7
        subtests; inactive account/center revocation 3 passed; frontend isolated 101 passed across15 suites;
        source/test typing and production Vite build passed.'
    - kind: test
      reference: '2026-10-28: four export suites 136 passed, 29 subtests; center/account revocation, cross-scope
        visibility, path/lock symlink attacks, reserved manifest and alias rejection covered.'
    note: Verified against current source and tests. Deployment must install the verified 1.6.10 wheel,
      apply migrations and restart API/workers; live broker/host acceptance remains a rollout check.
    assessed_by: codex-focused-commits-20261028
    assessed_at: '2026-10-28T18:10:31.184282Z'
