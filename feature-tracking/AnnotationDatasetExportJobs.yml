schema_version: '1.0'
id: annotation_dataset_export_jobs
name: Datensatzweiter Annotationsexport aus dem Frontend
description: Der YAML-basierte Frame-Annotationsexport (scripts/export_frame_annotations.py) wird aus
  lx-annotate als Formular gestartet. Die Konfiguration nutzt denselben lx_dtypes-Vertrag wie YAML und
  Skript, läuft als Celery-Job mit persistiertem Status und bleibt auf freigegebene Zentren und das geschützte
  Exportverzeichnis begrenzt.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/annotation_export_guide.md
  disposition: reference
  note: Beschreibt Konfiguration, Ausgabeort, Skript, API und Frontend-Ablauf.
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Frame-Exportvertrag, Präsentationszeitstempel-Identität und Speichergrenzen.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Umfang und Grenzen des Frontend-Exports sind dokumentiert
  acceptance:
  - Der Leitfaden beschreibt Formularfelder, YAML-Import/-Download, Prüfen, Starten, Statusabfrage und
    Ausgabeort unterhalb von frame_annotation_exports.
  - Nicht unterstützte Optionen (load_base_data aus dem Browser) und die Zentrumsregeln sind benannt.
  required: true
  verification:
    kind: manual
    instructions: Leitfaden gegen Service, API und Frontend-Komponente prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: 'docs/annotation_export_guide.md: browser fields, YAML contract, forbidden browser base-data
        loading, scoped output and strict failure rules reviewed against current backend and frontend.'
    note: Verified against current source and tests. Deployment must install the verified 1.6.10 wheel,
      apply migrations and restart API/workers; live broker/host acceptance remains a rollout check.
    assessed_by: codex-focused-commits-20261028
    assessed_at: '2026-10-28T18:10:20.899907Z'
- id: job_lifecycle
  category: functionality
  title: Export läuft als persistierter Celery-Job mit abfragbarem Status
  acceptance:
  - POST legt einen Job im Status queued an, dispatcht ihn erst nach Commit und antwortet mit 202 und
    Job-ID.
  - Der Worker setzt running, danach completed mit Zeilen-, Frame- und Videozahlen oder failed mit Fehlermeldung;
    Konfiguration und Ergebnis werden am Modell typisiert validiert.
  - Ausgabeverzeichnisse sind genau ein kanonisches Pfadsegment direkt unter dem Exportwurzelverzeichnis;
    verschachtelte oder überlappende Laufverzeichnisse sind dadurch ausgeschlossen. Ein zweiter aktiver
    Job für dasselbe Segment wird mit 409 abgelehnt (Datenbank-Unique-Constraint).
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_frame_annotation_export_jobs.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '2026-10-28: backend job/API 51 passed,18 subtests; reserved lock namespace 4 passed,7
        subtests; inactive account/center revocation 3 passed; frontend isolated 101 passed across15 suites;
        source/test typing and production Vite build passed.'
    - kind: test
      reference: '2026-10-28: real API -> on_commit -> eager Celery task -> exporter -> FFmpeg integration
        passed; job task ID, completed status, six pixel-identical frames, video hash, manifest and counts
        checked. Four export suites: 136 passed, 29 subtests.'
    - kind: command
      reference: '2026-10-28: maturin build --release produced dist/release-1.6.10/endoreg_db-1.6.10-cp312-cp312-linux_x86_64.whl;
        SHA256 011033708636da50ff3fa3f5e5b64d49f25542e477e66a21fce73c7c5843bc9c. Isolated wheel import
        verified all packaged Python sources, four job routes, registered ffmpeg_media task, migration
        leaf 0113 after 0114 with no conflicts/model drift, native adopt_published and mismatch rejection,
        and reserved-manifest rejection.'
    note: Verified source and exact release wheel. Deploy this artifact, apply migrations, restart API
      and ffmpeg_media workers; live broker and host acceptance remain rollout checks. No environment
      installation or host deployment was performed.
    assessed_by: codex-focused-commits-20261028
    assessed_at: '2026-10-28T18:11:58.022163Z'
