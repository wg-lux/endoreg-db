- id: worker_failure_visibility
  category: operations
  title: Abgebrochene Worker hinterlassen keinen stillen Dauerstatus
  acceptance:
  - Der Worker hält während Claim und Export eine prozessgebundene Advisory-Dateisperre je Laufverzeichnis
    (file_operations.advisory_file_lock); der Kernel gibt sie beim Prozessende frei.
  - Doppelte Celery-Zustellung bei gehaltener Sperre ändert den Job nicht; bei freier Sperre und Status
    running gilt der frühere Worker als verloren und der Job wird lost.
  - Ein neuer Job, dessen Laufverzeichnis noch von einem als lost markierten, weiterlaufenden Worker gesperrt
    ist, wird failed statt parallel zu schreiben.
  - Alle Statusübergänge nach dem Claim sind über ein Claim-Token gefenct; ein veralteter Worker kann
    lost oder failed nicht überschreiben.
  - Fehlschlagender Dispatch setzt den Job sofort failed; ohne Heartbeat oder Worker-Start werden Jobs
    lost und geben das Laufverzeichnis in der Datenbank frei.
  required: true
  verification:
    kind: manual
    instructions: Sperr-, Doppelzustellungs-, Stale-Worker- und Dispatch-Fehlertests in tests/services/test_frame_annotation_export_jobs.py
      ausführen und gegen LongRunningServiceStateMachines prüfen.
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '2026-10-28: tests/services/test_frame_annotation_export_jobs.py passed in the 136-test
        export lane: separate-process lock release, duplicate delivery, stale claim fencing, locked lost
        writer, dispatch failure and stale job recovery covered.'
    note: Backend 1.7.0 source and packaged artifact reviewed. Deploy with a compatible LX-Annotate dependency
      pin and restart API/workers. Successful live export and post-restart memory measurement remain rollout
      checks.
    assessed_by: codex-focused-commits-20261028
    assessed_at: '2026-10-28T18:45:24.892122Z'
