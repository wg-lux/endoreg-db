      reference: tests/scripts/test_check_assisted_reporting_route_contracts.py
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/python scripts/check_assisted_reporting_route_contracts.py
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/scripts/test_check_assisted_reporting_route_contracts.py
        -q
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/docs/test_show_urls_contract.py tests/api/test_dtypes_record_persistence.py::test_dtypes_terminology_mutation_rejects_read_only_actor
