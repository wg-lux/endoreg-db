- id: canonical_route_ownership
  category: requirements
  title: Eigentümer und Verträge aller Reporting-Routen sind eindeutig festgelegt
  acceptance:
  - /dtypes-api/terminology/bundles, /dtypes-api/examinations/{examination_id}/findings/ und /dtypes-api/patient-findings/
    sind als von lx_dtypes implementierte und von endoreg_db gehostete kanonische Verträge dokumentiert.
  - Für den Aufruf /endoreg-api/findings/ ist entschieden und dokumentiert, ob ein autorisierter endoreg_db-Listenvertrag
    implementiert oder der tote Frontend-Aufruf entfernt und durch einen kanonischen, kontextbezogenen
    lx_dtypes-Aufruf ersetzt wird.
  - Pfadformat, HTTP-Methode, Query-Parameter, snake_case-Wireformat und camelCase-Konvertierung an der
    zentralen Frontend-Grenze sind je Vertrag festgelegt.
