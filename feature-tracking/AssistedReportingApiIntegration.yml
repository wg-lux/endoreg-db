- id: host_adapter_configuration
  category: functionality
  title: Der lx_dtypes-Hostadapter ist in jedem unterstützten Laufzeitprofil verfügbar
  acceptance:
  - LX_DTYPES_HOST_MODELS_MODULE wird vor dem Start der Django-Anwendung auf endoreg_db.integrations.lx_dtypes_host_models
    gesetzt oder gleichwertig und importierbar in den Django-Settings bereitgestellt.
  - Entwicklung, Tests, Wheel-Paket und NixOS-systemd-Dienst verwenden denselben Hostadaptervertrag; die
    Produktionskonfiguration darf nicht vom devenv-only Environment abhängen.
  - Eine fehlende oder nicht importierbare Adapterkonfiguration verhindert den Dienststart mit einer handlungsorientierten
    Fehlermeldung statt erst Requests mit HTTP 500 scheitern zu lassen.
  - GET /dtypes-api/examinations/{examination_id}/findings/ und GET /dtypes-api/patient-findings/?patient_examination={id}
    liefern in einem gepackten Produktionsprofil den definierten Erfolg, 4xx-Fehler oder eine leere Liste,
    aber keinen Konfigurationsfehler als HTTP 500.
