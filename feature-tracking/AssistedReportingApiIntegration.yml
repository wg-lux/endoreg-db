- path: docs/assisted_reporting_api_integration.md
  disposition: reference
  note: Canonical integration and operations contract.
definition_of_done:
- id: canonical_route_ownership
  category: requirements
  title: Owners and contracts for all reporting routes are clearly defined
  acceptance:
  - /dtypes-api/terminology/bundles, /dtypes-api/examinations/{examination_id}/findings/, and /dtypes-api/patient-findings/
    are documented as canonical contracts implemented by lx_dtypes and hosted by endoreg_db.
  - For the /endoreg-api/findings/ call, it is decided and documented whether an authorized endoreg_db list
    contract will be implemented or the dead frontend call will be removed and replaced with a canonical,
    context-specific lx_dtypes call.
  - Path format, HTTP method, query parameters, snake_case wire format, and camelCase conversion at the
    centralized frontend boundary are defined for each contract.
  required: true
  verification:
    kind: manual
    instructions: Review ReportingShell, useFindingSelectors, findingsApi, terminologyApi, endoreg_db.root_urls,
      and the lx_dtypes routes together against the documented contract.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: quality/assisted_reporting_route_contracts.yml
    - kind: code
      reference: scripts/check_assisted_reporting_route_contracts.py
