id: assisted_reporting_api_integration
name: Assisted Reporting API Integration
description: Production-ready integration of the reporting interface with the canonical endoreg_db and
  lx_dtypes endpoints for terminology bundles, finding catalogs, and patient-related findings.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
- lx_dtypes maintainers
production_critical: true
tracking:
  state: active
  history: []
