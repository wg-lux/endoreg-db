- id: host_adapter_configuration
  category: functionality
  title: The lx_dtypes host adapter is available in every supported runtime profile
  acceptance:
  - Before the Django application starts, LX_DTYPES_HOST_MODELS_MODULE is set to
    endoreg_db.integrations.lx_dtypes_host_models or provided equivalently and importably in the Django settings.
  - Development, tests, the wheel package, and the NixOS systemd service use the same host-adapter contract;
    production configuration must not depend on the devenv-only environment.
  - Missing or non-importable adapter configuration prevents service startup with an actionable error message
    instead of allowing requests to fail later with HTTP 500.
  - In a packaged production profile, GET /dtypes-api/examinations/{examination_id}/findings/ and
    GET /dtypes-api/patient-findings/?patient_examination={id} return the defined success response, a 4xx error,
    or an empty list, but not a configuration error as HTTP 500.
  required: true
  verification:
    kind: command
    commands:
