schema_version: '1.0'
id: assisted_reporting_api_integration
name: Assisted-Reporting-API-Integration
description: Produktionsreife Integration der Reporting-Oberfläche mit den kanonischen endoreg_db- und
  lx_dtypes-Endpunkten für Terminologiepakete, Befundkataloge und patientenbezogene Befunde.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
- lx_dtypes maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/assisted_reporting_api_integration.md
  disposition: reference
  note: Kanonischer Integrations- und Betriebsvertrag.
definition_of_done:
- id: canonical_route_ownership
  category: requirements
  title: Eigentümer und Verträge aller Reporting-Routen sind eindeutig festgelegt
  acceptance:
  - /dtypes-api/terminology/bundles, /dtypes-api/examinations/{examination_id}/findings/ und /dtypes-api/patient-findings/
    sind als von lx_dtypes implementierte und von endoreg_db gehostete kanonische Verträge dokumentiert.
  - Für den Aufruf /endoreg-api/findings/ ist entschieden und dokumentiert, ob ein autorisierter endoreg_db-Listenvertrag
    implementiert oder der tote Frontend-Aufruf entfernt und durch einen kanonischen, kontextbezogenen
    lx_dtypes-Aufruf ersetzt wird.
  - Pfadformat, HTTP-Methode, Query-Parameter, snake_case-Wireformat und camelCase-Konvertierung an der
    zentralen Frontend-Grenze sind je Vertrag festgelegt.
  required: true
  verification:
    kind: manual
    instructions: ReportingShell, useFindingSelectors, findingsApi, terminologyApi, endoreg_db.root_urls
      und die lx_dtypes-Routen gemeinsam gegen den dokumentierten Vertrag prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: docs/assisted_reporting_api_integration.md; frontend/src/api/findingsApi.ts
    note: Kanonische Routen und der harte Cutover auf dtypes sind implementiert und dokumentiert.
    assessed_by: Codex
    assessed_at: '2026-07-22T08:27:03.568509Z'
- id: host_adapter_configuration
  category: functionality
  title: Der lx_dtypes-Hostadapter ist in jedem unterstützten Laufzeitprofil verfügbar
  acceptance:
  - LX_DTYPES_HOST_MODELS_MODULE wird vor dem Start der Django-Anwendung auf endoreg_db.integrations.lx_dtypes_host_models
    gesetzt oder gleichwertig und importierbar in den Django-Settings bereitgestellt.
  - Entwicklung, Tests, Wheel-Paket und NixOS-systemd-Dienst verwenden denselben Hostadaptervertrag; die
    Produktionskonfiguration darf nicht vom devenv-only Environment abhängen.
  - Eine fehlende oder nicht importierbare Adapterkonfiguration verhindert den Dienststart mit einer handlungsorientierten
    Fehlermeldung statt erst Requests mit HTTP 500 scheitern zu lassen.
  - GET /dtypes-api/examinations/{examination_id}/findings/ und GET /dtypes-api/patient-findings/?patient_examination={id}
    liefern in einem gepackten Produktionsprofil den definierten Erfolg, 4xx-Fehler oder eine leere Liste,
    aber keinen Konfigurationsfehler als HTTP 500.
  required: true
  verification:
    kind: command
    commands:
    - command:
      - devenv
      - shell
      - --
      - .devenv/state/venv/bin/pytest
      - tests/app/test_lx_dtypes_import_boundary.py
      - tests/api/test_dtypes_record_persistence.py
      - -q
      working_directory: /home/admin/endoreg-db
    - command:
      - devenv
      - shell
      - --
      - .devenv/state/venv/bin/pytest
      - tests/system/test_environment_checks.py
      - tests/system/test_wheel_deployment_acceptance.py
      - tests/system/test_console_scripts_contract.py
      - tests/api/test_base_api_mount.py
      - tests/api/test_urls_state.py
      - -q
      working_directory: /home/admin/dev/lx-annotate
    - command:
      - nix
      - build
      - .#checks.x86_64-linux.package
      - --no-link
      working_directory: /home/admin/dev/lx-annotate
    - command:
      - nix
      - run
      - .#nixtest
      - --
      - --no-color
      working_directory: /home/admin/dev/lx-annotate
    timeout_seconds: 3600
  # AGENT-MANAGER-NOTIZ (2026-07-31): `verified` widerspricht hier der eigenen
  # Notiz und dem Akzeptanzvertrag. Wheel-, NixOS/systemd- und paketiertes
  # Produktionsprofil sind noch nicht abgenommen; zudem belegt die vorhandene
  # Evidenz nicht den oben definierten endoreg_db-Verifikationslauf. Erst nach
  # exakten, reproduzierbaren Paket- und Routen-Smoke-Tests verifizieren.
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: '.devenv/state/venv/bin/pytest tests/integrations/test_lx_dtypes_host_models.py tests/views/test_dtypes_findings_api.py
        -q (exit 1 before collection: missing libstdc++.so.6; declared paths also do not exist)'
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/app/test_lx_dtypes_import_boundary.py
        tests/api/test_dtypes_record_persistence.py -q (25 passed)
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/system/test_environment_checks.py
        tests/system/test_wheel_deployment_acceptance.py tests/system/test_console_scripts_contract.py
        tests/api/test_base_api_mount.py tests/api/test_urls_state.py -q (49 passed)
    - kind: command
      reference: devenv shell -- npm run build (working directory /home/admin/dev/lx-annotate/frontend;
        exit 0)
    - kind: command
      reference: 'nix build .#checks.x86_64-linux.package --no-link (exit 1: frontend production build
        TypeScript/module errors)'
    - kind: command
      reference: 'nix run .#nixtest -- --no-color (exit 2: package-contract 0/1, service-vm 0/1; packaged
        server and route smoke not reached)'
    note: 'Akzeptanzpunkt 1: Im Quell- und Testprofil ist LX_DTYPES_HOST_MODELS_MODULE importierbar; das
      Paketprofil erreichte den Start nicht. Akzeptanzpunkt 2: Die devenv-Tests und der Frontend-Produktionsbuild
      im Arbeitsbaum bestanden, aber Wheel/NixOS verwenden den Vertrag noch nicht nachweisbar, weil der
