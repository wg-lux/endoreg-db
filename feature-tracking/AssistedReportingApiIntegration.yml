- id: reporting_access_controls
  category: security
  title: Finding and terminology routes enforce the intended access context
  acceptance:
  - Patient-related findings require authentication and are scoped by center or PatientExamination;
    records belonging to other scopes are not disclosed.
  - Finding-catalog and bundle read access have an explicit role decision; bundle import and activation
    require a documented explicit write role.
  - Error responses contain neither local registry paths nor patient or configuration secrets.
  required: true
  verification:
    kind: manual
    instructions: Review positive and negative authentication, role, and center-scope tests for all canonical
      reporting routes.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/api/test_dtypes_record_persistence.py::test_terminology_write_access_requires_explicit_write_role
    note: Host role checking and terminology write gates are implemented; the complete host route test
      is externally blocked.
    assessed_by: Codex
    assessed_at: '2026-07-22T08:27:11.715462Z'
- id: deployment_readiness
  category: operations
  title: Deployment detects incomplete reporting dependencies before serving traffic
  acceptance:
  - Startup or readiness checks validate the host adapter, terminology registry, active bundle identity,
    and resolution of every API route required by the built frontend.
  - The NixOS service and all workers receive the required non-secret lx_dtypes settings from a single
    declarative source.
  - Deployment evidence records lx-annotate, endoreg_db, and lx_dtypes versions together so that frontend/wheel
    drift can be diagnosed.
  - Monitoring distinguishes missing routes, a missing registry, a missing host adapter, authorization errors,
    and semantically empty results.
  required: true
  verification:
    kind: manual
    instructions: Deploy a production profile first with intentionally missing configuration and then with complete
      configuration; document fail-closed behavior and successful readiness.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
