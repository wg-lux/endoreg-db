- id: terminology_registry_runtime
  category: functionality
  title: Terminology bundles from lx-terminology-editor are discoverable in the production profile
  acceptance:
  - The registry references versioned export bundles from lx-terminology-editor that are readable by the service
    and contains either an explicit active selection or a documented state with no active selection.
  - GET /dtypes-api/terminology/bundles returns the typed bundle list; a missing registry is detected during
    deployment instead of appearing only during use as a misleading route-level HTTP 404.
  - Import and selection of a bundle remain restricted to the designated write roles and modify the registry atomically.
  - The lx-dtypes release verifies the wheel and source distribution byte-for-byte against the complete knowledge-base
    data tree and runs the semantic smoke test for the published German demo templates; endoreg-db and lx-annotate
    are upgraded together to this version only after publication.
  required: true
  verification:
    kind: command
    command:
