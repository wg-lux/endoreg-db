  verification:
    kind: command
    commands:
    - command:
      - devenv
      - shell
      - --
      - .devenv/state/venv/bin/pytest
      - tests/app/test_lx_dtypes_import_boundary.py
      - tests/api/test_dtypes_record_persistence.py
      - -q
      working_directory: /home/admin/endoreg-db
    - command:
