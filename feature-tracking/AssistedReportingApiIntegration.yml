      3: Die fail-closed Readiness-Checks bestanden im Quellprofil; ein paketierter Dienststart wurde
      nicht erreicht. Akzeptanzpunkt 4: Nicht erfüllt; die beiden /dtypes-api-Routen konnten in keinem
      gepackten Produktionsprofil per Smoke-Test geprüft werden. Der Status bleibt in_progress.'
