      - tests/system/test_wheel_deployment_acceptance.py
      - tests/system/test_console_scripts_contract.py
      - tests/api/test_base_api_mount.py
      - tests/api/test_urls_state.py
      - -q
      working_directory: /home/admin/dev/lx-annotate
    - command:
      - nix
