- id: terminology_registry_runtime
  category: functionality
  title: Terminologiepakete aus lx-terminology-editor sind im Produktionsprofil auffindbar
  acceptance:
  - LX_DTYPES_KB_REGISTRY verweist in jedem unterstützten Deployment auf eine lesbare, schema-gültige
    Registry innerhalb des vorgesehenen persistenten Datenbereichs.
  - Die Registry referenziert versionierte, für den Dienst lesbare Exportpakete aus lx-terminology-editor
    und enthält eine explizite aktive Auswahl oder einen dokumentierten Zustand ohne aktive Auswahl.
  - GET /dtypes-api/terminology/bundles liefert die typisierte Bundle-Liste; eine fehlende Registry wird
    bereits beim Deployment erkannt und nicht als irreführender Route-404 erst bei Nutzung sichtbar.
  - Import und Auswahl eines Bundles bleiben auf die vorgesehenen schreibenden Rollen beschränkt und verändern
    die Registry atomar.
  - Der lx-dtypes-Release prüft Wheel und Source-Distribution bytegenau gegen den vollständigen Knowledge-Base-Datenbaum
    und führt den semantischen Smoke-Test für die veröffentlichten deutschen Demo-Vorlagen aus; endoreg-db
    und lx-annotate werden erst nach der Veröffentlichung gemeinsam auf diese Version angehoben.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/views/test_dtypes_terminology_api.py
    - -q
    timeout_seconds: 600
  assessment:
