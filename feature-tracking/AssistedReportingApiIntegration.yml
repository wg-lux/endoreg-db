      reference: /home/admin/dev/lx-annotate/tests/system/test_wheel_deployment_acceptance.py
    note: The Nix environment, registry provisioning, and startup checks are implemented; a real deployment exercise
      remains outstanding.
    assessed_by: Codex
    assessed_at: '2026-07-22T08:27:13.113642Z'
