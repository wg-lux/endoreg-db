    assessed_at: '2026-07-22T08:27:09.966888Z'
- id: reporting_access_controls
  category: security
  title: Befund- und Terminologierouten erzwingen den vorgesehenen Zugriffskontext
  acceptance:
  - Patientenbezogene Befunde sind authentifiziert und nach Center beziehungsweise PatientExamination
    gescoped; fremde Datensätze werden nicht offengelegt.
  - Befundkatalog- und Bundle-Lesezugriffe haben eine explizite Rollenentscheidung; Bundle-Import und
    -Aktivierung verlangen eine dokumentierte explizite Schreibrolle.
  - Fehlerantworten enthalten weder lokale Registry-Pfade noch Patienten- oder Konfigurationsgeheimnisse.
  required: true
  verification:
    kind: manual
    instructions: Positive und negative Authentifizierungs-, Rollen- und Center-Scope-Tests für alle kanonischen
      Reporting-Routen prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/api/test_dtypes_record_persistence.py::test_terminology_write_access_requires_explicit_write_role
    note: Host-Rollenprüfung und schreibende Terminologie-Gates sind implementiert; vollständiger Host-Routentest
      ist extern blockiert.
    assessed_by: Codex
    assessed_at: '2026-07-22T08:27:11.715462Z'
- id: deployment_readiness
  category: operations
  title: Deployment erkennt unvollständige Reporting-Abhängigkeiten vor Traffic
  acceptance:
  - Startup- oder Readiness-Prüfungen validieren Hostadapter, Terminologie-Registry, aktive Bundle-Identität
    und die Auflösung aller vom gebauten Frontend benötigten API-Routen.
  - Der NixOS-Dienst und alle Worker erhalten die erforderlichen nicht geheimen lx_dtypes-Einstellungen
    aus einer einzigen deklarativen Quelle.
  - Deployment-Evidenz zeichnet lx-annotate-, endoreg_db- und lx_dtypes-Versionen gemeinsam auf, damit
    Frontend-/Wheel-Drift diagnostizierbar ist.
  - Monitoring unterscheidet fehlende Routen, fehlende Registry, fehlenden Hostadapter, Autorisierungsfehler
    und fachlich leere Ergebnisse.
  required: true
  verification:
    kind: manual
    instructions: Ein Produktionsprofil mit absichtlich fehlender Konfiguration und anschließend mit vollständiger
      Konfiguration deployen; Fail-closed-Verhalten und erfolgreiche Readiness dokumentieren.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/dev/lx-annotate/tests/system/test_wheel_deployment_acceptance.py
    note: Nix-Umgebung, Registry-Provisionierung und Startup-Checks sind implementiert; eine reale Deployment-Übung
      fehlt.
    assessed_by: Codex
    assessed_at: '2026-07-22T08:27:13.113642Z'
