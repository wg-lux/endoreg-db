- id: frontend_backend_contract_tests
  category: testing
  title: Reporting calls are regression-tested across repositories
  acceptance:
  - Frontend tests demonstrate the canonical paths for the bundle list, examination findings, and patient-related
    findings; obsolete VITE_FINDINGS_BACKEND values cannot reactivate removed routes.
  - Backend tests resolve the canonical paths under /dtypes-api/, demonstrate that removed /endoreg-api/ finding
    paths are unsupported, and test success, empty results, unknown identifiers, invalid query parameters, and
    structured error responses.
  - A packaged deployment smoke test uses the built frontend and Python artifact combination and fails when a
    route, host adapter, or terminology registry is missing.
  required: true
