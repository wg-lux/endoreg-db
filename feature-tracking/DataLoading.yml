schema_version: '1.0'
id: data_loading
name: YAML-Datenladen
description: Deterministisches, typisiertes und idempotentes Laden der fachlichen Basisdaten aus YAML.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/wiki/dataloader_layers_and_naming.md
  disposition: migrated
  note: Der bisherige Migrationsplan ist jetzt Teil der verbindlichen DoD.
- path: docs/wiki/dataloader_yaml_authoring.md
  disposition: reference
  note: Autorenvertrag für YAML-Basisdaten.
- path: docs/supported_formats_csv.md
  disposition: reference
  note: Vertrag der unterstützten CSV-Importformate.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Engine, Orchestrierung und Namenskonvention sind getrennt definiert
  acceptance:
  - YAML-zu-ORM-Engine und Command-Orchestrierung haben eindeutige Verantwortlichkeiten.
  - Kanonische Importpfade und Legacy-Kompatibilität sind festgelegt.
  required: true
  verification:
    kind: manual
    instructions: Modulgrenzen gegen Dokumentation und alle Importaufrufe prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/wiki/dataloader_layers_and_naming.md
    - kind: document
      reference: docs/wiki/dataloader_yaml_authoring.md
    - kind: code
      reference: endoreg_db/utils/yaml_model_loader.py; endoreg_db/helpers/data_load_orchestrator.py;
        endoreg_db/management/commands/load_base_db_data.py
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/dataloader/test_yaml_model_loader.py tests/dataloader/test_load_base_db_data_command.py
        -q (3 passed, exit 0)
    - kind: review
      reference: Repository call-site audit confirmed management commands use the public utils loader
        boundary and workflow entry points use the canonical orchestration helper; legacy modules remain
        compatibility implementations.
    note: 'The corrected guides match the implemented boundaries: yaml_model_loader is the canonical typed
      YAML-to-ORM wrapper over the legacy dataloader engine, while data_load_orchestrator owns command
      sequencing over the legacy data_loader implementation. Canonical imports, compatibility paths, migration
      rules, and load_base_db_data ordering are explicit and verified.'
    assessed_by: codex-feature-advance-20260902
    assessed_at: '2026-09-02T11:33:57.543459Z'
- id: deterministic_loading
  category: functionality
  title: Basisdaten werden in stabiler Reihenfolge idempotent geladen
  acceptance:
  - Wiederholtes load_base_db_data erzeugt denselben fachlichen Zustand ohne Duplikate.
  - Abhängigkeiten werden explizit aufgelöst und ungültige YAML-Daten laut abgelehnt.
  required: true
  verification:
    kind: manual
    instructions: Leere Datenbank zweimal laden und Zustände sowie natürliche Schlüssel vergleichen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: schema_validation
  category: data_integrity
  title: YAML wird vor ORM-Mutation in eine typisierte interne Form überführt
  acceptance:
  - Erforderliche Felder, Enums, Referenzen und Duplikate werden vor Persistenz validiert.
  - Teilfehler hinterlassen keinen still akzeptierten Mischzustand.
  required: true
  verification:
    kind: manual
    instructions: Gültige und absichtlich ungültige YAML-Beispiele am Loader-Rand prüfen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: automated_tests
  category: testing
  title: Loader, Abhängigkeiten und Idempotenz sind automatisiert getestet
  acceptance:
  - Repräsentative gültige Varianten und alle wichtigen Boundary-Fehler haben Tests.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/dataloader
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/pyright tests/dataloader/test_dataloader_missing_tables.py tests/dataloader/test_dataloader_foreign_keys.py
        (0 errors, 0 warnings, 0 informations)
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/dataloader -q (36 passed, exit 0)
    - kind: test
      reference: tests/dataloader/test_dataloader_missing_tables.py; tests/dataloader/test_dataloader_foreign_keys.py;
        tests/dataloader/test_load_base_db_data_command.py; tests/dataloader/test_yaml_model_loader.py
    note: The dataloader suite covers representative base-data commands, canonical wrapper delegation,
      ordered orchestration, idempotent named updates, relationship resolution, source selection, missing
      schema and directory handling, lock retries, fail-loud validation and non-lock database failures,
      and safe rejection of Python-tagged YAML before loader delegation.
    assessed_by: codex-feature-advance-20260902
    assessed_at: '2026-09-02T11:48:18.686270Z'
- id: safe_inputs
  category: security
  title: YAML-Laden führt keinen Code aus und überschreitet keine Datenquelle
  acceptance:
  - Ausschließlich sichere YAML-Parser und freigegebene Datenroots werden verwendet.
  - Eingaben können weder beliebige Imports noch Dateizugriffe auslösen.
  required: true
  verification:
    kind: manual
    instructions: Parser, Pfadauflösung und dynamische Importgrenzen sicherheitstechnisch reviewen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: endoreg_db/utils/dataloader.py::_approved_yaml_directory,_approved_yaml_file,load_model_data_from_yaml
    - kind: test
      reference: tests/dataloader/test_dataloader_safe_inputs.py; tests/dataloader/test_dataloader_missing_tables.py::test_load_model_data_from_yaml_rejects_unsafe_yaml_before_loading
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pyright endoreg_db/utils/dataloader.py
        endoreg_db/utils/dataloader.pyi tests/dataloader/test_dataloader_missing_tables.py tests/dataloader/test_dataloader_safe_inputs.py
        (0 errors, 0 warnings, 0 informations)
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/dataloader -q (38 passed,
        1 warning in 38.52s)
    - kind: review
      reference: Alle load_model_data_from_yaml-Aufrufer verwenden paketierte Verzeichnisse aus endoreg_db.data;
        die erzwungene Root-Prüfung gilt unabhängig vom Aufrufer. Kein importlib, __import__, eval, exec
        oder unsicherer yaml.load-Aufruf an der Loader-Grenze.
    note: Der gemeinsame YAML-Loader erzwingt nun vor jedem Dateizugriff den paketierten endoreg_db/data-Root,
      lehnt Verzeichnis- und Datei-Symlinks fail-closed ab und liest ausschließlich reguläre .yaml-Dateien.
      PyYAML safe_load bleibt die einzige Parsergrenze; Python-Objekttags werden vor jeder ORM-Delegation
      abgelehnt. Ein Repository-Abgleich der Loader- und load_*_data-Grenzen fand keine dynamischen Imports,
      eval-/exec-Aufrufe oder unsicheren PyYAML-Loader.
    assessed_by: codex-root-20260902
    assessed_at: '2026-09-02T12:38:06.598243Z'
- id: operational_readiness
  category: operations
  title: Ladefehler und Wiederholung sind für Betreiber beherrschbar
  acceptance:
