      reference: docs/wiki/dataloader_layers_and_naming.md
    - kind: document
      reference: docs/wiki/dataloader_yaml_authoring.md
    - kind: command
      reference: './feature-tracking/tracker.py validate (OK: 34 feature definitions are valid)'
    note: The two authoritative data-loader guides cover layers and responsibilities, canonical and legacy
      names, the YAML schema and field conventions, references, examples, and validation and error guidance.
      Comparison with the loader contract and YAML validation confirms that this criterion is complete.
    assessed_by: codex-20260902-feature
