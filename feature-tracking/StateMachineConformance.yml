- id: native_vocabulary_single_source
  category: requirements
  title: Rust is the single source of every native state vocabulary
  acceptance:
  - Every native state machine declares each state, event and action token exactly once in Rust and exports
    the complete vocabulary through native_state_vocabularies.
  - Hub local status, receiver status and failure categories are Rust-owned vocabularies; persistence
    and API share one failure mirror. Native acknowledgement/failure reduction preserves completed jobs,
    rejects unknown tokens and runs under the caller's database lock without Python fallback.
  - Every outbound hub local_status/failure_class change is one Rust hub_transfer_event applied through
    endoreg_db.services.hub.outbound_transfer_state under a row lock; an exhaustive Rust test proves applied
    results keep failure exactly on failed status and are idempotent under duplicate delivery, superseded
    acknowledgements other than applied are no-ops, receiver lost is a non-retryable integrity failure,
    and a stale worker cannot resume a transfer another writer failed or completed.
  - Every VideoHlsArtifact.status change goes through endoreg_db.services.streaming.hls_artifact_state,
    whose Rust table (hls_artifact_transition_v1) is exhaustively tested; ready is reachable only from
    validated and superseded/failed artifacts are never revived.
  - Every status/state/failure_class write in endoreg_db is listed in quality/state_mutation_owners.yml
    with a reviewed writer kind; scripts/check_state_mutation_owners.py (pre-commit and tests/scripts)
    fails on unlisted or stale writers and on a second writer of a field owned by a native single writer.
  - Every remaining lifecycle field (report LLM jobs, video processing history, quarantine items, frame
    annotation exports, AI dataset export artifacts, DICOM export jobs, patient examination reports, inbound
    hub transfer and case resolution, upload source cleanup, outbound local cleanup) is written only by
    the named functions in endoreg_db.services.runtime.status_writers, which read the persisted status
    under the row lock and apply the Rust decide_status_transition table (status_transition_v1); the owner
    map has no locked or unreviewed writers, and Rust tests prove final statuses never move and every
    non-legacy status is reachable.
  - Each Python mirror enum is registered once; application startup refuses to run when any mirror differs
    from the Rust vocabulary in either direction, and a parametrized test covers every registered vocabulary.
  - utils/rust_backend.py keeps no duplicate token sets and no Python re-implementation of a native decision;
    a missing native function raises instead of falling back.
  - Unknown frame task-mode and sampling-strategy tokens raise ValueError in Rust instead of defaulting.
  - Rust unit tests, including vocabulary uniqueness and serde token parity, pass through the devenv rust:report-runtime
    task.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/rust_backend/test_state_enum_parity.py
    - -q
    timeout_seconds: 600
  assessment:
