    role/study/center authorization; authoring a definition never grants access to patient records.
  - Parse YAML safely with duplicate-key rejection and bounded input size, nesting, aliases, archive expansion,
    and dependency resolution; reject executable tags and archive path traversal.
  - Apply the same safe YAML parser and authorization checks to dataset and saved-cohort imports, including
    dry-run; reject inaccessible existing dataset references before writes and report definition locations
    without logging patient values.
  - Use existing governed registry and filesystem services; YAML cannot choose host paths, arbitrary network
    dependencies, model imports, SQL, credentials, or permission rules.
