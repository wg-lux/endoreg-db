schema_version: '1.0'
id: dtypes_study_definitions
name: Dtypes-driven reference data, YAML datasets, and live study cohorts
description: 'Replace duplicated clinical base-data fixtures with validated, versioned lx_dtypes knowledge
  bases and let researchers create lx-annotate datasets, saved study cohorts, study endpoints, and data
  collection in YAML. Cohorts are saved definitions with live membership re-evaluated against current
  authorized records, not fixed membership snapshots. Current relational workflows require reference rows,
  not the load_base_db_data command itself: the compatibility command delegates to a versioned reference
  catalogue. Clinical graph projection and optional operational catalogues use typed shared contracts
  and immutable host import receipts. This feature makes the resolved knowledge base authoritative for
  clinical definitions while endoreg_db owns persistence, access control, and operational provisioning.
  Implementation proceeds through the numbered phases below; this file outlines proposed work, not completed
  support.'
owners:
- endoreg_db maintainers
- lx_dtypes maintainers
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/wiki/dataloader_yaml_authoring.md
  disposition: reference
  note: Host versioned catalogue authoring, compatibility commands, dry-run reconciliation and recovery.
- path: ../lx-data-models/docs/guides/knowledge-base-authoring.md
  disposition: reference
  note: Canonical versioned YAML, registry, dependency resolution, and packaging contract.
- path: ../lx-data-models/docs/guides/knowledge-base-graph-api.md
  disposition: reference
  note: Existing immutable graph and examination-context projections.
- path: docs/ai_dataset_attachment_contract.md
  disposition: reference
  note: Dataset annotation attachment is a separate authorized operation; creating a definition must not
    implicitly attach all annotations.
definition_of_done:
- id: independent_local_center_defaults
  category: interoperability
  title: Local center provisioning remains independent of study and clinical fixture loading
  acceptance:
  - Local intake resolves its configured stable center identity without importing a study or legacy clinical
    fixtures.
  - Explicit study center selection is preserved; named centers supplied by reference catalogues never
    replace runtime defaults implicitly.
  - Authenticated hub source identity is preserved and never replaced by the receiving node's default
    center.
  required: true
  verification:
    kind: manual
    instructions: Run the CenterAccess.yml local_center_defaults checks against empty clinical reference
      tables and after catalogue provisioning; compare local explicit-center and authenticated hub source
      ownership.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: yaml_dataset_and_cohort_contract
  category: functionality
  title: First delivery - Define YAML creation of datasets and saved live cohorts
  acceptance:
  - Publish a versioned strict lx_dtypes contract for YAML dataset and cohort definitions, with snake_case
    keys and stable definition identifiers distinct from editable display names and deployment-specific
    database IDs.
  - Reuse AIDataSetCreateContract for name, description, dataset_type, ai_model_type, and is_active; preserve
    its supported modality/model combinations and reject unsupported text datasets and unknown fields
    before mutation.
  - Reuse and consolidate the existing lx-annotate CohortDefinition and CohortFilters semantics for name,
    hypothesis, date_from, date_to, center_key, examination_name, document_type, finding, annotation_label,
    has_report, has_video, and limit; do not maintain divergent YAML and HTTP validators.
  - YAML declares saved cohort definitions with live membership; patient, examination, finding, report,
    and annotation records are not seeded or copied by definition import, and fixed membership snapshots
    are outside this delivery.
  - Cohorts reference datasets by stable definition identifiers; validate duplicate identifiers and dangling
    references across the entire document, support several datasets per cohort and several cohorts per
    dataset, and never resolve an ambiguous dataset display name by taking the first row.
  - Owner identity and permissions come from the authenticated caller or explicit authorized CLI actor,
    never from an author-controlled YAML owner or permission field.
  - Provide a schema-validated .yml authoring example covering image and video dataset definitions, shared
    dataset references, a required cohort hypothesis, false boolean filters, and quoted date strings without
    embedding patient data, credentials, or host paths.
  required: true
  verification:
    kind: manual
    instructions: Validate the authoring .yml against the published schema and canonical existing contracts;
      reject duplicate and unknown keys, invalid date ranges, string booleans, incompatible dataset model
      types, missing hypotheses, duplicate identities, and dangling dataset references before any database
      write.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: ../lx-data-models/lx_dtypes/models/contracts/study_setup.py
    - kind: code
      reference: ../lx-data-models/lx_dtypes/utils/study_setup_yaml.py
    - kind: test
      reference: ../lx-data-models/tests/unit/lx_dtypes/models/contracts/test_study_setup.py
    - kind: document
      reference: ../lx-data-models/lx_dtypes/data/study_setup/research.yml
    - kind: code
      reference: ../dev/lx-annotate/lx_annotate/schemas/study_cohorts.py
    note: 'Erster Vertragsschritt implementiert: versionierter StudySetupDefinition-Vertrag, gemeinsame
      CohortDefinition/CohortFilters für YAML und lx-annotate, begrenzter SafeLoader-Parser und kommentierte
      research.yml. Stabile Identitäten, gemeinsame Dataset-Referenzen, unbekannte Felder, Datumsbereiche,
      boolesche Werte und Modalitätskombinationen werden geprüft. JSON Schema über StudySetupDefinition.model_json_schema().
      Noch kein autorisierter Importer, keine Persistenz/Provenienz oder Produktivfreigabe. lx-annotate
      benötigt bei Auslieferung die dazugehörige neue lx-dtypes-Paketversion. Verifikation: lx-data-models:
      uv run --no-sync pyright: 0 Fehler/0 Warnungen; PYTHONPATH=/home/admin/lx-data-models .venv/bin/pytest
      tests/unit/lx_dtypes/models/contracts/test_study_setup.py tests/unit/lx_dtypes/models/contracts/test_study_cohort.py
      -q: 40 bestanden. Ruff format/check der vier neuen Python-Dateien bestanden. .venv/bin/sphinx-build
      -b html docs docs/_build/html und -b linkcheck docs docs/_build/linkcheck erfolgreich, jeweils bestehende
      terminology.md-toctree-Warnung. endoreg-db: .devenv/state/venv/bin/pyright: 0 Fehler/6 Warnungen.
      lx-annotate-Schema: Pyright mit explizitem lx-data-models extraPaths und endoreg-db-Venv: 0 Fehler/0
      Warnungen; Standardkonfiguration kann neuen lokalen Vertrag nicht auflösen. API-Testversuch mit
