        tests/services/test_audit_integrity.py tests/services/test_hub_audit.py tests/management/commands/test_refresh_audit_ledger_integrity.py
        -q (32 passed)
    note: Die verkettete Speicherung sperrt den Singleton-Ledger-Kopf, berechnet den Hash über den gemeinsamen
      typisierten lx_dtypes-Vertrag und aktualisiert Kopf und Eintrag atomar. Die reine Kettenprüfung
      erkennt Payload- und Kopfmanipulation; wiederholte Prüfungen ändern keine Ledgerzeilen.
    assessed_by: codex-root-20260902-feature
    assessed_at: '2026-09-02T11:39:42.512643Z'
