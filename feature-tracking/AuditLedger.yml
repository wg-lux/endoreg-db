- id: operational_readiness
  category: operations
  title: Periodische Prüfung, Alarmierung und Reparaturprozess sind eingerichtet
  acceptance:
  - Verifikation läuft getrennt, verhindert parallele Läufe und alarmiert bei Fehlern.
  - Betreiber haben ein Verfahren zur Beweissicherung ohne unsafe Auto-Recovery.
  required: true
  verification:
    kind: manual
    instructions: Manipulation simulieren, Alarm und Beweissicherungs-Runbook prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/audit_ledger_operations.md
    - kind: code
      reference: endoreg_db/config/settings/base.py audit-ledger-integrity-refresh; endoreg_db/services/audit_integrity.py;
        endoreg_db/management/commands/check_system_health.py
    - kind: test
      reference: tests/services/test_audit_integrity.py; tests/management/commands/test_refresh_audit_ledger_integrity.py;
        tests/management/commands/test_check_system_health.py
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/views/media/test_video_ready_export.py
        tests/views/misc/test_stats_endpoints.py tests/models/state/test_audit_ledger.py tests/services/test_audit_integrity.py
        tests/services/test_hub_audit.py tests/management/commands/test_refresh_audit_ledger_integrity.py
        tests/management/commands/test_check_system_health.py -q (59 passed, 4 subtests passed)
    note: Celery Beat plant die vollständige Prüfung standardmäßig alle 300 Sekunden auf der separaten
      Maintenance-Queue; ein 30-Minuten-Cache-Lock verhindert parallele Scans. Failed/error erzeugen strukturierte
      Fehlerereignisse, und der Local-Study-Server-Health-Check scheitert bei nicht verifiziertem Status.
      Das Runbook definiert Beweissicherung, begrenzte Wiederholungsprüfung und Wiederherstellung ohne
      Rehashing, Kürzung oder unsichere Auto-Recovery.
    assessed_by: codex-root-20260902-feature
    assessed_at: '2026-09-02T11:57:46.291858Z'
