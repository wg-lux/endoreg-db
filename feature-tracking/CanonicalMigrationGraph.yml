- id: cross_repository_guidance
  category: documentation
  title: Cross-repository ownership is explicit
  acceptance:
  - Endoreg-db owns the canonical graph and consuming applications own their historical database checks.
  required: true
  verification:
    kind: manual
    instructions: Review the feature descriptions in the dependency and consuming application repositories.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: /home/admin/dev/lx-annotate/feature-tracking/CanonicalMigrationCutover.yml assigns the
        consuming application its historical/canonical cutover checks
    - kind: document
      reference: /home/admin/dev/lx-annotate/docs/guides/deployment-strategy.md states that installed
        endoreg_db owns the shipped canonical migrations while lx-annotate owns runtime history repair
        and deployment gating
    note: Dependency and consuming-application ownership are explicitly separated in both trackers and
      the deployment guide.
    assessed_by: codex-release-readiness
    assessed_at: '2026-08-13T12:07:27.016200Z'
