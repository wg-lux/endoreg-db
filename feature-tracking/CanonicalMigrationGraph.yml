schema_version: '1.0'
id: canonical_migration_graph
name: Canonical Migration Graph
description: Keep the dependency-owned endoreg_db migration graph fresh-installable, immutable, and suitable
  for application release gates.
owners:
- endoreg-db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents: []
definition_of_done:
- id: canonical_contract
  category: requirements
  title: Canonical migration history remains immutable
  acceptance:
  - Existing canonical migration names and operations are not rewritten during application cutovers.
  required: true
  verification:
    kind: manual
    instructions: Review the migration diff and release package manifest.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: 'git migration review: no existing numbered migration is modified; only additive 0072_patient_examination_report_provenance.py
        is new and max_migration.txt advances from 0071 to 0072'
    - kind: command
      reference: 'final full pytest: canonical graph and provenance backfill cohorts passed within 2718
        passed, 4 skipped'
    note: The release adds one dependency-owned leaf migration without rewriting prior canonical names
      or operations.
    assessed_by: codex-release-readiness
    assessed_at: '2026-08-13T12:07:23.253820Z'
- id: canonical_graph
  category: functionality
  title: The canonical migration graph reaches its declared leaf
  acceptance:
  - Django loads the endoreg_db migration graph without conflicts.
  - The declared max migration is the only endoreg_db leaf.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - ./.devenv/state/venv/bin/pytest
    - tests/migrations/test_canonical_graph.py
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- ./.devenv/state/venv/bin/pytest tests/migrations/test_canonical_graph.py
      note: Exit-Code 0
    - kind: command
      reference: devenv shell -- ./.devenv/state/venv/bin/pytest tests/migrations/test_canonical_graph.py
        -vv => 1 passed in 40.36s
    - kind: code
      reference: endoreg_db/migrations/0072_patient_examination_report_provenance.py
    - kind: command
      reference: 'tests/migrations/test_canonical_graph.py and provenance backfill: 8 passed'
    note: Der konfliktfreie kanonische Graph besitzt genau das neue Leaf 0072_patient_examination_report_provenance;
      max_migration.txt stimmt überein.
    assessed_by: codex-contract-coverage-20260813
    assessed_at: '2026-08-13T10:52:30.675872Z'
- id: fresh_install
  category: testing
  title: A fresh database can apply the canonical migration graph
  acceptance:
  - The canonical graph applies from zero without application-owned migration modules.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - ./.devenv/state/venv/bin/pytest
    - tests/migrations/test_canonical_graph.py
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- ./.devenv/state/venv/bin/pytest tests/migrations/test_canonical_graph.py
      note: Exit-Code 0
    - kind: command
      reference: devenv shell -- ./.devenv/state/venv/bin/pytest tests/migrations/test_canonical_graph.py
        -vv => 1 passed in 40.36s
    - kind: command
      reference: 'tests/migrations/test_canonical_graph.py: fresh graph passed; combined migration lane
        8 passed'
    note: Eine isolierte SQLite-Neuinstallation hat den vollständigen Endoreg-Migrationsgraph bis 0072
      ohne Konflikte oder unapplied migrations ausgeführt.
    assessed_by: codex-contract-coverage-20260813
    assessed_at: '2026-08-13T10:52:33.582223Z'
- id: safe_boundary
  category: security
  title: Migration verification does not weaken storage or cryptographic boundaries
  acceptance:
  - Tests mutate only isolated test databases and do not access application payloads or keys.
  required: true
  verification:
    kind: manual
    instructions: Review the migration test database boundary.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: tests/migrations/test_canonical_graph.py creates a tmp_path SQLite database, configures
        a fresh isolated Django process, and migrates only that database
    - kind: review
      reference: migration test uses a generated SECRET_KEY and neither loads application payloads nor
        reads cryptographic material or production storage
    note: Migration verification remains isolated from deployment data, storage and cryptographic boundaries.
    assessed_by: codex-release-readiness
    assessed_at: '2026-08-13T12:07:25.146191Z'
- id: release_gate
  category: operations
  title: Canonical migration leaf and package version are release gates
  acceptance:
