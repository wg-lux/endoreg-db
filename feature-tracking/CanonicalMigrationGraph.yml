    - kind: command
      reference: 'final repository gates: pyright 0 errors; Ruff check passed; Ruff format --check 1263
        files; pytest 2718 passed, 4 skipped, 0 failed in 706.17s'
    - kind: command
      reference: manylinux wheel sha256 16a45197e830d0882e163acfedaa091e8a95117079dec2920915ca784241e03c;
        sdist sha256 fbb3cda38daf0f51ae7727daac706ee4698082a21dd350804d79e18b504d619a
    note: Release candidate 1.0.15.0 uses published lx-dtypes 0.2.17, exposes canonical migration leaf
