definition_of_done:
- id: storage_profile_contract
  category: requirements
  title: Rollen und Größenbudgets aller Videoartefakte sind verbindlich definiert
  acceptance:
  - Roh-Ingest, kanonisches anonymisiertes Mastervideo, HLS-Derivat, extrahierter Frame und temporäres
    Transcode-Artefakt besitzen je eine eindeutige Rolle, Aufbewahrungsfrist und Löschbedingung.
  - Ein versioniertes, typisiertes Profil definiert numerische Obergrenzen für Auflösung, Bildrate, Bitrate
    beziehungsweise Bytes pro Sekunde und zulässigen Storage-Overhead; Profile werden nicht als freie
    Strings durch den Workflow gereicht.
  - Genau ein anonymisiertes kanonisches Video bleibt dauerhaft erhalten; HLS ist ein reproduzierbares,
    größenbegrenztes Derivat mit expliziter Cache- und Eviction-Regel.
  - Ein erfolgreicher Import, Reimport oder eine Reanonymisierung kehrt erst zurück, wenn Raw- und Processed-HLS
    über den typisierten, idempotenten Materializer atomar bereitstehen. Dieser bewusste Storage-Trade-off
    hält die Wiedergabelatenz in zeitkritischen Umgebungen begrenzt; fehlgeschlagene HLS-Erzeugung lässt
    den Import laut und wiederholbar fehlschlagen. Der autorisierte Playlist-Zugriff behält den begrenzten
    Demand-Fallback für Legacy-, evizierte oder reconciliierte Derivate.
  - Jeder FFmpeg-Befehl, der ein Video, HLS-Derivat oder extrahiertes Frame erzeugt, deaktiviert Audio
    explizit mit `-an`.
  - Abweichungen vom Profil werden laut abgelehnt oder in einen expliziten Quarantänestatus versetzt;
    stilles Stream-Copy oder unbeschränktes Source-Quality-Encoding ist kein Produktionsfallback.
  - Die HLS-Encoderwahl erfolgt ausschließlich über ein versioniertes typisiertes Profil. Das bestehende
    CPU-Profil verwendet libx264 mit Constant Rate Factor; das NVIDIA-NVENC-Profil verwendet explizite
    variable Bitratenregelung mit Constant-Quality-Wert (`-cq`) und niemals libx264-CRF-Argumente.
  - Das NVIDIA-NVENC-Profil startet nur, wenn der dedizierte FFmpeg-Worker genau ein deklarativ sichtbares
    Grafikprozessor-Gerät besitzt und ein realer Encoder-Preflight erfolgreich ist. Fehlende, mehrere
    oder unzugängliche Geräte sowie ein fehlender `h264_nvenc`-Encoder schlagen laut fehl; ein automatischer
    CPU-Fallback ist unzulässig.
  - Der Name des verwendeten HLS-Encoderprofils wird mit dem HLS-Artefakt persistiert. Ein deklarativer
    Profilwechsel invalidiert nur das reproduzierbare HLS-Derivat und erzwingt eine neue atomare Generation,
    ohne das kanonische Mastervideo zu verändern.
  required: true
  verification:
    kind: manual
    instructions: Profil, Artefaktmatrix und Ausnahmeprozess mit Betrieb, klinischem Reviewer und Storage-Verantwortlichen
      abnehmen.
    timeout_seconds: 600
  assessment:
