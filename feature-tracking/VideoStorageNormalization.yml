- id: derived_artifact_lifecycle
  category: functionality
  title: Redundante Roh- und HLS-Artefakte werden erst nach vollständiger Freigabe entfernt
  acceptance:
  - Outside-segment blackening holds exclusive media writer ownership, validates the replacement profile
    and timeline, and records the previous encrypted master before publication. Success requires matching
    ready processed HTTP Live Streaming (HLS); committed cleanup receipts retire superseded masters and
    HLS. Failed or deferred cleanup blocks further generation allocation.
  - Receipt-based retirement recognizes historical attempt, post_validation and filtered filenames only
    for the owning video's exact raw hash, with digest and reference checks unchanged. Scoped plaintext
    is removed after success and failure; raw input is preserved by blackening.
  - An uncommitted receipt may be retired without deleting media only when its source is the authenticated
    current master and its recorded replacement is absent and unreferenced. Ambiguous receipts remain
    blockers; preview does not mutate the journal. Failed rebuilds preserve preexisting frame artifacts
    and extraction state when the rebuild owns no frame-cache writes.
  - Speicherplatz-Transkodierung erhält Video-Primärschlüssel, UUID und raw_video_hash sowie die Importauflösung
    über get_video_by_content_hash und video_hash_exists auch nach wiederholtem Ersatz. processed_video_hash
    entspricht dem entschlüsselten Inhalt der neuen Generation; reale Encoder- und HLS-Integration bestätigt
    kleinere Ausgabe, unveränderte Frame-Identitäten und passende Wiedergabe.
  - Nach erfolgreichem Commit einer Processed-Ersatzgeneration werden das vorherige generierte Mastervideo
    und sein superseded Processed-HLS anhand persistierter Hash- und Besitznachweise bereinigt. Aktive
    Leases, fremde Referenzen oder fehlende Ersatzartefakte verhindern die Löschung. Teilfehler behalten
    einen wiederholbaren Cleanup-Auftrag; der gezielte Management-Befehl ist standardmäßig ein Dry-Run.
  - Before anonymization validation, retain encrypted raw and processed masters and their current HLS.
    Validation and backfill retire raw video and raw HLS through the existing integrity and approval gates.
    The encrypted processed master remains until verified Hub transfer and the user's local retention
    choice permits removal; its local HLS is removed together with the processed master.
  - Legacy materialisierte Vollvideos und veraltete HLS-Generationen werden anhand persistierter Besitz-
    und Referenzdaten erkannt und idempotent bereinigt; aktive oder unbekannte Referenzen verhindern die
    Löschung.
  - Nach einem Teilfehler bleibt ein wiederanlauffähiger, eindeutig beobachtbarer Zustand zurück; ein
    Cleanup-Erfolg wird erst nach Prüfung des tatsächlichen Dateisystemzustands persistiert.
  - HLS is the playback copy. Storage-pressure operations create only a replacement processed master;
    repeated attempts reconcile recorded old generations before encoding another candidate. Cleanup failures
    preserve the current master and block further artifact accumulation. Legacy full-video playback copies
    require exact ownership and digest evidence for retirement.
  - The undeployed optimized-playback schema and supporting code are removed directly. Fresh installations
    end at migration 0080 without optimized-playback columns; no forward retirement migration or optimized-copy
    compatibility layer is introduced.
  - Cleanup rejects known database references before reading replacement media, and rechecks references
    after validation so references added meanwhile still prevent deletion.
  - Eine versionierte native Rust-Zustandsmaschine entscheidet deterministisch über Reservierung, Veröffentlichung
    und Reconciliation. Datenbankzeilen, Media-Operation-Leases, Dateibesitz und atomare Veröffentlichung
    bleiben autoritativ im Python-Service.
  - Der automatische Backfill stellt vorhandene `queued`, `materializing` oder `validated`-Versuche unabhängig
    von ihrem Alter nicht erneut in den Broker. Nur ein tatsächlich zugestellter Worker darf einen veralteten
    Versuch unter Datenbanksperre als fehlgeschlagen abgrenzen und eine neue Generation übernehmen; duplizierte
    Broker-Nachrichten erzeugen keine parallelen Generationen.
  - Validierte HLS-Ausgaben bleiben bei aktiver Playback- oder Segment-Update-Lease unveröffentlicht und
    werden über einen begrenzten Task-Retry erneut zur Veröffentlichung angeboten. Ein späterer Besitzer
    darf weder ihren Zustand ändern noch ihre temporären Dateien bereinigen.
  - Reconciliation markiert ausschließlich abgelaufene, durch Datenbank-ID und Generationsschlüssel eindeutig
    besessene HLS-Versuche als fehlgeschlagen und entfernt nur deren versuchsspezifische temporäre Pfade
    über die typisierten Dateisystem-Wrapper. Unbekannte Verzeichnisse, aktive Leases und nicht abgelaufene
    Versuche blockieren automatische Löschung und werden strukturiert gemeldet.
  - Deterministische Profil- und Timeline-Validierungsfehler erhalten einen terminalen, nicht wiederholbaren
    Fehlercode je Source-Generation. Eine dupliziert zugestellte Task materialisiert dieselbe fehlerhafte
    Generation nicht erneut; eine unabhängige nachfolgende HLS-Task kann auf dem Worker fortfahren.
