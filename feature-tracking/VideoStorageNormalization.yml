- id: video_examination_annotation_contract
  category: interoperability
  title: Normalisierte Videos bleiben in der Segmentannotation sicher nutzbar
  acceptance:
  - Das von lx-annotate/VideoExaminationAnnotation.vue verwendete Processed-HLS bleibt nach Neuimport,
    Reimport und Bestandsnormalisierung unter den bestehenden Playlist-, Key- und Segment-Endpunkten abspielbar;
    Video-Detail, HLS-Dauer, FPS und Frameanzahl beschreiben dieselbe veröffentlichte Generation.
  - Der GET-/POST-Vertrag segments/normalize-fps normalisiert Videos oberhalb von 50 FPS vor der ersten
    Segmentanlage mit einem eigenen typisierten Resampling-Profil. Er aktualisiert FPS, Frameanzahl, Timeline-Version
    und Provenienz konsistent; eine Storage-Normalisierung mit FPS-Passthrough darf diesen Pfad nicht
    als erfolgreich behandeln oder blockieren. Statusabfragen und der gewöhnliche FPS-Endpunkt validieren
    ausschließlich die persistierte positive, endliche Bildrate und dürfen weder das verschlüsselte Video
    entschlüsseln noch eine vollständige temporäre Klartextkopie anlegen; die dateibasierte Prüfung bleibt
    auf Import-, Normalisierungs- und explizite Integritäts-Workflows begrenzt.
  - Sobald Segmentzeilen existieren, lehnt der FPS-Pfad jede Änderung der Framekoordinaten laut ab. Seeking
    sowie Segmentanfang und -ende referenzieren nach Storage-Normalisierung deterministisch denselben
    klinischen Bildinhalt.
  - Die Nachverarbeitung nach Segmentvalidierung extrahiert nach erfolgreichem Outside-Frame-Rebuild
    den vollständigen stabilen Frame-Satz zwingend aus der neu veröffentlichten Processed-Generation.
    Sie markiert die Validierung erst nach Prüfung von positivem Frame-Count, lückenlosen nullbasierten
    Framezeilen, kanonischen Dateinamen, gesetztem Extraktionsstatus und vorhandenen Dateien als abgeschlossen;
    ein fehlender oder unvollständiger Frame-Cache schlägt laut und wiederholbar fehl.
  - Der Einzelbild-Decode verwendet den autoritativen Präsentationszeitstempel und einen nur an Loopback
    gebundenen, nicht erratbaren Byte-Range-Zugriff auf das ausgewählte verschlüsselte Artefakt. Er erzeugt
    keine vollständige temporäre Klartextkopie, entschlüsselt nur die von FFmpeg angeforderten Chunks
    und schlägt bei nicht seekbarem Storage laut fehl.
  - lx-annotate bewahrt binäre Einzelbildantworten unverändert als Blob, lädt pro ausgewählter Aufgabe
    ohne expliziten Wiederholungsversuch höchstens einmal und zeigt HTTP-Status beziehungsweise Backendfehler
    statt einer generischen Bildfehlermeldung an. Selten benötigte Queue-Parameter bleiben in einer eingeklappten
    erweiterten Konfiguration verfügbar, während der Standardpfad nur die fachlich nötige Auswahl zeigt.
  - lx-annotate lädt Video-Metadaten und Segmentdaten pro Auswahl über genau einen logisch verantwortlichen
    Ladepfad. Status-Polling ist unabhängig von der Anzahl gleichzeitig ausstehender Videos auf einen
    Request-Zyklus begrenzt, lädt unveränderte Labels nicht erneut und wird beim Verlassen der Ansicht
    vollständig abgebrochen. Eine vom Normalisierungsstatus bereits validierte Bildrate wird für denselben
    Ladevorgang wiederverwendet; der separate FPS-Endpunkt wird dann nicht zusätzlich aufgerufen.
  - Der Dataset-Export bindet Integer-Präsentationszeitstempel, rationale Stream-Timebase und Timeline-Version
    an denselben persistierten pts_v1-Vertrag. Fehlende Zeitachsenidentität führt zu einem lauten Fehler;
    nominale Bilder pro Sekunde dürfen keine Exportkoordinaten erzeugen.
  - Playlist-, Key- und Segmentzugriffe erzeugen beziehungsweise erneuern eine Media-Operation-Lease.
    Normalisierung, HLS-Neuerzeugung und Cleanup warten bei aktivem Playback oder Segment-Update und veröffentlichen
    eine neue Generation atomar, ohne laufende Annotationen auf gemischte Derivate zu lenken.
  - Ein versionierter nativer Rust-Zustandsreduzierer entscheidet die zulässigen HLS-Reservierungs-, Claim-,
    Publikations- und Reconciliation-Aktionen. Datenbank-Constraints erlauben je Video und Artefaktart
    höchstens eine veröffentlichte `ready`-Generation und höchstens einen aktiven `queued`-, `materializing`-
    oder `validated`-Kandidaten. Eine vorherige `ready`-Generation bleibt während der Kandidatenerzeugung
    streambar; die Publikation serialisiert auf derselben Videozeile wie die Lease-Erzeugung.
  - Vor der HLS-Materialisierung wird die ausgewählte Raw- oder Processed-Quelle innerhalb des geschützten
    Transcoding-Verzeichnisses idempotent gegen `clinical_h264_bounded_v1` geprüft und nur bei Abweichung
    normalisiert. Die HLS-Kodierung verwendet danach denselben Codec-, Pixelformat-, Farbbereichs-, Bitraten-
    und FPS-Passthrough-Vertrag; eine bereits vollständige Generation wird ohne erneute Materialisierung
    zurückgegeben.
  - Das verschlüsselte HLS-Ergebnis wird vor atomarer Veröffentlichung über eine versuchsspezifische lokale
    Prüfplaylist entschlüsselt geprobt. Codec, Pixelformat, Dimensionen, Bildrate, Dauer, Frameanzahl,
    Bitrate, Gesamtgröße und Timeline müssen dem typisierten Profil entsprechen; Abweichungen verhindern
    die Veröffentlichung und entfernen Prüfplaylist, Teilsegmente und Schlüsselmaterial.
  - Nominelle rationale Bildrate, gemessene durchschnittliche Bildrate und Präsentationszeitstempel-Timeline
    sind getrennte typisierte Werte. Eine HLS-Ausgabe mit nominell 50/1 und gemessen 50/1 darf gegenüber
    einer gemessen 49,8549-FPS-Quelle ausschließlich dann akzeptiert werden, wenn die aktuelle `annotation_fps_resample_v1`-Provenienz,
    der Content-Hash der Processed-Generation, Frameanzahl, Dauer, Time-Base, streng monotone konstante
    PTS-Abstände sowie alle persistierten Segment- und extrahierten Framegrenzen dieselbe 50-FPS-Timeline
    beweisen.
  - Fehlende oder fremde FPS-Provenienz, ein abweichender Generation-Hash, Frameverlust, Frameduplikation,
    echte PTS- beziehungsweise Grenzendrift und variable Bildrate ohne autoritative PTS verhindern die
    HLS-Veröffentlichung weiterhin; die allgemeine FPS-Toleranz wird dafür nicht erweitert.
  - Vor HLS-Veröffentlichung müssen die vollständigen relativen Präsentationszeitstempel der normalisierten
    Quelle und der entschlüsselten HLS-Ausgabe innerhalb der gemeinsamen Time-Base-Auflösung übereinstimmen.
    Jede `EXTINF`-Segmentgrenze muss monoton, positiv und innerhalb höchstens einer Frame-Dauer auf einen
    autoritativen Ausgabe-Präsentationszeitstempel abbildbar sein; Segmentanzahl und Playlist-Gesamtdauer
    müssen mit Dateien und validierter Timeline übereinstimmen.
  - Gleichzeitige verschlüsselte Byte-Range-Lesezugriffe verwenden bevorzugt die native Rust-Implementierung,
    die Datei-I/O und AES-GCM-Entschlüsselung ohne gehaltenen Python Global Interpreter Lock ausführt.
    Rückgaben bleiben pro Request größenbegrenzt und byteidentisch zum Python-Referenzpfad; native Integritäts-,
    Schlüssel- oder Geometriefehler schlagen laut fehl. Nur eine beim Prozessstart nicht verfügbare native
    Erweiterung darf den explizit getesteten Python-Fallback verwenden.
  - Ein Cross-Repository-Test deckt mindestens ein Video oberhalb von 50 FPS, die Zustände required/queued/running/ready/failed,
    authentifiziertes Processed-HLS-Playback und Segment-Zeit-/Frame-Roundtrips ab.
