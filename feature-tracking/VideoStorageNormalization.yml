    decoding and exact decoded counts; unused single-frame array APIs are removed.
  - iter_video_file_frame_samples and read_video_file_frame_jpeg use the selected canonical generation
    content hash and its persisted timestamp sequence, preserving raw and processed origins.
  - read_video_path_frame_jpeg requires an explicit authoritative timestamp and seeks in the absolute
    container timeline; rate-derived timestamp fallbacks are removed.
  - Regression tests compare timestamps and pixels for irregular variable-rate media and nonzero origins,
    and reject missing coordinates, invalid timestamps and replaced generations.
  - Accepted verified or explicitly unresolved hub provenance supplies complete processed generation-bound
    decoder coordinates without treating unresolved lineage as verified; conflicting sequences fail closed.
  - Partial streaming inference retains the independently observed exclusive end boundary after the last
    scored frame without deriving it from nominal frame rates or requiring an extracted-frame cache.
  - Unused FPS conversions in lx-annotate timeHelpers.ts and timeUtils.ts are removed; annotation navigation
    and export continue to use backend timestamps.
  - Prediction smoothing and minimum durations use persisted presentation-time windows without shifting
    frame identities; duration, metadata initialization and profiling do not reconstruct clinical coordinates
