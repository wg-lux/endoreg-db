- id: derived_artifact_lifecycle
  category: functionality
  title: Redundante Roh- und HLS-Artefakte werden erst nach vollständiger Freigabe entfernt
  acceptance:
  - Roh-HLS und kanonisches Rohvideo werden nach erfolgreicher menschlicher Validierung nur entfernt,
    wenn normalisiertes Mastervideo, benötigtes Processed-HLS, Segmentdaten und Temporal-/Qualitätsnachweise
    vollständig und integritätsgeprüft vorliegen.
  - Legacy materialisierte Vollvideos und veraltete HLS-Generationen werden anhand persistierter Besitz-
    und Referenzdaten erkannt und idempotent bereinigt; aktive oder unbekannte Referenzen verhindern die
    Löschung.
  - Nach einem Teilfehler bleibt ein wiederanlauffähiger, eindeutig beobachtbarer Zustand zurück; ein
    Cleanup-Erfolg wird erst nach Prüfung des tatsächlichen Dateisystemzustands persistiert.
  - Eine versionierte native Rust-Zustandsmaschine entscheidet deterministisch über Reservierung, Veröffentlichung
    und Reconciliation. Datenbankzeilen, Media-Operation-Leases, Dateibesitz und atomare Veröffentlichung
    bleiben autoritativ im Python-Service.
  - Der automatische Backfill stellt vorhandene `queued`, `materializing` oder `validated`-Versuche unabhängig
    von ihrem Alter nicht erneut in den Broker. Nur ein tatsächlich zugestellter Worker darf einen veralteten
    Versuch unter Datenbanksperre als fehlgeschlagen abgrenzen und eine neue Generation übernehmen; duplizierte
    Broker-Nachrichten erzeugen keine parallelen Generationen.
  - Validierte HLS-Ausgaben bleiben bei aktiver Playback- oder Segment-Update-Lease unveröffentlicht und
    werden über einen begrenzten Task-Retry erneut zur Veröffentlichung angeboten. Ein späterer Besitzer
    darf weder ihren Zustand ändern noch ihre temporären Dateien bereinigen.
  - Reconciliation markiert ausschließlich abgelaufene, durch Datenbank-ID und Generationsschlüssel eindeutig
    besessene HLS-Versuche als fehlgeschlagen und entfernt nur deren versuchsspezifische temporäre Pfade
    über die typisierten Dateisystem-Wrapper. Unbekannte Verzeichnisse, aktive Leases und nicht abgelaufene
    Versuche blockieren automatische Löschung und werden strukturiert gemeldet.
  required: true
  verification:
    kind: command
    command:
