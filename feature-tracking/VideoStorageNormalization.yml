- id: hls_source_generation_and_publication_integrity
  category: data_integrity
  title: WP-ER-02 READY HLS is bound to the current source generation
  acceptance:
  - Wiederholte HLS-Quellhashprüfungen dürfen einen vollständig berechneten Klartext-SHA-256 pro Prozess
    nur für dieselbe verschlüsselte Storage-Instanz und unveränderte Dateigeneration wiederverwenden.
    Geräte-ID, Inode, Dateigröße, Modus sowie Nanosekunden-Änderungszeiten binden die Generation; Ersetzung,
    In-place-Schreiben, fehlende Dateien und Änderungen während der Prüfung verhindern Wiederverwendung.
    Der Cache ist begrenzt, pro Quelle synchronisiert und wird nach Fork verworfen. Andere Storage-Backends
    behalten die vollständige Hashprüfung. Legacy-Datenbankhashes allein begründen keine Wiederverwendung;
    Prozessneustarts führen zur erneuten Verifikation.
  - READY fast paths validate source content identity, artifact kind, encoder profile, and generation
    rather than relying on a source filename and shallow path existence.
  - Publication rechecks the locked current source generation after transcoding and rejects output derived
    from a superseded source.
  - Playlist admission, publication, and reconciliation verify the complete referenced encrypted segment
    set, including count, existence, timeline, and generation identity. Subsequent key and segment requests
    recheck current source, profile, generation, key, and protected playlist/directory; requested segment
    access validates its own protected path and existence without rescanning unrelated sibling segments.
  - A profile change does not inherit deterministic-failure suppression from a different encoder profile.
  - Explicit operator-approved adoption may bind existing legacy READY HLS with a blank historical hash
    to the verified current source without transcoding. Require an exact artifact allowlist, an unchanged-source
    attestation, authenticated source hashing, complete HLS paths and key checks, locked state rechecks,
    a protected typed before/after receipt, and rejection of mismatched nonempty hashes or active encodes.
    Ordinary playback and future-source invalidation remain strict after adoption.
  required: true
  verification:
    kind: manual
    instructions: After WP-ER-01 establishes attempt fencing, run same-name source replacement, concurrent
      reanonymization, profile-change, missing-segment, and corrupt-segment tests through READY lookup
      and authenticated playback.
