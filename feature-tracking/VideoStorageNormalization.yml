- id: storage_observability
  category: operations
  title: Betreiber sehen Verbrauch, Redundanz, Einsparung und Migrationsrisiko
  acceptance:
  - Metriken und strukturierte Logs weisen Bytes nach Artefaktrolle, normalisierte versus ausstehende
    Videos, freigegebenen löschbaren Bestand, erzielte Einsparung, Fehler und verfügbaren Headroom aus.
  - Konfigurierbare Warn- und Stoppschwellen verhindern, dass Transcoding oder HLS-Materialisierung den
    kritischen Storage erschöpfen.
  - Ein wegen unzureichenden Storage-Headrooms vor der Medienanlage abgebrochener Import bewahrt seine
    verschlüsselte verwaltete Quelle, erscheint center-begrenzt in der Anonymisierungsübersicht als wiederholbar
    und kann nach Freigabe von Speicher automatisch oder explizit erneut angestoßen werden; der Kapazitätsfehler
    führt nicht zur Quarantäne.
  - Gewöhnliche Laufzeit-, Transcoding-, Worker- und Dispatchfehler verschieben eine bereits verschlüsselt
    verwaltete Importquelle nicht in die Quarantäne. Sie bewahren die unveränderte Quelle und verwenden
    begrenzte, beobachtbare Wiederholungsversuche; nach Ausschöpfung bleibt die Quelle für eine explizite
    Betreiberentscheidung erhalten.
  - Quarantäne bleibt auf seltene Trust-Boundary- oder Integritätsfälle begrenzt, in denen eine Quelle
    nicht sicher als verwalteter Import weiterverarbeitet werden darf, insbesondere abgelehnte voranonymisierte
    Drops. Profil-, Timeline-, Hash- und Referenzfehler bleiben fail-closed und werden durch diese Einschränkung
    weder akzeptiert noch mit einem schwächeren Verarbeitungspfad umgangen.
  - Nach jedem Batch werden Zähler aus Datenbank und Dateisystem abgeglichen; Abweichungen stoppen weitere
    destruktive Schritte.
