- id: canonical_frame_timestamp_history
  category: functionality
  title: Vollständige Präsentationszeitstempel vor und nach kanonischer Transkodierung
  acceptance:
  - Nur kanonische Raw- und Processed-Videos sind Generationen. HTTP Live Streaming (HLS) ist ausschließlich
    ein optimiertes Streaming-Derivat einer kanonischen Quellgeneration.
  - Jede neue kanonische Veröffentlichung bewahrt die vollständigen dekodierten Präsentationszeitstempel
    vor und nach der Transformation mit rationaler Zeitbasis und Inhalts-Hash. Wiederholte Transkodierung
    und Resampling überschreiben die vorherigen Sequenzen nicht.
  - Raw-Importnormalisierung, Processed-Import, Reimport, Reanonymisierung, Blackening und Speichertranskodierung
    verwenden denselben typisierten Vertrag. Bei Resampling bleiben Quell- und Zielindizes getrennt; fehlende
    historische Werte werden nicht erfunden.
  - Fehlende oder ungültige Zeitstempel verhindern die Veröffentlichung. Bestehende klinische Frame- und
    Segmentkoordinaten sowie Streaming- und Lease-Verträge bleiben erhalten.
  - Jede neue Transkodierung speichert eine inhaltsgebundene Out-of-Band-Tabelle mit vollständigen ffprobe-Quellzeitstempeln,
    rationaler Zeitbasis und tatsächlichem Decoder-Quellindex pro Encoder-Ausgabeframe. Resampling darf
    keine Herkunft durch Zeitnähe schätzen; fehlende oder widersprüchliche Herkunft blockiert Erfolg.
  - Mehrstufige Transformationen bleiben bis zur Aufnahmequelle zusammensetzbar. HLS und kompatible MP4-Derivate
    bewahren Herkunft, ohne eigenständige kanonische Generationen zu werden.
  - Maskierung und Frame-Entfernung verwenden die Implementierung von lx-anonymizer; typisierte, instanzgebundene
    Hooks erfassen Encoder- und Decoder-Herkunft. Endoreg besitzt Belegpersistenz und Ausführungsgrenzen,
    ohne eine zweite Maskierungsimplementierung oder globale Laufzeit-Patches.
  required: true
  verification:
    kind: manual
    instructions: Pyright sowie fokussierte Schema-, Import-, Transcode- und Veröffentlichungsregressionen
      ausführen.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/services/video_storage/canonical_timelines.py; endoreg_db/schemas/video_storage.py;
        endoreg_db/schemas/persisted_json.py; canonical import/transcode/anonymization/blackening publication
        callers
    - kind: test
      reference: '2026-10-05: RUN_VIDEO_TESTS=true SKIP_EXPENSIVE_TESTS=false .devenv/state/venv/bin/pytest:
        nine focused normalization/import/encryption/publication suites, 169 passed, 2 warnings in 502.58s.
        Final hash-binding and persistence verification: 33 passed, 2 warnings in 79.37s; includes real
        downsizing and 60-to-50 FPS resampling, 60 original timestamps retained and 50 output timestamps
        matching persisted frames.'
    - kind: command
      reference: '2026-10-05: full .devenv/state/venv/bin/pyright: 0 errors, 10 warnings; final changed
        tests checked separately: 0 errors. Ruff, format and git diff --check passed.'
    - kind: document
      reference: 'AGENTS.md; docs/video_storage_normalization.md: only canonical raw and processed are
