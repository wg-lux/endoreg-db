schema_version: '1.0'
id: video_storage_normalization
name: Speicher-normalisierte Videos
description: Einheitlicher, speicherbegrenzter Lebenszyklus für Rohvideo, kanonisches anonymisiertes Video
  und HLS-Derivate, ohne die zeitgenaue Extraktion klinisch hochwertiger Frames aus persistierten Segmenten
  zu verschlechtern.
