- id: temporal_frame_contract
  category: data_integrity
  title: Persistierte Segmente referenzieren Frames transcode-stabil und eindeutig
  acceptance:
  - Processed publication automatically maps segment boundaries to the nearest processed presentation
    timestamp (ties select the earlier boundary), keeps decoded frame counts exact and preserves raw timestamp
    history for external sensor alignment. Mapping evidence records before/after coordinates and is committed
    atomically with frame timestamps and processed generation identity. No additional review workflow
    is introduced; incompatible or collapsing mappings fail processing.
  - Outside-frame blackening uses timestamp passthrough instead of imposing a fixed frame-rate cap. HLS
    segment checks normalize boundaries relative to the source container origin, and explicit resampling
    proofs obtain their target cadence from the typed profile.
  - Size-reduction and masking defaults retain native frame timestamps and their container origin. Canonical
    publication compares every decoded frame using rational time bases, rejects dropped, added or shifted
    frames, and preserves existing annotations on rejection. Only explicit pre-annotation FPS resampling
    may bypass this equivalence gate.
  - Native-timestamp encoding uses the demuxer time base and refuses automatic timestamp repair. Directory
    transcoding has no implicit frame-rate cap; processed downsizing reads the persisted typed source
    timeline for variable-frame-rate media.
  - Vor einer Bestandsnormalisierung sind die autoritative rationale FPS, Time-Base, Dauer, Frameanzahl
    und Präsentationszeitstempel beziehungsweise deren belastbare Zuordnung zur Quell-Timeline persistiert
    und versioniert.
  - Segmentgrenzen speichern autoritative Präsentationszeitstempel; falls Frameindizes gespeichert werden,
    ist deren Umrechnung samt Rundungsregel und Timeline-Version explizit. Bei variabler Bildrate sind
    Zeitstempel autoritativ und eine nominelle FPS-Angabe allein ist unzulässig.
  - Zeitbasierte Modellfenster für Glättung, Mindestdauer und Lückenschluss werden gegen die persistierten
    Präsentationszeitstempel ausgewertet; fehlende, nicht endliche, nicht streng steigende oder unvollständige
    Zeitstempelfolgen brechen die temporale Inferenz laut ab und fallen nicht auf eine nominelle Bildrate
    zurück.
  - Jede Normalisierung persistiert Provenienz und eine überprüfbare Abbildung von Quell- zu Ziel-Timeline;
    Drift, ausgelassene oder doppelte Frames außerhalb der freigegebenen Toleranz verhindern die Freigabe.
  - Frame-Extraktion an Segmentanfang, Segmentende und inneren Zeitpunkten wählt vor und nach dem Transcode
    denselben klinischen Bildinhalt deterministisch aus und protokolliert Zielzeitstempel sowie Frameindex.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - bash
