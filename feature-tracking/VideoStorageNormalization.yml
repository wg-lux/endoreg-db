- id: operator_transfer_media_repair
  category: functionality
  title: Users can recover transfer media without bypassing provenance or review
  acceptance:
  - Every authenticated center member can preview and acknowledge unresolved frame provenance for one
    usable video without administrator privileges.
  - Integrity failures and active media work block recovery; missing original evidence remains explicitly
    unknown. Media, annotations and audit history are preserved.
  - An audited typed recovery receipt retains current hashes and processed PTS, available original PTS
    and known recording start/end. Normal transfer gates remain; electrical matching is prohibited for
    unresolved mapping.
  - Segment review success is distinguished from media rebuild failure; worker failures retain actionable
    diagnostics.
  - Recovery conflicts distinguish active media leases, active processing and failed integrity or provenance
    preconditions; the browser pauses its own playback before explicit recovery requests without bypassing
    other leases or automatically retrying.
  required: true
  verification:
    kind: manual
    instructions: Run repair component and backend workflow tests, type checks and structure validation;
      complete a deployed unresolved-provenance transfer before production acceptance.
    timeout_seconds: 900
  assessment:
