- id: browser_video_annotation_downloads
  category: functionality
  title: Direkte Video- und Annotationsexporte auf der Exportseite
  acceptance:
  - Angemeldete berechtigte Nutzer laden ausschließlich validierte anonymisierte Videos herunter; Zentrumsscope,
    Integritätsprüfung und aktive Medien-Leases bleiben verbindlich.
  - Annotationen sind als CSV mit persistierten Frame-Nummern, Präsentationszeitstempeln (PTS), rationaler
    Zeitbasis und Artefaktidentität direkt herunterladbar.
  - Vor dem Import gespeicherte Präsentationszeitstempel sind explizit auswählbar; fehlende historische
    Werte werden nicht aus der Bildrate rekonstruiert.
  - Downloads schreiben keine zusätzlichen unverschlüsselten Mediendateien auf dem Server.
  - Medienantworten werden unter ASGI blockweise statt vollständig im Arbeitsspeicher konsumiert;
    langsame Leser, Abbruch während eines Lesevorgangs, Fehler und WSGI bleiben getestet.
  - Browser- und Datei-Medienexport verwenden dieselbe Integritätsentscheidung; aktuelle Inhaltsidentität,
    vorhandener Freigabehash und gelesene Datei müssen übereinstimmen, auch außerhalb des Studienserver-Modus.
  - Annotationsmanifeste referenzieren den kanonischen Processed-Inhaltshash; veraltete Freigaben werden
    abgewiesen. Anzahl, Tabelle und Medien eines Exportauftrags verwenden dieselbe Annotationsauswahl.
  - Exportentscheidungen verwenden den zentralen Segmentstatus einschließlich laufender oder fehlgeschlagener
    Bereinigung; Browser- und Datei-CSV verwenden dieselbe Kodierung zum Schutz vor Tabellenformeln.
  required: true
  verification:
