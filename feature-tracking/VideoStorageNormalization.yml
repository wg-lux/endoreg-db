- id: secure_atomic_migration
  category: security
  title: Normalisierung und Löschung bleiben innerhalb der geschützten Storage-Grenze
  acceptance:
  - Temporäre und finale Medien liegen ausschließlich im freigegebenen, verschlüsselten Storage; Klartext-Artefakte
    werden weder exportiert noch in öffentliche Mounts oder ungeschützte Temp-Verzeichnisse geschrieben.
  - Dateiänderungen verwenden den kanonischen typisierten Wrapper, atomare Veröffentlichung und strukturierte
    Logs; Quelle und einziger gültiger Master werden nie vor Ziel-, Hash-, Timeline- und Qualitätsprüfung
    gelöscht.
  - Abbruch, Prozessverlust und unzureichender Speicher können kein teilweise veröffentlichtes Video als
    gültig markieren.
  required: true
  verification:
