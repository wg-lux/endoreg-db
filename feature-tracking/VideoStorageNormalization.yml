    führt nicht zur Quarantäne.
  - Gewöhnliche Laufzeit-, Transcoding-, Worker- und Dispatchfehler verschieben eine bereits verschlüsselt
    verwaltete Importquelle nicht in die Quarantäne. Sie bewahren die unveränderte Quelle und verwenden
    begrenzte, beobachtbare Wiederholungsversuche; nach Ausschöpfung bleibt die Quelle für eine explizite
    Betreiberentscheidung erhalten.
  - Quarantäne bleibt auf seltene Trust-Boundary- oder Integritätsfälle begrenzt, in denen eine Quelle
