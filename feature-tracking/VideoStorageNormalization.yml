- id: hls_backfill_admission_and_accounting
  category: operations
  title: WP-ER-04 Backfill admits viable sources and reports truthful outcomes
  acceptance:
  - Der Backfill verarbeitet beziehungsweise disponiert alle ausgewählten Processed-Artefakte vor Raw-Artefakten.
    Videos mit Processed-Datei und bestätigter Anonymisierung oder erstellten beziehungsweise validierten
    Segmentannotationen kommen zuerst, danach übrige Processed-Videos, danach reine Raw-Videos. Innerhalb
    jeder Gruppe gilt die aufsteigende Video-ID; die Priorisierung erfolgt vor dem Videolimit. Dry-Run,
    Inline-Ausführung und Dispatch verwenden dieselbe Reihenfolge, explizite Videoauswahl und Artefaktfilter
    bleiben wirksam. Bereits laufende oder disponierte Jobs werden nicht umgeordnet.
  - Recoverable database failures retain fenced HLS attempts and protected staged output; Celery retries
    with capped backoff until the database/runtime is repaired without reporting READY prematurely.
  - A reservation failure is reported per artifact and does not discard the remainder of a backfill batch;
    the command exits nonzero and repeated execution uses existing readiness and reservation fences.
  - Selection distinguishes a populated FileField from a source that exists and is readable in the approved
    encrypted storage boundary; worker-side validation remains authoritative for races.
  - Missing sources are reported or quarantined with a stable reason and are not retried without bound
    on every boot or operator invocation.
  - Dry-run and summary counts are per distinct eligible video and distinguish ready, active, failed,
    missing-source, dispatch-failed, and newly queued outcomes.
  - Inline execution exits nonzero for every terminal failure status.
