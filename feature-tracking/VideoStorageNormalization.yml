schema_version: '1.0'
id: video_storage_normalization
name: Speicher-normalisierte Videos
description: Einheitlicher, speicherbegrenzter Lebenszyklus für Rohvideo, kanonisches anonymisiertes Video
  und HLS-Derivate, ohne die zeitgenaue Extraktion klinisch hochwertiger Frames aus persistierten Segmenten
  zu verschlechtern.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Artefaktvertrag, Profil, Migrationsgate und Betriebsablauf.
- path: docs/video_import_concurrency_contract.md
  disposition: reference
  note: Repository-übergreifender Vertrag für Import-Leases, Fencing, unveränderliche Staging-Artefakte
    und versuchslokale Anonymisierung.
- path: docs/video_pts_fps_callsite_inventory.md
  disposition: reference
  note: Repository-weites Risikoinventar und rückwärtskompatible FPS-zu-PTS-Migration.
definition_of_done:
- id: bounded_timestamp_probe_decoding
  category: operations
  title: Vollständige Zeitstempelprüfungen nutzen begrenzte Decoderparallelität
  acceptance:
  - Beide vollständigen ffprobe-Zeitstempelpfade verwenden höchstens vier Decoderthreads pro Prozess;
    keine unbegrenzte automatische Threadzahl und keine Reduktion der geprüften Frames.
  - Reale Medien mit konstanter und variabler Bildrate, verschobenem Zeitursprung und bidirektional prädizierten
    Frames liefern dieselben vollständigen Zeitstempel wie ein einzelner Decoderthread.
  - Ungültige Zeitstempel und Decoderfehler bleiben Fehler; Herkunfts-, Hash-, Lease- und Publikationsprüfungen
    bleiben unverändert. Hostmessungen unterscheiden begrenzte Stichproben von vollständigen Importläufen.
  required: true
  verification:
    kind: manual
    instructions: Pyright vor den Probe-, Herkunfts-, HLS- und Importregressionen ausführen; bereinigte
      gc-10-Messungen in feature-tracking/reports/gc10_import_timing_20261015.yml prüfen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: feature-tracking/reports/gc10_import_timing_20261015.yml
    - kind: test
      reference: '2026-10-15: devenv shell -- env RUN_VIDEO_TESTS=true SKIP_EXPENSIVE_TESTS=false .devenv/state/venv/bin/pytest
        tests/services/test_frame_provenance.py tests/services/test_video_storage_normalization.py tests/services/test_canonical_video_timelines.py
        tests/services/test_hls_media.py tests/services/test_hls_workload_timing.py tests/import_files/test_video_import_normalization.py
        -q --tb=short: 231 passed, 1 plugin warning, no skips, 89.35s; existing temporary-directory cleanup
        warnings.'
    - kind: command
      reference: '2026-10-15: Full .devenv/state/venv/bin/pyright: 0 errors, 20 warnings; Ruff, git diff
        --check, 65 structure manifests and 37 feature definitions passed. Direct pytest initially failed
        before collection because libpq was unavailable outside devenv; devenv run passed.'
