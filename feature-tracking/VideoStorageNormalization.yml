- id: periodic_generation_cleanup
  category: operations
  title: Periodische Bereinigung erfasst temporäre Dateien bekannter Generationen
  acceptance:
  - Periodische Aufträge bearbeiten begrenzte Batches vorhandener Generationenbelege, ohne aktuelle Master
    oder unzugeordnete Dateien zu löschen.
  - Veraltete und fehlgeschlagene Streaming-Versuche mit passendem Quellnamen und Hash werden einschließlich
    ihrer temporären Schlüssel-, Quell- und Ausgabeverzeichnisse bereinigt.
  - Aktive Leases, unbekannte Referenzen und ungültige Ersatzgenerationen blockieren weiterhin die Bereinigung.
  - Auf allen Hosts bereinigt der automatische Apply-Modus auch terminale rohe und verarbeitete Streaming-Derivate
    ohne Master-Löschbeleg; ein verifizierter aktueller Quellinhalt und dessen verfügbares Streaming-Derivat
    sind erforderlich. Fehlende historische Quell-Hashes erlauben niemals eine Master-Löschung.
  - Streaming-Datensätze werden erst nach erfolgreicher Dateibereinigung entfernt; blockierte Videos verhindern
    nicht die Bearbeitung späterer Batches.
  required: true
  verification:
    kind: manual
    instructions: Generationen-Cleanup und periodische Tasks auf zulässige Bereinigung und blockierte
      Zustände prüfen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
