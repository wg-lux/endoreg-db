- id: secure_atomic_migration
  category: security
  title: Normalisierung und Löschung bleiben innerhalb der geschützten Storage-Grenze
  acceptance:
  - VideoArtifactFieldFile bündelt Existenzprüfung, geschützten Klartextzugriff und lokale Materialisierung;
    Video-Services verwenden diese Schnittstelle ohne alternative direkte Dateipfade. Hashes stammen ausschließlich
    aus utils.file_operations.get_file_hash.
  - Video and PDF runtime paths resolve through get_runtime_paths() using LX_RUNTIME_ROOT only; package
    seed-data paths remain separate from runtime storage.
  - Video and PDF filenames use the central storage filename policy. Legacy artifact discovery reconciles
    known names without choosing ambiguous candidates or overwriting a valid master.
  - The manual LuxNix migration unit invokes the shared video and PDF reconciliation command; source deletion
    remains behind the existing verified migration gates.
  - Temporäre und finale Medien liegen ausschließlich im freigegebenen, verschlüsselten Storage; Klartext-Artefakte
    werden weder exportiert noch in öffentliche Mounts oder ungeschützte Temp-Verzeichnisse geschrieben.
  - Dateiänderungen verwenden den kanonischen typisierten Wrapper, atomare Veröffentlichung und strukturierte
    Logs; Quelle und einziger gültiger Master werden nie vor Ziel-, Hash-, Timeline- und Qualitätsprüfung
    gelöscht.
  - Abbruch, Prozessverlust und unzureichender Speicher können kein teilweise veröffentlichtes Video als
    gültig markieren.
