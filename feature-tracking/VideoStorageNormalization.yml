        tests/import_files/test_video_import_normalization.py tests/import_files/test_import_encryption.py
        tests/services/test_hls_media.py -q (45 passed)
    note: Der typisierte Vertrag wird jetzt bei Import, Reimport, Reanonymisierung sowie vor und nach
      HLS-Transcoding durchgesetzt. Bereits konforme Artefakte werden ohne erneute Kodierung übernommen;
      verschlüsselte HLS-Ausgaben werden vor Veröffentlichung vollständig geprobt. Offen bleibt die formale
      Abnahme durch Betrieb, klinischen Reviewer und Storage-Verantwortliche.
