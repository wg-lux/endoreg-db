    - kind: test
      reference: '2026-10-14: recovery API suite13 passed including lease/pending/running/integrity no-mutation
        regressions; frontend47 component tests passed. Source/test TypeScript and ESLint pass; full backend
        Pyright0 errors6 warnings.'
    - kind: test
      reference: '2026-10-14 final: recovery18 passed with explicit shared-source PYTHONPATH (no installation);
        identical acknowledgment preserves audit count/date_modified, changed evidence audited, invalid
