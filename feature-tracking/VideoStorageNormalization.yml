      reference: endoreg_db/services/video_storage/generation_cleanup.py
    - kind: test
      reference: tests/services/test_processed_video_cleanup.py
    - kind: test
      reference: tests/services/test_periodic_media_cleanup.py
    - kind: code
      reference: endoreg_db/tasks.py
    - kind: document
      reference: docs/video_storage_normalization.md
    note: 'Automatische Bereinigung terminaler HTTP-Live-Streaming-Derivate beider Quellarten implementiert;
      aktuelle verifizierte Quelle und verfügbares Derivat bleiben Voraussetzung. Fehlende historische
