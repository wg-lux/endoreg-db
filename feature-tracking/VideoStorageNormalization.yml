  title: Bestandsvideos werden kapazitätsbegrenzt, idempotent und rollbackfähig normalisiert
  acceptance:
  - Ein Dry-Run inventarisiert pro Video Rohvideo, Master, HLS, Legacy-Derivate, Referenzen und erwartete
    Einsparung, ohne Dateien zu verändern.
  - Die Migration priorisiert validierte Videos mit größtem Einsparpotenzial, arbeitet in begrenzten Batches
    und startet nur mit ausreichendem Headroom für temporären Output und Rollback.
  - Resume, Retry und erneuter Dry-Run sind idempotent; bei Fehler bleibt die bisher gültige Quelle erhalten
