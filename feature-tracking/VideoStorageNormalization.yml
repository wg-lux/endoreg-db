- id: media_worker_process_isolation
  category: operations
  title: Media workers retain bounded process isolation and executable readiness
  acceptance:
  - Pipeline, media and report-model workers use prefork with per-job recycling and preserve configured
    Celery soft and hard task deadlines, late acknowledgement and lease fencing.
  - The installed anonymizer supervisor works in daemon workers and bounds loading, inference, cancellation
    and parent death; real-process tests prove detached descendants are killed and reaped.
  - Both bare ffmpeg and ffprobe resolve and execute in the actual worker service PATH; discovery elsewhere
    on the machine is not sufficient.
  - Candidate packaged dependencies pass capability checks; deployment verifies encrypted staging, descendant
    containment and a representative import before production acceptance.
  required: true
  verification:
    kind: manual
    instructions: Run strict typing, worker and executable tests, real-process anonymizer lifecycle tests
      and package-install checks; verify service PATH and storage protection on the target.
    timeout_seconds: 900
