- id: concurrent_import_ownership
  category: functionality
  title: Gleichzeitige Videoimporte besitzen eindeutige, eingezäunte Ausführungsrechte
  acceptance:
  - Ein persistierter, typisierter Importversuch besitzt eine eindeutige aktive Lease, durch Datenbankzeit
    bestimmte Ablaufzeit, Heartbeat und monotonen Fencing-Token. Dateisperren sind ausschließlich lokale
    Optimierungen und dürfen nicht allein anhand ihres Alters fremd übernommen werden.
  - Jeder persistente Zustandswechsel und jede atomare Veröffentlichung prüft den aktuellen Fencing-Token.
    Ein abgelaufener oder ersetzter Worker darf weder Zustand ändern noch Kandidaten veröffentlichen oder
    fremde Artefakte bereinigen.
  - Der Watcher übergibt reguläre, nicht symbolisch verknüpfte Quelldateien atomar in ein unveränderliches,
    versuchseigenes Staging innerhalb des verschlüsselten Storage. Hashing, Anonymisierung und Validierung
    arbeiten auf derselben geprüften Quellgeneration.
  - endoreg-db bleibt alleiniger Eigentümer von Lease, Retry, Storage-Routing, Datenbankzustand und Veröffentlichung.
    lx-anonymizer verarbeitet pro Aufruf genau eine Quelle in einen unveröffentlichten, versuchseigenen
    Kandidaten und besitzt keine konkurrierende Sperr- oder Publikationslogik.
  - Pro gleichzeitigem Video wird eine eigene `FrameCleaner`-Laufinstanz beziehungsweise ein typisiertes
    Run-State-Objekt verwendet. Veränderliche Frame-, Metadaten- und Large-Language-Model-(LLM)-Zustände
    werden nicht zwischen Aufrufen geteilt; gemeinsam genutzte Modelle benötigen einen nachgewiesenen
    thread- und prozesssicheren Vertrag.
  - Langlebige Rust- und FFmpeg-Operationen sind abbrechbar beziehungsweise begrenzt, geben den Python
    Global Interpreter Lock frei, beenden Kindprozesse zuverlässig und propagieren Integritätsfehler ohne
    stillen Erfolgsfallback. Das Produktionsprofil prüft eine versionierte native Capability-Menge beim
    Start und schlägt bei Pflichtinkompatibilität geschlossen fehl.
  - Prozessbasierte Konkurrenz- und Failure-Injection-Tests decken gleiche Pfade, gleiche Inhalte, unabhängige
    Inhalte, Source-Mutation, Lease-Verlust, veraltete Fencing-Token, Worker-Abbruch, Disk-full, Retry
    und Datenbank-/Dateisystem-Reconciliation ab.
  - Strukturierte Logs und Metriken weisen Lease-Wartezeit, Heartbeats, Backendwahl, gehashte und temporäre
    Bytes, Phasendauer, Abbruch, Fencing-Ablehnung, Duplicate-Short-Circuit und Cleanup-Eigentum je Versuch
    nach, ohne Patientendaten oder unzulässige Rohpfade offenzulegen.
  - Der optionale Snakemake-Batchpfad orchestriert Import, Processed-Video-Transcoding und HLS-Materialisierung
    ausschließlich über typisierte Konfigurationen und atomare Receipt-Dateien. Globale CPU-, Speicher-,
    Rust-Worker- und GPU-Budgets begrenzen die Parallelität über den gesamten gerichteten azyklischen
    Graphen; Datenbank-Leases, Fencing, Publikation und Cleanup bleiben in den autoritativen Python-Services.
  - Native Batch-Dateiidentitäten verwenden einen versuchslokalen, explizit begrenzten Rayon-Threadpool,
    geben den Python Global Interpreter Lock frei und bewahren Eingabereihenfolge sowie fail-closed
    Mutationsprüfung. Die Zahl der Rayon-Worker überschreitet nie die dem Snakemake-Job zugewiesenen Threads.
  - Der überwachte Offline-Batch-Runner erzwingt eine prozessgebundene lokale Einzelinstanz-Sperre innerhalb
    des freigegebenen Workflow-Pfads, prüft die Pflichtbudgets gegen jeden konfigurierten Job und beendet
    sowie reapet die vollständige Snakemake-Prozessgruppe bei Signal oder Laufzeitüberschreitung mit begrenzter
    Eskalation. Terminale strukturierte Ereignisse und Stage-Receipts teilen dieselbe Batch-ID; getrennte
    Supervisor- und Workflow-Konfigurationsdigests, Start, Ende, Status, Exit-Code, Dauer und alarmierbare
    Fehlerzähler werden ohne Quellpfade oder Patientendaten protokolliert.
  required: true
  verification:
    kind: manual
    instructions: Prozessbasierte Cross-Repository-Tests und Failure Injection aus docs/video_import_concurrency_contract.md
      ausführen; Lease-/Fencing-Evidenz, Rust-Capability-Gate, FFmpeg-Kindprozess-Cleanup und produktionsnahe
      Lastmetriken gemeinsam durch Betrieb, Security und Storage-Verantwortliche prüfen.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/services/hub/upload_job_import_lease.py
    - kind: code
