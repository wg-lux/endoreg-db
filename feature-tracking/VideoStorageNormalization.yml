- id: segment_original_timeline_transfer
  category: data_integrity
  title: Transferred and exported segments carry exact generation and original-recording presentation
    timestamps
  acceptance:
  - Every hub-transferred and exported segment carries the exact integer presentation timestamp ticks
    of its first and last included frame on the current processed generation, with the rational time base
    and processed content hash.
  - With a verified frame provenance bundle, each segment also carries the original-recording frame index
    and presentation timestamp tick for both boundaries. These are composed natively from source_frame_indices
    and never inferred from nearest timestamps.
  - An operator-acknowledged unresolved provenance receipt yields an explicit unresolved recording mapping
    without original values. Missing, ambiguous or mismatched ancestry fails the transfer or export.
  - The wire contract lives in lx-dtypes. The lx-annotate sender, endoreg-db hub receiver and PVideoSegment
    export deploy together. The receiver rejects coordinates that disagree with its received processed
    timeline or provenance bundle.
  - Tests cover multi-step chains with frame drops and repetitions, disconnected or out-of-range chains,
    unresolved receipts and segment bounds beyond the processed timeline.
  required: true
  verification:
    kind: manual
    instructions: Run cargo test for frame_ancestry, strict Pyright, tests/services/test_segment_coordinates.py,
      lx-data-models contract tests and the lx-annotate and endoreg-db hub transfer suites.
    timeout_seconds: 900
