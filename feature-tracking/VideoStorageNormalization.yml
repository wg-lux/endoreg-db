      Alle endoreg-db-Anwendungswege delegieren OCR nun an den lx-anonymizer-FrameOCR-Vertrag; pro gesampeltem
      Video wird eine eigene Instanz verwendet und das frühere endoreg_db/utils/ocr.py ist entfernt. lx-anonymizer
      lehnt konkurrierende FrameCleaner-Instanznutzung ab, beendet FFmpeg-Prozessgruppen bei Timeout und
      prüft native Pflicht-Capabilities fail-closed. Der optionale Snakemake-Pfad besitzt nun einen typisierten,
