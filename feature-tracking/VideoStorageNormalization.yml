schema_version: '1.0'
id: video_storage_normalization
name: Speicher-normalisierte Videos
description: Einheitlicher, speicherbegrenzter Lebenszyklus für Rohvideo, kanonisches anonymisiertes Video
  und HLS-Derivate, ohne die zeitgenaue Extraktion klinisch hochwertiger Frames aus persistierten Segmenten
  zu verschlechtern.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Artefaktvertrag, Profil, Migrationsgate und Betriebsablauf.
- path: docs/video_pts_fps_callsite_inventory.md
  disposition: reference
  note: Repository-weites Risikoinventar und rückwärtskompatible FPS-zu-PTS-Migration.
definition_of_done:
- id: storage_profile_contract
  category: requirements
  title: Rollen und Größenbudgets aller Videoartefakte sind verbindlich definiert
  acceptance:
  - Roh-Ingest, kanonisches anonymisiertes Mastervideo, HLS-Derivat, extrahierter Frame und temporäres
    Transcode-Artefakt besitzen je eine eindeutige Rolle, Aufbewahrungsfrist und Löschbedingung.
  - Ein versioniertes, typisiertes Profil definiert numerische Obergrenzen für Auflösung, Bildrate, Bitrate
    beziehungsweise Bytes pro Sekunde und zulässigen Storage-Overhead; Profile werden nicht als freie
    Strings durch den Workflow gereicht.
  - Genau ein anonymisiertes kanonisches Video bleibt dauerhaft erhalten; HLS ist ein reproduzierbares,
    größenbegrenztes Derivat mit expliziter Cache- und Eviction-Regel.
  - Abweichungen vom Profil werden laut abgelehnt oder in einen expliziten Quarantänestatus versetzt;
    stilles Stream-Copy oder unbeschränktes Source-Quality-Encoding ist kein Produktionsfallback.
  required: true
  verification:
    kind: manual
    instructions: Profil, Artefaktmatrix und Ausnahmeprozess mit Betrieb, klinischem Reviewer und Storage-Verantwortlichen
      abnehmen.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/services/video_storage/contracts.py; endoreg_db/services/video_storage/validation.py;
        docs/video_storage_normalization.md
    - kind: code
      reference: c3dfaf0a; 3f7084c4
