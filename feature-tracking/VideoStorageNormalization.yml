    evidence:
    - kind: command
      reference: devenv shell bash -lc 'exec .devenv/state/venv/bin/pytest tests/import_files/test_video_import_normalization.py
        tests/services/test_video_storage_normalization.py -q'
      note: Exit-Code 0
    - kind: code
      reference: c3dfaf0a
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_video_storage_normalization.py
        tests/import_files/test_video_import_normalization.py tests/import_files/test_import_encryption.py
        tests/services/test_hls_media.py -q (45 passed)
    note: Neuimport, Reimport und Reanonymisierung verwenden den gemeinsamen Profilcheck. Konforme Quellen
      werden atomar kopiert, Abweichungen transkodiert und erst nach vollständiger Storage- und Timeline-Prüfung
      veröffentlicht; 45 fokussierte Import-, Normalisierungs-, Verschlüsselungs- und HLS-Tests bestanden.
