- id: temporal_frame_contract
  category: data_integrity
  title: Persistierte Segmente referenzieren Frames transcode-stabil und eindeutig
  acceptance:
  - Vor einer Bestandsnormalisierung sind die autoritative rationale FPS, Time-Base, Dauer, Frameanzahl
    und Präsentationszeitstempel beziehungsweise deren belastbare Zuordnung zur Quell-Timeline persistiert
    und versioniert.
  - Segmentgrenzen speichern autoritative Präsentationszeitstempel; falls Frameindizes gespeichert werden,
    ist deren Umrechnung samt Rundungsregel und Timeline-Version explizit. Bei variabler Bildrate sind
    Zeitstempel autoritativ und eine nominelle FPS-Angabe allein ist unzulässig.
  - Zeitbasierte Modellfenster für Glättung, Mindestdauer und Lückenschluss werden gegen die persistierten
    Präsentationszeitstempel ausgewertet; fehlende, nicht endliche, nicht streng steigende oder unvollständige
    Zeitstempelfolgen brechen die temporale Inferenz laut ab und fallen nicht auf eine nominelle Bildrate
    zurück.
  - Jede Normalisierung persistiert Provenienz und eine überprüfbare Abbildung von Quell- zu Ziel-Timeline;
    Drift, ausgelassene oder doppelte Frames außerhalb der freigegebenen Toleranz verhindern die Freigabe.
  - Frame-Extraktion an Segmentanfang, Segmentende und inneren Zeitpunkten wählt vor und nach dem Transcode
    denselben klinischen Bildinhalt deterministisch aus und protokolliert Zielzeitstempel sowie Frameindex.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - bash
    - -lc
    - exec .devenv/state/venv/bin/pytest tests/services/test_video_temporal_mapping.py tests/services/test_segment_frame_extraction.py
      tests/services/test_video_temporal_inference.py -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell bash -lc 'exec .devenv/state/venv/bin/pytest tests/services/test_video_temporal_mapping.py
        tests/services/test_segment_frame_extraction.py -q'
      note: Exit-Code 0
    assessed_by: Max
    assessed_at: '2026-07-20T10:40:56.446106Z'
- id: clinical_frame_quality
  category: requirements
  title: Storage-Reduktion erhält die klinisch erforderliche Framequalität
  acceptance:
  - Ein repräsentativer, freigegebener Videokorpus deckt Auflösungen, Bildraten, variable Bildrate, Bewegung,
    Text, Segmentgrenzen und aktuell eingesetzte Quellcodecs ab.
  - Numerische Mindestwerte für extrahierte Frameauflösung, Lesbarkeit und freigegebene objektive Qualitätsmetriken
    sind je Profil versioniert; reine Dateigröße ist kein Qualitätsnachweis.
  - Qualitätsmessungen erfolgen auf den anhand persistierter Segment-PTS ausgewählten Frames und nicht
    nur auf zufällig gewählten Vollvideoframes.
  - Das kleinste Profil, das alle klinischen und zeitlichen Grenzwerte erfüllt, wird als Produktionsprofil
    festgelegt und mit Reviewerfreigabe dokumentiert.
  required: true
  verification:
    kind: manual
    instructions: Benchmarkbericht, numerische Schwellen und klinische Stichprobe gemeinsam prüfen; ohne
      freigegebenes Profil keine destruktive Bestandsmigration.
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: normalized_import_pipeline
  category: functionality
  title: Jeder erfolgreiche Import erzeugt ein begrenztes kanonisches Video
  acceptance:
  - Neuimport, Reimport und Reanonymisierung durchlaufen denselben typisierten Normalisierungsschritt;
    Duplicate- und Existing-Video-Pfade umgehen ihn nicht unbemerkt.
  - Vor jedem Neuimport sowie nach jedem Reimport und jeder Reanonymisierung wird das konkrete Kandidatenartefakt
    gegen `clinical_h264_bounded_v1` geprüft. Bereits konforme Artefakte werden ohne erneute Kodierung
    atomar übernommen; nicht konforme Artefakte werden in einem versuchsspezifischen Staging-Pfad auf
    dasselbe Profil transkodiert und erst nach erneuter vollständiger Prüfung veröffentlicht.
  - Das finale Video wird vor Veröffentlichung auf Codec, Pixel-Format, Dimensionen, FPS, Dauer, Bitrate,
    Dateigröße und Timeline-Konformität geprüft.
  - Die rationale Bildrate der verifizierten, unveränderlichen Quelle wird ohne Float-Rundung bis zur
    Maskierungsgrenze in lx-anonymizer durchgereicht. FFmpeg-Maskierung erhält Quell-Präsentationszeitstempel
    mit `-fps_mode passthrough` und darf weder `-r`, `-fpsmax` noch einen `fps`-Filter ergänzen.
  - Ein Full-Frame-Maskierungs- oder Passthrough-Pfad darf das verpflichtende Storage-Profil nicht durch
    Stream-Copy umgehen.
  - Fehlende oder widersprüchliche Metadaten führen zu einem expliziten Fehlerzustand und bewahren die
    noch benötigte Quelle.
  - Der Content-Hash für die Import-Sperre wird erst unter der pfadbasierten Import-Sperre aus einer stabilen
    Dateiidentität gebildet. Gleichzeitige Änderung oder Ersetzung der Quelle während des Hashings schlägt
    laut fehl; die native Hash-Berechnung gibt den Python Global Interpreter Lock frei, damit unabhängige
    Imports parallel fortschreiten können.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - bash
    - -lc
    - exec .devenv/state/venv/bin/pytest tests/import_files/test_video_import_normalization.py tests/services/test_video_storage_normalization.py
      -q
    timeout_seconds: 1200
