schema_version: '1.0'
id: colonoscopy
name: Koloskopie-Dokumentation
description: Vollständige, klinisch valide und typisierte Dokumentation von Koloskopien und Polypenbefunden.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/colonoscopy-requirements-plan.md
  disposition: migrated
  note: Fachliche Anforderungen wurden in überprüfbare DoD-Kriterien überführt.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Pflichtdaten und klinische Semantik sind fachlich freigegeben
  acceptance:
  - Die maßgebliche Fassung der S2k-Leitlinie 021-022 ist mit Status, Datum, Version und Fundstellen
    eindeutig benannt; Konsultationsfassung und veröffentlichte Langfassung werden nicht gleichgesetzt.
  - Patient, Indikation, Untersucher, Assistenzpersonal, Gerätetyp, Seriennummer, Prozesszeitpunkte,
    Monitoring, Untersuchungsabschluss und relevante Bilder sind in typisierten Laufzeitverträgen
    eindeutig definiert und nicht nur als Template-Anzeigefelder deklariert.
  - Operierter Situs, unbekannte Werte und unauffälliger Befund haben explizite Semantik.
  - Patientenbezogene Mindestdokumentation und populationsbezogene Qualitätsindikatoren sind als
    getrennte Verträge modelliert.
  required: true
  verification:
    kind: manual
    instructions: Kriterien mit klinischer Fachverantwortung und Datenmodell reviewen.
    timeout_seconds: 300
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: /home/admin/lx-parse/021-022l_S2k_Qualitaetsanforderungen-in-der-gastrointestinalen-Endoskopie_2026-01.pdf
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/report_template_examples/report_templates.yaml
    note: 'Review 2026-07-31: Indikation, Untersucher, Assistenz, Geräteidentifikation, Prozesszeiten,
      Monitoring und relevante Bilder sind im LXDM-Template teilweise nur deklarierte Felder; sechs Feldschlüssel
      sind im Template-Graph unbekannt und werden nicht durch den PExamination-Laufzeitvertrag erzwungen.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:35.835814Z'
- id: examination_timeline
  category: functionality
  title: Untersuchungszeitpunkte und Vollständigkeit sind korrekt erfassbar
  acceptance:
  - Betreten des Untersuchungsraums, Untersuchungsbeginn, Rückzugsbeginn am Zökalpol,
    Untersuchungsende, Verlassen des Untersuchungsraums und Verlassen der Endoskopieabteilung
    sind validierte Zeitpunkte.
  - Die Mukosainspektionszeit schließt Biopsie- und Polypektomiezeiten aus; für Vorsorgekoloskopien
    wird die Mindestzeit pro Untersuchung und für diagnostische Koloskopien die populationsbezogene
    Durchschnittsregel indikationsgerecht ausgewertet.
  - Tiefste Intubation bildet Vollständigkeit auch bei operiertem Situs korrekt ab.
  - Bei nativer Anatomie und dokumentiertem Zökumerreichen sind Appendixostium und Ileozökalklappe
    mit echten Bildreferenzen verpflichtend; inkomplette Untersuchungen und ileokolische Anastomosen
    folgen expliziten Alternativregeln.
  - Der BBPS-Gesamtwert wird aus den drei Segmentwerten abgeleitet oder gegen deren Summe validiert.
  required: true
  verification:
    kind: manual
    instructions: Repräsentative vollständige, unvollständige und postoperativ veränderte Fälle prüfen.
    timeout_seconds: 300
  assessment:
    status: blocked
    evidence:
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/report_template_examples/report_templates.yaml
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/interface/tests/test_report_template_runtime_execution.py
    note: 'Review 2026-07-31: Mukosainspektionsdauer und tiefste Lokalisation sind modelliert, aber die
      sechs Prozesszeitpunkte fehlen, BBPS-Gesamtwert und Segmentwerte werden nicht auf Konsistenz geprüft
      und Zökumerreichen erzwingt keine positiven Landmarkbilder.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:37.380223Z'
- id: finding_requirements
  category: data_integrity
  title: Polypenbefunde erfüllen größenabhängige Pflichtangaben
  acceptance:
  - Lokalisation und Größe sind vorhanden; Rektum und Sigma verlangen bei Bedarf Zentimeterangabe.
  - Paris-, NICE-, J-NET- und LST-Klassifikation werden nur gemäß fachlicher Größenregeln verlangt.
  - Biopsie, Resektion und Clipversorgung sind eindeutig dokumentiert.
  - Die konkrete Resektionstechnik ist strukturiert erfasst und wird anhand von Größe und Morphologie
    als angemessen oder nicht angemessen auswertbar; ein bloßer Status „Technik dokumentiert“ genügt nicht.
  - Präparatebergung, Histologieeinsendung und das verknüpfte Histologieergebnis sind unterscheidbar,
    sodass ein histologisch bestätigtes Adenom berechnet werden kann.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/finding/test_colonoscopy_finding.py
    - tests/finding/test_colon_polyp_locations.py
    - tests/finding/test_colon_polyp_morphologies.py
    - -q
    timeout_seconds: 600
  assessment:
    status: blocked
    evidence:
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/terminology/lx_findings/data/02_colonoscopy_observation.yaml
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/terminology/lx_classifications/data/02_colonoscopy_baseline.yaml
    note: 'Review 2026-07-31: Lokalisation, Größe und Morphologie sind weitgehend strukturiert; für Polypen
      über 5 mm wird jedoch nur der Status Resektionstechnik dokumentiert verlangt. Angemessenheit der
      konkreten Technik und histologisch bestätigte Adenome sind nicht durchgängig auswertbar.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:39.094782Z'
- id: s2k_report_minimum_documentation
  category: data_integrity
  title: Die Mindestdokumentation nach Statement 2.36 ist durchgängig erzwingbar
  acceptance:
  - Patientenidentifikation, Indikation, Untersucher und Assistenzpersonal, Gerätetyp und Seriennummer,
    Medikation, Prozesszeiten, Vollständigkeit und Beurteilbarkeit sind durch persistierte, typisierte
    Felder und Runtime-Validatoren belegt.
  - Normalbefund und pathologische Befunde enthalten Läsionsattribute, Lokalisation und Ausdehnung;
    diagnostische und therapeutische Maßnahmen sowie Proben sind ortsbezogen dokumentiert.
  - Intra- und postprozedurale Komplikationen, Nachsorgeempfehlungen mit Inhalt und Intervall,
    ICD-/OPS-Kodierung, verwendete Instrumente und Materialien sowie relevante Bilddateien sind
    strukturiert abbildbar.
  - Ein Bericht ohne eine Pflichtangabe schlägt in der kombinierten Template-, Ledger- und
    Runtime-Validierung fehl; unbekannte Template-Feldschlüssel dürfen keine Produktionsfreigabe erhalten.
  required: true
  verification:
    kind: manual
    instructions: Statement 2.36 zeilenweise gegen Template, Ledger, API, Persistenz und Runtime-Validatoren
      prüfen und für jede Pflichtangabe einen positiven und negativen End-to-End-Fall belegen.
    timeout_seconds: 600
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: /home/admin/lx-parse/021-022l_S2k_Qualitaetsanforderungen-in-der-gastrointestinalen-Endoskopie_2026-01.pdf
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/interface/tests/test_report_template_runtime_execution.py
    note: 'Review 2026-07-31: Statement 2.36 ist nur teilweise abgebildet. Es fehlen insbesondere durchgängige
      Runtime-Verträge für Assistenz, Geräteseriennummer, Prozesszeiten, Vitalparameter/Sauerstofffluss,
      ICD/OPS, Instrumente/Materialien und echte Bildreferenzen; ein Bericht ohne Indikation oder Untersucher
      kann die aktuellen Finding-Validatoren bestehen.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:40.227655Z'
- id: s2k_quality_indicators
  category: functionality
  title: Allgemeine und koloskopiespezifische Qualitätsindikatoren sind reproduzierbar berechenbar
  acceptance:
  - Die allgemeinen Indikatoren aus Tabelle 22 umfassen Risikoassessment, Aufklärung und Einwilligung,
    Antibiotikaprophylaxe, Management gerinnungshemmender Medikation, Team-Time-out, Bilddokumentation,
    kontinuierliches Vitalzeichenmonitoring, Entlassungsmanagement, vollständigen Befund,
    Nachsorgeempfehlungen und Komplikationsdokumentation.
  - Die koloskopiespezifischen Indikatoren umfassen Darmvorbereitungsdokumentation, Zökumintubationsrate,
    Adenomdetektionsrate, Vorsorge-Rückzugszeit, Klassifikationsabdeckung für Polypen über 5 mm,
    angemessene Resektionstechnik und standardisierte Terminologie mit den leitlinienbezogenen Zielwerten.
  - Jeder Indikator definiert Zähler, Nenner, Ausschlüsse, Zeitraum, Datenvollständigkeit und Gruppierung
    nach Untersucher beziehungsweise Einrichtung.
  - Per-Bericht-Validatoren werden nicht als Erfüllung einer populationsbezogenen Rate ausgegeben;
    Adenomdetektionsrate setzt ein verknüpftes, histologisch bestätigtes Adenom voraus.
  required: true
  verification:
    kind: manual
    instructions: Indikatorspezifikation mit klinischer Fachverantwortung prüfen und anschließend gegen
      reproduzierbare Kohorten-Fixtures mit Einschlüssen, Ausschlüssen und fehlenden Daten auswerten.
    timeout_seconds: 600
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: /home/admin/lx-parse/021-022l_S2k_Qualitaetsanforderungen-in-der-gastrointestinalen-Endoskopie_2026-01.pdf
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/report_template_examples/report_templates.yaml
    note: 'Review 2026-07-31: Es existiert keine ausführbare populationsbezogene QI-Schicht mit Zähler,
      Nenner, Ausschlüssen, Zeitraum und Gruppierung. Allgemeine Indikatoren aus Tabelle 22 sowie ADR,
      Zökumrate, Rückzugszeit-Compliance, angemessene Resektionstechnik und standardisierte Terminologie
      sind nicht als Kohortenmetriken implementiert.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:41.616679Z'
- id: guideline_provenance
  category: documentation
  title: Leitlinienprovenienz ist versioniert und bis zum einzelnen Konzept nachvollziehbar
  acceptance:
  - Template und Qualitätsindikatoren referenzieren dieselbe eindeutig identifizierte Leitlinienfassung;
    Dateiname, interner Dokumentstatus, Publikationsdatum und zitierte URL widersprechen sich nicht.
  - Jede klinische Regel nennt Empfehlung oder Statement, Seite beziehungsweise Abschnitt,
    Empfehlungsstärke und Implementierungsstatus.
  - Änderungen der Leitlinienfassung erzeugen eine nachvollziehbare fachliche Differenzprüfung und
    eine neue Template- oder Regelsatzversion.
  required: true
  verification:
    kind: manual
    instructions: PDF-Metadaten, interne Versionsangaben, Citation-Datensatz, Template-Version und
      Regelquellen gemeinsam prüfen.
    timeout_seconds: 300
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: /home/admin/lx-parse/021-022l_S2k_Qualitaetsanforderungen-in-der-gastrointestinalen-Endoskopie_2026-01.pdf
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/citations/data/sample_references.yaml
    note: 'Review 2026-07-31: Die bereitgestellte Datei trägt intern den Status Konsultationsfassung Juli
      2025, während der Citation-Datensatz auf eine Langfassung vom 30.09.2025 verweist. Template, Citation
      und einzelne Regeln sind nicht über genaue Statement-/Empfehlungs- und Seitenreferenzen verbunden.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:44.038061Z'
- id: lxdm_report_concept_coverage
  category: functionality
  title: LXDM-validierte Berichte weisen die anwendbaren Reporting-Konzepte aus
  acceptance:
  - Das freigegebene YAML-Modul ist durch Modulname, semantische Version, unveränderliche Freigabe oder
    Inhaltsdigest und fachliche Freigabe identifiziert.
  - Jedes prüfbare Reporting-Element besitzt eine stabile Konzept-ID, eine explizite Anwendbarkeitsregel,
    eine Wertdefinition, zulässige Einheit oder Wertemenge, Provenienz und die Modellversion.
  - Ein über lx-annotate erstellter Bericht wird gegen genau dieses Modul ausgewertet und liefert je Element
    den deterministischen Status present, missing, not_applicable, invalid oder unknown.
  - present wird nur bei validiertem Konzeptwert vergeben; ein bloßer lexikalischer Treffer, ein unbekannter
    Wert oder ein nicht aufgelöstes Synonym gilt nicht als ausreichender Nachweis.
  - Das Ergebnis enthält die Bericht-/Template-Identität, Modulversion beziehungsweise Digest sowie die
    belegende Feld- oder Pfadreferenz und ist mit Positiv-, Negativ-, Nicht-anwendbar- und ungültigen
    Fixtures reproduzierbar.
  - Die technische Konzeptabdeckung wird ausdrücklich getrennt von klinischer Vollständigkeit, Leitlinienadhärenz
    und einem Qualitätsgewinn durch Standardisierung berichtet; diese Aussagen erfordern eine fachlich
    annotierte Referenzmenge und eine prospektive Vergleichsstudie.
  required: true
  verification:
    kind: manual
    instructions: LXDM-YAML-Freigabe, Elementmatrix, lx-annotate-Berichtsexport und reproduzierbare Fixtures
      gemeinsam durch technische und klinische Verantwortliche prüfen; erst danach technische Testevidenz
      und fachliche Abnahme getrennt bewerten.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/lx-parse/lx_dtypes/models/knowledge_base/report_template/tests/test_report_concept_coverage.py
      note: Versionierter LXDM-Coverage-Vertrag mit stabiler Konzept-ID, Modul-/Template-Digest, Anwendbarkeit,
        Status und Evidenzpfad; positive und negative Modelltests.
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/django/api/tests/test_report_templates_api.py
      note: API-Validierung erzeugt concept_coverage aus KnowledgeBase, Template-Export, PExamination
        und Validatorresultat; fokussierter Lauf bestanden.
    - kind: test
      reference: /home/admin/dev/lx-annotate/frontend/src/api/__tests__/reportTemplatesApi.test.ts
      note: Frontend validiert den versionierten Serververtrag und weist bei fehlender oder ungültiger
        Coverage sichtbar auf den nicht autoritativen Fallback hin.
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/knowledge_base/report_template/tests/test_report_concept_coverage_builder.py
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/interface/tests/test_report_template_runtime_execution.py
    - kind: code
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/data/report_template_examples/report_templates.yaml
    note: 'Review 2026-07-31: Die technische Coverage-Auflösung und zentrale bedingte Regeln sind getestet.
      Die aktuelle autoritative Konzeptmatrix umfasst jedoch nur zwölf Konzepte und schließt Indikation,
      Personal, Gerät, Prozesszeiten, Monitoring, relevante Bilder, BBPS-Gesamtwert, Pathologiestatus
      und Nachsorge nicht vollständig ein; klinische Freigabe und QI-Aggregation bleiben offen.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:47.594532Z'
- id: automated_tests
  category: testing
  title: Klinische Regeln haben parametrisierte Positiv- und Negativtests
  acceptance:
  - Größen-, Lokalisations-, Klassifikations- und Vollständigkeitsvarianten sind automatisiert getestet.
  - Tests decken fehlende Indikation und Personalangaben, widersprüchliche BBPS-Werte, Zökumerreichen
    ohne Landmarkbilder, postoperative Anatomie, inadäquate Vorbereitung, Rückzugszeit nach Indikation,
    fehlende Histologieverknüpfung und unvollständige Komplikations- beziehungsweise Nachsorgedaten ab.
  - Kohorten-Fixtures prüfen Zähler, Nenner, Ausschlüsse und Zielwerte aller populationsbezogenen
    Qualitätsindikatoren.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/finding
    - -q
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/interface/tests/test_report_template_runtime_execution.py
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/interface/tests/test_report_template_example_module.py
    note: 35 fokussierte LXDM-Template- und Runtime-Tests bestanden am 2026-07-31. Es fehlen End-to-End-Fälle
      für die deklarativen Kontextfelder, BBPS-Summenkonsistenz, Zökumerreichen ohne positive Landmarkbilder
      und sämtliche populationsbezogenen QI-Kohorten.
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:45.219514Z'
- id: privacy_controls
  category: security
  title: Patienten- und Geräteidentität folgt dem minimalen Zugriffskonzept
  acceptance:
  - Direkte Identifikatoren sind nur in autorisiertem klinischem Kontext verfügbar.
  - Export und Forschungsnutzung verwenden pseudonymisierte Verträge.
  required: true
  verification:
    kind: manual
    instructions: API-, Export- und Rollenpfade für Patient und Geräte-ID reviewen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: operational_readiness
  category: operations
  title: Ungültige und historische Datensätze sind sicher behandelbar
  acceptance:
  - Validierungsfehler sind verständlich und bestehende Daten können kontrolliert migriert werden.
  - Keine neue Pflichtregel macht Produktion ohne geprüften Migrationspfad unstartbar.
  required: true
  verification:
    kind: manual
    instructions: Migration und Validierung eines repräsentativen Bestands proben.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: clinical_documentation
  category: documentation
  title: Klinische Regeln und technische Abbildung sind gemeinsam dokumentiert
  acceptance:
  - Jede Pflichtangabe ist auf Modell, API-Feld und fachliche Begründung abbildbar.
  - Eine freigegebene Abdeckungsmatrix ordnet jedes Element aus Statement 2.36, Tabelle 22 und den
    spezifischen Koloskopie-Qualitätsindikatoren einem Template-Feld, Ledger-Objekt, Aggregationsvertrag
    oder einer ausdrücklich begründeten Nichtanwendbarkeit zu.
  - Die Dokumentation kennzeichnet getrennt, ob ein Konzept nur deklariert, strukturell ladbar,
    zur Laufzeit validiert, klinisch freigegeben oder populationsbezogen auswertbar ist.
  required: true
  verification:
    kind: manual
    instructions: Feldmatrix mit klinischer Fachverantwortung und API-Consumer abnehmen.
    timeout_seconds: 300
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: /home/admin/lx-parse/colonoscopy_guideline_coverage_matrix.md
    note: 'Review 2026-07-31: Eine vollständige, freigegebene Abdeckungsmatrix für Statement 2.36, Tabelle
      22 und die spezifischen Koloskopie-QI fehlt. Die vorhandene Matrix beschreibt patientenbezogene
      Kerndaten, bildet aber keinen implementierten Aggregationsvertrag und keine End-to-End-Freigabe
      ab.'
    assessed_by: Codex
    assessed_at: '2026-07-31T09:18:46.324658Z'
