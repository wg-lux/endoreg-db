schema_version: '1.0'
id: colonoscopy
name: Koloskopie-Dokumentation
description: Vollständige, klinisch valide und typisierte Dokumentation von Koloskopien und Polypenbefunden.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/colonoscopy-requirements-plan.md
  disposition: migrated
  note: Fachliche Anforderungen wurden in überprüfbare DoD-Kriterien überführt.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Pflichtdaten und klinische Semantik sind fachlich freigegeben
  acceptance:
  - Patient, Indikation, Personal, Gerät, Zeitpunkte und Untersuchungsabschluss sind eindeutig definiert.
  - Operierter Situs, unbekannte Werte und unauffälliger Befund haben explizite Semantik.
  required: true
  verification:
    kind: manual
    instructions: Kriterien mit klinischer Fachverantwortung und Datenmodell reviewen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: examination_timeline
  category: functionality
  title: Untersuchungszeitpunkte und Vollständigkeit sind korrekt erfassbar
  acceptance:
  - Untersuchungsbeginn, Rückzugsbeginn und Untersuchungsende sind validierte Zeitpunkte.
  - Tiefste Intubation bildet Vollständigkeit auch bei operiertem Situs korrekt ab.
  required: true
  verification:
    kind: manual
    instructions: Repräsentative vollständige, unvollständige und postoperativ veränderte Fälle prüfen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: finding_requirements
  category: data_integrity
  title: Polypenbefunde erfüllen größenabhängige Pflichtangaben
  acceptance:
  - Lokalisation und Größe sind vorhanden; Rektum und Sigma verlangen bei Bedarf Zentimeterangabe.
  - Paris-, NICE-, J-NET- und LST-Klassifikation werden nur gemäß fachlicher Größenregeln verlangt.
  - Biopsie, Resektion und Clipversorgung sind eindeutig dokumentiert.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/finding/test_colonoscopy_finding.py
    - tests/finding/test_colon_polyp_locations.py
    - tests/finding/test_colon_polyp_morphologies.py
    - -q
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: lxdm_report_concept_coverage
  category: functionality
  title: LXDM-validierte Berichte weisen die anwendbaren Reporting-Konzepte aus
  acceptance:
  - Das freigegebene YAML-Modul ist durch Modulname, semantische Version, unveränderliche Freigabe oder
    Inhaltsdigest und fachliche Freigabe identifiziert.
  - Jedes prüfbare Reporting-Element besitzt eine stabile Konzept-ID, eine explizite Anwendbarkeitsregel,
    eine Wertdefinition, zulässige Einheit oder Wertemenge, Provenienz und die Modellversion.
  - Ein über lx-annotate erstellter Bericht wird gegen genau dieses Modul ausgewertet und liefert je Element
    den deterministischen Status present, missing, not_applicable, invalid oder unknown.
  - present wird nur bei validiertem Konzeptwert vergeben; ein bloßer lexikalischer Treffer, ein unbekannter
    Wert oder ein nicht aufgelöstes Synonym gilt nicht als ausreichender Nachweis.
  - Das Ergebnis enthält die Bericht-/Template-Identität, Modulversion beziehungsweise Digest sowie die
    belegende Feld- oder Pfadreferenz und ist mit Positiv-, Negativ-, Nicht-anwendbar- und ungültigen
    Fixtures reproduzierbar.
  - Die technische Konzeptabdeckung wird ausdrücklich getrennt von klinischer Vollständigkeit, Leitlinienadhärenz
    und einem Qualitätsgewinn durch Standardisierung berichtet; diese Aussagen erfordern eine fachlich
    annotierte Referenzmenge und eine prospektive Vergleichsstudie.
  required: true
  verification:
    kind: manual
    instructions: LXDM-YAML-Freigabe, Elementmatrix, lx-annotate-Berichtsexport und reproduzierbare Fixtures
      gemeinsam durch technische und klinische Verantwortliche prüfen; erst danach technische Testevidenz
      und fachliche Abnahme getrennt bewerten.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/lx-parse/lx_dtypes/models/knowledge_base/report_template/tests/test_report_concept_coverage.py
      note: Versionierter LXDM-Coverage-Vertrag mit stabiler Konzept-ID, Modul-/Template-Digest, Anwendbarkeit,
        Status und Evidenzpfad; positive und negative Modelltests.
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/django/api/tests/test_report_templates_api.py
      note: API-Validierung erzeugt concept_coverage aus KnowledgeBase, Template-Export, PExamination
        und Validatorresultat; fokussierter Lauf bestanden.
    - kind: test
      reference: /home/admin/dev/lx-annotate/frontend/src/api/__tests__/reportTemplatesApi.test.ts
      note: Frontend validiert den versionierten Serververtrag und weist bei fehlender oder ungültiger
        Coverage sichtbar auf den nicht autoritativen Fallback hin.
    - kind: test
      reference: /home/admin/lx-parse/lx-data-models/lx_dtypes/models/knowledge_base/report_template/tests/test_report_concept_coverage_builder.py
    note: Die Coverage-Auflösung verarbeitet wiederholte Befunde nun deterministisch über Finding-/Klassifikations-Selektoren
      und liefert konkrete Evidenzpfade für alle Instanzen. Offen bleiben klinisch freigegebene Konzeptmatrizen,
      Einheiten, reale Template-Metadaten, annotierte Koloskopie-Fixtures und Abnahme.
    assessed_by: Codex
    assessed_at: '2026-07-30T13:13:54.279171Z'
- id: automated_tests
  category: testing
  title: Klinische Regeln haben parametrisierte Positiv- und Negativtests
  acceptance:
  - Größen-, Lokalisations-, Klassifikations- und Vollständigkeitsvarianten sind automatisiert getestet.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/finding
    - -q
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: privacy_controls
  category: security
  title: Patienten- und Geräteidentität folgt dem minimalen Zugriffskonzept
  acceptance:
  - Direkte Identifikatoren sind nur in autorisiertem klinischem Kontext verfügbar.
  - Export und Forschungsnutzung verwenden pseudonymisierte Verträge.
  required: true
  verification:
    kind: manual
    instructions: API-, Export- und Rollenpfade für Patient und Geräte-ID reviewen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: operational_readiness
  category: operations
  title: Ungültige und historische Datensätze sind sicher behandelbar
  acceptance:
  - Validierungsfehler sind verständlich und bestehende Daten können kontrolliert migriert werden.
  - Keine neue Pflichtregel macht Produktion ohne geprüften Migrationspfad unstartbar.
  required: true
  verification:
    kind: manual
    instructions: Migration und Validierung eines repräsentativen Bestands proben.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: clinical_documentation
  category: documentation
  title: Klinische Regeln und technische Abbildung sind gemeinsam dokumentiert
  acceptance:
  - Jede Pflichtangabe ist auf Modell, API-Feld und fachliche Begründung abbildbar.
  required: true
  verification:
    kind: manual
    instructions: Feldmatrix mit klinischer Fachverantwortung und API-Consumer abnehmen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
