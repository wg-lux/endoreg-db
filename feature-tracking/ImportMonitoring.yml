- id: safe_monitoring_boundary
  category: security
  title: Monitoring legt keine geschützten Medien- oder Systemdetails offen
  acceptance:
  - Monitoring-Endpunkte erzwingen Authentisierung und Center-Scope und geben weder absolute Pfade, Rohmedieninhalte,
    Hashes, Stacktraces, Datenbankdetails noch Secrets aus.
  - Nutzertexte stammen aus stabilen Fehlercodes und freigegebenen Meldungen; vollständige technische
    Details verbleiben korreliert in strukturierten, zugriffsgeschützten Server-Logs.
  - Quarantäne und Importartefakte bleiben innerhalb der genehmigten verschlüsselten Speichergrenze; Monitoring
    umgeht weder mTLS noch Storage- oder Retention-Policies.
  required: true
  verification:
    kind: manual
    instructions: Berechtigungs-, Mandantentrennungs- und Informationsleck-Review für Übersicht, Quarantäne-Endpunkt
      und strukturierte Logs durchführen.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/dev/lx-annotate/tests/api/test_quarantine_api.py
    note: Center-Scope und Pfadbereinigung getestet; formales Security-Review ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:49.630358Z'
- id: metrics_and_alerts
  category: observability
  title: Importdurchsatz, Wiederholungen, Fehler und Quarantäne sind messbar
  acceptance:
  - Strukturierte Ereignisse und Metriken erfassen Importanzahl und -alter je Zustand, Laufzeit, transiente
    Fehler, Versuchszähler, ausgeschöpfte Wiederholungen, LOST, HLS-Warte- und Materialisierungsdauer,
    HLS-Fehlschläge und Generationswechsel sowie Anzahl, Alter und Größe der Quarantäne.
  - Upload-Job-ID verbindet API-Antwort, Worker-Ereignisse, Cleanup, Quarantäne und technische Fehlerdetails,
    ohne sensible Bezeichner als ungeschützte Metrik-Labels zu verwenden.
  - Alarme besitzen festgelegte Schwellen für hängende Verarbeitung, Retry-Erschöpfung, ERROR oder LOST,
    Quarantänewachstum und Speicherknappheit und wurden mit Testereignissen geprüft.
  required: true
  verification:
    kind: manual
    instructions: Einen erfolgreichen, einen transient fehlschlagenden und einen quarantänisierten Import
      ausschließlich über Metriken, Alarme und korrelierte strukturierte Ereignisse nachvollziehen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/management/commands/check_system_health.py
    note: Health-Zähler und strukturierte Retry-Ereignisse implementiert; produktive Alarm-Testereignisse
      ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:50.562363Z'
- id: operational_recovery
  category: operations
  title: Wiederanlauf, Quarantänereview und Störungsbehebung sind betriebssicher
  acceptance:
  - Worker-Neustart, Prozessabbruch und vorübergehende Abhängigkeitsfehler führen idempotent zu Fortsetzung
    oder begrenzter Wiederholung, nicht zu parallelen Jobs oder doppelten fachlichen Ressourcen.
  - Nach ausgeschöpften Wiederholungen erfolgt ein terminaler, alarmierter Zustand; LOST und Inkonsistenz
    bleiben fail-closed und werden nicht automatisch auf Erfolg gesetzt.
  - Hängende oder fehlgeschlagene HLS-Materialisierung ist diagnostizierbar und idempotent wiederanlauffähig;
    eine bestehende gültige Generation bleibt bis zur atomaren Veröffentlichung des Ersatzes erhalten.
  - Runbook und Health-Check beschreiben Diagnose, manuelle Wiederholung, sicheren Neuimport, Quarantänereview,
    Kapazitätskontrolle und Eskalation mit überprüfbaren Kommandos.
  required: true
  verification:
    kind: manual
    instructions: Produktionsnahe Wiederanlauf- und Incident-Übung mit transientem Fehler, Retry-Erschöpfung,
      LOST und Quarantäne durchführen.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: runbook
      reference: docs/hub_ingest_operations.md
    note: Retry-Dispatcher, HLS-Recovery und Runbook implementiert; produktionsnahe Incident-Übung ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:30:00.489642Z'
- id: operator_documentation
  category: documentation
  title: Zustände, Anzeigen und Betriebsabläufe sind verständlich dokumentiert
  acceptance:
  - Dokumentation enthält Zustands- und Übergangsmatrix, Fehlercodes, Retry-Policy, UI-Bedeutung, HLS-Materialisierung
    und Quarantäne-Lebenszyklus sowie die Abgrenzung von Import-, Anonymisierungs-, HLS- und Cleanup-Zustand.
  - Bediener können anhand der Dokumentation entscheiden, wann Abwarten, manuelle Wiederholung, Neuimport,
    Quarantänereview oder Eskalation erforderlich ist.
  - Technische Dokumentation benennt die Verträge und verantwortlichen Module in endoreg_db, lx_dtypes
    und lx-annotate ohne parallelen Fertigstellungsstatus außerhalb dieses Trackers.
  required: true
  verification:
    kind: manual
    instructions: Dokumentation mit Entwicklung, Betrieb und einer repräsentativen Bedienperson gegen
      reale Statusbeispiele reviewen.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/hub_ingest_operations.md
    note: Zustandsmatrix, Fehlercodes, Retry-, HLS- und Quarantäneablauf dokumentiert; Mehrrollen-Review
      ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:30:01.370965Z'
