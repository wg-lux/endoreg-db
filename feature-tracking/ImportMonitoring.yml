schema_version: '1.0'
id: import_monitoring
name: Import-Monitoring
description: Durchgängige, sichere und betriebsfähige Sicht auf Import-Jobs aus API und Ordnerüberwachung.
  Der Vertrag trennt Import, transiente Wiederholungsversuche, Quarantäne, Anonymisierung, Cleanup und
  die generationsgebundene Materialisierung von HTTP Live Streaming (HLS) in eigenständige Zustandsachsen.
owners:
- endoreg_db und lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/wiki/hub_ingest_current_state.md
  disposition: reference
  note: Beschreibt UploadJob als gemeinsames Import-Ledger für API und Ordnerüberwachung.
- path: docs/hub_ingest_operations.md
  disposition: reference
  note: Definiert Quarantäne-, Cleanup-, Alarmierungs- und Wiederanlaufanforderungen.
- path: docs/lxdm_contract_inventory.md
  disposition: reference
  note: Inventarisiert den typisierten Vertrag der Anonymisierungsübersicht.
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Definiert HLS als generationsgebundenes Derivat mit atomarer Veröffentlichung und Lease-Schutz.
definition_of_done:
- id: import_state_contract
  category: requirements
  title: Importzustände und Übergänge sind vollständig und eindeutig definiert
  acceptance:
  - Wartend, in Bearbeitung, erfolgreich, transient fehlgeschlagen, dauerhaft fehlgeschlagen, verloren
    und in Quarantäne sind fachlich getrennte Zustände mit erlaubten Übergängen und terminaler Bedeutung.
  - Für jeden Fehlerzustand ist festgelegt, ob automatisch wiederholt werden darf, ein Bedienereingriff
    erforderlich ist oder ein sicherer Neuimport erfolgen muss.
  - Import-, Anonymisierungs-, HLS-Materialisierungs- und Cleanup-Zustand bleiben getrennte Zustandsachsen
    und dürfen einander nicht implizit überschreiben.
  required: true
  verification:
    kind: manual
    instructions: Zustandsmatrix gegen UploadJob, Importservices, API-Verträge und die Anonymisierungsübersicht
      prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/models/hub/upload_job.py
    note: Implementiert; fachliche Zustandsmatrix wartet auf manuelles Review.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:45.000331Z'
- id: typed_monitoring_api
  category: interoperability
  title: Die Monitoring-API liefert einen typisierten, stabilen Fehlervertrag
  acceptance:
  - Der snake_case API-Vertrag liefert Status, Importweg, Quellsystem, Zeitpunkte, Cleanup-Zustand, HLS-Materialisierungszustand
    und eine stabile Job-Korrelation.
  - Transiente Fehler enthalten einen stabilen Fehlercode, Wiederholbarkeit, bisherigen Versuchszähler,
    maximal zulässige Versuche und den nächsten Wiederholungszeitpunkt; die UI muss keine Ausnahmetexte
    klassifizieren.
  - Unbekannte Zustände oder widersprüchliche Kombinationen werden am typisierten Rand laut abgelehnt
    und nicht als erfolgreicher oder wiederholbarer Import interpretiert.
  required: true
  verification:
    kind: manual
    instructions: Endoreg-Serializer, lx_dtypes-Vertrag und TypeScript-Typen auf vollständige, identische
      und strikt validierte Felder vergleichen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/serializers/misc/file_overview.py
    note: Typisierter Backend-, lx_dtypes- und TypeScript-Vertrag implementiert; manueller Vertragsvergleich
      ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:45.949387Z'
- id: operator_overview
  category: functionality
  title: Die Anonymisierungsübersicht macht Importzustände handlungsorientiert sichtbar
  acceptance:
  - AnonymizationOverviewComponent.vue zeigt Importstatus getrennt von Anonymisierung und Annotation sowie
    Importweg, Quellsystem, Zentrum, Aktualisierungszeit und Cleanup-Zustand.
  - Transiente Fehler zeigen verständlich den laufenden oder geplanten Wiederholungsversuch samt Versuchszähler;
    terminale Fehler und LOST werden davon visuell und sprachlich eindeutig unterschieden.
  - 'Aktionen sind zustandsabhängig: aktive oder automatisch wiederholte Jobs verhindern konkurrierende
    Verarbeitung, Quarantäne bleibt schreibgeschützt und Neuimport oder Löschung wird nur angeboten, wenn
    der serverseitige Vertrag dies erlaubt.'
  - Duplikate werden über einen stabilen Fehlercode und nicht durch reguläre Ausdrücke auf error_detail
    erkannt; vorhandene validierte Annotationen bleiben unverändert.
  required: true
  verification:
    kind: manual
    instructions: Repräsentative API-Payloads für jeden Zustand in der Übersicht darstellen und Texte,
      Badges, Aktionen sowie Pollingverhalten prüfen.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: /home/admin/dev/lx-annotate/frontend/src/components/Anonymizer/AnonymizationOverviewComponent.vue
    note: Darstellung und aktive Zustandsaktionen implementiert; repräsentative Bedienerprüfung ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:46.872488Z'
- id: hls_materialization_state
  category: functionality
  title: HLS-Materialisierung ist als eigene generationsgebundene Zustandsachse sichtbar
  acceptance:
  - Raw- und Processed-HLS verwenden getrennt die typisierten Zustände queued, materializing, ready und
    failed; ein erfolgreicher Import oder eine abgeschlossene Anonymisierung impliziert nicht automatisch
    ready.
  - Der Monitoringvertrag verbindet Artefaktart, Zustand, Quell- und Zielgeneration, Erstellungs- und
    Aktualisierungszeit sowie einen sicheren stabilen Fehlercode mit dem Video und dem auslösenden Import-
    oder Reimport-Job.
  - ready wird erst nach vollständiger Validierung und atomarer Veröffentlichung von Playlist, Schlüssel
    und Segmenten für genau eine Generation gemeldet; gemischte oder unvollständige Generationen schlagen
    fail-closed fehl.
  - Aktive Wiedergabe- oder Segment-Update-Leases schieben Neuerzeugung und Generationswechsel auf. Ein
    Fehler oder eine Aufschiebung entfernt weder die vorherige gültige Generation noch den einzigen gültigen
    Master.
  - Die Anonymisierungsübersicht zeigt verständlich, ob HLS wartet, materialisiert wird, bereit oder fehlgeschlagen
    ist, und bietet nur serverseitig erlaubte Wiederholungs- oder Diagnoseaktionen an.
  required: true
  verification:
    kind: manual
    instructions: Import und Reimport mit Raw- und Processed-HLS durch queued, materializing, ready und
      failed verfolgen; atomare Veröffentlichung, Generationsbindung, Lease-Aufschub und UI-Aktionen prüfen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/services/hls_media.py
    note: Generationsgebundener HLS-Zustand und UI implementiert; produktionsnahe Lease-/Reimport-Prüfung
      ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:47.767791Z'
- id: quarantine_lifecycle
  category: data_integrity
  title: Quarantäne ist mit Import-Ledger, Ursache und Lebenszyklus nachvollziehbar verbunden
  acceptance:
  - Jede Quarantänedatei besitzt eine stabile Korrelation zum Upload-Job oder einen ausdrücklich als verwaist
    gekennzeichneten Zustand; Dateisystemscan und Datenbank-Ledger werden auf Abweichungen geprüft.
  - Quarantänegrund, Zeitpunkt, Medienart, Größe, Reviewstatus und zulässiger nächster Schritt sind für
    berechtigte Bediener sichtbar, ohne absolute Pfade oder sensible Rohdetails offenzulegen.
  - Freigabe, sicherer Neuimport, Aufbewahrung und Löschung folgen einer expliziten Review-Entscheidung;
    es gibt keine automatische Löschung der einzigen gültigen Quelle.
  required: true
  verification:
    kind: manual
    instructions: Beschädigten Import, verwaiste Quarantänedatei, freigegebenen Neuimport und genehmigten
      Reap end-to-end gegen Ledger, API, UI und Dateisystem prüfen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/services/hub/quarantine.py
    note: Ledger-Korrelation und center-spezifische read-only Anzeige implementiert; vollständige Review-/Reap-Übung
      ausstehend.
    assessed_by: Codex
    assessed_at: '2026-07-21T08:29:48.677451Z'
- id: backend_contract_tests
  category: testing
  title: Backend-Vertrag und Quarantänegrenze sind automatisiert getestet
  acceptance:
  - Tests decken alle Importzustände, transiente Wiederholungsmetadaten, terminale Fehler, LOST, HLS-Materialisierungszustände,
    sichere Fehlerdarstellung und Cleanup-Zustände ab.
  - Quarantänetests decken fehlende Verzeichnisse, unlesbare Einträge, Symlinks, Limits, Pfadbereinigung,
    Ledger-Korrelation und sichere Lebenszyklusaktionen ab.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/views/anonymization/test_anonymization_overview.py
    - tests/services/test_ingest_idempotency_quarantine.py
    - tests/services/test_hls_media.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/views/anonymization/test_anonymization_overview.py
        tests/services/test_ingest_idempotency_quarantine.py tests/services/test_hls_media.py -q
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-21T08:34:58.641925Z'
- id: frontend_state_tests
  category: testing
  title: Frontend-Darstellung und erlaubte Aktionen sind automatisiert getestet
  acceptance:
  - Komponententests decken wartende, laufende, transient fehlgeschlagene, dauerhaft fehlgeschlagene,
    verlorene, duplizierte, erfolgreiche und quarantänisierte Importe sowie queued, materializing, ready
    und failed für Raw- und Processed-HLS ab.
  - Tests sichern verständliche Texte, keine rohen Fehlerdetails, zustandsabhängige Aktionen, schreibgeschützte
