- id: security_controls
  category: security
  title: Klinische Identität und Provenienz werden nicht durch lose Payloads umgangen
  acceptance:
  - Center- und Untersuchungsbezug werden serverseitig geprüft.
  - Patientenbefunde werden nur authentifiziert und innerhalb des eigenen Center-Scopes gelistet.
  - Erstellen, Ändern, Klassifizieren, Reaktivieren und Deaktivieren von Patientenbefunden erfordern Authentifizierung
    und Center-Scope; fremde Ressourcen liefern 404.
  - Jede Deaktivierung erhält einen authentifizierten Akteur und einen serverseitigen Zeitstempel.
  - Persistierte JSON-Daten werden am Modellrand validiert.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - env
    - PYTHONPATH=/home/admin/lx-data-models
    - .devenv/state/venv/bin/pytest
    - tests/api/test_dtypes_record_persistence.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
