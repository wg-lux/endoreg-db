  acceptance:
  - Die Identität besteht aus knowledge_base_module und knowledge_base_version und wird durch den unveränderlichen
    KnowledgeBaseIdentity-Vertrag validiert.
  - Verfügbare Identitäten und Versionen stammen aus lx_dtypes; endoreg_db und lx-annotate erfinden keine
    konkurrierenden Identitätsfelder oder Resolverregeln.
  required: true
  verification:
    kind: command
    command:
    - bash
    - -lc
    - cd /home/admin/lx-data-models && uv run pytest -q lx_dtypes/models/contracts/tests/test_knowledge_base.py
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: bash -lc 'cd /home/admin/lx-data-models && uv run pytest -q lx_dtypes/models/contracts/tests/test_knowledge_base.py'
      note: Exit-Code 0
    note: Canonical identity contract and resolver ownership reviewed; declared verifier passed (5 tests).
    assessed_by: codex-frontend-kb-resolution
    assessed_at: '2026-08-20T08:31:28.901844Z'
