      Dateien fehlerfrei.
    assessed_by: codex-contract-coverage-20260813
    assessed_at: '2026-08-13T10:52:27.713623Z'
- id: record_consistency
  category: data_integrity
  title: Persistierter LXDM-Datensatz folgt allen klinischen Änderungen
  acceptance:
  - Erstellen, Ändern und Löschen abhängiger Befunde aktualisiert den Datensatz idempotent.
  - Soft-Delete und Aktualisierung des persistierten LXDM-Datensatzes erfolgen atomar.
  - Fremde Untersuchungsdatensätze werden abgelehnt.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - env
    - PYTHONPATH=/home/admin/lx-data-models
    - .devenv/state/venv/bin/pytest
    - tests/api/test_dtypes_record_persistence.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-data-models .devenv/state/venv/bin/pytest
