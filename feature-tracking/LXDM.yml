schema_version: '1.0'
id: lxdm
name: LX-Datenmodell-Integration
description: Strikt typisierte Integration von lx_dtypes als klinischer Wissens- und Austauschvertrag.
  lx_dtypes definiert auflösbare Wissensbasis-Identitäten, das Frontend wählt sie explizit und endoreg_db
  validiert und persistiert die Auswahl ohne aktive oder voreingestellte Identitäten still einzusetzen.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/dtypes_lookup_module_entrypoint.md
  disposition: reference
  note: Beschreibt den aktuellen Lookup- und Host-Modul-Vertrag.
- path: docs/lxdm_contract_usage_audit.md
  disposition: reference
  note: Prüfspezifikation für Inventar, Nutzungsklassifikation und priorisierte Einführung der lx_dtypes-Contracts;
    der Status wird ausschließlich im Kriterium contract_usage_audit geführt.
- path: docs/lxdm_contract_inventory.md
  disposition: reference
  note: Reproduzierbares vollständiges Modul-, Export-, Invarianten-, Test- und Consumer-Inventar.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Ownership zwischen Django, lx_dtypes und Knowledge Base ist eindeutig
  acceptance:
  - Für jedes persistierte oder exportierte Feld ist die zuständige Quelle festgelegt.
  - Versions- und Kompatibilitätsgrenzen sind dokumentiert.
  - lx_dtypes besitzt die Identitätssemantik, lx-annotate die Benutzerauswahl und endoreg_db die dauerhafte
    Bindung an PatientExamination sowie die serverseitige Validierung.
  required: true
  verification:
    kind: manual
    instructions: Feldownership und Versionsvertrag gegen Host-Modelle und Service prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/dtypes_lookup_module_entrypoint.md
    note: Die bisherige Dokumentation belegt die allgemeine Contract-Grenze. Der neue frontend-eigene
      Auswahl- und Persistenzvertrag muss nach Abschluss der Migration ergänzt und erneut geprüft werden.
    assessed_by: codex-frontend-kb-resolution
    assessed_at: '2026-08-20T11:30:00Z'
- id: contract_usage_audit
  category: requirements
  title: LXDM-Contract-Nutzung ist vollständig inventarisiert und priorisiert
  acceptance:
  - Jedes öffentliche Nicht-Test-Modul unter /home/admin/lx-data-models/lx_dtypes/models/contracts ist
    mit exportierten Typen, Invarianten und vorhandenen Contract-Tests erfasst.
  - Statische und dynamische Consumer in endoreg-db sind je API-, Persistenz-, Job-, Import-/Export-,
    Authentifizierungs- oder Mediengrenze nachvollziehbar zugeordnet.
  - Parallele lokale Schemata, untypisierte Dictionaries und fehlende Boundary-Validierung sind mit Risiko
    und Ownership klassifiziert.
  - Verbesserungsvorschläge sind in kleine priorisierte Migrationskohorten mit Zielcontract, betroffenen
    Dateien und überprüfbaren Pyright- und Testnachweisen gegliedert.
  - Contract-Änderungen und Endoreg-Adoption werden getrennt bewertet; öffentliche oder persistierte Verträge
    erhalten eine Versions- und Kompatibilitätsstrategie.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - feature-tracking/audit_lxdm_contracts.py
    timeout_seconds: 1800
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/lxdm_contract_inventory.md
    - kind: command
      reference: feature-tracking/audit_lxdm_contracts.py
    note: Alle 111 Contract-Module reproduzierbar inventarisiert; Consumer, Invarianten, Tests, Risiken
      und priorisierte Kohorten dokumentiert.
    assessed_by: Codex
    assessed_at: '2026-07-20T14:26:25.596650Z'
