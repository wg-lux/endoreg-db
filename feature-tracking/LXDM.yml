- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/dtypes_lookup_module_entrypoint.md
  disposition: reference
  note: Beschreibt den aktuellen Lookup- und Host-Modul-Vertrag.
- path: docs/lxdm_contract_usage_audit.md
  disposition: reference
  note: Prüfspezifikation für Inventar, Nutzungsklassifikation und priorisierte Einführung der lx_dtypes-Contracts;
    der Status wird ausschließlich im Kriterium contract_usage_audit geführt.
- path: docs/lxdm_contract_inventory.md
  disposition: reference
  note: Reproduzierbares vollständiges Modul-, Export-, Invarianten-, Test- und Consumer-Inventar.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Ownership zwischen Django, lx_dtypes und Knowledge Base ist eindeutig
  acceptance:
  - Für jedes persistierte oder exportierte Feld ist die zuständige Quelle festgelegt.
  - Versions- und Kompatibilitätsgrenzen sind dokumentiert.
  required: true
  verification:
    kind: manual
    instructions: Feldownership und Versionsvertrag gegen Host-Modelle und Service prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/dtypes_lookup_module_entrypoint.md
    note: Feldownership und Kompatibilitätsgrenze 0.2.1/<0.3 gegen Host-Service und Modelle dokumentiert.
    assessed_by: Codex
    assessed_at: '2026-07-20T14:26:24.820980Z'
- id: contract_usage_audit
  category: requirements
  title: LXDM-Contract-Nutzung ist vollständig inventarisiert und priorisiert
  acceptance:
  - Jedes öffentliche Nicht-Test-Modul unter /home/admin/lx-data-models/lx_dtypes/models/contracts ist
    mit exportierten Typen, Invarianten und vorhandenen Contract-Tests erfasst.
  - Statische und dynamische Consumer in endoreg-db sind je API-, Persistenz-, Job-, Import-/Export-,
    Authentifizierungs- oder Mediengrenze nachvollziehbar zugeordnet.
  - Parallele lokale Schemata, untypisierte Dictionaries und fehlende Boundary-Validierung sind mit Risiko
    und Ownership klassifiziert.
  - Verbesserungsvorschläge sind in kleine priorisierte Migrationskohorten mit Zielcontract, betroffenen
    Dateien und überprüfbaren Pyright- und Testnachweisen gegliedert.
  - Contract-Änderungen und Endoreg-Adoption werden getrennt bewertet; öffentliche oder persistierte Verträge
    erhalten eine Versions- und Kompatibilitätsstrategie.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - feature-tracking/audit_lxdm_contracts.py
    timeout_seconds: 1800
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/lxdm_contract_inventory.md
    - kind: command
      reference: feature-tracking/audit_lxdm_contracts.py
    note: Alle 111 Contract-Module reproduzierbar inventarisiert; Consumer, Invarianten, Tests, Risiken
      und priorisierte Kohorten dokumentiert.
    assessed_by: Codex
    assessed_at: '2026-07-20T14:26:25.596650Z'
- id: typed_boundary
  category: functionality
  title: Externe und persistierte Daten werden einmalig strikt validiert
  acceptance:
  - API-Daten werden am Rand in lx_dtypes-Verträge überführt.
  - Interne Workflows verwenden keine parallelen untypisierten Payloadformen.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - env
    - PYTHONPATH=/home/admin/lx-data-models
    - .devenv/state/venv/bin/pytest
    - tests/api/test_dtypes_record_persistence.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-data-models .devenv/state/venv/bin/pytest
        tests/api/test_dtypes_record_persistence.py -q
      note: Exit-Code 0
    - kind: code
      reference: endoreg_db/schemas/persisted_json.py:validate_dtypes_p_examination_payload
    - kind: test
      reference: tests/schemas/test_dtypes_record_persistence_boundary.py
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-data-models .devenv/state/venv/bin/pytest
        tests/schemas/test_dtypes_record_persistence_boundary.py tests/api/test_dtypes_record_persistence.py::test_base_api_persists_full_dtypes_record
        tests/api/test_dtypes_record_persistence.py::test_base_api_rejects_unknown_nested_dtypes_record_fields
        tests/api/test_dtypes_record_persistence.py::test_report_submission_api_returns_and_retrieves_persisted_dtypes_record
        -q
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pyright endoreg_db/schemas/persisted_json.py
        tests/schemas/test_dtypes_record_persistence_boundary.py
    - kind: code
      reference: endoreg_db/services/dtypes_records.py
    - kind: code
      reference: /home/admin/lx-data-models/lx_dtypes/django/api/findings_routes.py
    - kind: test
      reference: tests/services/test_dtypes_records.py
    - kind: test
      reference: /home/admin/lx-data-models/lx_dtypes/django/api/tests/test_report_template_validate_from_ledger_api.py
    - kind: command
      reference: 'Endoreg focused persistence/report lane: 75 passed'
    - kind: command
      reference: 'lx_dtypes host-ledger builder: 4 passed'
    note: Der Host schreibt widersprüchliche nested patient_examination-Referenzen nicht mehr still um.
      Der gemeinsame DtypesRecordPersistencePayload lehnt Befund- und Indikationskonflikte vor Mutation
