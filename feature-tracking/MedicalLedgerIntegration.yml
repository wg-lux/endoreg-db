- id: database_integrity
  category: data_integrity
  title: Datenbankconstraints schützen medizinische Invarianten auch außerhalb der API
  acceptance:
  - Constraints verhindern unmögliche Zeiträume, leere Pflichtreferenzen und bekannte Duplikate auch bei
    Admin-, Import- oder direkter ORM-Nutzung.
  - PatientLabValue.patient und PatientLabValue.sample.patient können nicht widersprüchlich sein; Plan
    und enthaltene Medikationen können nicht verschiedenen Patienten gehören.
  - Löschregeln für Patient, Terminologie, Einheit, Probe, Laborwert, Medikation und Plan sind explizit
    und verhindern verwaiste oder historisch verfälschte Datensätze.
  - Fachlich benötigte Eindeutigkeit wird durch Constraints oder einen dokumentierten, nebenläufigkeitssicheren
    Idempotenzschlüssel erzwungen.
  - Constraint-Verletzungen werden am Service-Rand in stabile API-Konflikte übersetzt, ohne rohe Datenbankfehler
    oder sensible Werte zurückzugeben.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/models/medical/test_medical_ledger_constraints.py
    - -q
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: transactional_idempotency
  category: functionality
  title: Wiederholte und parallele Requests erzeugen keine Teilgraphen oder Duplikate
  acceptance:
  - Der Create-Vertrag definiert einen Idempotency-Key oder eine gleichwertige stabile externe Identität
    pro Top-Level-Request und medizinischem Kinddatensatz.
  - Eine identische Wiederholung liefert denselben gespeicherten Graphen; dieselbe Idempotenzidentität
    mit abweichendem Payload liefert einen expliziten Konflikt.
  - Parallele identische Requests erzeugen höchstens einen fachlichen Datensatz und verlieren keine Many-to-Many-Relation.
  - Failure-Injection nach jedem Persistenzschritt belegt den vollständigen Rollback einschließlich Join-Tabellen
    und Idempotenzstatus.
  - Locking-, Isolation- und Retry-Verhalten ist benannt, begrenzt und erzeugt keine stille Teilakzeptanz.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - env
    - ENDOREG_TEST_RUN_NAMESPACE=medical-ledger-idempotency
    - PYTHONPATH=/home/admin/lx-data-models
    - .devenv/state/venv/bin/pytest
    - tests/services/test_medical_ledger_transactions.py
    - tests/api/test_medical_ledger_create.py
    - -q
    timeout_seconds: 1200
