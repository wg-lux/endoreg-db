- id: host_persistence_mapping
  category: functionality
  title: Ein expliziter Host-Service persistiert jeden Ledger-Typ verlustfrei
  acceptance:
  - Das konfigurierte lx_dtypes-Host-Modul stellt ausschließlich explizit freigegebene medizinische Modelle
    und Service-Funktionen bereit; lx_dtypes importiert endoreg_db weder direkt noch über versteckte Django-Abhängigkeiten.
  - Ein dedizierter endoreg_db-Service bildet validierte Ledger-Payloads auf die sechs patientenbezogenen
    Django-Modelle und ihre Many-to-Many-Relationen ab.
  - Patienten-, Terminologie-, Einheiten-, Proben- und Planreferenzen werden vor dem Schreiben aufgelöst;
    fehlende, mehrdeutige oder typfremde Referenzen schlagen laut fehl.
  - Datenbankgenerierte IDs und Zeitstempel werden in eine vollständig validierte PatientMedicalLedger-Antwort
    zurückgeführt und nicht aus dem Request vorgetäuscht.
  - Es existieren keine zweite JSON-Schattenpersistenz und keine duplizierten Django-Medizinmodelle in
    lx_dtypes; kanonisch bleiben die normalisierten endoreg_db-Tabellen.
  required: true
  verification:
