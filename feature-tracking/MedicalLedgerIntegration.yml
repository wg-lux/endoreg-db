schema_version: '1.0'
id: medical_ledger_integration
name: Medizinische Ledger-Integration
description: Integriert die strikt validierten medizinischen Ledger-Modelle aus lx_dtypes mit endoreg_db,
  sodass patientenbezogene Erkrankungen, Ereignisse, Laborproben, Laborwerte, Medikationen und Medikationspläne
  über einen authentifizierten API-Vertrag atomar erstellt, dauerhaft gespeichert und verlustfrei wieder
  als Ledger-Datensätze gelesen werden können.
owners:
- endoreg_db maintainers
- lx_dtypes maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/medical_ledger_contract.md
  disposition: reference
  note: Feldinventar, Ownership-, Zeit-, Relations-, Create- und Snapshot-Grenzen.
- path: docs/model_layer_map_for_agents.md
  disposition: reference
  note: Definiert die Ownership-Grenze zwischen Django-Persistenz, Service-Layer und strikt typisierten
    lx_dtypes-Verträgen.
- path: /home/admin/lx-data-models/docs/guides/django-host-integration.md
  disposition: reference
  note: Beschreibt Ledger-Modelle, EndoReg-Adapter und den vorgesehenen Django-Host-Integrationspfad.
definition_of_done:
- id: sap_ish_structured_clinical_import
  category: interoperability
  title: SAP-IS-H-Tabellen werden mit stabiler Identität in kanonische Medizinmodelle überführt
  acceptance:
  - PatientNr wird center- und quellsystembezogen auf genau einen PatientExternalID und kanonischen Patienten
    aufgelöst; mehrere Dokumente desselben Patienten erzeugen keine getrennten Pseudopatienten.
  - FallNr erzeugt eine deterministische, idempotente Case-Zuordnung und verknüpft erreichbare PatientExaminations
    sowie fallbezogene Laborproben und Laborwerte.
  - Diagnosen, Laborwerte und Meona-Medikationen werden atomar in PatientDisease, PatientLabSample/PatientLabValue
    und PatientMedication persistiert und bei Wiederholung nicht dupliziert.
  - Importierte Terminologie ist mit dem Präfix sap_ish source-namespaced; unbekannte Semantik wird nicht
    still einer vorhandenen Knowledge-Base-Terminologie gleichgesetzt.
  - Meona-Zeilen ohne FallNr bleiben nachweislich patientenbezogen und werden keinem Fall oder Medikationsplan
    geraten zugeordnet.
  - Das Ergebnis meldet erzeugte, wiederverwendete und übersprungene Datensätze ohne PatientNr, Freitext,
    Laborwerte oder Dosierungen in Logs oder Tracker-Evidenz offenzulegen.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - env
    - PYTHONPATH=/home/admin/lx-data-models
    - .devenv/state/venv/bin/pytest
    - tests/services/test_sap_ish_clinical.py
    - tests/services/test_sap_ish_import.py
    - tests/services/test_watcher_storage_import.py
    - tests/management/commands/test_import_sap_ish_txt.py
    - -q
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-data-models .devenv/state/venv/bin/pytest
        tests/services/test_sap_ish_clinical.py tests/services/test_sap_ish_import.py tests/services/test_watcher_storage_import.py
        tests/management/commands/test_import_sap_ish_txt.py -q
      note: Exit-Code 0
    note: Center-scoped PatientNr reconciliation, deterministic FallNr cases, atomic namespaced diagnosis/lab/medication
      persistence, stable Meona row replay, and patient-level handling are implemented; verifier passed
      32 tests.
    assessed_by: Codex
    assessed_at: '2026-07-29T12:48:11.222165Z'
- id: documented_scope
  category: requirements
  title: Medizinischer Ledger-Umfang und Ownership sind vollständig festgelegt
  acceptance:
  - Das Feldinventar ordnet PatientDisease, PatientEvent, PatientLabSample, PatientLabValue, PatientMedication,
    PatientMedicationSchedule und PatientMedicalLedger jeweils einem lx_dtypes-Vertrag und einem endoreg_db-Modell
    zu.
  - Für jedes Feld sind Typ, Pflichtstatus, Kardinalität, Fremdschlüsselrichtung, Löschverhalten, Zeitsemantik,
    Provenienz und API-Repräsentation eindeutig beschrieben.
  - lx_dtypes besitzt Validierungs-, Serialisierungs- und Austauschverträge; endoreg_db besitzt Django-Modelle,
    Transaktionen, Berechtigungen und Datenbankmigrationen; Orchestrierung liegt im Service- beziehungsweise
    API-Layer und nicht in den Modellen.
  - Es ist ausdrücklich entschieden, ob der API-Vertrag nur Datensätze für einen vorhandenen Patienten
    erstellt oder auch Patientendemografie anlegen darf; eine implizite Patientenanlage ist ausgeschlossen.
  - Untersuchungs- und fallbezogene Daten aus dem bestehenden Ledger und patientenbezogene medizinische
    Daten haben dokumentierte Referenz- und Snapshot-Grenzen ohne widersprüchliche Ownership.
  required: true
  verification:
    kind: manual
    instructions: Feldinventar gegen lx_dtypes Ledger-Klassen, EndoReg-Django-Modelle, Services, Serializer,
      API-Routen, CasePersistence und LXDM-Tracker prüfen.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/medical_ledger_contract.md
    note: The field inventory documents all seven ledger types, ownership, cardinality, FK/deletion behavior,
      time semantics, provenance, API representation, existing-patient-only creation, and Case/PatientExamination
      reference boundaries.
    assessed_by: Codex
    assessed_at: '2026-07-29T13:14:10.294119Z'
- id: versioned_ledger_contract
  category: interoperability
  title: Der medizinische Ledger-Vertrag ist öffentlich, versioniert und kompatibel
  acceptance:
  - Alle sieben medizinischen Ledger-Typen sind über stabile lx_dtypes-Imports und die zentrale Ledger-Registry
    verfügbar und erzeugen ein dokumentiertes JSON-Schema.
  - Externe IDs und Ledger-UUIDs werden aus unveränderlichen EndoReg-Identitäten deterministisch gebildet;
    Umbenennungen von Python-Klassen oder Terminologie-Labels verändern bestehende Identitäten nicht.
  - Jeder persistierte Datensatz trägt die für Reproduktion erforderliche Schema-, lx_dtypes- und Knowledge-Base-Version
    oder verweist eindeutig darauf.
  - Additive, inkompatible und veraltete Felder besitzen eine Release-, Upgrade- und Deprecation-Regel;
    endoreg_db pinnt eine veröffentlichte kompatible lx-dtypes-Version.
  - Snake-Case-Wireformat, Datums- und Zeitzonenformat, Dezimal-/Gleitkommasemantik, Nullwerte und verschachtelte
    Ledger-Referenzen sind für Python- und Nicht-Python- Consumer eindeutig.
