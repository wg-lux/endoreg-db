- id: strict_clinical_validation
  category: functionality
  title: Ungültige medizinische Datensätze werden vor jeder Datenbankmutation abgelehnt
  acceptance:
  - API-JSON wird genau einmal am Request-Rand mit den öffentlichen medizinischen lx_dtypes-Modellen validiert;
    Services erhalten keine parallele untypisierte Dictionary-Form.
  - Erkrankungs- und Ereigniszeiträume lehnen ein Ende vor dem Beginn ab; alle Datetimes sind zeitzonenbewusst
    und werden ohne stillen Zeitzonen-Fallback verarbeitet.
  - Ein Laborwert besitzt gemäß dokumentierter Fachregel einen numerischen oder textuellen Wert, eine
    gültige Einheit und einen konsistenten Normalbereich; NaN, Infinity und widersprüchliche Werteformen
    werden abgelehnt.
  - Dosierung, Einheit, Einnahmezeiten und Aktivstatus einer Medikation erfüllen explizite fachliche Invarianten;
    unbekannte JSON-Strukturen und zusätzliche Felder werden nicht still übernommen.
  - Jeder verschachtelte Datensatz gehört zum Top-Level-Patienten; fremde Patienten in Laborproben, Laborwerten,
    Medikationen oder Plänen werden vor dem Schreiben abgelehnt.
  - Terminologie- und Relationsreferenzen werden serverseitig auf Existenz, erwarteten Typ und zulässige
    Kombination geprüft statt frei als Namen oder Primärschlüssel gespeichert zu werden.
  required: true
  verification:
    kind: command
    command:
    - env
    - PYTHONPATH=/home/admin/lx-data-models
    - .devenv/state/venv/bin/pytest
    - /home/admin/lx-data-models/lx_dtypes/models/ledger/medical/tests
