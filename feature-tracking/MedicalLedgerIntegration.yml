- id: roundtrip_fidelity
  category: data_integrity
  title: Persistenz- und API-Roundtrip erhalten den vollständigen medizinischen Graphen
  acceptance:
  - Jeder einzelne medizinische Ledger-Typ sowie ein vollständiger PatientMedicalLedger überstehen Create,
    Datenbank-Reload, Service-Export und JSON-Revalidierung ohne Feld-, Präzisions-, Relations- oder Zeitzonenverlust.
  - Direkte Laborwerte und in Proben enthaltene Werte sowie direkte Medikationen und in Plänen enthaltene
    Medikationen werden ohne Duplikate und mit stabiler Identität repräsentiert.
  - Leere optionale Relationen, Nullwerte, Unicode-Texte, Grenzwerte, mehrere Klassifikationen und mehrere
    Einnahmezeiten sind roundtrip-getestet.
  - Änderungen an Terminologie-Labels beeinflussen weder gespeicherte Referenzen noch Ledger-UUIDs; gelöschte
    oder deaktivierte Terminologie wird explizit als historisch auflösbar oder als Integritätsfehler behandelt.
  - Ein PatientMedicalLedger kann nach Prozessneustart allein aus kanonischer Datenbankpersistenz wiederhergestellt
    werden; In-Memory-Objekte sind keine Quelle.
  required: true
  verification:
    kind: command
    command:
