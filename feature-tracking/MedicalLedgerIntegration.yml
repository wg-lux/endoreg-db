    status: not_assessed
    evidence: []
- id: operational_readiness
  category: operations
  title: Release, Backfill, Rollback und Störungsbehebung sind produktionsfähig
  acceptance:
  - Das Runbook beschreibt Release-Reihenfolge für lx-dtypes-Paket, EndoReg-Migration, Backfill, API-Aktivierung
    und Consumer-Rollout einschließlich harter Stop-Gates.
  - Feature-Flag oder vergleichbare Aktivierung ist standardmäßig geschlossen, bis Paketpin, Migration,
    Berechtigungen, Backup und Integritätsprüfung erfolgreich sind.
  - Rollback deaktiviert neue Writes sicher, ohne bereits bestätigte Datensätze, Join-Relationen oder
    Ledger-Identitäten zu verlieren.
  - Kapazitäts- und Lasttests belegen begrenzte Requestgröße, Batchgröße, Queryanzahl, Sperrdauer und
    Laufzeit für Patienten mit großen medizinischen Historien.
  - Eine Staging-Probe demonstriert authentifiziertes Create, Datenbank-Roundtrip, Prozessneustart, Reconciliation,
    Backup und Restore mit repräsentativen Daten.
  required: true
  verification:
    kind: manual
    instructions: Release-, Rollback-, Last-, Reconciliation-, Backup- und Restore-Probe anhand des freigegebenen
      Runbooks durchführen und Review-Evidenz erfassen.
    timeout_seconds: 1800
  assessment:
    status: not_assessed
    evidence: []
