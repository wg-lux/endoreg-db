- id: migrations_and_existing_data
  category: interoperability
  title: Bestehende medizinische Daten werden kompatibel übernommen und geprüft
  acceptance:
  - Schemaänderungen besitzen vorwärts und rückwärts geprüfte Django-Migrationen, ohne bestehende medizinische
    Zeilen oder Relations-Tabellen still zu verwerfen.
  - Ein idempotenter, wiederaufnehmbarer Backfill erzeugt fehlende stabile Ledger- Identitäten und Versionsmetadaten
    in begrenzten Batches.
  - Vor dem Backfill werden ungültige Zeiträume, patientenfremde Relationen, unauflösbare Terminologie
    und Duplikate gezählt und quarantänisiert statt automatisch umgedeutet.
  - Backup, Restore, Dry-Run, Abbruch und Rollback sind mit einem repräsentativen Datenbestand geprobt
    und produzieren einen nachvollziehbaren Integritätsbericht.
  - Das Deployment erzwingt eine kompatible veröffentlichte lx-dtypes-Version, bevor API- oder Backfill-Code
    aktiviert wird.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/migrations/test_medical_ledger_integration.py
    - -q
    timeout_seconds: 1200
  assessment:
    status: not_assessed
    evidence: []
- id: authorization_privacy_audit
  category: security
  title: Patientenzugriff, Mandantengrenzen und Audit sind fail-closed
  acceptance:
  - Lesen und Erstellen erfordern einen authentifizierten Akteur mit serverseitig geprüftem Center- und
    Patienten-Scope; Request-Felder können den Scope nicht erweitern.
  - Fehlende, unbekannte oder widersprüchliche Center-Zuordnung verweigert den Zugriff; fremde Patienten
    und ihre Terminologiebezüge werden über 404 nicht aufgezählt.
  - Bulk- und Nested-Create prüfen jede enthaltene Ressource und verwenden keine Berechtigung des ersten
    Listenelements als Freigabe für den Rest.
  - Audit-Ereignisse erfassen Akteur, Zeitpunkt, Patient, Operation, Idempotenzidentität, Ergebnis und
    geänderte Datensatz-IDs ohne Freitext, Dosierung, Laborwert oder andere sensible Payloadinhalte zu
    protokollieren.
  - Persistierte medizinische Daten, Backfills, Dumps und Fehlerartefakte bleiben in den freigegebenen
