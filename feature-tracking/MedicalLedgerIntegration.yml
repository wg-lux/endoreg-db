- id: validated_create_api
  category: functionality
  title: Die API erstellt validierte patientenbezogene medizinische Datensätze atomar
  acceptance:
  - Eine versionierte, dokumentierte Route nimmt PatientMedicalLedger als atomaren Aggregate-Request an;
    unterstützte Einzel-Create-Routen verwenden dieselben lx_dtypes-Modelle und denselben Persistenzservice.
  - Erfolgreiche Erstellung liefert HTTP 201 mit kanonischen IDs, Ledger-UUIDs, Zeitstempeln, Versionen
    und dem vollständig validierten gespeicherten Datensatz.
  - Schemafehler liefern HTTP 422, fachliche oder Referenzkonflikte HTTP 409 und nicht sichtbare Ressourcen
    HTTP 404 in einem stabilen strukturierten Fehlerformat; interne IDs oder fremde Patientendaten werden
    nicht offengelegt.
  - Ein Fehler in einem Kinddatensatz rollt PatientDisease, PatientEvent, PatientLabSample, PatientLabValue,
    PatientMedication, Plan und alle Many-to-Many-Änderungen gemeinsam zurück.
  - Fehlende Listen bedeuten gemäß Vertrag leer oder unverändert und können nicht versehentlich vorhandene
    Daten löschen; Create-, Replace- und Merge-Semantik sind getrennt benannt.
  - Die Route ist über den vorgesehenen lx_dtypes-Mount erreichbar, erscheint im OpenAPI-Schema und besitzt
    keinen abweichenden Legacy-Serializerpfad.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/api/test_medical_ledger_create.py
    - -q
    timeout_seconds: 1200
