- id: observability_and_reconciliation
  category: observability
  title: Medizinische Ledger-Fehler und Persistenzabweichungen sind messbar und reparierbar
  acceptance:
  - Strukturierte Metriken unterscheiden Validierungsfehler, Autorisierungsablehnungen, Referenzkonflikte,
    Datenbankkonflikte, Rollbacks und erfolgreiche Erstellungen ohne sensible klinische Werte als Labels.
  - Logs besitzen Korrelations-, Request- und Idempotenzidentität, aber keine vollständigen medizinischen
    Payloads oder direkt identifizierende Patientendaten.
  - Ein read-only Reconciliation-Kommando vergleicht normalisierte EndoReg-Daten mit erneut validierten
    Ledger-Exports und meldet fehlende, fremdpatientige, duplizierte oder nicht serialisierbare Datensätze.
  - Reconciliation verändert Daten niemals implizit; Reparatur benötigt einen getrennten, auditierten
    und wiederaufnehmbaren Workflow.
  - Alarmgrenzen und verantwortliche Reaktion für anhaltende Fehler-, Quarantäne- und Reconciliation-Abweichungen
    sind im Runbook festgelegt.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/management/commands/test_reconcile_medical_ledger.py
    - -q
    timeout_seconds: 900
