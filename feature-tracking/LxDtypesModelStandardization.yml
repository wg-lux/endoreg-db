schema_version: '1.0'
# AGENT-MANAGER-NOTIZ (2026-07-31): Vor der naechsten Status- oder Evidenzaenderung
# alle als `command` klassifizierten Referenzen mit Platzhaltern wie `<... matrix>`
# durch die exakten, im Vordergrund ausfuehrbaren Befehle und Testpfade ersetzen.
# Eine Testanzahl mit Sammelbezeichnung ist keine stabile, reproduzierbare Evidenz;
# betroffene `verified`-Bewertungen erst nach nachvollziehbarer Evidenz bestaetigen.
id: lx_dtypes_model_standardization
name: lx-dtypes-Modellstandardisierung
description: 'Repositoryweite Standardisierung der endoreg_db-Django-Modelle durch eindeutig verantwortete,
  zentral validierte lx_dtypes-Verträge und lokale Persistenzgrenzen. Nicht jedes Django-Modell wird zu
  einem lx_dtypes-Modell: Gemeinsam genutzte klinische und interoperable Datenformen gehören nach lx_dtypes,
  während endoreg_db-spezifische Datenbankconstraints und Zustandsübergänge im Persistenzmodell verbleiben.'
owners:
- endoreg_db maintainers
- lx_dtypes maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/model_layer_map_for_agents.md
  disposition: reference
  note: Definiert Ownership, Modell-/Servicegrenzen und die Cross-Layer-Checkliste für Feldänderungen.
- path: docs/lxdm_contract_inventory.md
  disposition: reference
  note: Dokumentiert den bestehenden lx_dtypes-Contract-Bestand und bekannte endoreg_db-Consumer als Ausgangspunkt
    der Modellstandardisierung.
- path: docs/pydantic_django_hardening_plan.md
  disposition: reference
  note: Liefert Architekturkontext zu Pydantic-, Django- und Mehrfachvererbungsrisiken; der verbindliche
    Status wird nur hier geführt.
definition_of_done:
- id: complete_model_inventory
  category: requirements
  title: Alle endoreg_db-Modelle und ihre Datengrenzen sind vollständig klassifiziert
  acceptance:
  - Ein reproduzierbares Inventar erfasst jedes konkrete und Proxy-Modell über die Django-App-Registry
    sowie jedes abstrakte Modell durch statische Quelldatei-Erkennung mit Modul, App-Label soweit anwendbar,
    Basisklasse und Persistenzstatus.
  - Für jedes Modell sind API-, Import-, Export-, YAML-/JSON-, Job-, Service- und repositoryübergreifende
    Datengrenzen sowie persistierte JSON-Felder und dynamische Modellreferenzen erfasst.
  - 'Jedes Modell ist genau einer überprüfbaren Zielklasse zugeordnet: gemeinsamer lx_dtypes-Vertrag,
    lokales endoreg_db-Boundary-Schema, reines Persistenzmodell oder begründete zeitlich befristete Ausnahme.'
  - Das Inventar schlägt fehl, wenn ein neues Modell oder eine neue Boundary ohne Klassifikation hinzukommt.
  required: true
  verification:
    kind: manual
    instructions: Inventar gegen Django-App-Registry, endoreg_db/models, Serializer, Views, Services,
      Importer, Exporte und dynamische Stringreferenzen abgleichen und Vollständigkeitsguard ausführen.
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: quality/lx_dtypes_model_inventory.yml
    - kind: code
      reference: scripts/check_lx_dtypes_model_inventory.py
    - kind: test
      reference: tests/scripts/test_check_lx_dtypes_model_inventory.py
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/python scripts/check_lx_dtypes_model_inventory.py
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/python -m pytest tests/scripts/test_check_lx_dtypes_model_inventory.py tests/app/test_model_import_boundaries.py -q
    - kind: command
      reference: ./feature-tracking/tracker.py validate
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pyright
    note: 'Das reproduzierbare Inventar importiert alle Modell-Leaf-Module vor der Registry-Auswertung
      und deckt damit 146 registrierte sowie fünf abstrakte Modelle vollständig ab. Alle 151 Deklarationen
      besitzen genau eine konkrete Zielklasse: 53 shared_lx_dtypes_contract, 40 local_boundary_schema
      und 58 persistence_only; es bestehen keine unclassified-Einträge oder temporary_exceptions. Erfasst
      werden Modellstruktur, persistierte JSON-Felder, API-, Schema-, Service-, Import-, Export- und Job-Consumer
      sowie dynamische Modellreferenzen. Neue oder veränderte Modelle und Boundaries lassen den Guard
      fehlschlagen. Die Runtime-Metadaten wurden nach den DICOM-, Video- und Annotation-Boundary-Änderungen
      reproduzierbar aktualisiert; der Guard meldet weiterhin 146 registrierte und fünf abstrakte Modelle
      ohne Klassifikationsabweichung. Pyright, die fokussierten Integrations- und Tracker-Tests sowie der
      Repositoryscan bestanden.'
    assessed_by: codex
    assessed_at: '2026-07-31T11:42:27Z'
- id: field_and_contract_ownership
  category: interoperability
  title: Feld-, Enum- und Contract-Ownership ist für jedes Modell eindeutig
  acceptance:
  - Gemeinsam genutzte klinische, semantische und interoperable Datenformen haben genau einen kanonischen
    Owner in lx_dtypes.
  - Datenbankfelder, Constraints, Relationen und endoreg_db-spezifische Zustandsübergänge bleiben im Django-Persistenzmodell;
    Workflowlogik gehört in typisierte Services.
  - Parallele Pydantic-Modelle, TypedDicts, DataDicts, Enums und offene Dictionaries für dieselbe Datenform
    sind entfernt oder durch einen benannten, getesteten Kompatibilitätsadapter mit Ablaufbedingung verbunden.
  - Jede Feldänderung dokumentiert die betroffenen Django-, lx_dtypes-, Serializer-, Loader-, Service-,
    Persistenz- und Exportverträge sowie deren Versionsfenster.
  required: true
  verification:
    kind: manual
    instructions: Ownership-Matrix je Modellkohorte gegen Code, lx_dtypes-Exporte, Wissensbasis, Serializer
      und Persistenzschema reviewen.
    timeout_seconds: 1200
