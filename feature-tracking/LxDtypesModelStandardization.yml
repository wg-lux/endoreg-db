- id: incremental_model_cohorts
  category: maintainability
  title: Die Standardisierung erfolgt in kleinen risiko- und domänenbasierten Modellkohorten
  acceptance:
  - Jede Kohorte nennt Modelle, aktuelle und kanonische Verträge, bekannte Consumer, Datenmigrationen,
    Abhängigkeiten, Owner und messbare Abschlusskriterien.
  - Klinische Identität, medizinische Ledger, Importpfade, Reports, Video, Hub-Transfer und Konfiguration
    werden nach Risiko priorisiert, ohne unabgestimmten repositoryweiten Big-Bang-Austausch.
  - Neue Workflowlogik landet nicht in endoreg_db/models und neue lx_dtypes-Verträge importieren weder
    Django-Modelle noch endoreg_db-spezifische Services.
  - Eine Kohorte gilt erst als abgeschlossen, wenn ihr Restbestand null oder als befristete Ausnahme mit
    Owner, Begründung und Ablaufbedingung dokumentiert ist.
