    note: Elf externe Boundary-Kohorten sind typisiert. AIDataSet-Exporte verwenden AIDataSetExportRequestPayload;
      PatientExamination-Drafts verwenden PatientExaminationReportDraft Version 1.0 mit einmaliger Legacy-Normalisierung
      zu snake_case; Report-LLM-Dispatch-Payloads werden durch den zentralen ReportLlmJobConfig-Vertrag
      Version 1.0 in eine strikt JSON-kompatible interne Form überführt. Der frühere Service-lokale Doppelvertrag
      und die permissive Objekt-zu-String-Konvertierung wurden entfernt. Unbekannte Contract-Felder, fremde
      Versionen, nicht-Objekt-Payloads und nicht JSON-kompatible Werte scheitern laut. VideoFile.sequences
      wird am Persistenzpfad über den gemeinsamen VideoSegmentsPayload-Vertrag validiert. Die zusätzlichen
      AI-Training- und Hub-Payload-Adapter erzwingen jetzt ebenfalls strikt JSON-kompatible Formen. Der
      Local-Study-Server-Sidecar-Vertrag lehnt unbekannte Felder und boolesche String-Coercion am Ingest ab;
      fehlerhafte Sidecars werden vor Modellanlage quarantänisiert. Der generische Preanonymized-Sidecar-
      Vertrag ist ebenfalls geschlossen, verlangt vollständige External-ID-Paare und akzeptiert Identitätshashes
      nur als kanonische kleingeschriebene SHA-256-Digests. Parsing- und Validierungsfehler quarantänisieren
      Medium und Sidecar vor UploadJob- oder Modellanlage; nicht fertig geschriebene Dateien bleiben aufschiebbar.
      SAP-ISH erzeugt ohne Patienten-ID kein verwaistes external_id_origin. Die exakte Integrationsmatrix bestand
      mit 55 Tests und vier Negativ-Subtests. NetworkNode-Create, -Update und -Response
      verwenden einen geschlossenen snake_case-Vertrag, lehnen CamelCase/Unknown Fields sowie widersprüchliche
      owning_center_id-/owning_center_key-Identitäten ab und führen nach der Boundary kein Roh-Mapping parallel.
      Video-Temporal-Inferenz normalisiert Legacy-Optionen jetzt einmalig in CanonicalTemporalOptions;
      neue History- und Celery-Payloads führen nur temporal_options weiter, während bestehende
      raw_temporal_options-History-Einträge lesbar bleiben. Unknown Fields, NaN/Infinity, mehrdeutige
      Boolean-Werte und inkonsistente kanonische Formen scheitern laut. Weitere externe Boundaries bleiben
      offen. Die DICOM-/FHIR-Interoperabilitätskohorte validiert DICOM-Manifeste rekursiv geschlossen,
      lehnt skalare Typ-Coercion ab und bindet Export-ID, Schema-Version, Quellsystem und Digest an dieselbe
      kanonische Persistenzform. FHIR-Bundles erzwingen nun fullUrl-/Resource-ID-Konsistenz sowie den
      korrekten Zieltyp jeder internen Referenz; Dangling References und unbekannte verschachtelte Felder
      scheitern laut. Die exakte Interoperabilitätsmatrix bestand mit 35 Tests. Report-Reimport akzeptiert
      nur noch den geschlossenen ReportLlmReimportRequestPayload mit einem strikt booleschen retry-Feld;
      Body-IDs, Unknown Fields, Scalar-Coercion und nicht-objektförmige Bodies scheitern vor Dispatch und
      Jobreservierung. Der Multipart-Upload-Vertrag im lx_dtypes-Owner toleriert ausschließlich das
      Transportfeld file außerhalb seiner vier Contract-Felder. Bis eine Version neuer als lx_dtypes 0.2.9
      gepinnt ist, erzwingt endoreg_db/schemas/upload.py dieselbe Regel als benannter Kompatibilitätsadapter;
      danach kann dieser Adapter entfallen. Die fokussierten Matrizen bestanden mit 15 Report- und 21
      Endpunkt-Tests sowie 13 Shared-Contract-Tests. Frame-Annotation-Bulk-Upsert, Skip und Box-Upsert
      verwenden nun die geschlossenen Shared Mutation Envelopes. Unknown Wrapper-/Item-Felder und
      widersprüchliche äußere/innere frame_id-Werte scheitern vor DRF und ORM; dokumentierte Bare-List-
      Payloads sowie Wrapper-Vererbung für Frame, Quelle und Annotator bleiben erhalten. DRF löst danach
      nur noch Datenbanklabels und Choices aus kanonischen Item-Dumps auf. Bis eine Version neuer als
      lx_dtypes 0.2.9 gepinnt ist, backportiert endoreg_db/schemas/frame_annotation_ingress.py ausschließlich
      die neuen Strictness- und Normalisierungsregeln ohne lokales Pydantic-Doppelmodell; danach kann der
      Adapter entfallen. Die Matrix bestand mit 24 Shared-Contract- und 57 Endpunkt-/Regressions-Tests
      sowie vier Negativ-Subtests. Pyright ist in beiden Repositories fehlerfrei.
    assessed_by: Codex
    assessed_at: '2026-07-31T13:41:32Z'
- id: persisted_model_validation
  category: data_integrity
  title: Persistierte Modellzustände und JSON-Payloads besitzen eine zentrale Validierungsgrenze
  acceptance:
  - Jedes persistierte JSON-Feld wird vor jedem Schreibpfad durch ein versioniertes typisiertes Schema
    validiert und kanonisch serialisiert.
  - Django-Constraints, clean-Methoden und typisierte Zustandsübergänge sichern ausschließlich Persistenzinvarianten
    und duplizieren keine abweichende lx_dtypes-Normalisierung.
  - Direkte Manager-, Bulk-, Management-Command-, Job- und Migrationspfade können die für ihre Modellkohorte
    erforderliche Validierung nicht unbemerkt umgehen.
  - Round-Trip- und Invalid-Input-Tests beweisen, dass gespeicherte Daten vollständig validiert, versionszugeordnet
    und ohne semantischen Verlust wieder geladen werden.
  required: true
  verification:
    kind: manual
    instructions: Alle Schreibpfade und JSONFields je Kohorte inventarisieren; Constraint-, Round-Trip-,
      Bulk-/Manager- und Invalid-Input-Tests ausführen.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/models/media/pdf/report_llm_job.py
    - kind: code
      reference: endoreg_db/schemas/report_llm.py
