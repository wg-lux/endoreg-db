- id: canonical_boundary_validation
  category: functionality
  title: Externe und repositoryübergreifende Daten werden zentral durch lx_dtypes validiert
  acceptance:
  - API-, Import-, Export-, Datei-, Message- und Drittanbieter-Payloads mit gemeinsam genutzter Semantik
    werden an der besitzenden Boundary genau einmal in einen strikt typisierten lx_dtypes-Vertrag überführt.
  - Nach erfolgreicher Validierung verwenden Serializer, Views, Services, Jobs und Exporte dieselbe typisierte
    interne Form und führen weder das ursprüngliche Mapping noch eine konkurrierende Payloadform parallel.
  - Unbekannte Felder, ungültige Enumwerte, widersprüchliche Identitäten und verletzte klinische Invarianten
    werden laut und ohne stillen Fallback abgelehnt.
  - Öffentliche API-Felder bleiben snake_case; Kompatibilitätsnormalisierung findet ausschließlich in
    einem benannten Boundary-Adapter statt.
  required: true
  verification:
    kind: manual
    instructions: Repräsentative gültige und ungültige Payloads jeder Modellkohorte von der Eingangsgrenze
      bis Service, Persistenz und Ausgabe verfolgen.
    timeout_seconds: 1200
