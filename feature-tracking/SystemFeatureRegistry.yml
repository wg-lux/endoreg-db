  category: documentation
  title: Ownership, resolution, migration, recovery, and provenance are documented
  acceptance:
  - Documentation identifies package and LuxNix ownership boundaries and the immutable specification versus
    mutable state lifecycle.
  - Recovery and deployment verification instructions use semantic identities and generated Nix provenance.
