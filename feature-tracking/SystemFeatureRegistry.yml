      and bounded resolver APIs.
    assessed_by: codex-os-feature-storage
    assessed_at: '2026-08-20T11:07:48.611770Z'
- id: nixos_service_integration
  category: operations
  title: Authorized services receive hardened registry and state access
  acceptance:
  - NixOS exposes providers.json and the assessment state root through explicit environment variables.
  - The MCP service can read package roots and has only controlled state-root access with no generic shell
    tool.
  required: true
  verification:
    kind: command
    commands:
