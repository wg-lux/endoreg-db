- id: migration_and_reconstruction
  category: testing
  title: Combined trackers migrate deterministically without evidence loss
  acceptance:
  - Migration separates immutable specifications from assessment events and current work while preserving
    requirement IDs and all assessment metadata.
  - Current status reconstructs from append-only event history and remains stable when package store paths
    change.
  required: true
  verification:
    kind: command
    commands:
