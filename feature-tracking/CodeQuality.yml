  acceptance:
  - Arrange-Act-Assert-Tests decken positive, negative und unbekannte Ziel-Buckets sowie deren Priorität
    bei mehreren Annotationen desselben Frames ab.
  - Annotation-, Segment- und zusammengeführte Buckets prüfen Label-Set-Filterung, Prediction-Filterung,
    extrahierte Frames, exklusive Segmentenden und Deduplizierung.
  - Leere oder nicht anwendbare Datensätze sowie Metadaten, Sortierung, Label-Verteilung und eindeutige
    Summary-Zähler besitzen stabile Assertions.
  - Direkte Arrange-Act-Assert-Tests der Annotation-Queue decken Target-, Annotation-, Segment-, Candidate-
    und Merge-Builder einschließlich Extraktions- und Prediction-Schaltern ab.
  - Die fokussierte Testdatei erreicht 100 Prozent Statement-Coverage für den Bucket-Service.
