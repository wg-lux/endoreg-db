- id: image_content_hash_pixel_experiment
  category: testing
  title: Reproduzierbares Ein-Pixel-Experiment unterscheidet Dateiidentität und Bildähnlichkeit
  acceptance:
  - Deterministische RGB-Beispielbilder werden verlustfrei gespeichert; pro Generation ändert sich genau
    ein Pixel um eine Intensitätsstufe in einem Farbkanal, kumulativ über alle Pixel.
  - Zwei Bildgrößen und alle drei Farbkanäle werden mit dem echten get_file_hash geprüft; jede veränderte
    Generation unterscheidet sich vom Original und allen vorherigen Vorwärtsgenerationen.
  - Byteidentische Kopien stimmen überein; schrittweise Rücknahme erreicht den Originalhash erst nach
    vollständiger Wiederherstellung. Gleiche Pixel mit anderen PNG-Metadaten haben andere Dateihashes.
  - Der endliche Versuch belegt keine allgemeine Kollisionsfreiheit und definiert keinen visuellen Schwellenwert.
  - Ein reproduzierbarer Export archiviert alle tatsächlich gehashten PNG-Dateien, Einzelmesswerte, Quellcode-Snapshots,
    Softwareversionen, Testprotokoll, Prüfsummen, Tabellen und Vektorgrafiken. Die Messwertzahl und die
    archivierten Dateien werden gegen den tatsächlichen Testlauf geprüft.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - -m
    - scripts.collect_image_hash_publication
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/utils/test_image_content_hash.py -q
      note: Exit-Code 0
    - kind: test
      reference: 'tests/utils/test_image_content_hash.py: 7 passed, 1 warning in 1.12s'
    - kind: command
      reference: '.devenv/state/venv/bin/python -m scripts.collect_image_hash_publication: exit 0; 7 passed;
        1934 rows; ZIP verified'
    - kind: document
      reference: docs/image_hash_publication.md
    - kind: test
      reference: data/publication-artifacts/export/image-hash-20261016T081010Z-8094c8de/pytest.log
    note: 'Neutraler Publikationsexport gegen unveränderte Testfälle: 7 passed, 1 bestehende Plugin-Warnung
      in 1.81s. 1934 PNG-Beobachtungen, 960 Vorwärts- und 960 Rücknahmeschritte; Messwerte, zwei CSV-Tabellen,
