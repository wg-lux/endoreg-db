- id: test_suite_fixture_overhead
  category: testing
  title: Test-Fixtures vermeiden unnötige Datenbank-, Datei- und Ausgabearbeit
  acceptance:
  - Reine Namen-, Datums-, Task-Konfigurations- und Runtime-Isolationstests laufen ohne Datenbank-Fixture.
  - Die automatische Video-Anonymizer-Fixture fordert temporäre Verzeichnisse nur für betroffene Tests
    an.
  - Produkt-Testdaten werden einmal pro TestCase-Klasse geladen; jede Testmethode bleibt durch Rollback
    isoliert.
  - Test-Tasks zeigen langsame Testphasen statt zusätzlicher Start-/Endausgaben und erlauben eine explizite
    Worker-Begrenzung.
  - Fokussierte Regressionen und Typprüfung werden dokumentiert; PostgreSQL-Prozessisolation und echte
    Migrationen bleiben erhalten.
  required: true
  verification:
    kind: manual
    instructions: Pyright vor pytest ausführen. Namen-, Datums-, Task-, Runtime-Isolations-, Produkt-
      und Video-Fixture-Regressionen prüfen. Laufzeiten mit --durations=30 erfassen; Worker-Vergleiche
      nur ohne konkurrierende Tests durchführen. PYTEST_XDIST_AUTO_NUM_WORKERS begrenzt die Worker bei
      -n auto.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'devenv shell -- .devenv/state/venv/bin/pytest tests/utils/test_names.py tests/utils/test_dates.py
