        passed)
    - kind: code
      reference: AIDataSet-Modell ohne endoreg_db.services-Importe und sieben entfernte Workflow-Fassaden;
        SensitiveMetaUpdateSerializer als reine DRF-Validierungsgrenze; typisierter atomarer Service in
        endoreg_db/services/sensitive_meta_update.py; AST-Nullregeln in tests/app/test_clean_layer_cohorts.py
    - kind: command
