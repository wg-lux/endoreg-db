  title: Endoreg-db owns reusable persistence from lx-annotate
  acceptance:
  - All six remaining lx-annotate concrete models register under endoreg_db only; old Python imports resolve
    to the same classes.
  - Split snapshot validation has one owning implementation without an endoreg-db dependency on lx-annotate.
  - Fresh installation and reversible upgrade preserve primary keys, foreign keys, immutable snapshots,
    job state, constraints, content types and permission assignments.
  - Occupied target tables fail migration atomically; schema checks and existing import, streaming, transfer
    and concurrency tests pass.
  required: true
  verification:
    kind: manual
    instructions: Run Pyright, migration and model ownership tests, inventory guard, and affected lx-annotate
      consumer suites.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'Core persistence and inventory: 14 passed; scoped moved-model inventory: 1 passed; import,
        encrypted streaming, lease and report concurrency regressions: 249 passed. Logs: .devenv/state/persistence-model-tests.log,
        persistence-inventory-tests.log, persistence-integration-tests.log.'
    - kind: command
      reference: 'Full Endoreg Pyright: 0 errors, 10 existing warnings. Full LX-Annotate Pyright: 0 errors,
        0 warnings. Both makemigrations --check --dry-run: No changes detected; test-profile database
        port 1 unavailable for history checks. Focused Ruff and both git diff --check passed.'
    - kind: test
