  - Der native PDF-Renderer liefert bytes passend zum Typstub; Frame-Ergebnisse und bestehende Python-Fallback-Verträge
    bleiben erhalten.
  - Native Validierungsfehler ergeben ValueError; Dateisystemfehler behalten über die Standardkonvertierung
    ihre spezifischen Python-Ausnahmetypen. Direkte Binding-Tests prüfen Fehler, Ergebnisse und parallele
    Aufrufe.
  required: true
  verification:
