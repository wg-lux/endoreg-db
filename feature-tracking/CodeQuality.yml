schema_version: '1.0'
id: code_quality
name: Codequalität und Wartbarkeit
description: Toten Code belastbar identifizieren und entfernen, Helper- und Klassengrenzen vereinheitlichen
  sowie Exception-Behandlung zentral, typisiert und sicher gestalten.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/model_layer_map_for_agents.md
  disposition: reference
  note: Definiert bestehende Modell-, Service-, Helper- und Importgrenzen.
- path: docs/code_quality.md
  disposition: reference
  note: Definiert Dead-Code-Baseline, Ownership-, Exception- und Reviewregeln.
definition_of_done:
- id: import_function_profiling
  category: operations
  title: Large import and reimport functions support opt-in call profiling
  acceptance:
  - Profiling is disabled by default and scoped to the current execution thread.
  - Nested calls share one profile; unique artifacts contain call statistics without argument values.
  - Success and failure profiles are readable by pstats and existing command profiling remains compatible.
  required: true
  verification:
    kind: manual
    instructions: See docs/profiling.md for usage. Run profiling unit tests and import/reimport/management
      command regression tests.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '207 focused tests passed across profiling, three management-command suites, import timing/finalization,
        both import services and video reimport jobs/views. Log: .devenv/state/function-profile-tests.log.'
    - kind: command
      reference: 'Full Pyright: 0 errors/6 existing warnings. Final profiling module/tests typing: 0 errors/0
        warnings. Ruff and git diff HEAD --check passed.'
    - kind: command
      reference: 'Documentation-only verification: docs/profiling.md links and Python example syntax passed;
        README.md and docs/README.md link to the guide; no profiling YAML guide remains; tracker validation
        and git diff --check passed.'
    note: Profiling implementation and prior regression evidence unchanged. Concise Markdown guide is
      canonical for usage and linked from both README entry points; feature YAML retains verification
      tracking only.
    assessed_by: codex-overview-20260924-a
    assessed_at: '2026-09-24T12:08:15.548565Z'
- id: reimport_outcome_parity
  category: functionality
  title: Inline and worker reimports share typed completion decisions
  acceptance:
  - Optional prediction dispatch failures produce the same typed JSON outcome in both execution modes.
  - Non-ready HLS and invalid finalization inputs cannot be reported as completed imports.
  - Radon measurements and focused regression tests document the consolidated paths.
  required: true
  verification:
    kind: manual
    instructions: Run Radon, Pyright and reimport/finalization regression tests.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '214 tests passed: video reimport jobs/views, async view, storage state management, both
        workload timing suites, both import unit suites, report LLM jobs, hub ingest import contract and
        workflow import tests.'
    - kind: command
      reference: 'Repository Pyright: 0 errors, 6 unrelated warnings. Final typed reimport response/view
        check: 0 errors, 0 warnings. Ruff passed.'
    - kind: command
      reference: 'Radon: inline prediction helper 4 -> 1; shared worker prediction handler 2 -> 4 (grade
        A); HLS guard 3 -> 4. Higher guard complexity is intentional; divergent execution paths removed.'
    note: Shared prediction outcomes, ready-only HLS completion and non-null import returns verified across
      execution modes; no deployment.
    assessed_by: codex-overview-20260924-a
    assessed_at: '2026-09-24T08:47:17.759675Z'
- id: rust_runtime_interop
  category: functionality
  title: Native Rust-Arbeit trennt Python-Konvertierung und Berechnung
  acceptance:
  - Aufwendige native Schleifen geben den Global Interpreter Lock frei; Frame-Eingaben werden vorab in
    native Sammlungen konvertiert und Fehler erst an der Python-Grenze übersetzt.
  - Der native PDF-Renderer liefert bytes passend zum Typstub; Frame-Ergebnisse und bestehende Python-Fallback-Verträge
    bleiben erhalten.
  - Native Validierungsfehler ergeben ValueError; Dateisystemfehler behalten über die Standardkonvertierung
    ihre spezifischen Python-Ausnahmetypen. Direkte Binding-Tests prüfen Fehler, Ergebnisse und parallele
    Aufrufe.
  required: true
  verification:
    kind: manual
    instructions: Native Erweiterung neu bauen, Pyright sowie Rust- und Python-Integrationstests ausführen.
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'pytest tests/rust_backend tests/services/test_video_frame_initialization.py tests/utils/test_file_hash_integrity.py
        tests/utils/test_file_operations.py tests/services/test_report_import_service_unit.py -q --tb=short:
        150 passed, 3 warnings.'
    - kind: test
      reference: 'RUSTFLAGS="-C link-arg=-lpython3.12" cargo test --manifest-path rust/endoreg_rust_backend/Cargo.toml
        --lib: 17 passed.'
    - kind: command
      reference: 'maturin develop --skip-install erfolgreich; vollständiger Pyright: 0 Fehler, 6 bestehende
        Warnungen; Ruff check/format, rustfmt und git diff HEAD --check bestanden.'
    - kind: review
      reference: Native Schleifen in frames, pdf, file_identity, file_copy, encrypted_range und encryption_state
        verwenden allow_threads. Frame-Helfer liefern native InvalidInput-Werte; From<InvalidInput> for
        PyErr übersetzt nach Rückkehr. PDF liefert PyBytes; gemeinsamer E/A-Mapper verwendet PyO3-Standardkonvertierung.
    note: Direkte Binding-Tests prüfen bytes-Rückgabe, ValueError, FileNotFoundError und parallele Frame-Rundläufe
      ohne optionalen Fallback. Bestehende Python-Adapter bleiben unverändert; keine Produktionsbereitstellung
      und kein Leistungsbenchmark.
    assessed_by: codex-rust-interop-20260924
    assessed_at: '2026-09-24T08:31:05.495421Z'
- id: import_state_consistency
  category: functionality
  title: Import and reimport share failure and retry state handling
  acceptance:
