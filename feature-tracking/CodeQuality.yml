        tests/environment/test_base_db_data.py -q --durations=30 --tb=short: 27 bestanden, 2 Warnungen
        in 115.10 s. Einschließlich Datenbank-Flush und bedingter temporärer Verzeichnisse. Produktklasse:
        erstes Setup 69.44 s, drei Aufrufe zusammen 0.26 s; Ausgangslauf erstes Setup 68.97 s, drei Aufrufe
