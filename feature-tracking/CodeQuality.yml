  - Owned retries revoke prior readiness without bypassing integrity-loss or source checks.
  - Reimport endpoints delegate transitions; reconciliation observes canonical in-flight statuses without
    resetting ownership.
  required: true
  verification:
    kind: manual
    instructions: Run Pyright and focused import, reimport, finalization and reconciliation tests.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '190 import/reimport/state/reconciliation tests passed; final tests/services/test_report_import_service_unit.py,
        test_report_import_fencing.py and test_report_llm_jobs.py: 82 passed.'
    - kind: command
      reference: 'Pyright: 0 errors, 6 unrelated warnings. Ruff and git diff --check passed.'
    - kind: test
      reference: 'Cleanup follow-up: 204 unique focused cases pass across the expanded eight-file run
        (203 passed, one fixture failure) and corrected video-finalization rerun (10 passed). Logs: .devenv/state/cleanup-tests-final.log
        and .devenv/state/cleanup-video-final.log.'
    - kind: command
      reference: 'Full Pyright: 0 errors, 6 existing warnings; final video test typing: 0 errors, 0 warnings.
        Ruff and git diff HEAD --check passed. Radon cancellation 12 to 3, failure cleanup 7 to 4, duplicate
        methods 4 to 1; 54 production lines removed net in this cleanup pass.'
    - kind: command
      reference: 'Ownership consolidation: 188 tests passed (.devenv/state/ownership-tests.log); Pyright
        0 errors/6 existing warnings; Ruff passed. Radon duplicate cleanup 5 to 3; production net -11
        lines.'
    - kind: test
      reference: 'Callback validation: 140 import/fencing tests passed; full Pyright 0 errors/6 existing
        warnings; Ruff passed. Logs: .devenv/state/guard-validation-tests.log and .devenv/state/guard-validation-pyright.log.'
    - kind: test
      reference: 'Reported-failure repair: 37 passed, zero skipped with RUN_VIDEO_TESTS=true SKIP_EXPENSIVE_TESTS=false;
        central hub training access, workflow failure injection and two video import regressions. Full
        Pyright 0 errors/6 existing warnings; Ruff passed. Log: .devenv/state/test-repair-results.log.'
    note: Retained reported regression tests and repaired outdated exception expectations, subprocess
      import, staging ownership fixture and HLS callback signature. Production contracts unchanged.
    assessed_by: codex-overview-20260924-a
    assessed_at: '2026-09-24T11:42:06.751371Z'
- id: rust_anonymization_status
  category: functionality
  title: Rust owns anonymization status precedence across Python and SQL
  acceptance:
  - Models, transfer eligibility, polling and metrics use the canonical processing_anonymization token.
  - Rust rules drive state derivation and SQL cases; processing failure takes precedence over validation.
  - Exhaustive flag parity, API string conversion and unavailable native backend rejection are tested.
  - Standardization produces a net repository line reduction without changing storage or annotation states.
  required: true
  verification:
    kind: manual
    instructions: Run Rust tests, Pyright and focused state, overview, transfer and metrics tests; review
      git diff --stat.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'pytest tests/rust_backend/test_video_state_status_parity.py tests/models/state/test_video_anonymization_status.py
        tests/models/state/test_raw_pdf_state.py tests/views/anonymization/test_anonymization_overview.py
        tests/views/media/test_anonymization_metrics.py tests/services/test_transfer_job_contract.py -q
        --tb=short: 104 passed, 3 subtests passed; all 160 flag combinations checked.'
    - kind: command
      reference: 'pyright: 0 errors, 6 unrelated warnings; focused final Pyright: 0 errors, 0 warnings;
        Ruff and git diff --check passed.'
    - kind: test
      reference: 'RUSTFLAGS="-C link-arg=-lpython3.12" cargo test --manifest-path rust/endoreg_rust_backend/Cargo.toml
        import_state: 2 passed. Plain cargo test needs explicit Python linkage here.'
    - kind: command
      reference: 'maturin develop --skip-install: native extension built; Rust-generated Python stubs
        synchronized.'
    note: Rust owns status precedence and SQL projection; StrEnum and strict polling conversion preserve
      wire tokens. Net line reduction includes tests and tracking. Native extension rebuilt locally; no
      production deployment.
    assessed_by: codex-overview-20260924-a
    assessed_at: '2026-09-24T08:06:03.883644Z'
- id: media_hash_and_path_centralization
  category: testing
  title: Zentrale Medien-Hashes und Laufzeitpfade sind verbindliche Abnahmegrenzen
  acceptance:
  - Zukünftige Medienänderungen verwenden die get_hash-Methoden der Artefaktfelder und den gemeinsamen
    get_file_hash-Helper; private Hashimplementierungen und Ciphertext-Hashes ersetzen diese nicht.
  - EndoregPathsModel aus endoreg_db.utils.paths und get_runtime_paths sind der alleinige Vertrag für
    Laufzeitpfade; LX_RUNTIME_ROOT ist dessen einzige Root-Konfiguration. Retirierte Aliase und importzeitlich
    aufgelöste Medienpfade dürfen nicht wieder eingeführt werden.
  - Vertragstests prüfen Hashdelegation, Klartextparität bei verschlüsseltem Storage, Fehlerweitergabe,
    Root-Konfiguration, Cache-Neuauflösung und Pfadgrenzen; neue Aufrufstellen werden auf Umgehungen geprüft.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/contracts/test_media_centralization.py
    - tests/utils/test_paths.py
    - tests/utils/test_file_operations.py
    - tests/services/test_video_source_hash.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/code_quality.md
    - kind: test
      reference: 'pytest tests/contracts/test_media_centralization.py tests/utils/test_paths.py tests/utils/test_file_operations.py
        tests/services/test_video_source_hash.py -q --tb=short: 81 passed, 2 warnings (2026-09-21)'
    - kind: command
      reference: 'pyright: 0 errors, 5 existing warnings; pytest --lf -vv --tb=short: 8 passed, 2 skipped,
        580 deselected (2026-09-21)'
    note: Zentrale Hash- und Pfadgrenzen sind dokumentiert und durch parametrisierte Vertragstests abgesichert.
      PostgreSQL-spezifische Tests im --lf-Lauf wurden übersprungen.
    assessed_by: codex-pytest-lf-20260921
    assessed_at: '2026-09-21T12:03:01.551853Z'
