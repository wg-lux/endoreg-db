- id: quality_regression_guards
  category: testing
  title: Automatisierte Guards verhindern neue Qualitätsregressionen
  acceptance:
  - Basisdaten-Fixtures schreiben innerhalb der jeweiligen Testtransaktion; nachfolgende Frischdatenbanktests
    bleiben leer. Migrationstests stellen im finally-Block alle aktuellen Migrationsblätter wieder her.
    Job-Fixtures erfüllen die aktuellen Fehlerzustands-Constraints, schützen laufende Video-Jobs vor altersbasierter
    Übernahme und verwenden für erfolgreiche PDF-Freigaben ein gültiges verarbeitetes Dokument.
  - Test-Fixtures überstehen Datenbank-Flushes zwischen Transaktionstests; PDF-Erfolgsfälle verwenden
    vollständig parsebare Dokumente und prüfen Textinhalt statt einer festen PDF-Version. Subprozess-
    und parallele Subtest-Prüfungen verwenden aktuelle Imports und serialisierbare Parameter. Tests ohne
    Produktivaufruf und Assertion werden entfernt.
  - Der Paketbuild entfernt den devenv-Linker-Override für das explizite Zig-Ziel und isoliert portable
    Cargo-Artefakte von nativen Entwicklungsbuilds. Maturins manylinux2014-Prüfung bleibt verpflichtend;
    Wheel und Quelldistribution werden erfolgreich erzeugt und ihre Paketmetadaten geprüft.
  - Der eigenständige Startupcheck initialisiert die Verzeichnisstruktur seines Testprofils vor Django-Startup
    über die vorhandenen typisierten Dateisystemhelfer; relative oder anderweitig ungültige Runtime-Konfigurationen
    scheitern weiterhin laut.
  - Pyright, Import-Boundary-Tests und fokussierte Runtime-Tests bestehen nach jeder Refactoring-Kohorte.
  - Ein versionierter Dead-Code-Check meldet neue hochkonfidente Funde und verwendet nur begründete, reviewbare
    Ausnahmen.
  - Ein versionierter Boundary-Guard verhindert unreviewte breite Exception-Handler und Typunterdrückungen.
  - Tests decken Exception-Mapping, Chaining, Retry-Klassifikation, unbekannte Fehler und rückwärtskompatible
    öffentliche Importe ab.
