- id: sensitive_meta_verification_authority
  category: functionality
  title: Sensitive-Meta-Verifikation hat einen zentralen Schreibweg
  acceptance:
  - Verifikations-Service, Metadaten-PATCH und Modellfassaden schreiben Prüfflags über dieselbe transaktionale
    Operation; Video- und PDF-Validierung bestätigen beide Flags gemeinsam.
  - is_verified bleibt aus Namen- und Geburtsdatumsprüfung abgeleitet; fehlender Zustand ergibt auch für
    state_verified false.
  - Persistierte Änderungen an Namen oder Geburtsdatum widerrufen ausschließlich die betroffene Prüfung;
    unveränderte Werte und nicht gespeicherte Felder erhalten sie. Explizite Bestätigung im selben PATCH
    gilt für die neuen Werte.
  - Auditierte Identitätslöschung erhält geprüfte Identität; fehlgeschlagene Updates rollen Daten und
    Prüfflags gemeinsam zurück. Konkurrierende Teilupdates verlieren keine Bestätigung.
  required: true
  verification:
    kind: manual
    instructions: Pyright vor Service-, Modellfassaden-, Validierungs-, Import- und PostgreSQL-Nebenläufigkeitstests
      ausführen.
    timeout_seconds: 900
