- id: media_hash_and_path_centralization
  category: testing
  title: Zentrale Medien-Hashes und Laufzeitpfade sind verbindliche Abnahmegrenzen
  acceptance:
  - Serialisierte Hub-Steuerungsdaten, Interoperabilitätskennungen, DICOM-Manifeste, Evaluationskennungen,
    Protokollreferenzen, Zugriffstoken und Modellprüfsummen verwenden get_bytes_hash aus utils.hashs ohne
    Änderung ihrer Kodierung oder bestehenden SHA-256-Werte. Identitäts-Hashes bleiben schlüsselgebunden;
    historische Migrationsformate und Kryptografieprotokolle werden nicht durch ungesalzene Dateihashes
    ersetzt.
  - Streambare Medien verwenden get_file_hash auch ohne lokalen Pfad; unvollständige Streams, negative
    oder veränderte Klartextgrößen und Authentifizierungsfehler werden abgewiesen.
  - Zukünftige Medienänderungen verwenden die get_hash-Methoden der Artefaktfelder und den gemeinsamen
    get_file_hash-Helper; private Hashimplementierungen und Ciphertext-Hashes ersetzen diese nicht.
  - EndoregPathsModel aus endoreg_db.utils.paths und get_runtime_paths sind der alleinige Vertrag für
    Laufzeitpfade; LX_RUNTIME_ROOT ist dessen einzige Root-Konfiguration. Retirierte Aliase und importzeitlich
    aufgelöste Medienpfade dürfen nicht wieder eingeführt werden.
  - Vertragstests prüfen Hashdelegation, Klartextparität bei verschlüsseltem Storage, Fehlerweitergabe,
    Root-Konfiguration, Cache-Neuauflösung und Pfadgrenzen; neue Aufrufstellen werden auf Umgehungen geprüft.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/contracts/test_media_centralization.py
    - tests/utils/test_file_hash_integrity.py
    - tests/environment/test_identity_hashing.py
    - tests/utils/test_paths.py
    - tests/utils/test_file_operations.py
    - tests/services/test_video_source_hash.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/code_quality.md
    - kind: test
      reference: 'pytest tests/contracts/test_media_centralization.py tests/utils/test_paths.py tests/utils/test_file_operations.py
        tests/services/test_video_source_hash.py -q --tb=short: 81 passed, 2 warnings (2026-09-21)'
    - kind: command
      reference: 'pyright: 0 errors, 5 existing warnings; pytest --lf -vv --tb=short: 8 passed, 2 skipped,
        580 deselected (2026-09-21)'
    - kind: test
      reference: '2026-10-19: devenv shell -- pytest tests/contracts/test_media_centralization.py tests/utils/test_file_hash_integrity.py
