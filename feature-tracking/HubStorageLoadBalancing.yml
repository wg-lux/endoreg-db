- id: deterministic_capacity_aware_placement
  category: functionality
  title: Placement is deterministic, capacity aware, and concurrency safe
  acceptance:
  - A versioned exhaustive policy filters by authorization, health freshness, drain state, artifact capability,
    residency, failure domain, usable capacity, reservation, and configured safety margin.
  - Selection accounts for node weight and utilization and uses a stable documented tie-breaker; identical
    eligible input and policy version produce the same result.
  - Capacity is reserved atomically with placement intent before bytes are accepted, and concurrent transactions
    cannot overcommit the same capacity or create multiple canonical primaries.
  - No eligible node, stale telemetry, insufficient capacity, and ambiguous state fail loudly with stable
    typed errors and never fall back to an unapproved path.
  required: true
  verification:
    kind: manual
    instructions: Run model and service tests for deterministic selection, concurrent reservation, stale
      telemetry, policy versioning, node drain, skew, and no-eligible-node behavior.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
