- id: reconciliation_observability_and_recovery
  category: operations
  title: Operators can detect and safely recover skew, failures, and capacity pressure
  acceptance:
  - Structured correlated events and metrics expose placement decisions, policy version, reservations,
    node health age, capacity, skew, rotation transitions, bytes moved, retries, verification, cleanup,
    and failures without secrets or patient data.
  - Scheduled reconciliation and balancing are rate limited, lease aware, resumable, bounded, and safe
    after hub, database, worker, network, or storage-node restart.
  - Alerts cover stale health, low and stop capacity, imbalance, unreachable node, integrity mismatch,
    stuck rotation, reservation leak, repeated retry, cleanup failure, and loss of the only verified copy.
  - Drain, replacement, rollback, key rotation, restore, and disaster recovery preserve auditable placement
    history and require explicit approval before destructive repair.
  required: true
  verification:
    kind: manual
    instructions: Run a production-like soak and recovery drill with injected skew, capacity exhaustion,
      restart, partition, corruption, drain, replacement, and rollback; inspect metrics, alerts, and ledgers.
    timeout_seconds: 3600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/services/hub/storage_balancing.py; endoreg_db/models/hub/storage_balancing.py
    - kind: command
      reference: 'focused balancing suite: 23 passed in 27.78s; Pyright 0 errors; Ruff and migration drift
        passed (2026-08-11)'
    - kind: command
      reference: LX overview/task suites and endoreg balancing/telemetry suites passed in focused lanes.
    - kind: code
      reference: endoreg_db/services/hub/storage_reconciliation.py; endoreg_db/models/hub/storage_balancing.py;
        endoreg_db/migrations/0070_storage_reconciliation.py
    - kind: code
      reference: endoreg_db/services/hub/storage_operator_control.py; endoreg_db/migrations/0071_storage_operator_control.py
    note: Bounded balancing, immutable outcomes, telemetry probe state, restart redispatch, reservation
