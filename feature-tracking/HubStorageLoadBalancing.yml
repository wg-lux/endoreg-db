- id: architecture_and_operations_documentation
  category: documentation
  title: Domain, API, migration, and recovery contracts are documented
  acceptance:
  - English documentation defines storage-node identity, placement versus storage mode, balancing policy,
    reservations, replicas, rotation state machine, leases, encryption, reconciliation, and stable errors.
  - Migration from hub-local persistent storage inventories and verifies every artifact, records initial
    placement, supports dry-run and rollback, and prohibits destructive cleanup until production gates
    pass.
  - Operator procedures cover node enrollment, capacity planning, drain, rebalance, replacement, certificate
    and recipient-key rotation, incident response, backup, restore, and disaster recovery.
  - The documentation links this feature to HubTransfer, StorageSecurity, VideoStorageNormalization, the
    LX-Annotate tracker, and the LuxNix storage-node deployment without maintaining parallel readiness
    status.
  required: true
  verification:
    kind: manual
    instructions: Have endoreg-db, LX-Annotate, LuxNix, security, and storage owners execute the migration
      and recovery runbooks in a production-like environment and approve the evidence.
