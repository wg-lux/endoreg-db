definition_of_done:
- id: typed_storage_domain_contract
  category: requirements
  title: Storage-node capabilities, placements, reservations, and rotations have one typed domain model
  acceptance:
  - A storage node is distinct from central-hub, site-node, and standalone roles and has immutable identity,
    active and drain state, endpoint, failure domain, weight, capabilities, and freshness metadata.
  - Persisted typed models represent artifact identity, artifact kind, canonical primary, optional replicas,
    reservation, policy version, rotation intent, workflow state, lease, retry, and terminal failure reason.
  - Placement is independent of VideoStorageMode; encryption and streamability policy cannot be mistaken
    for the physical node holding an artifact.
  - The schema supports one initial dedicated node and additional nodes without changing artifact identifiers
    or silently converting placement balancing into backup or replication.
  required: true
  verification:
    kind: manual
    instructions: Review models, constraints, migrations, typed schemas, and ownership boundaries against
      HubTransfer and StorageSecurity.
    timeout_seconds: 900
  assessment:
    status: in_progress
