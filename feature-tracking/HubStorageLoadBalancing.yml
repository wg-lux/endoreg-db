id: hub_storage_load_balancing
name: Hub Storage-Node Load Balancing
description: Provide the typed endoreg-db domain and service contracts for hub-managed placement and safe
  rotation of protected artifacts across one or more dedicated storage nodes.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
- LuxNix maintainers
- storage operations
production_critical: true
