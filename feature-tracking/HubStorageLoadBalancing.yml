- id: idempotent_rotation_state_machine
  category: functionality
  title: Rotation uses an idempotent copy-verify-commit-cleanup state machine
  acceptance:
  - Rotation persists immutable source and target placements, artifact hash and size, policy version,
    idempotency key, initiator, reason, timestamps, retry state, and current transition.
  - Copy completion alone cannot change the canonical placement; target verification precedes an atomic
    compare-and-set placement commit and source cleanup remains a distinct deferred transition.
  - Exact replay resumes the same rotation, changed replay is rejected, and concurrent rotations for the
    same artifact serialize or terminate with a stable conflict.
  - Cleanup requires committed placement, all required replicas, expired media-operation leases, verified
    target, and database/filesystem reconciliation; it never removes the previous or only valid master
    early.
  required: true
  verification:
    kind: manual
    instructions: Interrupt and replay every transition under concurrent ingest, playback, reconciliation,
      drain, retry, and cleanup workloads and inspect constraints and ledgers.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/services/hub/storage_rotation.py
    - kind: command
      reference: 'tests/services/test_hub_storage_rotation.py in focused suite: 26 passed total (2026-08-11)'
    - kind: code
      reference: endoreg_db/services/hub/storage_rotation.py (fingerprinted transition and receipt services)
    - kind: command
      reference: 'focused hardening pytest: 31 passed in 22.46s (2026-08-11)'
    - kind: command
      reference: '2026-08-11 hardened focused suite: 31 passed; changed transition evidence, verification
        receipt, cleanup receipt, and reservation lifecycle paths covered.'
    - kind: command
      reference: '2026-08-11 endoreg focused storage suite: 37 passed; LX focused orchestration suite:
        67 passed.'
    - kind: code
      reference: Operator retry receipts are included in the deterministic balance-work fingerprint. A retry
        therefore materializes a new reservation, target placement, rotation, and immutable work item rather
        than replaying or reopening the failed workflow. Focused test code covers unchanged-telemetry retry and
        exact subsequent reconciliation replay; execution is intentionally left to the evidence owner.
    note: Copy, verification, commit, cleanup deferral, terminal failure, transition fingerprints, and
      reconciler and operator-control receipts are persisted and exact-replay safe; LX now executes and recovers
      the workflow, and a retry requires fresh placement state. Owner-run verification and production
      lease/replica drills remain outstanding.
    assessed_by: codex-storage-prod-readiness
    assessed_at: '2026-08-11T10:35:53.155877Z'
- id: storage_node_security_boundary
  category: security
  title: Storage-node transport and encryption preserve the clinical security boundary
  acceptance:
  - Storage-node calls require HTTPS with mutually authenticated Transport Layer Security, authenticated
    node identity, explicit operation authorization, certificate rotation, bounded request lifetime, and
    replay protection.
  - NetworkNode.shared_secret remains request authentication material only; neither it nor the application
    master key is used as a payload key or transmitted to a storage node.
  - Standalone artifacts leaving a local encrypted-storage boundary use per-transfer envelope encryption
    and a data-encryption key wrapped to the approved recipient identity; plaintext staging remains prohibited.
  - Only approved protected artifacts are accepted, raw-media export remains prohibited, and wrong node,
    center, artifact, recipient, hash, storage profile, or residency fails before disclosure or mutation.
  required: true
  verification:
    kind: manual
    instructions: Review keys, models, serializers, clients, logs, and deployment settings, then run positive
      and negative mutually authenticated Transport Layer Security, authorization, replay, recipient,
      and envelope-encryption tests.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: '2026-08-11 cross-repository live TLS 1.3/mTLS envelope suite: 3 passed.'
    note: Typed evidence binds recipient key, envelope profile, hash, size, placement, and generation;
      the exact cross-repository client/server contract passed a live local TLS 1.3 mTLS encrypted transfer.
      Deployed certificate validation remains pending.
    assessed_by: codex-storage-prod-readiness
    assessed_at: '2026-08-11T10:35:54.436491Z'
- id: atomic_storage_operations_and_integrity
  category: data_integrity
  title: Remote storage mutations are atomic, hash verified, and fully reconcilable
  acceptance:
  - Store, publish, fetch, verify, and delete contracts carry canonical artifact identity, expected size,
    cryptographic hash, key version, placement generation, and idempotency key.
  - Filesystem mutations use endoreg_db.utils.filesystem.file_operations, atomic publication, bounded
    staging, and structured JavaScript Object Notation events; partial targets are never exposed as valid
    artifacts.
  - Retrieval and streaming resolve only a committed placement and renew the appropriate media-operation
    lease; missing, corrupt, or mismatched content fails closed and records an explicit failed or LOST
    outcome.
  - Reconciliation detects database-only, storage-only, duplicate, stale-generation, corrupt, and unreachable
    states without guessing a canonical copy or rewriting clinical timeline coordinates.
  required: true
  verification:
    kind: manual
    instructions: Exercise store, fetch, stream, verify, publish, reconcile, and delete with injected
      partial writes, corruption, generation mismatch, database rollback, and node loss.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: Lux storage/deployment lane 55 passed; endoreg focused storage suite 37 passed.
    note: Persisted transfer and deletion evidence, placement commit receipts, integrity/failure transitions,
      resolver gates, and reconciliation receipts now match the atomic Lux data plane. Production filesystem/database
      skew drills remain outstanding.
    assessed_by: codex-storage-prod-readiness
    assessed_at: '2026-08-11T10:35:55.651986Z'
- id: versioned_hub_storage_api
  category: functionality
  title: Hub and storage services share a versioned least-privilege API contract
  acceptance:
  - Typed request and response schemas cover capability discovery, health, capacity, reservation, store,
    fetch, verification, and deletion with stable error codes and no unvalidated persisted dictionaries.
  - Health and capacity distinguish total, filesystem-free, policy-usable, reserved, in-flight, committed,
    and cleanup-reclaimable bytes and include a signed or authenticated observation timestamp.
  - Pagination, timeouts, byte limits, backpressure, idempotency, range access, and error semantics are
    explicit and compatible with large streamable media.
  - Storage nodes cannot mutate application metadata, select their own canonical placement, or enumerate
    or access artifacts outside the hub-authorized scope.
  required: true
  verification:
    kind: manual
    instructions: Validate schemas and endpoint tests from both endoreg-db and LX-Annotate and exercise
      them against an independently deployed storage-node service.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'Cross-contract schema and envelope suite: 3 passed; combined Pyright: 0 errors.'
    note: Public versioned planner and typed model/service contracts are consumed fail-closed by LX, while
      the data plane exposes least-privilege typed health/capacity/store/fetch/verify/delete operations.
      Additive inventory pagination and exact current-generation application resolution are implemented.
      Node-side plaintext range transfer and production compatibility remain outstanding.
    assessed_by: codex-storage-prod-readiness
    assessed_at: '2026-08-11T10:35:56.848172Z'
- id: concurrency_and_failure_tests
  category: testing
  title: Placement and rotation failure modes are regression tested
  acceptance:
  - Tests cover one and multiple nodes, weighted utilization, deterministic ties, capacity margins, reservations,
    drain, recovery, rebalance, lease deferral, replicas, and safe cleanup.
  - Concurrency tests cover simultaneous ingest, placement, rotation, fetch, reconciliation, retry, and
    node drain without overcommit, duplicate primaries, stale publication, or early deletion.
  - Negative tests cover stale or dishonest telemetry, no capacity, unreachable node, timeout, partial
    copy, wrong size or hash, replay, lost acknowledgement, transaction rollback, worker restart, and
    corrupt source or target.
  - Cross-repository contract tests pin compatible schema and policy versions and a production-like integration
    test verifies hub ingest, remote placement, playback, rotation, recovery, and reconciliation.
  required: true
  verification:
    kind: manual
    instructions: Run focused unit, database-constraint, concurrency, failure-injection, cross-repository,
      and production-like integration suites and record exact revisions and results.
    timeout_seconds: 3600
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: '2026-08-11: endoreg 37 passed/1 SQLite skip; PostgreSQL concurrency 1 passed; LX 67
        passed; Lux 55 passed.'
    - kind: command
