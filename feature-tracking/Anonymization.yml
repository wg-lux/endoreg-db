  - Leere externe ID-Paare werden bei Video- und Berichtsvalidierung ignoriert; vollständige Paare werden
    als typisierte PatientExternalID-Relation aufgelöst oder angelegt und atomar zugeordnet.
  - Die Modellneutrainingsintegration mit lx-anonymizer ist nach Arrange-Act-Assert strukturiert und prüft
    Optionsübergabe, Worker- und Management-Command-Grenze, Ergebnispersistenz sowie fail-closed Eingabe-,
    Ergebnis- und Trainingsfehler.
