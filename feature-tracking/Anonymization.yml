- id: incremental_reidentification_experiment
  category: security
  title: Isolated synthetic measurement of incremental identity disclosure after key compromise
  acceptance:
  - Freeze independent candidates and bounded search before hidden generation; separate attacker input
    from private scoring truth.
  - Compare equal auxiliary knowledge with and without keys, preserving baseline disclosures, tuple ambiguity
    and membership abstentions.
  - Differentially validate the offline evaluator against production helpers and publish measured work,
    isolation checks and limitations.
  - Measure current deterministic local and hub UUIDv8 mappings with exposed, absent and wrong keys,
    independent centre keys and already-labelled controls; retain historical evidence separately.
  required: false
  verification:
    kind: manual
    instructions: Run scripts/reidentification/README.md commands; inspect public results and private
      reproduction separately.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: scripts/reidentification/REPORT.md
    - kind: demonstration
      reference: scripts/reidentification/evidence/verification.json
    - kind: demonstration
      reference: scripts/reidentification/evidence/uuid_mapping/verification.json
      note: '23 October 2026: 45 current UUID/hash-control cases replayed and independently rescored;
        18 harness tests passed. Shared-key exposure yields 192 matches, 144 new correct and 12 false
        assignments for both local and hub UUIDs; no-key and wrong-key controls yield zero.'
    note: 'Bounded synthetic experiment executed: 48 case pairs, three independent subject seeds; complete
      replay and independent rescoring agree. No production-readiness or clinical-population probability
      claim. Missing external hashs.py attachment and encrypted-file integration coverage are documented
      limitations.'
    assessed_by: codex-reidentification-20261021-a
    assessed_at: '2026-10-21T07:33:15.494669Z'
- id: identity_hash_response_boundary
  category: security
  title: Identity hashes never leave through browser or export responses
  acceptance:
  - Patient and examination browser routes accept center-scoped local patient IDs, return no identity
    hashes, and use resource IDs for displayed filenames; cohort grouping retains server-side hash matching.
  - Both applications reject JSON and browser responses carrying patient, examination or case hashes,
    shortened displays or identity fingerprints; error responses contain no rejected values.
  - FHIR and research spreadsheet exports reject their hash-bearing contracts before publication; renamed
    patient pseudonyms do not bypass the restriction.
  - File-integrity checksums and approved binary media streaming remain available; blocked responses never
    consume a deferred metadata stream.
  - Explicit JSON artifact downloads validate identity fields before streaming; rejecting deferred responses
    preserves normal request completion, resource cleanup and subsequent database access.
  required: true
  verification:
    kind: manual
    instructions: Verify HTTP middleware, actual serializer payloads, FHIR and spreadsheet entrypoints,
      and unchanged media streaming.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'Final backend response/transfer/keyring suite: 94 passed in 1.73s. Real patient/examination
        serializer output, FHIR rejection, prepared workbook refusal, redacted errors, malformed/deep
        JSON, non-consuming metadata streams, binary video streaming and file checksums tested. Focused
        Pyright and Ruff passed.'
    - kind: test
      reference: tests/views/case/test_case_viewset.py
    - kind: test
      reference: tests/services/test_identity_response_boundary.py
    - kind: test
      reference: tests/services/test_fhir_r4_export.py
    - kind: test
      reference: '2026-10-20: Datenschutz- und vollständige Anwendungseinstellungs-Suite im abschließenden
        222-bestanden-Lauf erfolgreich; sichere JSON-Dateiausgabe, blockierte Identitätsfelder, einmaliger
        Request-Abschluss und weitere Datenbankabfragen geprüft. Geänderte Python-Dateien: Pyright 0 Fehler/0
        Warnungen.'
    assessed_by: codex-test-review-20261020
    assessed_at: '2026-10-20T11:24:13.076308Z'
- id: central_identity_salts_disabled
