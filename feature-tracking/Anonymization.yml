- id: online_secret_rotation
  category: security
  title: Online secret rotation preserves readable media and stable clinical links
  acceptance:
  - Native Einzel- und Batch-Hashleser erhalten denselben validierten Schlüssel-Snapshot wie Python; aktive
    und auslaufende 16-, 24- und 32-Byte-Schlüssel sind getestet. Ein explizit leerer Salt-Snapshot bleibt
    innerhalb einer Operation stabil; Produktionssettings erzeugen keinen Ersatz-Signaturschlüssel.
  - Einzeldateien und Keyrings verwenden dieselbe private Dateiprüfung und dieselben Validatoren für Master-Key-Material,
    Identitätssalz und Django-Signaturschlüssel; der Health-Check bewertet den tatsächlich geladenen Django-Schlüssel,
    nicht eine möglicherweise ersetzte Quelldatei.
  - A private versioned keyring selects one active master key for new writes and explicitly retiring keys
    for reads; running storage instances observe atomic keyring changes.
  - Resumable media rotation generates fresh data keys, authenticates every chunk and verifies unchanged
    plaintext before atomic publication; active media leases defer replacement and failures retain the
    original.
  - HTTP Live Streaming content keys remain readable during overlap and compromised-key recovery regenerates
    content keys and segments through the existing generation workflow.
  - Identity salt rotation explicitly supports legacy default_salt as migration input only, retains patient
    and examination links, and refuses incomplete or ambiguous source identities rather than inventing
    replacements.
  - Django signing-key rotation is distinguished from media encryption; compromised signing keys are not
    retained as verification fallbacks.
  - Focused type, integrity, failure, streaming and identity tests pass; deployment requires staged reader
    rollout and reviewed retirement evidence.
  required: true
  verification:
    kind: manual
    instructions: Run focused rotation and import/streaming integration tests, then rehearse overlapping
      key generations and key retirement on an isolated production-like deployment.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/secret_rotation.yml
    - kind: test
      reference: tests/services/test_secret_rotation.py; tests/services/test_identity_salt_rotation.py;
        tests/services/test_hls_media.py (PostgreSQL, echte FFmpeg-Ausführung)
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/services/test_secret_rotation.py tests/services/test_identity_salt_rotation.py
        tests/environment/test_identity_hashing.py tests/import_files/test_sensitive_identity_guards.py
        tests/import_files/test_sensitive_metadata_concurrency_postgresql.py tests/import_files/test_import_encryption.py
        tests/utils/test_encryption_range.py tests/utils/test_encryption_streaming.py tests/services/test_media_operation_gate.py
        tests/services/test_hls_media.py tests/views/video/test_hls_stream.py tests/deployment/test_prod_settings_contract.py
        tests/migrations/test_canonical_graph.py -q --tb=short (isoliertes PostgreSQL 16; RUN_VIDEO_TESTS=true,
        SKIP_EXPENSIVE_TESTS=false; 189 bestanden vor finaler Gruppenintegritätsverschärfung; danach 20
        fokussierte Identitäts-/Import-/Parallelitätstests bestanden)
    - kind: test
      reference: tests/environment/test_secret_resolution.py; tests/rust_backend/test_encryption_status.py;
        rust/endoreg_rust_backend/src/encryption_state.rs
    - kind: test
      reference: tests/rust_backend/test_encrypted_contract.py; tests/environment/test_secret_resolution.py
        (zweite Secret-Runde, gemeinsame native Header- und Schlüsselverträge)
    note: '2026-09-21: Online-Rotation implementiert: private atomar austauschbare Schlüsselmanifeste,
      explizite Lesegenerationen, frische Dateischlüssel, vollständige Authentifizierung und Klartextprüfung
