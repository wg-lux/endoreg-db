- id: privacy_controls
  category: security
  title: Nicht freigegebene Rohdaten können den lokalen Schutzbereich nicht verlassen
  acceptance:
  - Export ist nur für anonymisierte, validierte Medien möglich.
  - Master-Key und direkte Identifikatoren gelangen weder in Payloads noch Konfiguration.
  - Leere oder nur aus Platzhaltern bestehende Anonymizer-Metadaten überschreiben bei Wiederholungen keine
    bereits persistierten direkten Identifikatoren.
  - Center-Zuordnung und lokale Dateipfade stammen ausschließlich aus dem vertrauenswürdigen Importkontext;
    Anonymizer-Metadaten dürfen diese Besitz- und Speichergrenzen nicht verändern und Routine-Logs enthalten
    keine sensitiven Quellpfade.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/import_files/test_sensitive_meta_storage.py
    - tests/services/test_export_frames_contract.py
    - tests/services/test_transfer_job_contract.py
    - tests/views/media/test_hub_transfer_endpoints.py
    - tests/utils/test_structured_logging.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/import_files/test_sensitive_meta_storage.py
        tests/services/test_export_frames_contract.py tests/services/test_transfer_job_contract.py tests/views/media/test_hub_transfer_endpoints.py
        tests/utils/test_structured_logging.py -q
      note: Exit-Code 0
    note: 'Codeprüfung und fokussierte Verifikation bestätigen: Export bleibt validierungsgebunden; Transferpfade
      verwerfen Rohdaten und direkte Identifikatoren; leere oder Platzhalter-Metadaten erhalten bekannte
      Identifikatoren; Center und Dateipfad sind keine schreibbaren Anonymizer-Felder; die Importservices
      protokollieren keine sensitiven Quell- oder Stagingpfade.'
    assessed_by: codex-sensitive-meta-20260820
    assessed_at: '2026-08-20T09:10:33.293358Z'
