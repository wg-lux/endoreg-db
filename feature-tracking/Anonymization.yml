- id: sensitive_metadata_resolution
  category: testing
  title: Anonymizer metadata resolves consistently through persistence, identity hashing, and review
  acceptance:
  - scripts/benchmark_sha256.py misst begrenzte Kandidatensuche mit bekanntem Salt für HMAC-SHA-256 und
    SHA-256-Varianten; Zeichenvorrat, Längen, UTF-8-Präfix/Suffix, Zeit- und Versuchslimit sind konfigurierbar.
    Tests prüfen Treffer, Erschöpfung, Abbruchgrenzen und ungültige Eingaben ohne Datenbank.
  - Reproduzierbare synthetische Hashversuche unterscheiden Eingabemehrdeutigkeit, demografische Gleichheit
    und kryptografische Kollisionen; Wörterbuchabgleich mit bekanntem Salt und Grenzen der Kollisionswahrscheinlichkeitsrechnung
    sind dokumentiert, ohne Produktionsdaten zu verwenden.
  - Normal validation and privacy-policy application share complete idempotent direct-identifier erasure;
    committed hashes, collision fingerprints and clinical links survive, and later saves do not recreate
    erased examiner relations.
  - Video and report imports use the shared lx-dtypes SensitiveMeta normalization contract, including
    supported legacy aliases and date formats.
  - Repeated extraction preserves the media-to-metadata relation, persisted patient and examination hashes,
    and pseudonymous links for equivalent input; empty extraction does not erase known identifiers.
  - Authenticated video and report metadata reads resolve the persisted relation after import; missing
    relations remain explicit errors and are not manufactured by reads.
  - Legacy hash encoding remains compatible. Patient dates retain their clinical calendar day after UTC
    database persistence; incomplete extraction does not invent patient or examination identities.
  - Preanonymized imports with a source-scoped external patient identifier may create a pseudonymous patient
    without demographic data. Repeated imports reuse the mapping, different source scopes remain distinct,
    cross-center mappings fail, and transactional creation leaves no orphan patient on failure.
  - Aktive Identitätssalze und explizite Hashparameter durchlaufen die gemeinsame Salt-Validierung; wiederholte
    Validierung erhält die exakten UTF-8-Schlüsselbytes. Nur explizit registrierte historische Lesegenerationen
    dürfen schwaches Altmaterial zur Wiedererkennung verwenden.
  - Identity hashing reads the typed Django setting at call time. Production requires a private DJANGO_SALT_FILE,
    rejects default or invalid salts, and never generates a replacement.
  - Test settings honor configured DJANGO_SALT_FILE or DJANGO_SALT before generating isolated test material;
    equivalent identities with the same salt and stable center key hash identically across processes.
    Local test intake uses environment-backed center defaults, preserving explicit center scope and name
    normalization.
  - Additive keyed identity fingerprints reject ambiguous legacy concatenation and incompatible salt reuse,
    including after identifier erasure. Erased legacy rows without enrollment evidence require explicit
    review.
  - PostgreSQL concurrent writes keep one metadata relation per media and reuse one patient and examination
    for equivalent input. Rollback leaves no dangling relation.
  - Coordinated package rollout, established-salt enrollment, legacy-data collision review, and clinical
    approval are required before production acceptance.
