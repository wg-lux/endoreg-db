- id: media_workflow
  category: functionality
  title: Video-, Frame- und Berichtsanonymisierung folgen einem expliziten Workflow
  acceptance:
  - Verarbeitung ist idempotent und jeder Übergang wird serverseitig validiert.
  - Korrektur und erneute Verarbeitung überschreiben keine ungeprüfte Historie.
  - Nach der Validierung werden alle extrahierten Frames validierter Outside-Segmente atomar vollständig
    geschwärzt und vor der Freigabe verifiziert.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/import_files/test_video_anonymization.py
    - tests/views/anonymization/test_validate_view.py
    - tests/services/test_video_post_validation_jobs.py
    - tests/views/video/test_segments_crud.py
