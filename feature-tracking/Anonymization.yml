- id: privacy_controls
  category: security
  title: Unapproved raw data cannot leave the local protection boundary
  acceptance:
  - Export is possible only for anonymized, validated media.
  - The master key and direct identifiers enter neither payloads nor configuration.
  - Empty anonymizer metadata or metadata consisting only of placeholders does not overwrite already persisted
    direct identifiers during repeated processing.
  - Center assignment and local file paths originate exclusively from the trusted import context; anonymizer
    metadata must not change these ownership and storage boundaries, and routine logs contain no sensitive source paths.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/import_files/test_sensitive_meta_storage.py
    - tests/services/test_export_frames_contract.py
    - tests/services/test_transfer_job_contract.py
    - tests/views/media/test_hub_transfer_endpoints.py
    - tests/utils/test_structured_logging.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/import_files/test_sensitive_meta_storage.py
        tests/services/test_export_frames_contract.py tests/services/test_transfer_job_contract.py tests/views/media/test_hub_transfer_endpoints.py
        tests/utils/test_structured_logging.py -q
      note: Exit code 0
    note: 'Code review and focused verification confirm: export remains conditional on validation; transfer paths
      reject raw data and direct identifiers; empty or placeholder metadata preserves known identifiers; center and
      file path are not writable anonymizer fields; the import services do not log sensitive source or staging paths.'
    assessed_by: codex-sensitive-meta-20260820
    assessed_at: '2026-08-20T09:10:33.293358Z'
