      No host activation or previously distributed secret revocation.
    assessed_by: codex-hash-boundary-20261019
    assessed_at: '2026-10-19T13:12:15.618854Z'
- id: strict_legacy_hmac_inventory
  category: security
  title: Atomare HMAC-Migration des vollständigen Identitätsbestands
  acceptance:
  - migrate_legacy_hashes validiert alle Zentren, Quellen, Beziehungen und Zielkollisionen vor der ersten
    Datenbankmutation; fehlende Originale benötigen geprüfte Zuordnungen. Keine automatische Zusammenführung.
  - Eine PostgreSQL-Transaktion mit Advisory-Lock (20260921, 2), Schreibsperren und festem Schlüssel-Snapshot
    erhält Primärschlüssel und historische Patientenhash-Aliase. Jeder Fehler rollt alle Änderungen zurück.
  - Patient, PatientExamination, SensitiveMeta und Examiner verwenden die bestehenden domänenseparierten
    UTF-8-HMAC-Helfer mit ensure_ascii=False. Wiederholungen verändern passende aktive Fingerprints nicht.
  - Der aktive Schlüssel erfüllt die bestehende 256-Bit-Schlüsselvalidierung. Gebundene Zentrumsgrenzen
    bleiben erhalten; unvollständige oder fremde Inventare werden nicht still übersprungen.
  - Dry-run zeigt ausschließlich Hash-Differenzen und Zähler ohne Datenbankmutation. Nachprüfung verifiziert
    sämtliche Zielwerte und Beziehungen vor Commit; strukturierte Commit-Logs enthalten nur Zähler.
  - Wiederkehrende Importe erhalten nach Migration auch bei gelöschten Originalen ihre klinischen Verknüpfungen.
    Metadaten-Schreiber und Bericht-Pseudonymauflösung verwenden denselben direkten HMAC; historische
    SHA-256-von-HMAC-Zwischenstände werden ausschließlich aus Originalquellen verifiziert und migriert.
  required: true
  verification:
    kind: manual
    instructions: Pyright vor tests/services/test_migrate_legacy_hashes.py ausführen; PostgreSQL-Rollback,
      Schreibsperren, Unicode, Kollisionsvorprüfung, Alias-Erhalt und Wiederholungen prüfen.
    timeout_seconds: 1800
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: tests/services/test_migrate_legacy_hashes.py
    - kind: command
      reference: 'devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_migrate_legacy_hashes.py
        tests/services/test_patient_hash_aliases.py tests/services/test_historical_identity_resolution.py::test_returning_source_matches_erased_patient_without_restoring_identifiers
        -q --tb=short --show-capture=no --disable-warnings: 37 passed, 133 warnings, 110.07s; PostgreSQL.'
    - kind: command
      reference: 'Full Pyright: 0 errors,24 warnings; focused changed-module Pyright: 0 errors,0 warnings;
        Ruff passed; 65 structure manifests and37 feature definitions valid.'
    note: 'Isolierte PostgreSQL-Prüfung bestätigt vollständigen Rollback, Vorprüfung, Aliase, Wiederholbarkeit,
      Unicode, Quellenreview, Schreibsperren und wiederkehrende Importe. Breiter Integrationslauf: 76
      bestanden,2 alte Untersuchungsrotationsfehler; beide nach Korrektur im frischen 37-Test-Lauf bestanden.
      Separater koordinierter Hash-/Report-Regressionslauf: 220 bestanden. Keine Produktionsmigration
      oder Secret-Änderung.'
    assessed_by: codex-identity-migration-20261019
    assessed_at: '2026-10-19T08:05:52.488997Z'
- id: compromised_identity_salt_migration
  category: security
  title: Geprüfte Migration kompromittierter Identitätssalze erhält klinische Beziehungen
  acceptance:
  - LuxNix secrets-management.yml bleibt die einzige repositoryübergreifende Koordinationsquelle. Zentrale
    Identitätssalt-Auslieferung bleibt gemäß central_identity_salts_disabled deaktiviert; ältere Delivery-Kriterien
    autorisieren keine Aktivierung. Verschlüsselte lokale Secret-Persistenz gehört zu wg-lux/luxnix feature-tracking/luxnix_secret_lifecycle_readiness.yml,
    Kriterium encrypted_local_secret_persistence. Der Backendservice übernimmt weder Provisionierung noch
    Secret-Verteilung.
  - Ein typisierter Service verwendet die vorhandene Gruppenmigration und einen festen Schlüssel-Snapshot
    über Preview und Apply; kompatible PostgreSQL-Schreiber werden koordiniert. Preview und Wiederholung
    verändern keine Identitäten; unvollständige Kompromittierungs-Migration rollt vollständig zurück.
  - Ein explizit autorisierter lokaler Rotationsablauf bindet das neue aktive Salz an die erwartete Generation
    und erhält etablierte lokale Lesegenerationen. Keine zentrale Bundle-Injektion, automatische Zufallsgenerierung
    bei fehlendem Material, Default-Salze, stille Fallbacks oder Verwendung kompromittierter Salze für
    neue Identitäten. Lokale Identitätsschreiber verwenden denselben validierten Schlüssel-Snapshot; dieser
    Vertrag erlaubt keine zentrale Verteilung an Clients.
  - Fehlende oder gelöschte Originalidentitäten benötigen unabhängig geprüfte autorisierte Quellen. Übereinstimmung
    mit einem kompromittierten Hash allein bestätigt keine Person. Reviewdateien und Recoverydaten unterliegen
    dem LuxNix-Vertrag für verschlüsselte Persistenz; keine Originaldaten in Logs.
  - Vollständige Inventarisierung und Prüfung umfassen Patientengruppen, Metadaten, verknüpfte Untersuchungen,
    Untersucher, fehlende Quellen und widersprüchliche Beziehungen. Primärschlüssel bleiben stabil; Konflikte
    führen niemals zu automatischer Zusammenführung oder neu erfundenen Identitäten.
  - Historische Identitätssalze bleiben am Quellzentrum für die Wiedererkennung bestehender Patienten
    und historischer Hashreferenzen verfügbar, auch nach Löschung direkter Identifikatoren. Neue Patienten
    verwenden ausschließlich die aktive Generation. Alte Salze sind weder Dateientschlüsselungsschlüssel
    noch Authentifizierungs- oder Auslieferungsfallbacks. Unbekannte Generationen, fehlende Fingerprint-Evidenz
    und mehrdeutige Treffer erfordern Review; klinische Beziehungen werden niemals blind zusammengeführt.
    Abgeschlossene Hashmigration allein erlaubt kein Retirement der Quellgenerationen.
  - Historische Patientenhash-Aliase bleiben lokal, zentrumsgebunden und transaktional mit der Migration
    erhalten. Historische Untersuchungsreferenzen und bereits exportierte Altbestände benötigen eine eigene
    geprüfte Kompatibilitätsstrategie ohne erneute Hashübertragung. Hub-Reimport mit Identitätshashes
    wird gemäß HubTransfer.yml/local_identity_hash_boundary vor Registrierung abgewiesen, auch bei Wiederholungen.
  - Lokale interne Auflösung verwendet die gemeinsame zentrumsgebundene Aliasauflösung. Browser- und Exportverträge
    verwenden autorisierte lokale IDs gemäß identity_hash_response_boundary; keine Hashannahme oder Hashausgabe
    als Kompatibilitätsfallback. Serializer-Validierung schreibt keine Patienten und akzeptiert nur eindeutig
    aufgelöste Patienten aus autorisierten Zentren; unbekannte oder mehrdeutige Referenzen werden abgewiesen.
    Allgemeine Untersuchungs-APIs behalten ihre Unterstützung realer Patienten.
  - Automatische Medienzuordnung und die Untersuchungs-Modellfassade prüfen den kanonischen Patienten,
    das Zentrum und vorhandene Pseudonymbeziehungen vor jeder Mutation. Historische Patientenaliase verwenden
    dieselben Primärschlüssel; widersprüchliche Untersuchungs- oder Metadatenbeziehungen sowie fehlender
    Zentrumskontext erzeugen keine neuen Identitäten oder Verknüpfungen. Regressionstests prüfen Wiederholung,
    Alias-Konflikte, Zentrumsgrenzen und unveränderte Daten bei Ablehnung.
  - Autorisierte Metadatenkorrekturen bei Video und PDF prüfen bestehende automatische Verknüpfungen vor
    der Änderung und lösen sie nach erfolgreicher Korrektur atomar erneut auf. Bereits widersprüchliche
    Verknüpfungen werden abgewiesen; explizite oder zurückgestellte Fallzuordnungen werden nicht überschrieben.
  - Strukturierte Ergebnisse unterscheiden Preview, Commit, Rollback und verbleibende Blocker ohne Geheimnisse
    offenzulegen. Anhängende Audit-Historie bleibt unverändert; Replikate, Hub-Referenzen, Exporte und
    Backups brauchen koordinierte Abnahme vor Retirement. Rotation schützt keine bereits gestohlenen Hash-/Schlüsselkopien
    rückwirkend.
  required: true
  verification:
    kind: manual
    instructions: Vor pytest Pyright ausführen. tests/services/test_identity_salt_rotation.py um Gesamt-Snapshot,
      vollständigen Rollback, falsche Zielgeneration, fehlende Reviewquellen, Idempotenz und PostgreSQL-Parallelität
      erweitern; anschließend Import-/Identitätsregression und Restore auf isolierter produktionsnaher
      Umgebung.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/services/test_patient_hash_aliases.py
    - kind: test
      reference: tests/services/test_patient_examination_hash_resolution.py
    - kind: test
      reference: tests/serializers/test_patient_examination_identity.py
    - kind: test
      reference: tests/services/test_hub_transfer_unit_decisions.py
    - kind: test
      reference: tests/views/anonymization/test_sensitive_metadata_view.py
    - kind: command
      reference: 'Coordinated codex-anon-status-20261019: pytest tests/services/test_sensitive_meta_verification.py
        tests/services/test_sensitive_meta_update.py tests/views/anonymization/test_validate_view.py tests/views/anonymization/test_sensitive_metadata_view.py
        tests/services/test_anonymization_quality_evaluation.py tests/import_files/test_sensitive_metadata_concurrency_postgresql.py
        -q --tb=short --show-capture=no: 102 passed,133 warnings,233.73s,exit0; PostgreSQL.'
    - kind: command
      reference: 'devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_video_metadata_validation.py
        tests/services/test_sensitive_meta_external_id_validation.py tests/services/test_report_artifact_integrity.py
        tests/models/video/test_validation_deletion.py tests/services/test_media_security_lifecycle.py
        -q --tb=short --show-capture=no --disable-warnings --maxfail=5: 27 passed,133 warnings,383.24s,exit0;
        PostgreSQL. Pytest temporary-directory cleanup warnings remain outside changed paths.'
    note: 'Typisierte Gesamtmigration und historische Quellwiedererkennung bleiben erhalten. Vier Hashauflösungsbefunde
      geschlossen: zentrumsgebundener Hub-Reimport, schreibfreie autorisierte Serializer-Auflösung, konsistente
      automatische Fallzuordnung und zentrumsgebundene Untersuchungsfassade. Opaque aktuelle Kennungen
      bleiben explizit unterstützt; historische Aliase bleiben streng validiert. Autorisierte PDF-/Video-Metadatenkorrekturen
      prüfen alte Verknüpfungen und binden nach erfolgreicher Änderung atomar neu; Identitätsfence vor
      Zeilensperren. Initialer kombinierter Lauf: 147 bestanden, 3 Fehler; zwei Metadaten-Defaultassertionen
      und ein realer PDF-Korrekturfehler behoben. Gesamter betroffener Endpunktlauf anschließend im koordinierten
      102-Test-Lauf bestanden; zusätzliche 27 Validierungs-/Speicherintegrationstests bestanden. Vollständiger
      Pyright 0 Fehler/24 bestehende Warnungen, fokussiert 0/0, Ruff sauber. Historische Untersuchungsexporte
      sowie produktionsnahe Restore-/Flottenabnahme und koordinierte Secret-Freigaben bleiben offen. Keine
      Produktionsmigration oder Secret-Änderung.'
    assessed_by: codex-hash-audit-20261019
    assessed_at: '2026-10-19T08:33:28.030324Z'
- id: legacy_key_read_only_recovery
  category: security
  title: Alte verschlüsselte Dateien bleiben über explizite Leseschlüssel wiederherstellbar
  acceptance:
  - Dieses Kriterium besitzt nur die Backend-Lese-/Migrationsverträge. Secret-Kustodie und verschlüsselte
    Schlüsselablage gehören zu LuxNix, Prozessintegration zu wg-lux/lx-annotate feature-tracking/LuxNixPressingIssues.yml
    Kriterium managed_secret_consumer_acceptance.
  - Alle unterstützten historischen verschlüsselten Dateiformate und tatsächlichen Schlüsselgenerationen
    werden inventarisiert, einschließlich Backups und bisher unregistrierter Artefakte. Schlüssel- oder
    Versionsgrenzen wie maximal acht retiring-Einträge dürfen vorhandene Dateien nicht still unlesbar
    machen; explizite sichere Migration oder Generationauflösung ist erforderlich.
  - Ausschließlich neue aktive Schlüssel erzeugen neue Ciphertexte. Alte Schlüssel dienen nur authentifizierten
    Reads oder expliziter Re-Verschlüsselung; unbekannte Schlüssel, manipulierte Tags, unvollständige
    Dateien und widersprüchliche Provenienz scheitern geschlossen ohne Klartext- oder Default-Key-Fallback.
  - Python-, Rust-, Streaming- und Hashleser verwenden denselben validierten Schlüssel-Snapshot und identische
    Fehlersemantik. Prüfsummen über authentifizierten Klartext und klinische Referenzen bleiben bei Migration
    erhalten; der letzte gültige Bestand wird niemals vor vollständiger Verifikation entfernt.
  - Reconcile signing-key retirement in config/secret_keyring.py with LuxNix criterion legacy_decryption_only_compatibility;
    legacy encrypted-file readability never authorizes obsolete request credentials, signing-key fallbacks
    or weakened TLS. Keep media master keys local and separate from center identity salts and NetworkNode.shared_secret.
  required: true
  verification:
    kind: manual
    instructions: Vor pytest Pyright ausführen; tests/services/test_secret_rotation.py, tests/environment/test_secret_resolution.py
      und native Reader-Verträge um mehrere reale Formatgenerationen, falsche/fehlende Schlüssel, Retirement
      nach Restore und Unterbrechung ergänzen. Keine produktiven Schlüssel in Testfixtures übernehmen.
    timeout_seconds: 1800
  assessment:
    status: not_assessed
    evidence: []
    note: Nur TODO-Erfassung am 16.10.2026. config/secret_keyring.py unterstützt aktive und begrenzt viele
      retiring-Generationen; frühere Reader-Tests sind unter online_secret_rotation und StorageSecurity.yml
      dokumentiert. Die neue vollständige Bestands- und Retirement-Anforderung wurde nicht ausgeführt
      oder verifiziert.
- id: bounded_video_reimport
  category: functionality
  title: Video re-import has bounded workload budgets and actionable timeout failures
  acceptance:
  - Frame-count budgets include throughput margin, finalization time and cleanup grace; invalid or oversized
    requests are rejected before dispatch.
  - Direct and wrapped Celery soft timeouts persist processing_timeout without automatic retry or publication.
  - Stale recovery cannot reclaim a re-import within its maximum runtime.
  - OCR telemetry and atomic metadata validation preserve exhaustive coverage and omit clinical values.
  required: true
  verification:
    kind: manual
    instructions: Run focused budget, reimport, observability and paired anonymizer tests; benchmark a
      representative long video before deployment.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: 'RUN_VIDEO_TESTS=true TEST_DB_ENGINE=django.db.backends.postgresql SKIP_EXPENSIVE_TESTS=false
