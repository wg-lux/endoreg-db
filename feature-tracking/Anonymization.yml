- id: typed_media_deletion
  category: data_integrity
  title: Explicit media identity controls individual deletion
  acceptance:
  - Individual deletion requires video or pdf in the route and rejects untyped or invalid requests.
  - Equal numeric IDs never select the other media type, including when the requested type is missing.
  - Existing model storage cleanup and upload-job provenance retention remain authoritative.
  - Missing or multiple upload jobs do not cause a post-deletion lookup failure.
  required: true
  verification:
    kind: manual
    instructions: Run focused media-management endpoint tests and Pyright; verify frontend typed callers.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence: []
    assessed_by: codex-video16-20260925
    assessed_at: '2026-09-25T08:19:02Z'
- id: approved_report_artifact_retention
  category: functionality
  title: Explicit report approval retains the verified processed PDF
  acceptance:
  - Approval verifies the existing processed PDF and its persisted digest before marking the report validated
    or scheduling raw cleanup.
  - Manual correction PDFs are retained byte-for-byte after explicit acceptance; no rendering from text
    or raw-document export fallback is permitted.
  - Missing, unreadable or mismatched processed PDFs reject approval with an actionable conflict response
    and preserve the source and validation state.
  required: true
  verification:
    kind: command
    command:
    - env
    - TEST_DB_ENGINE=django.db.backends.postgresql
    - SKIP_EXPENSIVE_TESTS=false
    - .devenv/state/venv/bin/pytest
    - tests/views/anonymization/test_validate_view.py
    - tests/services/test_report_artifact_integrity.py
    - tests/views/report/test_pdf_redaction.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: '2026-09-25: focused Pyright zero errors/warnings; SQLite with SKIP_EXPENSIVE_TESTS=false:
        validation view, artifact integrity and redaction suites 33 passed, 12 video tests skipped. Ruff
        passed. lx-annotate hub integration confirms correction bytes and filename retained, raw-only
        cleanup, and hub eligibility; 28 hub tests passed against source backend.'
    note: All three acceptance bullets reviewed. Approval verifies before state mutation; accepted bytes
      are retained; unusable artifacts return 409 and preserve raw/validation state. Source change not
