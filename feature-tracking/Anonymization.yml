- id: online_secret_rotation
  category: security
  title: Online secret rotation preserves readable media and stable clinical links
  acceptance:
  - Central identity injection is prohibited; preserve established local keyrings and reject SecretSpec
    bundles before file access.
  - Repository rotation guidance links to the canonical LuxNix secrets-management.yml coordination catalog
    and matches the installed command's explicit partial-commit contract; no duplicate readiness record
    is created.
  - Der Identitätsmigrationsbefehl rollt einen unvollständigen Apply-Lauf standardmäßig vollständig zurück;
    nur --apply --allow-partial erlaubt bewusstes Speichern unabhängig geprüfter Gruppen. Regressionstests
    prüfen Patienten-, Untersuchungs- und Metadatenhashes sowie applied/rolled_back im Ergebnis.
  - Native Einzel- und Batch-Hashleser erhalten denselben validierten Schlüssel-Snapshot wie Python; aktive
    und auslaufende 16-, 24- und 32-Byte-Schlüssel sind getestet. Ein explizit leerer Salt-Snapshot bleibt
    innerhalb einer Operation stabil; Produktionssettings erzeugen keinen Ersatz-Signaturschlüssel.
  - Einzeldateien und Keyrings verwenden dieselbe private Dateiprüfung und dieselben Validatoren für Master-Key-Material,
    Identitätssalz und Django-Signaturschlüssel; der Health-Check bewertet den tatsächlich geladenen Django-Schlüssel,
    nicht eine möglicherweise ersetzte Quelldatei.
  - A private versioned keyring selects one active master key for new writes and explicitly retiring keys
    for reads; running storage instances observe atomic keyring changes.
  - Resumable media rotation generates fresh data keys, authenticates every chunk and verifies unchanged
    plaintext before atomic publication; active media leases defer replacement and failures retain the
    original.
  - HTTP Live Streaming content keys remain readable during overlap and compromised-key recovery regenerates
    content keys and segments through the existing generation workflow.
  - Identity salt rotation explicitly supports enrolled legacy default_salt for reviewed migration and
    source recognition only, retains patient and examination links, and refuses incomplete or ambiguous
    source identities rather than inventing replacements.
  - Django signing-key rotation is distinguished from media encryption; previous signing keys are never
    verification fallbacks, including planned rotation. Consumer reload invalidates old signatures.
  - Focused type, integrity, failure, streaming and identity tests pass; deployment requires staged reader
    rollout and reviewed retirement evidence.
  required: true
  verification:
    kind: manual
    instructions: Run focused rotation and import/streaming integration tests, then rehearse overlapping
      key generations and key retirement on an isolated production-like deployment.
    timeout_seconds: 1800
