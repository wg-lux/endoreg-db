schema_version: '1.0'
id: api_contracts
name: API-Verträge
description: Stabile, autorisierte und regressionsgetestete REST-Verträge für alle produktionskritischen
  Endpunkte.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/api_route_test_matrix.md
  disposition: migrated
  note: Die Routenmatrix bleibt Coverage-Referenz; der Fertigstellungsstatus wird hier abgeleitet.
definition_of_done:
- id: documented_scope
  category: requirements
  title: Kanonische und kompatible Routen sind vollständig inventarisiert
  acceptance:
  - Jede produktionskritische Route hat Zweck, Mount, Supportstatus und Eigentümer.
  - Für lx-annotate sind /endoreg-api/ und /dtypes-api/ die kanonischen Mounts; /api/ und /base_api/ sind
    ausschließlich dokumentierte Kompatibilitätsaliasse.
  - Jeder Kompatibilitätsalias besitzt ein explizites Entfernungskriterium; neue Consumer verwenden ausschließlich
    die kanonischen Mounts und zentralen URL-Helper.
  required: true
  verification:
    kind: manual
    instructions: URL-Konfiguration gegen Routenmatrix und Supportvertrag prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/root_urls.py; endoreg_db/utils/api_urls.py; docs/api_route_test_matrix.md
    - kind: document
      reference: 'docs/api_route_test_matrix.md: Mount Ownership And Compatibility'
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/test_app_startup.py tests/docs/test_show_urls_contract.py
        tests/test_resolve.py tests/utils/test_api_urls.py -q (19 route/startup contract tests passed)
    - kind: command
      reference: manage.py show_urls --format csv before/after URLConf consolidation (505 rows; byte-identical
        SHA-256 38fd085855cdd0ed9e95602ef944efa8dfd05103c821771e6ee04f7646415b20)
    note: endoreg_db.root_urls ist nun die einzige kanonische Root-URLConf; die stale Tracker-Referenz
      auf die nie konfigurierte Dublette wurde korrigiert. Kanonische Mounts und Kompatibilitätsaliasse
      sind byteidentisch geblieben. Die Routenmatrix erfasst weiterhin noch nicht jede produktionskritische
      Route mit einzeln ausgewiesenem Owner und Supportstatus.
    assessed_by: Codex
    assessed_at: '2026-08-04T16:06:39.859018Z'
- id: route_contracts
  category: functionality
  title: Kanonische Routen und Payloadverträge stimmen mit der Implementierung überein
  acceptance:
  - Alle dokumentierten Routen lösen auf die erwarteten Views auf.
  - Backend- und Wire-Verträge verwenden snake_case; die zentrale lx-annotate-Clientgrenze darf Requests
    nach snake_case und Responses nach camelCase konvertieren, ohne endpoint-spezifische Sonderpfade.
  - GET media/videos/{id}/fps/ und GET/POST media/videos/{id}/segments/normalize-fps/ validieren die persistierte
    positive, endliche Bildrate ohne vollständiges Media-Staging. Fehlende oder ungültige persistierte
    Werte liefern HTTP 422; dateibasierte Verifikation bleibt dem schweren Worker beziehungsweise expliziten
    Integritätsworkflow vorbehalten.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - scripts/check_route_matrix.py
    - --warn-on-missing-backend
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/python scripts/check_route_matrix.py --warn-on-missing-backend
      note: Exit-Code 0
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_video_fps_normalization_jobs.py
        tests/views/video/test_video_fps_view.py tests/views/video/test_segment_validation_status_view.py::VideoSegmentFpsNormalizationStatusViewTest
        tests/views/video/test_segments_crud.py::VideoSegmentFpsNormalizationViewTest -q
      note: Metadatenbasierter FPS-/Normalisierungsstatus-Vertrag einschließlich HTTP-422-Fehlerpfad bestanden.
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/python scripts/check_route_matrix.py --warn-on-missing-backend
        (25 documented routes matched 489 normalized backend routes; 10 referenced test files exist)
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/scripts/test_check_route_matrix.py
        tests/docs/test_show_urls_contract.py tests/test_resolve.py tests/test_app_startup.py tests/scripts/test_check_documentation_governance.py
        -q (22 passed)
    note: Die kanonischen Routenverträge werden nun reproduzierbar aus der versionierten Markdown-Matrix
      gegen die reale Django-URL-Ausgabe geprüft. Der Legacy-JSON-Eingabevertrag bleibt unterstützt; snake_case-
      und FPS-Verträge bleiben durch die bestehenden fokussierten Evidenzen belegt.
    assessed_by: Codex
    assessed_at: '2026-08-04T16:18:17.139615Z'
- id: route_coverage
  category: testing
  title: Jede Hochrisikoroute besitzt einen belastbaren Contract-Test
  acceptance:
  - Routenmatrix und Testdateien sind synchron.
  - Authentifizierung, Autorisierung, Validierung und Fehlerfälle sind nicht nur Happy-Path-getestet.
  - Hochrisiko-Medienstatusrouten besitzen einen Regressionstest, der vollständiges Entschlüsseln oder
    Staging innerhalb des Webprozesses explizit fehlschlagen lässt.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/docs/test_show_urls_contract.py
    - tests/test_resolve.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/docs/test_show_urls_contract.py tests/test_resolve.py
        -q
      note: Exit-Code 0
    - kind: test
      reference: tests/services/test_video_fps_normalization_jobs.py::test_normalization_status_uses_persisted_fps_without_probing_media;
        tests/views/video/test_video_fps_view.py::VideoFpsViewTest::test_uses_persisted_video_fps_without_media_probe
    assessed_by: Codex
    assessed_at: '2026-07-23T08:18:03.336332Z'
- id: access_controls
  category: security
  title: Alle geschützten Routen erzwingen Authentifizierung und Scope
  acceptance:
  - Medien-, Berichts-, Upload- und Adminrouten erzwingen ihren dokumentierten Ressourcen-, Patienten-
    und Center-Scope.
  - Auf Site-Nodes wird Center-Zugriff als Keycloak-synchronisierte Mehrfachzuordnung modelliert; fehlende
    oder unbekannte Center-Gruppen verweigern den Zugriff sicher.
  - Auf dem Central Hub dürfen authentifizierte Leser anonymisierte Medien center-übergreifend lesen;
    Raw-Medien bleiben auch dort center-bezogen und dürfen den lokalen Storage-Bereich nicht verlassen.
  - Ausdrücklich center-übergreifende Annotationsrouten erzwingen stattdessen Dataset-, Annotator- und
    Rollenberechtigungen; Raw-Video-Streams bleiben center-bezogen.
  - DEBUG-Bypass kann in keinem Produktionsprofil aktiv sein.
  required: true
  verification:
    kind: manual
    instructions: Routenmatrix gegen Permission-Klassen und negative Authz-Tests prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/authz/test_center_group_sync.py
        tests/authz/test_dynamic_permissions.py tests/authz/test_video_media_policy.py tests/services/test_center_access.py
        tests/views/media/test_center_scoped_reads.py tests/views/media/test_video_media_view.py tests/views/misc/test_upload_endpoints.py
        tests/views/test_center_access_matrix.py tests/views/video/test_annotation_access_controls.py
        tests/deployment/test_prod_settings_contract.py -q (103 passed, 2 warnings in 67.03s)
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/views/video/test_hls_stream.py::test_centerless_hub_user_can_read_processed_playlist_key_and_segment
        tests/views/video/test_hls_stream.py::test_central_hub_processed_playlist_rejects_anonymous_user
        -q (2 passed, 2 warnings in 48.60s)
    note: Die fokussierte Zugriffskontroll-Lane belegt fail-closed Keycloak-Center-Synchronisierung, Null-/Ein-/Mehrfach-Center-Auflösung,
      Patienten-, Report-, Upload- und Raw-Media-Scope, den eingeschränkten anonymisierten Central-Hub-Lesezugriff,
      serverseitige Annotator-Identität und Rollenprüfung sowie die Ablehnung von DEBUG in Produktion.
      Das Kriterium ist von not_assessed auf in_progress vorgerückt. Für verified fehlen noch ein vollständiger
      routeweiser Abgleich aller produktionskritischen Admin- und Reporting-Endpunkte sowie explizite
      Negativnachweise für AIDataSet-Zuordnung beziehungsweise Dataset-Scope an den center-übergreifenden
      Annotationsrouten.
    assessed_by: codex-root-20260902
    assessed_at: '2026-09-02T11:53:51.773011Z'
- id: deprecation_control
  category: maintainability
  title: Legacy-Routen und Serializer-Shims haben ein kontrolliertes Ende
  acceptance:
  - /api/ und /base_api/ sowie jeder weitere Alias sind markiert, getestet und mit Entfernungsvoraussetzung
    versehen.
  - Neue lx-annotate-Aufrufer verwenden endoregApi() oder dtypesApi() statt direkter Legacy-Mounts.
  - Tote oder ungetestete Kompatibilitätspfade sind entfernt.
  required: true
  verification:
    kind: manual
    instructions: URL- und Serializer-Shims inventarisieren und Supportstatus reviewen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: /home/admin/dev/lx-annotate/frontend/src/stores/annotationStats.ts
    - kind: test
      reference: /home/admin/dev/lx-annotate/frontend/src/stores/__tests__/annotationStats.test.ts
    - kind: test
      reference: /home/admin/dev/lx-annotate/frontend/src/api/__tests__/apiPrefixContract.test.ts
    - kind: document
      reference: 'docs/api_route_test_matrix.md: Mount Ownership And Compatibility'
    note: Produktive lx-annotate-TypeScript-/Vue-Quellen werden nun repository-weit gegen direkte /api/-
      und /base_api/-Stringliterale geprüft; der gefundene Runtime-Hardcode ist migriert. Offen bleiben
      die kontrollierte Ablösung des r()-Wrappers sowie Deployment- und Reverse-Proxy-Nachweise vor Entfernung
      der weiterhin unterstützten Aliasse.
    assessed_by: Codex
    assessed_at: '2026-07-23T08:33:13.774895Z'
- id: operational_readiness
