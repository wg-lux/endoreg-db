- id: route_contracts
  category: functionality
  title: Canonical routes and payload contracts match the implementation
  acceptance:
  - All documented routes resolve to the expected views.
  - Backend and wire contracts use snake_case; the centralized lx-annotate client boundary may convert requests
    to snake_case and responses to camelCase without endpoint-specific special paths.
  - GET media/videos/{id}/fps/ and GET/POST media/videos/{id}/segments/normalize-fps/ validate the persisted
    positive, finite frame rate without complete media staging. Missing or invalid persisted values return
    HTTP 422; file-based verification remains reserved for the resource-intensive worker or an explicit
    integrity workflow.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - scripts/check_route_matrix.py
    - --warn-on-missing-backend
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/python scripts/check_route_matrix.py --warn-on-missing-backend
      note: Exit code 0
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/services/test_video_fps_normalization_jobs.py
        tests/views/video/test_video_fps_view.py tests/views/video/test_segment_validation_status_view.py::VideoSegmentFpsNormalizationStatusViewTest
        tests/views/video/test_segments_crud.py::VideoSegmentFpsNormalizationViewTest -q
      note: Metadata-based frames-per-second/normalization status contract, including the HTTP 422 error path, passed.
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/python scripts/check_route_matrix.py --warn-on-missing-backend
        (25 documented routes matched 489 normalized backend routes; 10 referenced test files exist)
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/scripts/test_check_route_matrix.py
        tests/docs/test_show_urls_contract.py tests/test_resolve.py tests/test_app_startup.py tests/scripts/test_check_documentation_governance.py
        -q (22 passed)
    note: The canonical route contracts are now reproducibly checked from the versioned Markdown matrix
      against the actual Django URL output. The legacy JSON input contract remains supported; snake_case
      and frames-per-second contracts remain supported by the existing focused evidence.
    assessed_by: Codex
    assessed_at: '2026-08-04T16:18:17.139615Z'
- id: route_coverage
