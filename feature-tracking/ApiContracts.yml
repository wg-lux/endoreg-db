schema_version: "1.0"
id: api_contracts
name: API-Verträge
description: Stabile, autorisierte und regressionsgetestete REST-Verträge für alle produktionskritischen Endpunkte.
owners:
  - endoreg_db maintainers
production_critical: true
source_documents:
  - path: docs/api_route_test_matrix.md
    disposition: migrated
    note: Die Routenmatrix bleibt Coverage-Referenz; der Fertigstellungsstatus wird hier abgeleitet.
definition_of_done:
  - id: documented_scope
    category: requirements
    title: Kanonische und kompatible Routen sind vollständig inventarisiert
    acceptance:
      - Jede produktionskritische Route hat Zweck, Mount, Supportstatus und Eigentümer.
      - Für lx-annotate sind /endoreg-api/ und /dtypes-api/ die kanonischen Mounts; /api/ und /base_api/ sind ausschließlich dokumentierte Kompatibilitätsaliasse.
      - Jeder Kompatibilitätsalias besitzt ein explizites Entfernungskriterium; neue Consumer verwenden ausschließlich die kanonischen Mounts und zentralen URL-Helper.
    required: true
    verification:
      kind: manual
      instructions: URL-Konfiguration gegen Routenmatrix und Supportvertrag prüfen.
    assessment: &not_assessed
      status: not_assessed
  - id: route_contracts
    category: functionality
    title: Kanonische Routen und Payloadverträge stimmen mit der Implementierung überein
    acceptance:
      - Alle dokumentierten Routen lösen auf die erwarteten Views auf.
      - Backend- und Wire-Verträge verwenden snake_case; die zentrale lx-annotate-Clientgrenze darf Requests nach snake_case und Responses nach camelCase konvertieren, ohne endpoint-spezifische Sonderpfade.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, scripts/check_route_matrix.py, --warn-on-missing-backend]
    assessment:
      status: in_progress
      evidence:
        - kind: review
          reference: docs/api_route_test_matrix.md; endoreg_db/views/video/video_timeline.py
        - kind: test
          reference: tests/views/video/test_video_timeline_view.py; tests/utils/test_media_urlpatterns_contract.py
      note: Der neue kanonische Frame-Nachbarschaftsvertrag ist dokumentiert, aufgelöst, center-scoped sowie für Validierungs- und Fehlerfälle getestet. Die repository-weite Routenabnahme bleibt offen.
      assessed_by: Codex
      assessed_at: '2026-07-20T11:12:00Z'
  - id: route_coverage
    category: testing
    title: Jede Hochrisikoroute besitzt einen belastbaren Contract-Test
    acceptance:
      - Routenmatrix und Testdateien sind synchron.
      - Authentifizierung, Autorisierung, Validierung und Fehlerfälle sind nicht nur Happy-Path-getestet.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/pytest, tests/docs/test_show_urls_contract.py, tests/test_resolve.py, -q]
      timeout_seconds: 600
    assessment: *not_assessed
  - id: access_controls
    category: security
    title: Alle geschützten Routen erzwingen Authentifizierung und Scope
    acceptance:
      - Medien-, Berichts-, Upload- und Adminrouten erzwingen ihren dokumentierten Ressourcen-, Patienten- und Center-Scope.
      - Auf Site-Nodes wird Center-Zugriff als Keycloak-synchronisierte Mehrfachzuordnung modelliert; fehlende oder unbekannte Center-Gruppen verweigern den Zugriff sicher.
      - Auf dem Central Hub dürfen authentifizierte Leser anonymisierte Medien center-übergreifend lesen; Raw-Medien bleiben auch dort center-bezogen und dürfen den lokalen Storage-Bereich nicht verlassen.
      - Ausdrücklich center-übergreifende Annotationsrouten erzwingen stattdessen Dataset-, Annotator- und Rollenberechtigungen; Raw-Video-Streams bleiben center-bezogen.
      - DEBUG-Bypass kann in keinem Produktionsprofil aktiv sein.
    required: true
    verification:
      kind: manual
      instructions: Routenmatrix gegen Permission-Klassen und negative Authz-Tests prüfen.
    assessment: *not_assessed
  - id: deprecation_control
    category: maintainability
    title: Legacy-Routen und Serializer-Shims haben ein kontrolliertes Ende
    acceptance:
      - /api/ und /base_api/ sowie jeder weitere Alias sind markiert, getestet und mit Entfernungsvoraussetzung versehen.
      - Neue lx-annotate-Aufrufer verwenden endoregApi() oder dtypesApi() statt direkter Legacy-Mounts.
      - Tote oder ungetestete Kompatibilitätspfade sind entfernt.
    required: true
    verification:
      kind: manual
      instructions: URL- und Serializer-Shims inventarisieren und Supportstatus reviewen.
    assessment: *not_assessed
  - id: operational_readiness
    category: operations
    title: Vertragsbrüche werden vor Deployment erkannt
    acceptance:
      - Routenprüfung ist lokal und in CI reproduzierbar.
      - Fehlerausgaben benennen Route, erwarteten Vertrag und fehlende Abdeckung.
    required: true
    verification:
      kind: command
      command: [.devenv/state/venv/bin/python, scripts/check_route_matrix.py, --warn-on-missing-backend]
    assessment: *not_assessed
  - id: api_documentation
    category: documentation
    title: API-Vertrag ist für Consumer aktuell und eindeutig
    acceptance:
      - Mounts, Versionierung, Authentifizierung, Payloads und Fehlerverhalten sind dokumentiert.
    required: true
    verification:
      kind: manual
      instructions: Dokumentierten Ablauf für je eine Medien-, Upload- und Berichtsroute nachvollziehen.
    assessment: *not_assessed
