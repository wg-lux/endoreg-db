- id: documented_scope
  category: requirements
  title: Canonical and compatible routes are fully inventoried
  acceptance:
  - Every production-critical route has a purpose, mount, support status, and owner.
  - For lx-annotate, /endoreg-api/ and /dtypes-api/ are the canonical mounts; /api/ and /base_api/ are
    documented compatibility aliases only.
  - Every compatibility alias has an explicit removal criterion; new consumers use only the canonical mounts
    and centralized URL helpers.
  required: true
  verification:
    kind: manual
    instructions: Review the URL configuration against the route matrix and support contract.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/root_urls.py; endoreg_db/utils/api_urls.py; docs/api_route_test_matrix.md
