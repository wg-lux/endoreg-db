- id: access_controls
  category: security
  title: All protected routes enforce authentication and scope
  acceptance:
  - Media, report, upload, and administration routes enforce their documented resource, patient, and center scope.
  - On site nodes, center access is modeled as a Keycloak-synchronized multiple assignment; missing or unknown
    center groups deny access safely.
  - On the central hub, authenticated readers may read anonymized media across centers; raw media remains
    center-scoped there as well and must not leave the local storage boundary.
  - Explicitly cross-center annotation routes instead enforce dataset, annotator, and role permissions;
    raw video streams remain center-scoped.
  - The DEBUG bypass cannot be active in any production profile.
  required: true
  verification:
    kind: manual
    instructions: Review the route matrix against permission classes and negative authorization tests.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/authz/test_center_group_sync.py
        tests/authz/test_dynamic_permissions.py tests/authz/test_video_media_policy.py tests/services/test_center_access.py
        tests/views/media/test_center_scoped_reads.py tests/views/media/test_video_media_view.py tests/views/misc/test_upload_endpoints.py
        tests/views/test_center_access_matrix.py tests/views/video/test_annotation_access_controls.py
        tests/deployment/test_prod_settings_contract.py -q (103 passed, 2 warnings in 67.03s)
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/views/video/test_hls_stream.py::test_centerless_hub_user_can_read_processed_playlist_key_and_segment
        tests/views/video/test_hls_stream.py::test_central_hub_processed_playlist_rejects_anonymous_user
        -q (2 passed, 2 warnings in 48.60s)
    note: The focused access-control lane demonstrates fail-closed Keycloak center synchronization, resolution
      of zero, one, or multiple centers, patient, report, upload, and raw-media scope, restricted anonymized
      central-hub read access, server-side annotator identity and role checks, and rejection of DEBUG in production.
      The criterion has advanced from not_assessed to in_progress. Verification still requires a complete
      route-by-route review of all production-critical administration and reporting endpoints and explicit
      negative evidence for AIDataSet assignment or dataset scope on the cross-center annotation routes.
    assessed_by: codex-root-20260902
    assessed_at: '2026-09-02T11:53:51.773011Z'
- id: deprecation_control
