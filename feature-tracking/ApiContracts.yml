  - Routenprüfung ist lokal und in CI reproduzierbar.
  - Fehlerausgaben benennen Route, erwarteten Vertrag und fehlende Abdeckung.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - scripts/check_route_matrix.py
    - --warn-on-missing-backend
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: /home/admin/endoreg-db/.devenv/state/venv/bin/python scripts/check_route_matrix.py --warn-on-missing-backend
        (exit 0; documented=25, backend=489, test_files=10)
    - kind: command
      reference: '/home/admin/endoreg-db/.devenv/state/venv/bin/pytest tests/scripts/test_check_route_matrix.py
        -q (7 passed: missing matrix, malformed coverage, missing backend and legacy JSON compatibility)'
    - kind: document
      reference: docs/api_route_test_matrix.md#reproducible-contract-check
    - kind: command
      reference: SKIP_EXPENSIVE_TESTS=true RUN_VIDEO_TESTS=false USE_STUB_MODEL_META=true TEST_DB_REUSE=true
        .devenv/state/venv/bin/pytest -q -m "not (expensive or video or pipeline or ai or slow or ffmpeg)"
        -n auto --dist=loadscope (1327 passed, 1 skipped, 803 subtests passed)
    note: Die Routenprüfung ist lokal und in CI ohne absolute lx-annotate-Tempdatei reproduzierbar. Fehlende
