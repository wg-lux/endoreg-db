definition_of_done:
- id: documented_scope
  category: requirements
  title: Rollen, Grenzen, Transfermodi und Cleanup-Policy sind festgelegt
  acceptance:
  - standalone, site_node und central_hub haben explizite erlaubte Ingresspfade.
  - Metadaten-, Medien-, Replay-, Konflikt- und Retentionregeln sind eindeutig.
  required: true
  verification:
    kind: manual
    instructions: Hub-Vertrag gegen Deploymentrollen, Endpunkte, Modelle und Services prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/wiki/hub_ingest_current_state.md
    - kind: document
      reference: docs/hub_ingest_operations.md
    note: Rollenmatrix, Ingressgrenzen, Replay-/Konfliktregeln, Retention und die Phase-1/Phase-2-Grenze
      sind gegen Services, Endpunkte und Sendervertrag geprüft.
    assessed_by: Codex
    assessed_at: '2026-07-17T12:59:24.006782Z'
- id: authenticated_ingress
  category: security
  title: Node- und Nutzergrenzen sind fail-closed authentifiziert und autorisiert
  acceptance:
  - Erforderliches mTLS kann nicht auf Shared-Secret-only zurückfallen.
  - Center-Scope wird serverseitig erzwungen; Raw-Media-Export bleibt verboten.
  - Der Master-Key wird weder übertragen noch in Anwendungskonfiguration gespeichert.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/authz/test_video_media_policy.py
    - tests/views/media/test_hub_transfer_endpoints.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/authz/test_video_media_policy.py
        tests/views/media/test_hub_transfer_endpoints.py -q
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-17T12:50:59.506359Z'
- id: idempotent_ingest
  category: functionality
  title: Upload, Watcher und Transfer konvergieren idempotent auf denselben Workflow
  acceptance:
  - Wiederholung und Replay erzeugen keine doppelten fachlichen Ressourcen.
  - Receiver-Entscheidungen behandeln Content-, Transfer- und Processing-Identität deterministisch.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/views/media/test_hub_transfer_endpoints.py
    - tests/services/test_preanonymized_watcher_ingest.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/views/media/test_hub_transfer_endpoints.py
        tests/services/test_preanonymized_watcher_ingest.py -q
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-17T12:51:46.683120Z'
- id: transfer_integrity
  category: data_integrity
  title: Metadaten, Artefakte und Provenienz werden als konsistenter Transfer persistiert
  acceptance:
  - Hashes, Ressourcen-Snapshot, Zustände und Acknowledgement sind überprüfbar verbunden.
  - Inkonsistenz führt abhängig von der Ingressgrenze zu Quarantäne, LOST oder persistentem INCONSISTENT,
    nie zu unsicherer Auto-Recovery.
  required: true
  verification:
    kind: manual
    instructions: Teiltransfer, Hashfehler, Replay und widersprüchliche Metadaten end-to-end prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'endoreg-db Hub-/Integrity-Bahn: 91 passed'
    - kind: command
      reference: 'lx-annotate Sender-/End-to-End-Bahn: 69 passed'
    note: Content- und Processed-Hashes, typed Snapshots/Provenienz, idempotentes Acknowledgement sowie
      Quarantäne, LOST und persistentes INCONSISTENT wurden boundary-spezifisch geprüft.
    assessed_by: Codex
    assessed_at: '2026-07-17T12:59:24.831286Z'
