      remain idempotent.
    assessed_by: Codex
    assessed_at: '2026-07-20T14:17:12.621603Z'
- id: transfer_integrity
  category: data_integrity
  title: Metadaten, Artefakte und Provenienz werden als konsistenter Transfer persistiert
  acceptance:
  - Hashes, Ressourcen-Snapshot, Zustände und Acknowledgement sind überprüfbar verbunden.
  - Inkonsistenz führt abhängig von der Ingressgrenze zu Quarantäne, LOST oder persistentem INCONSISTENT,
    nie zu unsicherer Auto-Recovery.
  required: true
  verification:
    kind: manual
    instructions: Teiltransfer, Hashfehler, Replay und widersprüchliche Metadaten end-to-end prüfen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'PYTHONPATH=/home/admin/lx-data-models focused hub boundary suite: 62 passed'
    note: Source-center claims are bound to authenticated node ownership; cross-node and cross-center
      resource-hash collisions persist INCONSISTENT without mutating existing video/report rows, and conflicted
      media uploads are rejected.
    assessed_by: Codex
    assessed_at: '2026-07-20T14:17:14.442790Z'
