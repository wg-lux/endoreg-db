- id: authenticated_ingress
  category: security
  title: Node- und Nutzergrenzen sind fail-closed authentifiziert und autorisiert
  acceptance:
  - Erforderliches mTLS kann nicht auf Shared-Secret-only zurückfallen.
  - Center-Scope wird serverseitig erzwungen; Raw-Media-Export bleibt verboten.
  - Der Master-Key wird weder übertragen noch in Anwendungskonfiguration gespeichert.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/authz/test_video_media_policy.py
    - tests/views/media/test_hub_transfer_endpoints.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'Targeted Pyright: 0 errors; canonical local lx-dtypes focused hub boundary suite: 63
        passed'
    note: Transfer senders must have an owning center and may only declare that center; nullable ownership
      can no longer authorize arbitrary center claims.
    assessed_by: Codex
    assessed_at: '2026-07-20T14:19:36.322566Z'
