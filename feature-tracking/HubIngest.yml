- id: storage_and_cleanup
  category: operations
  title: Storage, Cleanup, Wiederanlauf und Kapazität sind produktionsreif
  acceptance:
  - Cleanup erfolgt erst nach bestätigter Policy und vollständiger Integritätsprüfung.
  - Hängende Jobs, Quarantäne, Speicherknappheit und Wiederanlauf sind sichtbar und beherrschbar.
  - Phase 1 bleibt auf mTLS-geschützte anonymisierte Processed-Media-Transfers begrenzt; eigenständiger
    Blobexport bleibt bis zur Envelope-Encryption-Phase gesperrt.
  required: true
  verification:
    kind: manual
    instructions: Produktionsnahe Transfer-, Quarantäne-, Cleanup- und Recovery-Übung durchführen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'endoreg-db Operations-/Health-/Quarantäne-Bahn: 91 passed'
    - kind: command
      reference: lx-annotate Hub-Cleanup-/Recovery-Tests in 69 passed
    - kind: document
      reference: docs/hub_ingest_operations.md
    note: Upload-Cleanup nutzt den typisierten Storage-Wrapper und strukturierte Logs. Outbound/Transfer-Cleanup
      bleibt bis verified apply explizit retained, eligible oder deferred. Phase 1 erlaubt nur mTLS-geschützte
      anonymisierte Processed-Media-Transfers; eigenständiger Blobexport bleibt gesperrt.
    assessed_by: Codex
    assessed_at: '2026-07-17T12:59:25.664309Z'
- id: observability
  category: observability
  title: Jeder Transfer ist über strukturierte Ereignisse korrelierbar
  acceptance:
  - Upload-, Transfer-, Ressourcen- und Cleanup-ID verbinden alle relevanten Logs und Status.
  - Fehler und Sicherheitsablehnungen erzeugen verwertbare Metriken und Alarmierung.
  required: true
  verification:
    kind: manual
    instructions: Erfolgreichen und fehlgeschlagenen Transfer ausschließlich über Betriebsdaten nachvollziehen.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'tests/services/test_hub_audit.py plus lx-annotate tests/api/test_administration_api.py:
        passed'
    - kind: command
      reference: 'frontend AdministrationPage.test.ts: 3 passed; vue-tsc passed'
    note: Sender- und Hub-Audit verbinden Outbound-Job, Transfer-Key/Remote-ID, Resource, Center, Node
      und Cleanup. Die Administration zeigt aktuelle erfolgreiche und fehlerhafte Transfers ohne Secrets
      oder Raw-Media.
    assessed_by: Codex
    assessed_at: '2026-07-17T12:59:26.479437Z'
