definition_of_done:
- id: sap_ish_yaml_ingest
  category: functionality
  title: SAP-IS-H-Texttabellen werden typisiert über YAML in Django persistiert
  acceptance:
  - Ein Verzeichnis mit tabulatorgetrennten .txt-Dateien wird anhand der versionierten Dokumentvorlagen
    normalisiert und als validierte .yaml-Sidecars ausgegeben; unbekannte Tabellen werden explizit gemeldet.
  - Der optionale Process-Schritt übergibt jedes erzeugte Dateipaar an den bestehenden Preanonymized-Watcher-
    Service, sodass die Host-Django-Modelle über denselben idempotenten und auditierten Persistenzpfad
    geschrieben werden.
  - Der Process-Schritt normalisiert PatientNr centerbezogen auf eine kanonische Patientenidentität und
    persistiert unterstützte Diagnosen, Laborwerte und Medikationen zusätzlich in die medizinischen Fachtabellen;
    nicht fallzuordenbare Meona-Zeilen bleiben ausdrücklich patientenbezogen.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - env
    - PYTHONPATH=/home/admin/lx-parse/lx-data-models
    - .devenv/state/venv/bin/pytest
    - tests/services/test_sap_ish_clinical.py
    - tests/services/test_sap_ish_import.py
    - tests/services/test_watcher_storage_import.py
    - tests/services/test_preanonymized_watcher_ingest.py
    - tests/management/commands/test_import_sap_ish_txt.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-parse/lx-data-models .devenv/state/venv/bin/pytest
        tests/services/test_sap_ish_clinical.py tests/services/test_sap_ish_import.py tests/services/test_watcher_storage_import.py
        tests/services/test_preanonymized_watcher_ingest.py tests/management/commands/test_import_sap_ish_txt.py
        -q
      note: Exit-Code 0
    - kind: command
      reference: devenv shell -- env PYTHONPATH=/home/admin/lx-parse/lx-data-models .devenv/state/venv/bin/pytest
        tests/services/test_sap_ish_clinical.py tests/services/test_sap_ish_import.py tests/services/test_watcher_storage_import.py
        tests/management/commands/test_import_sap_ish_txt.py -q (32 passed)
    note: Structured SAP IS-H persistence remains verified after the final stable medication-identity
      review; the medical criterion verifier passed 32 tests and the expanded Hub suite passed 37 tests.
    assessed_by: Codex
    assessed_at: '2026-07-29T12:48:26.465397Z'
- id: segment_transfer_contract
  category: data_integrity
  title: Video-Segmente werden typisiert, idempotent und atomar übertragen
  acceptance:
  - Payload-Schema 3.0 überträgt ausschließlich typisierte, anonymisierte Segmentdaten mit quellknotengebundener
    unveränderlicher ID.
  - Der Receiver validiert exklusive Framegrenzen, materialisiert Segment- und Frame-Annotationen ohne
    Zwischenzustands-Side-Effects und setzt segment_annotations_validated erst nach erfolgreichem Commit
    aller Zeilen.
  - Replay derselben source_node_key/source_segment_id-Paare aktualisiert bestehende Segmente ohne Duplikate;
    fehlerhafte Grenzen rollen den gesamten Metadatenimport zurück.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/models/test_persisted_json_validation.py
    - tests/views/media/test_hub_transfer_endpoints.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/models/test_persisted_json_validation.py
        tests/models/test_hub_provenance_validation.py tests/services/test_transfer_job_contract.py tests/views/media/test_hub_transfer_endpoints.py
        -q (58 passed)
    - kind: command
      reference: lx-annotate tests/hub with canonical endoreg_db source (62 passed)
    note: Schema 3.0, source-scoped replay upsert, boundary rejection and atomic rollback are covered
      by receiver and sender tests.
    assessed_by: Codex
    assessed_at: '2026-07-20T13:57:45.626114Z'
