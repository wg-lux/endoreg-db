- id: performance_and_loading_states
  category: functionality
  title: Slow and unreliable connections remain usable
  acceptance:
  - Critical screens expose explicit loading, stale, empty, error, and retry states without blocking unrelated
    interactions.
  - Assets and cacheable responses use bounded, versioned caching; user-visible state does not display
    stale data as current without an explicit indication.
  - Optimistic updates are used only for operations with safe rollback, and perceived-speed improvements
    do not weaken server-side confirmation or data integrity.
  required: true
  verification:
    kind: manual
    instructions: Im konsumierenden lx-annotate-Frontend langsame und unterbrochene Verbindungen, veraltete
      Antworten, leere Listen und fehlgeschlagene Mutationen pruefen. Loading-, Stale-, Error- und Retry-Zustaende
      sowie Rollback beobachten. Backend-Cacheheader separat mit tests/views/video/test_hls_stream.py
      pruefen; Backend-pytest allein belegt keine UI-Akzeptanz.
    timeout_seconds: 1800
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: 'Quellpruefung 2026-09-09, HEAD 12f19caa3c840d86b8fdaf26e80e2d8da9bf6824; vorhandene
        Tests sind keine behaupteten Testergebnisse: endoreg_db/views/video/hls_stream.py; tests/views/video/test_hls_stream.py'
    note: Backend-Streaming unterscheidet zeitlich begrenztes privates Segmentcaching von nicht gecachten
      Playlists und Schluesseln. Dies belegt keine Loading-/Stale-/Retry-Zustaende oder optimistischen
      UI-Rollback. Blockiert durch fehlende Pruefung des konsumierenden Frontends unter langsamen/unterbrochenen
      Verbindungen. Der pauschale Backend-Testbefehl wurde durch eine zur Akzeptanz passende manuelle
      Pruefanweisung ersetzt.
    assessed_by: codex-professional-foundations-20260909
    assessed_at: '2026-09-09T09:38:28.904645Z'
- id: deterministic_data_integrity
  category: testing
  title: Concurrent interactions cannot corrupt or duplicate state
  acceptance:
  - State transitions have one authoritative owner and deterministic ordering for concurrent responses,
    retries, refreshes, and navigation.
  - Mutating requests are protected against double submission and unsafe replay through server-side idempotency
    or an equivalent invariant.
  - Tests cover race-prone success, timeout-after-commit, retry, stale-response, and concurrent-update
    scenarios and verify rollback or conflict behavior.
  required: true
  verification:
    kind: manual
    instructions: Review state ownership and mutation contracts, then execute concurrent and delayed-response
      scenarios while checking that persisted records and user-visible state remain consistent.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: 'Quellpruefung 2026-09-09, HEAD 12f19caa3c840d86b8fdaf26e80e2d8da9bf6824; vorhandene
        Tests sind keine behaupteten Testergebnisse: endoreg_db/services/hub/ingest.py; tests/services/test_ingest_idempotency_quarantine.py;
        tests/services/test_report_import_concurrency.py; tests/views/video/test_frame_annotation_bulk_upsert.py;
        feature-tracking/BackendIdempotencyGuarantee.yml'
    note: Upload-Identitaet, Datenbank-Constraints, Transaktionen und isolierte Report-Importlocks sind
      implementiert; vorhandene Tests pruefen ausgewaehlte Wiederholungen und Konkurrenzfaelle. Vollstaendige
      Commit-Ungewissheit, Mutation-Replay und UI-Reihenfolge bei veralteten Antworten und Navigation
      sind nicht belegt. PostgreSQL-Mehrprozessnachweise und eingesetzte Paketrevision sind gesondert
      zuzuordnen. BackendIdempotencyGuarantee.yml bleibt der Detailvertrag.
    assessed_by: codex-professional-foundations-20260909
    assessed_at: '2026-09-09T09:38:30.474958Z'
