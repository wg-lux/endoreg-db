definition_of_done:
- id: resilient_failure_handling
  category: functionality
  title: Expected failures are handled as recoverable user-facing states
  acceptance:
  - Network failures, API timeouts, validation errors, and expired sessions produce actionable feedback
    rather than cryptic errors or an unhandled crash.
  - Recoverable failures preserve valid user input and expose a deterministic retry or recovery action
    where retry is safe.
  - Each retry policy has an explicit timeout, bounded retry limit, and idempotency rule; unsafe operations
    are not automatically replayed.
  required: true
  verification:
    kind: manual
    instructions: Exercise representative timeout, invalid-input, expired-session, and connection-loss
      paths in a production-like profile and inspect the resulting UI state and server response.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: 'Quellpruefung 2026-09-09, HEAD 12f19caa3c840d86b8fdaf26e80e2d8da9bf6824; vorhandene
        Tests sind keine behaupteten Testergebnisse: endoreg_db/views/interoperability_errors.py; endoreg_db/services/jobs/error_handling.py;
        endoreg_db/tasks.py; tests/views/test_interoperability_errors.py; tests/test_tasks.py; tests/views/video/test_frame_annotation_bulk_upsert.py'
    - kind: test
      reference: '2026-09-09, HEAD e547189103a3ff5c084878fc9cfc23023f1d1fef plus Arbeitsbaum: .devenv/state/venv/bin/pyright:
        0 errors, 0 warnings, 0 informations. Danach .devenv/state/venv/bin/pytest tests/test_celery_observability.py
        tests/utils/test_structured_logging.py tests/utils/test_workload_timing.py tests/deployment/test_prod_settings_contract.py
        tests/views/test_interoperability_errors.py -q --tb=short: 53 passed, 2 warnings in 23.43s. Warnungen:
        pytest Assertion-Rewrite und spaCy/Click-Deprecation. Kein vollstaendiger Import-, PostgreSQL-Konkurrenz-
        oder Betriebsnachweis.'
    note: 'Sichere Fehlercodes und Transaktionsrollback sind an ausgewaehlten API-Grenzen implementiert.
      Vertragskonflikt: Datenbank-Recovery und beschaeftigte Import-Leases verwenden absichtlich max_retries=None;
      begrenztes Backoff ist kein Versuchslimit. Vor Aenderung sind terminaler Zustand und sichere Wiederaufnahme
      zu definieren. UI-Nachweise fuer Sessionablauf, Verbindungsverlust und erhaltene Eingaben fehlen.'
