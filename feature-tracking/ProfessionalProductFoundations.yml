  - Public API behavior documents authentication, inputs, outputs, errors, retries, and compatibility
    expectations without camelCase field additions.
  - Runbooks document deployment, troubleshooting, incident escalation, data recovery, and rollback procedures
    and are kept aligned with the implementation.
  required: true
  verification:
