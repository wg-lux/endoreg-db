- id: production_operational_readiness
  category: operations
  title: Deployment and incident operations are safe and repeatable
  acceptance:
  - Configuration is environment-specific, validated at startup, and free of committed secrets, fake credentials,
    or silent production fallbacks.
  - Deployments provide health checks, graceful shutdown, bounded resource use, migration safety, and
    observable rollback or recovery procedures.
  - Incident response identifies owner, severity, user impact, recovery steps, and post-incident evidence
    while preserving privacy and data integrity.
  required: true
