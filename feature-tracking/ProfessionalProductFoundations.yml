- id: observability_telemetry
  category: operations
  title: Failures and performance regressions are diagnosable in production
  acceptance:
  - Structured logs include correlation context, operation, resource identity, outcome, and a safe error
    classification without sensitive payloads.
  - Unhandled exceptions and background-job failures reach the configured crash-reporting channel with
    release and environment context.
  - Service health, latency, error rate, saturation, retries, and queue or workflow stagnation are represented
    by actionable metrics or alerts with documented ownership.
  required: true
  verification:
    kind: manual
    instructions: Trace one successful request, one handled failure, and one background failure using
      the configured logs, error reporting, dashboards, and alerts. Match the server-generated X-Request-ID
      response header to request_id in structured backend events. Verify concurrent requests cannot share
      context and streaming bodies are not consumed by logging; response-preparation timing is not full
      transfer latency. Confirm the consuming deployment actually installs the middleware and prove cross-service
      correlation separately.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: 'Quellpruefung 2026-09-09, HEAD 12f19caa3c840d86b8fdaf26e80e2d8da9bf6824; vorhandene
