      wurde kein Frontend-Komponentenprojekt gefunden; Tastatur-, Screenreader-, Kontrast- und Zustandsnachweise
      kritischer Workflows fehlen. Backend-Adminvorlagen ersetzen diesen Nachweis nicht. Benoetigt werden
      konkrete Frontend-Revision und gemeinsame Workflow-Abnahme.
