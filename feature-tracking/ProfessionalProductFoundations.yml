- id: accessible_design_system
  category: requirements
  title: The interface follows a consistent and accessible design system
  acceptance:
  - Shared components define consistent visual hierarchy, spacing, states, focus treatment, and error
    presentation for supported workflows.
  - Core workflows are operable by keyboard alone, expose meaningful names and status updates to assistive
    technology, and maintain sufficient contrast and visible focus.
  - Form errors, loading states, empty states, and destructive actions are understandable without relying
    on color, animation, or pointer input alone.
  required: true
  verification:
    kind: manual
    instructions: Review the component inventory and keyboard and screen-reader test the critical workflows,
      including loading, validation-error, empty, and destructive-action states.
    timeout_seconds: 900
  assessment:
    status: blocked
    evidence:
