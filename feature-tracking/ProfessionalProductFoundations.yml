- id: security_privacy_controls
  category: security
  title: Security and privacy controls are enforced throughout the stack
  acceptance:
  - Data is encrypted at rest within the approved storage boundary and in transit using the deployment-required
    transport protection.
  - Authentication, authorization, and resource scoping enforce least privilege and fail closed when identity
    or scope is missing.
  - External and user-controlled input is validated at system boundaries; sensitive data, credentials,
    and raw media are absent from logs, exports, and error responses.
  required: true
  verification:
    kind: manual
    instructions: Review the threat boundaries, storage and transport configuration, authorization checks,
      input schemas, logging fields, and export paths; execute negative access and data-leak tests in
      a production-like profile.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
