- id: durable_fenced_persistence
  category: data_integrity
  title: Persistierte Zustände sind atomar, idempotent und gegen veraltete Worker geschützt
  acceptance:
  - Jede Instanz besitzt stabile Identität, Zustandsversion, Attempt-ID, Owner, Lease-Ablauf, monotonen
    Fencing-Token sowie Erstellungs- und Aktualisierungszeit aus einer autoritativen Zeitquelle.
  - Claim, Heartbeat, Transition und Abschluss verwenden atomare Compare-and-Swap- oder Zeilensperr-Semantik;
    verspätete, doppelte oder fremde Worker dürfen keinen neueren Zustand überschreiben.
  - Ereignisse und persistierte Workflow- oder Provenienz-Payloads werden am Modellrand durch versionierte
    typisierte Schemata validiert; Modelle enthalten keine neue Orchestrierungs- oder Seiteneffektlogik.
  - Redelivery, wiederholte Kommandos und Prozessneustarts sind idempotent und erzeugen weder doppelte
    fachliche Ressourcen noch parallele Publikationsrechte.
  required: true
  verification:
    kind: manual
    instructions: Persistenzvertrag gegen Transaktionen, Constraints, Lease-Verwaltung, Fencing und typisierte
      Modellgrenzen prüfen.
    timeout_seconds: 900
