- id: typed_control_api
  category: interoperability
  title: Steuerungs- und Statusschnittstellen besitzen einen stabilen typisierten Vertrag
  acceptance:
  - API, Kommandozeile und interne Aufrufer verwenden snake_case und liefern getrennt beobachteten Zustand,
    gewünschten Zustand, Zustandsversion, Attempt-ID, zulässige Aktionen und stabile Fehlercodes.
  - Clients senden Ereignisse oder Absichten statt frei gesetzter Zielzustände; der autoritative Service
    entscheidet die Transition und lehnt veraltete Versionsstände explizit ab.
  - Rollierende Upgrades definieren unterstützte Schema- und Binärversionen; inkompatible Mischversionen
    werden vor Arbeitsannahme erkannt und fail-closed behandelt.
  required: true
  verification:
    kind: manual
    instructions: Rust-, Python-, REST- und Consumer-Verträge sowie Upgrade-Kompatibilitätsmatrix vergleichen.
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: observability_and_slo
  category: observability
  title: Zustand, Fortschritt und Stagnation sind ohne Prozesszugriff diagnostizierbar
  acceptance:
  - Strukturierte Ereignisse enthalten Service- oder Operations-ID, Zustandsversion, Attempt-ID, Fencing-Token,
    altes und neues State-Enum, Ereignistyp, Dauer und stabilen Ergebniscode ohne sensible Metrik-Labels.
  - Metriken erfassen Instanzen und Alter je Zustand, Transitionsrate, Laufzeit, Heartbeat- und Lease-Alter,
    Retry-Anzahl, Stagnation, LOST, Reconciliation sowie Shutdown-Dauer.
  - Health-Endpunkte unterscheiden Prozessbereitschaft, Abhängigkeitszustand und fachliche Arbeitsfähigkeit;
    DEGRADED und LOST werden nicht als gesund oder erfolgreich zusammengefasst.
  - Service-Level-Ziele und Alarme besitzen getestete Schwellen für Startfehler, Stagnation, Retry-Erschöpfung,
    Lease-Verlust, Reconciliation-Rückstand und unerwartete Terminalzustände.
  required: true
  verification:
    kind: manual
    instructions: Erfolg, Degradation, hängende Arbeit, Worker-Verlust und Recovery ausschließlich aus
      Metriken und Ereignissen rekonstruieren.
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: rollout_and_migration
  category: operations
  title: Migration und Aktivierung sind gestuft, reversibel und datenverträglich
  acceptance:
  - Bestandszustände werden vor Constraint-Aktivierung inventarisiert und deterministisch migriert; unbekannte
    oder widersprüchliche Datensätze gehen in explizite Quarantäne oder LOST statt geschätzt zu werden.
  - Der Rollout verwendet Shadow-Auswertung mit Ergebnisvergleich, begrenzte Aktivierung und messbare
    Abbruchkriterien, bevor der Rust-Kern autoritativ wird.
  - Rollback erhält persistierte Zustände und Ereignisse, kann keine neuere Zustandsversion überschreiben
    und reaktiviert keine entfernte unsichere Fallback-Implementierung.
  - Erst nach nachgewiesener Parität und stabiler Betriebsphase werden doppelte Reducer und Legacy-Direktupdates
    entfernt.
  required: true
  verification:
    kind: manual
    instructions: Migration, Shadow-Vergleich, Canary-Aktivierung, Abbruch und Rollback mit produktionsnahen
      Bestandsdaten üben.
    timeout_seconds: 1200
  assessment:
    status: not_assessed
    evidence: []
- id: operator_runbook
  category: documentation
  title: Zustandsverträge, Betrieb und sichere Recovery sind dokumentiert
  acceptance:
  - Die Dokumentation enthält je Dienst ein Zustandsdiagramm, Ereignismatrix, Invarianten, Owner, Abhängigkeiten,
    Timeout-, Retry-, Lease-, Fencing- und Terminalzustandsvertrag.
  - Das Runbook beschreibt Diagnose, kontrollierten Start und Shutdown, Drain, Retry, Cancel, Reconciliation,
    LOST-Behandlung, Rollback und Eskalation mit erwarteten Auditereignissen.
  - Manuelle Datenbank-Statusupdates, erzwungene Lease-Übernahme und das Umgehen des Rust-Capability-Gates
    sind ausdrücklich untersagt; Break-glass-Verfahren sind separat autorisiert und auditierbar.
  - Rust-Ausnahmen, Migrationsstand und verbleibende Legacy-Pfade verweisen auf dieses Feature und führen
    keinen parallelen Readiness- oder Aufgabenstatus.
  required: true
  verification:
    kind: manual
    instructions: Runbook anhand eines kontrollierten Worker-Abbruchs und einer LOST-Recovery durch Betrieb
      und Security prüfen.
    timeout_seconds: 1200
  assessment:
    status: not_assessed
    evidence: []
