- id: concurrency_and_recovery
  category: operations
  title: Abbruch, Neustart und Konkurrenz konvergieren ohne Split-Brain
  acceptance:
  - Start, kontrollierter Shutdown und Abbruch besitzen begrenzte Fristen; neue Arbeit wird vor Shutdown
    gestoppt, Kindprozesse werden kontrolliert beendet und aktive Claims werden abgeschlossen oder sicher
    zurückgelassen.
  - Abgelaufene Heartbeats oder Leases führen über eine explizite Reconciliation nach RETRY_WAIT, FAILED
    oder LOST; Prozesspräsenz allein gilt weder als RUNNING- noch als Erfolgsevidenz.
  - Retry-Policy verwendet begrenzte Versuche, klassifizierte Fehler und Backoff mit Jitter; nicht wiederholbare
    Integritäts-, Sicherheits- oder Vertragsfehler bleiben terminal und alarmiert.
  - Zwei konkurrierende Starter, Worker oder Reconciler sowie ein verspäteter alter Worker können zu keinem
    Zeitpunkt gleichzeitig gültiges Ownership oder Publikationsrecht besitzen.
  required: true
  verification:
    kind: manual
    instructions: Kill-, Restart-, Lease-Ablauf-, Redelivery- und Split-Brain-Übungen in einem produktionsnahen
      Mehrprozessprofil durchführen.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/services/test_model_training_jobs.py::test_stale_model_training_run_transitions_to_lost;
        tests/services/test_hub_ingest_import_job_contract.py
