      reference: tests/services/test_model_training_jobs.py::test_model_training_dispatch_failure_enters_durable_retry_wait;
        tests/services/test_model_training_jobs.py::test_expired_model_training_lease_rejects_completion;
        tests/services/test_transfer_job_contract.py
    - kind: command
      reference: Training-/Task-Lane 56 passed; TransferJob-Lifecycle-Lane 38 passed plus 3 subtests
    note: Training-Dispatchfehler wechseln persistent über RETRY_SCHEDULED nach RETRY_WAIT, werden durch
      den Maintenance-Worker mit begrenztem Backoff erneut versandt und enden nach Erschöpfung FAILED.
      Abgelaufene Training- und Transfer-Leases werden als verlorene Ownership behandelt; alte Worker
      verlieren Kandidaten- und Abschlussrecht. Bestätigte Artefaktverluste bleiben davon getrennt LOST.
    assessed_by: codex-state-machine-tracker
    assessed_at: '2026-09-02T15:05:19.614973Z'
- id: security_boundaries
  category: security
  title: Zustandsübergänge bewahren Identitäts-, Mandanten- und Speichergrenzen
  acceptance:
  - Start, Claim, Steuerung, Retry, Abbruch und manuelle Recovery prüfen Maschinen- oder Nutzeridentität,
    Berechtigung und Center-Scope serverseitig; interne Netzwerke werden nicht als vertrauenswürdig behandelt.
  - Zustands- und Fehlerpayloads enthalten keine Secrets, Schlüssel, Patientendaten oder ungeschützten
    absoluten Speicherpfade; technische Details bleiben in zugriffsgeschützten korrelierten Auditereignissen.
  - Medien- und Dateisystemoperationen bleiben innerhalb der genehmigten verschlüsselten Speichergrenze
    und verwenden die typisierten atomaren Dateioperations-Wrapper; Raw-Media-Export bleibt verboten.
  - Fehlende gegenseitige Transport Layer Security, native Capabilities oder Integritätsevidenz in einem
    sie verlangenden Profil verhindern Start oder Transition ohne unsicheren Fallback.
  required: true
  verification:
    kind: manual
    instructions: Negative Autorisierungs-, Mandantentrennungs-, Secret-Leak-, Storage- und Capability-Gate-Tests
      reviewen.
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: transition_and_failure_tests
  category: testing
  title: Transitionsmatrix, Rust-Parität und Ausfallpfade sind automatisiert geprüft
  acceptance:
  - Tabellen- oder eigenschaftsbasierte Tests decken jede erlaubte und verbotene Transition, Terminalität,
    unbekannte Eingaben und stabile Ablehnungsgründe des Rust-Kerns ab.
  - Python-Bindingstests prüfen strikte Typkonvertierung, Schema- und Binärversionskompatibilität sowie
    Parität mit versionierten Vertragsvektoren ohne offenen Any- oder Dictionary-Vertrag.
  - Mehrprozess-Integrationstests decken Doppelstart, konkurrierenden Claim, Lease-Ablauf, Worker-Abbruch,
    verspäteten Abschluss, Redelivery, Retry-Erschöpfung, Shutdown und Reconciliation ab.
  - Failure Injection vor und nach Persistenz- und Seiteneffektgrenzen beweist, dass kein falscher Erfolg,
    keine doppelte Ressource und kein unbemerkter Verlust entsteht.
  - AAA-Regressionstests beweisen, dass ein fachlicher Verarbeitungsfehler FAILED bleibt, während fehlende
    Artefakte nach einem belegten Erfolg beziehungsweise einer Validierung explizit LOST werden und bei
    jeder Inventur als LOST gezählt werden.
  - Modelltrainingstests erzwingen exklusives Lease-Ownership mit Fencing, einen dauerhaften Retry-Zustand
    bei Dispatch-Fehlern, physisch vorhandene Erfolgsartefakte und Datenbank-Framezustände, die erst nach
    erfolgreicher Dateimaterialisierung gesetzt werden.
  - Transfer- und Importtests erzwingen, dass veraltete Worker keinen neueren Zustand überschreiben, ein
    verlorenes Report-Ownership dauerhaft sichtbar wird und eine fehlgeschlagene Video-Finalisierung die
    zuvor gültige kanonische Generation unverändert lässt.
  - Transfer-Failure-Injection prüft die Lease nicht nur beim Claim und Heartbeat, sondern auch unmittelbar
    bei Kandidatenregistrierung und Abschluss; ein abgelaufener Worker besitzt ohne erfolgreichen Reclaim
    kein Publikationsrecht, und der Erfolgsabschluss akzeptiert ausschließlich APPLIED.
  - Jeder Fehler nach einem Transfer-Claim, einschließlich Ziel- und Hashvalidierung vor dem Öffnen eines
    Envelopes, beendet oder verwirft den Claim atomar; kein früher Fehler hinterlässt RUNNING mit einer
    scheinbar lebenden Lease.
  - TransferJob unterscheidet reparierbaren Artefaktverlust LOST vom bestätigten Konfliktzustand INCONSISTENT;
    nur LOST darf über einen expliziten Retry neu geclaimt werden, während INCONSISTENT bis zur autorisierten
    Auflösung fail-closed bleibt.
  - Der REST-Adapter bildet einen konkurrierenden Live-Lease-Claim deterministisch auf HTTP 409 Conflict
    mit sicherem Fehlerpayload ab; erwartete Konkurrenz darf weder als HTTP 500 erscheinen noch Lease-Daten
    oder interne Pfade offenlegen.
  required: true
  verification:
    kind: manual
    instructions: Testmatrix und CI-Lanes gegen Inventar, Zustandsverträge und alle Ausfallgrenzen abgleichen
      und ausführen.
    timeout_seconds: 1200
  assessment:
