    - kind: code
      reference: nix/nixos/video-format-reconciliation.nix; docs/wiki/hub_ingest_current_state.md
    note: Repository-Inventar der beaufsichtigten Prozesse, Shared Tasks, begrenzten Kindprozesse, lokalen
      Executor-Pools und persistierten Ownership-Ledger ist in der Akzeptanzmatrix erfasst. Offen bleiben
      der Abgleich mit den produktiven LuxNix-Units und dem lx-annotate-Watcher sowie Owner-, Abhängigkeits-
