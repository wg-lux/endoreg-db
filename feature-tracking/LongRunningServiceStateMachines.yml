schema_version: '1.0'
id: long_running_service_state_machines
name: Zustandsmaschinen für langlaufende Dienste
description: Einheitlicher, typisierter und wiederanlauffähiger Lebenszyklusvertrag für langlaufende Dienste
  und Operationen. Deterministische Zustandsentscheidungen sollen standardmäßig in einem versionierten
  nativen Rust-Kern liegen; Orchestrierung, Persistenz und fachliche Seiteneffekte bleiben in klar getrennten
  Service-Grenzen.
owners:
- endoreg_db maintainers
- LuxNix platform maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/model_layer_map_for_agents.md
  disposition: reference
  note: Definiert die Trennung zwischen Persistenzmodellen und Service-Logik.
- path: docs/production_workflow_hardening_plan.md
  disposition: reference
  note: Beschreibt bestehende Workflowinvarianten und fail-closed Zustandsübergänge.
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Referenz für Lease-, Fencing-, Recovery- und atomare Publikationsanforderungen bei Medienoperationen.
- path: docs/video_import_concurrency_contract.md
  disposition: reference
  note: Definiert bestehende Import-Ownership-, Heartbeat-, Lease- und Fencing-Grenzen.
definition_of_done:
- id: service_inventory_and_scope
  category: requirements
  title: Alle langlaufenden Dienste und Operationen besitzen einen verantworteten Lebenszyklusvertrag
  acceptance:
  - Das Prozessinventar umfasst den Gunicorn-Webdienst, die sechs getrennten Celery-Workerprofile pipeline,
    ffmpeg_media, frame_extraction, inference samt llm_inference, model_training und maintenance sowie
    Celery Beat; Prozessstart, Drain, Restart und Shutdown bleiben Eigentum des Deployments beziehungsweise
    Supervisors und werden nicht aus fachlichen Jobzuständen abgeleitet.
  - Das Operationsinventar umfasst alle 15 Shared Tasks in endoreg_db/tasks.py, Import und Reimport, Anonymisierung
    und Korrektur, Transcoding und HTTP Live Streaming, Frame- und Segmentverarbeitung, Inferenz und Training,
    Reportverarbeitung, Cleanup, Transfer, Storage-Balancing und Reconciliation sowie die beiden zeitgesteuerten
    Videoformat-Audit- und Repair-Oneshots.
  - 'Begrenzte Kindprozesse und lokale Ausführungskontexte sind separat erfasst: FFmpeg-Aufrufe, Offline-Batch,
    nativer Report-PDF-Renderer, Video-Probes, der temporäre Seekable-Range-Server sowie die lokalen Executor-Pools
    für temporale Inferenz und Post-Validation-Rebuild.'
  - Persistierte Zustands- und Ownership-Ledger sind UploadJob, ReportImportAttempt, VideoProcessingHistory,
    VideoHlsArtifact, AIModelTrainingRun, AIDataSetExportArtifact, DicomExportJob, StorageReservation,
    StorageArtifactPlacement, StorageRotation, StorageBalanceWorkItem und StorageReconciliationRun; fachlich
    unabhängige Zustandsachsen werden nicht in einen Gesamtstatus verdichtet.
  - Der produktive Watcher-Daemon gehört lx-annotate; endoreg_db besitzt nur den atomaren Watcher-Handoff
    und den anschließenden UploadJob. Diese externe Prozessgrenze benötigt einen gemeinsamen Start-, Health-,
    Handoff- und Shutdown-Vertrag, aber keinen zweiten endoreg_db-Daemon.
  - Nicht erfasste produktive Dauerläufer und implizite Zustände aus Prozesspräsenz, Logtexten oder Zeitüberschreitungen
    verhindern die Produktionsfreigabe.
  required: true
  verification:
    kind: manual
    instructions: Inventar gegen systemd-, Nix-, Container-, Task-Queue- und Management-Command-Einstiegspunkte
      prüfen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: flake.nix; devenv.nix; endoreg_db/tasks.py; endoreg_db/config/settings/base.py
    - kind: code
