- id: canonical_state_contract
  category: functionality
  title: Zustände, Ereignisse und Übergänge sind kanonisch und deterministisch
  acceptance:
  - Der gemeinsame Dienstlebenszyklus unterscheidet mindestens STARTING, RUNNING, DEGRADED, STOPPING,
    STOPPED, FAILED und LOST; begrenzte Operationen verwenden getrennt QUEUED, CLAIMED, RUNNING, RETRY_WAIT,
    SUCCEEDED, FAILED, CANCELLED und LOST, soweit der jeweilige Vertrag diese Zustände benötigt.
  - Jeder Übergang benennt auslösendes typisiertes Ereignis, Vorbedingungen, erlaubte Quellzustände, Zielzustand,
    Terminalität, Retry-Wirkung und stabilen Ablehnungsgrund.
  - Unbekannte Zustände, Ereignisse, Schema-Versionen und unmögliche Übergänge schlagen laut und fail-closed
    fehl; LOST bleibt sichtbar und kann nicht implizit zu Erfolg werden.
  - Zustandsentscheidungen sind reine, deterministische Reduktionen; Datenbank-, Netzwerk-, Prozess- und
    Dateisystem-Seiteneffekte werden erst nach einer erfolgreichen Entscheidung an expliziten Service-Grenzen
    ausgeführt.
  required: true
  verification:
    kind: manual
    instructions: Zustands- und Ereignismatrizen gegen Service-Einstiegspunkte, Persistenzmodelle und
      Bedieneraktionen prüfen.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: rust/endoreg_rust_backend/src/lifecycle_state.rs; endoreg_db/services/lifecycle_state_machine.py
    - kind: test
      reference: tests/services/test_lifecycle_state_machine.py::test_service_lifecycle_matrix_is_exhaustive;
        tests/services/test_lifecycle_state_machine.py::test_operation_lifecycle_matrix_is_exhaustive
    - kind: code
      reference: endoreg_db/services/hub/upload_job_state_machine.py; endoreg_db/services/hub/ingest.py;
        endoreg_db/services/jobs/model_training_jobs.py
    - kind: code
      reference: rust/endoreg_rust_backend/src/lifecycle_state.rs; endoreg_db/services/lifecycle_state_machine.py;
        endoreg_db/services/hub/upload_job_state_machine.py; endoreg_db/services/hub/ingest.py
    - kind: code
      reference: rust/endoreg_rust_backend/src/lifecycle_state.rs; endoreg_db/services/hub/upload_job_state_machine.py;
        endoreg_db/services/report_import_state_machine.py
    note: Der kanonische Operationsvertrag lifecycle_state_v3 ergänzt RETRY_REQUESTED und erlaubt den
      expliziten Pfad FAILED beziehungsweise SUCCEEDED -> RETRY_WAIT sowie QUEUED -> RETRY_WAIT bei einem
      Dispatch-Fehler. UploadJob und ReportImportAttempt bilden ihre persistierten Status typisiert auf
      denselben nativen Reducer ab; jede Reduktion wird unmittelbar vor der bestehenden Mutation validiert.
      LOST bleibt vom wiederholbaren Retry-Pfad getrennt.
    assessed_by: codex-state-machine-tracker
    assessed_at: '2026-09-02T13:30:02.736579Z'
- id: rust_transition_core
  category: maintainability
  title: Langlaufende Dienste verwenden bevorzugt einen versionierten nativen Rust-Zustandskern
  acceptance:
  - Neue produktionskritische Zustandsmaschinen implementieren Ereignisvalidierung und deterministische
    Transitionen standardmäßig in Rust mit vollständig typisierten Python-Bindings; Python orchestriert
    und führt Seiteneffekte aus, dupliziert aber nicht die Transitionslogik.
  - Bestehende langlaufende Dienste besitzen je einen dokumentierten Migrationsentscheid mit Reihenfolge,
    Kompatibilitätsfenster und Entfernungskriterium für doppelte Implementierungen.
  - Eine Ausnahme vom Rust-Standard benennt Owner, technische Begründung, Risiko, Ablauf- oder Reviewdatum
    und weist dieselben Typ-, Determinismus-, Nebenläufigkeits- und Recovery-Invarianten nach.
  - In Produktionsprofilen führt ein fehlender oder inkompatibler erforderlicher nativer Kern zum sicheren
    Startabbruch; ein optionaler Referenzreduzierer ist nur für Paritätstests zulässig und kein stiller
    Produktionsfallback.
  required: true
  verification:
    kind: manual
    instructions: Rust-Crates, Python-Bindings, Capability-Gates, Ausnahmeentscheidungen und Entfernungskriterien
      gemeinsam reviewen.
    timeout_seconds: 900
