definition_of_done:
- id: defined_structure
  category: requirements
  title: Struktur und Produktionsgate sind strikt definiert
  acceptance:
  - Feature, Kriterien, Verifikation, Bewertung und Evidenz besitzen ein versioniertes Schema.
  - Das Produktionsgate liefert binär produktionsreif oder nicht produktionsreif.
  - Ein Prozentwert kann das binäre Gate nicht ersetzen.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - feature-tracking/tracker.py
    - validate
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/python feature-tracking/tracker.py validate
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-20T14:11:35.220778Z'
- id: terminal_commands
  category: functionality
  title: Kleine, testbare Terminalbefehle decken den Workflow ab
  acceptance:
  - overview, show, validate, check, update, verify, done, reopen und lock haben getrennte Verantwortlichkeiten.
  - check liefert Exit-Code 0 nur bei vollständig verifizierter Definition of Done.
  - Valide aktive Features erscheinen ohne Argumente als evaluiert; done blendet sie standardmäßig aus.
  - Ein Agent erwirbt vor Änderungen atomar einen zeitlich begrenzten Lock für ein Feature, ein Kriterium,
    eine oder mehrere Repository-Dateien oder deren Kombination und gibt ihn nach der Arbeit wieder frei.
  - Featureweite, identische Kriteriums- und überlappende Dateiscopes werden abgelehnt; unabhängige Kriteriums-
    und Dateiscopes dürfen parallel bearbeitet werden.
  - Lock-Status, Ablauf, Erneuerung und owner-gebundene Freigabe sind explizit prüfbar; abgelaufene Locks
    blockieren keine neue Arbeit.
  - Owner-adressierte Codex-CLI-Nachrichten unterstützen Send, Inbox, Acknowledge und Reply mit optionalem
    Feature-/Kriteriumsbezug; Lock-Akquisition zeigt ungelesene Nachrichten desselben Owners an.
  - Nachrichten werden atomar und owner-privat im lokalen Runtime-Verzeichnis gespeichert, laufen begrenzt
    ab, lehnen Terminal-Steuerzeichen ab und erzeugen keinen parallelen Readiness- oder Status-Tracker.
  required: true
  verification:
    kind: command
    commands:
    - command:
      - .devenv/state/venv/bin/python
      - feature-tracking/tracker.py
      - overview
    - command:
      - .devenv/state/venv/bin/pytest
      - feature-tracking/test_tracker.py
      - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: feature-tracking/test_tracker.py::test_feature_locks_reject_overlapping_scopes_and_allow_independent_work
    - kind: test
      reference: feature-tracking/test_tracker.py::test_simultaneous_feature_lock_contenders_have_exactly_one_winner
    - kind: test
      reference: feature-tracking/test_tracker.py::test_feature_lock_expiry_renewal_and_owner_bound_release
    - kind: test
      reference: feature-tracking/test_tracker.py::test_lock_cli_acquires_reports_and_releases
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest feature-tracking/test_tracker.py tests/utils/test_file_operations.py
        -q (34 passed)
    - kind: test
      reference: feature-tracking/test_tracker.py::test_agent_messages_are_owner_bound_atomic_and_replyable
    - kind: test
      reference: feature-tracking/test_tracker.py::test_agent_message_expiry_and_terminal_control_validation
    - kind: test
      reference: feature-tracking/test_tracker.py::test_message_cli_and_lock_acquire_surface_unread_feedback
    - kind: command
      reference: devenv shell -- /home/admin/endoreg-db/.devenv/state/venv/bin/pytest feature-tracking/test_tracker.py
        tests/utils/test_file_operations.py -q (37 passed)
    note: Lokale Codex-CLI-Nachrichten-API unterstützt owner-adressiertes Send, Inbox, Ack und Reply,
      automatische Inbox-Anzeige bei Lock-Akquisition, Ablaufbereinigung, JSON-Ausgabe und Feature-/Kriteriumsbezug.
      Runtime-Dateien sind Git-ignoriert und owner-privat; Feature-YAML bleibt autoritativ.
    assessed_by: codex/root
    assessed_at: '2026-07-31T10:39:22.101834Z'
- id: automated_tests
  category: testing
  title: Schema, Ableitung und Updates sind fokussiert getestet
  acceptance:
  - Ungültige Bewertungen, unvollständige Migration und falsche Produktionsfreigabe schlagen fehl.
  - Update und atomarer YAML-Roundtrip sind getestet.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - feature-tracking/test_tracker.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest feature-tracking/test_tracker.py -q
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-23T08:01:22.134957Z'
- id: safe_execution
  category: security
  title: YAML kann keine implizite Shellausführung oder Freigabe einschleusen
  acceptance:
  - Prüfkommandos werden als Argumentlisten ohne Shell ausgeführt.
  - Unbekannte Felder und ungültige Zustände werden strikt abgelehnt.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - feature-tracking/test_tracker.py::test_command_verification_requires_one_command_shape
    - feature-tracking/test_tracker.py::test_verification_working_directory_must_be_absolute
    - feature-tracking/test_tracker.py::test_multi_repository_verification_runs_shell_free_in_order
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: 'feature-tracking/tracker.py: Verification, FeatureDefinition, run_verification'
    - kind: test
      reference: feature-tracking/test_tracker.py
    note: Pydantic-Modelle verbieten unbekannte Felder; Verifikationskommandos sind typisierte Argumentlisten
      und werden mit subprocess.run ohne Shell-Expansion ausgeführt.
    assessed_by: Codex
    assessed_at: '2026-07-23T08:01:37.612032Z'
