    Retention-Policy, noch nicht erreichtem Fälligkeitszeitpunkt, Retry, aktiver oder inzwischen erworbener
    Lease und fehlender Integritätsevidenz ab.
  - Failure Injection deckt Dateilöschfehler, Datenbankfehler vor und nach der Mutation, Prozessabbruch
    und zwei konkurrierende Reaper ab.
  - Video-, Report-, Watcher- und API-UploadJobs sowie bereits fehlende Dateien und manipulierte Pfade
