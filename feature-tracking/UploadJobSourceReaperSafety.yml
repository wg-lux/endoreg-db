- id: operator_inventory_and_rollout
  category: operations
  title: Speicherwirkung und blockierte Altbestände sind vor Apply sichtbar
  acceptance:
  - Ein read-only Inventar aggregiert Kandidatenanzahl und freigebbare Bytes nach Medienart, Ingest-Modus,
    Cleanup-Entscheidung und stabilem Blockiergrund.
  - Rollout beginnt mit Dry-Run, begrenzten Batches und überprüfbaren Audit-Receipts; Apply kann unabhängig
    von Import-Workern deaktiviert werden.
  - Metriken und Alarmierung erfassen wiederholt fehlgeschlagene Bereinigung, alte berechtigte Quellen,
    Ledger-Dateisystem-Abweichungen und ungewöhnlich große blockierte UploadJobs.
  - Eine produktionsnahe Übung weist tatsächlich freigegebene Bytes sowie unveränderte Import-, Master-,
    Derivat- und Wiedergabeintegrität nach.
  required: true
  verification:
    kind: manual
    instructions: Dry-Run und begrenztes Apply gegen einen freigegebenen produktionsnahen Datenbestand
      ausführen; Inventar, Audit-Receipts, Byte-Differenz und Medienintegrität gemeinsam prüfen.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/management/commands/reap_upload_job_sources.py; endoreg_db/config/env.py
    - kind: command
      reference: 'tests/management/commands/test_reap_upload_job_sources.py: 9 passed'
    - kind: code
      reference: endoreg_db/management/commands/check_system_health.py cleanup failure/staleness/mismatch/large-blocked
        alarms
    - kind: command
      reference: 'tests/management/commands/test_check_system_health.py plus focused reaper lane: 40 passed'
    - kind: command
      reference: 'Focused final lane including health and reaper command tests: 43 passed, 1 PostgreSQL-only
        concurrency test skipped, 2 warnings in 98.66s.'
    note: Inventory, independent apply gate, durable failure counters and health alarms are implemented
      and pass focused tests. Production-like byte/integrity exercise and operational threshold approval
      remain outstanding.
    assessed_by: codex-upload-reaper-20260826
    assessed_at: '2026-08-26T09:28:05.339128Z'
- id: cleanup_runbook
  category: documentation
  title: Diagnose, Freigabe, Apply und Recovery sind betrieblich dokumentiert
  acceptance:
  - Das Runbook beschreibt Dry-Run, Auswahl einer einzelnen UploadJob-ID, Batch-Limits, Entscheidungscodes,
    Apply, Audit-Korrelation und erwartete Exit-Codes.
  - Es enthält Recovery-Verfahren für fehlende Datei, fehlgeschlagene Mutation, Datenbank-Dateisystem-
    Abweichung, aktive Lease, fehlende Zielintegrität und versehentliche Bedienerunterbrechung.
  - Direkte Dateisystemlöschung außerhalb des Reapers ist ausdrücklich untersagt; Eskalation und manuelle
    Freigabe für unsichere Altbestände sind benannt.
  required: true
  verification:
    kind: manual
    instructions: Runbook anhand eines sicheren Dry-Runs und einer simulierten Cleanup-Störung durch Betrieb,
      Security und Storage-Verantwortliche prüfen.
    timeout_seconds: 900
  assessment:
