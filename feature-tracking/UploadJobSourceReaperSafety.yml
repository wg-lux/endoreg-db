  title: Negative Pfade, Abstürze und konkurrierende Zustandswechsel sind regressionsgetestet
  acceptance:
  - Tests decken erfolgreiche Vorschau und Löschung sowie Blockierung bei nicht terminalem Job, falscher
    Retention-Policy, noch nicht erreichtem Fälligkeitszeitpunkt, Retry, aktiver oder inzwischen erworbener
    Lease und fehlender Integritätsevidenz ab.
  - Failure Injection deckt Dateilöschfehler, Datenbankfehler vor und nach der Mutation, Prozessabbruch
    und zwei konkurrierende Reaper ab.
  - Video-, Report-, Watcher- und API-UploadJobs sowie bereits fehlende Dateien und manipulierte Pfade
    werden parametrisiert geprüft.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_hub_cleanup.py
    - tests/management/commands/test_reap_upload_job_sources.py
    - -q
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/services/test_hub_cleanup.py tests/management/commands/test_reap_upload_job_sources.py
        -q
      note: Exit-Code 0
    - kind: command
      reference: 'Tracker verifier: 34 passed before PostgreSQL-only two-reaper process test; focused
        static Pyright 0 errors'
    - kind: test
      reference: tests/services/test_hub_cleanup.py::test_two_concurrent_reapers_serialize_one_source_deletion
        (requires PostgreSQL; SQLite cannot provide select_for_update row-lock evidence)
    - kind: command
      reference: 'Focused final lane: 43 passed, 1 skipped, 2 warnings in 98.66s; skip is tests/services/test_hub_cleanup.py::test_two_concurrent_reapers_serialize_one_source_deletion
        on non-PostgreSQL.'
    note: State matrix, failure injection and ingest/media coverage pass in the focused lane. The real
