        and 29,698 human annotations; annotations and existing media must be preserved. Videos 48 and
        52 retain raw and processed files despite older LOST attempts. Two LOST jobs with retained files
        decrypted successfully and matched their original hashes; one belongs to retired video 55 and
        must not recreate it. Files were checked for existence, not full playback integrity; no videos,
        annotations or import states were changed.'
    - kind: code
      reference: endoreg_db/import_files/video_import_service.py::_import_and_anonymize; endoreg_db/import_files/video_import_service.py::_raw_source_identity;
        endoreg_db/services/video_files/queries.py::get_video_by_content_hash
