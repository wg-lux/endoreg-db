- id: continuous_format_folder_ingestion
  category: functionality
  title: Supported report formats reach their existing import workers continuously
  acceptance:
  - Raw and preanonymized watcher jobs share cancellation-safe processing transitions and duplicate-drop
    handling; cancellation observed after job lookup preserves the incoming source and sidecar.
  - A settled source is revalidated before and after hashing without repeating the settling wait; replacement,
    mutation and symbolic links fail before upload-job creation.
  - PDF and TXT watcher inputs preserve their media type and dispatch to the report worker.
  - LX-Annotate scans nested format folders, including preanonymized TXT with its required sidecar.
  - LuxNix exposes four workflow inputs (reports, videos, preanonymized files and SAP exports), sharing
    each input across its supported formats without relocating existing intake paths.
  - Temporary paths and symlink escapes are excluded; existing duplicate-content and encrypted storage
    contracts remain enforced.
  - Intake and native-output compliance accept every valid positive source frame rate without an FPS ceiling
    or automatic resampling; complete frame timestamps and codec/integrity checks remain mandatory.
  - The mover never quarantines media solely for FPS, including legacy rejection reports. Successful inputs
    complete independently; real failures retain source bytes and use bounded retry delays.
  required: true
  verification:
    kind: manual
    instructions: Run Pyright, watcher storage and dispatch tests, LX-Annotate watcher tests, and LuxNix
      evaluated folder contracts.
    timeout_seconds: 300
