- id: lossless_report_and_owned_import_locks
  category: data_integrity
  title: Reportquellen bleiben vollständig erhalten und Importsperren besitzen eindeutige Eigentümer
  acceptance:
  - TXT-Quellen bleiben bei Erfolg und Fehler bytegleich erhalten; die Konvertierung verwendet eine stabile
    Eingangskopie, übernimmt alle Seiten und Unicode-Zeichen oder bricht bei Inhaltsverlust laut ab.
  - Ein Timeout eines wartenden Imports gibt niemals die Sperre eines aktiven Imports frei; Prozessende
    gibt die Betriebssystemsperre frei.
  - Erzeugte Reports werden vor Veröffentlichung parserbasiert geprüft; beschädigte, reparaturbedürftige,
    leere oder verschlüsselte PDFs werden abgewiesen.
  - Reportersatz publiziert eine neue unveränderliche Generation. Datenbankfehler einschließlich äußerem
    Transaktionsrollback erhalten die vorherige Datei und Referenz; unklarer Commitstatus führt nicht
    zur Löschung einer möglicherweise referenzierten Generation.
  required: true
  verification:
    kind: manual
    instructions: Fokussierte Quellerhalt-, Textvollständigkeits-, Prozesssperren-, PDF-Parser- und Transaktionsrollback-Tests
      einschließlich verschlüsseltem Speicher ausführen.
