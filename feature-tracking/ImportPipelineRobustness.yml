- id: atomic_media_generation_publication
  category: functionality
  title: Master, Derivate, Status und Erfolgsevidenz werden als eine Generation veröffentlicht
  acceptance:
  - Ein Import wird erst erfolgreich, wenn kanonischer Master, erforderliche Derivate, Zustände und Erfolgshistorie
    auf dieselbe Generation zeigen und vollständig validiert sind.
  - Ein Fehler nach Master-Staging, während Raw- oder Processed-HLS oder beim History-Commit hinterlässt
    keine teilweise als gültig referenzierte Generation.
  - Die vorherige gültige Generation bleibt bis zum vollständigen Commit lesbar und wird bei Fehlern weder
    überschrieben noch gelöscht.
  required: true
  verification:
    kind: manual
    instructions: Failure Injection an jeder Datei- und Datenbankgrenze ausführen und Datenbank, Master,
      HLS, History und vorherige Generation anschließend reconciliieren.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: endoreg_db/import_files/file_storage/state_management.py::finalize_video_success; endoreg_db/services/hls_media.py::_publish_validated_artifact
    - kind: test
