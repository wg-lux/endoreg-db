    note: 'Reported duplicate-display incident on gc-10: videos 54 and 55 originate from same-named uploads
      and both report 2183.68 seconds, 50 frames per second and 109183 frames, but their stored source
      hashes differ. Both UploadJob hashes match their respective VideoFile.video_hash; processed identities
      also differ. At initial inspection video 54 had 31845 manual frame annotations, 583 segments (96
      without prediction metadata), accepted anonymization and no raw-file reference. Video 55 has no
      frame or segment annotations, retains a raw-file reference and has unaccepted anonymization. Video
      54 has clinical links; video 55''s patient and examination links are unset, not proven conflicting
      patient identities. Preserve 54 as the canonical candidate and retain 55''s unique raw source if
      equivalence is verified. Current source inspection hashes the incoming file before anonymization
      and looks up VideoFile.video_hash, not processed_video_hash. The hypothesis that a historical anonymized
      or re-encoded input caused the different source hashes remains unproven; equal names and timing
      are not content-equivalence evidence. This records an improvement requirement, not an implemented
      deduplication fix or automatic deletion policy. Subsequently, the operator explicitly requested
      cancellation, PostgreSQL evidence capture and retirement of video 55. Live inspection identified
      video 45 as the active encoder; four queued HLS deliveries for video 55 were revoked with acknowledgments
      and removed from the queue without interrupting video 45. After a full database snapshot, record-only
      transactional deletion removed video 55, its 109183 unannotated frame records and seven HLS records.
      The unique raw and processed ciphertext files were atomically moved into the protected host-local
      recovery archive with inode and size preserved; they were not attached to video 54 and source equivalence
      remains unproven. PostgreSQL after-checks found zero video/frame/HLS records for 55. Video 54''s
      31845 manual annotations and 583 segments retain identical before/after row digests; its video and
      state records also remain unchanged. The application and FFmpeg worker remain active. This scoped
      operational retirement does not implement or verify automatic retrospective deduplication. Ergänzung
      2026-09-08: Der automatische Löschpfad in _existing_readable_video wurde entfernt; bestehende Quellidentität
      wird jetzt vor Normalisierung geprüft. Fehlende oder unlesbare Rohquellen führen in direkter Erzeugung,
      Kontextwiederverwendung und History-Pfaden zu einem typisierten Integritätsfehler statt Datensatzlöschung
      oder Zustandsreset. 27 parametrisierte Fälle mit wiederholtem Aufruf sichern Video, VideoState,
      Frame, menschliche Annotation, History, Master und Eingangsquelle unverändert ab. Ein erfolgreich
