        -q (14 passed, 4 subtests passed)
    - kind: test
      reference: '2026-09-07: tests/services/test_hls_media.py and tests/import_files/test_video_finalize_success.py
        included in all-enabled 69-pass integration lane'
    note: Existing publication guards/history failure propagation retained. Inline queued HLS takeover
      changes the attempt key under row lock; delayed deliveries cannot overwrite it, active encoder stays
      protected, and completed reservations are idempotent. Active join polls only fenced DB state with
      execution guard and bounded wait while enclosing heartbeat continues, avoiding repeated source hashing.
      Both raw and processed readiness remain required. Focused materialization/finalization tests and
      full Pyright pass; expanded process-level PostgreSQL/concurrent recovery acceptance remains outstanding.
    assessed_by: codex-remote-review-20260907
    assessed_at: '2026-09-07T09:20:52.013179Z'
