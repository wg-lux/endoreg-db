- id: import_reconciliation_and_recovery
  category: operations
  title: Partielle Importe werden sicher erkannt und wiederaufgenommen
  acceptance:
  - Video overview and status polling project a matching terminal import_interrupted upload as failed
    instead of stale in-progress media state. Newer attempts, newer media state, other centers/sources,
    and completed or validated media are not overridden. Read requests never manufacture completion, modify
    media state, approve validation, or infer success from streaming derivatives.
  - Reconciliation erkennt Datenbank-only, Storage-only, fehlende History, unvollständige HLS-Generation,
    abgelaufene Ownership und widersprüchliche Erfolgszustände.
  - Automatische Reparatur verändert nur eindeutig besessene, wiederherstellbare Zustände; unbekannte
    oder klinisch unsichere Zustände werden als LOST oder Quarantäne sichtbar und bleiben erhalten.
  - Retry ist begrenzt, idempotent, kapazitätsgeprüft und löscht nie die einzige gültige Quelle oder Generation.
  - Expired upload ownership is rechecked under row lock and fenced before terminal interruption; delayed
    workers cannot publish or reacquire a reconciled interruption themselves. The recurring retry coordinator
    automatically admits retained raw-video sources with a center, source digest and remaining retry budget
    under the row lock, using bounded backoff. Cancelled/dismissed jobs, active owners, pre-anonymized
    sources, cleanup and exhausted budgets are excluded. Source bytes are verified before processing;
    stale snapshots stay fenced after admission. Unproven cancellation cleanup remains an interruption,
    never successful cancellation.
  - Video retry handoff remains rediscoverable until worker admission; a lost broker send is retried after
    a bounded interval without consuming processing retries or weakening exclusive execution ownership.
  - Nach klinischer Validierung darf die Start-Reconciliation entfernte Rohdateien nicht aus alten Kopien
    wieder verknüpfen; vor der Mutation wird der aktuelle Zustand unter Zeilensperre erneut geprüft. Die
    Übersicht zeigt historische Rohstream-Fehler bei validiertem Video und belegter aktueller fertiger
    anonymisierter Streaming-Generation nicht als aktuellen Fehler. Aktive Rohverarbeitung und fehlende,
    ungeprüfte oder fehlerhafte anonymisierte Generationen bleiben sichtbar.
  required: true
