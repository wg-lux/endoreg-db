- id: report_spacy_fallback_without_llm
  category: functionality
  title: Reportimporte wählen ein erreichbares LLM zur Laufzeit oder fallen explizit auf spaCy und Regex
    zurück
  acceptance:
  - lx-anonymizer prüft beim Start eines Reportimports den konfigurierten LLM-Provider und aktiviert LLM-Metadatenextraktion
    nur, wenn der Provider erreichbar ist und ein Modell bereitstellt; bei explizit deaktivierter LLM-Verarbeitung
    wird der Provider nicht kontaktiert.
  - endoreg-db führt Reportimporte unabhängig von der LLM-Verfügbarkeit im bereits verfügbaren Pipeline-Worker
    aus und übergibt use_llm=true nur nach erfolgreicher Laufzeitprüfung; andernfalls verwendet der Import
    die lokale spaCy- und Regex-Pipeline.
  - Die Auswahl von LLM oder Fallback wird strukturiert protokolliert, startet keinen Dienst und lädt
    kein Modell automatisch herunter; ein Import wird erst nach der bestehenden Artefakt-, Hash- und Zustandsvalidierung
    als erfolgreich markiert.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_report_llm_jobs.py
    - tests/services/test_report_import_service_unit.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: endoreg_db/services/jobs/heavy_jobs.py; endoreg_db/config/settings/base.py; endoreg_db/import_files/processing/report_processing/report_anonymization.py;
        //lx-anonymizer/lx_anonymizer/report_reader.py
    - kind: test
      reference: 'Endoreg packaged-runtime pytest: 42 passed; lx-anonymizer focused pytest: 7 passed'
    - kind: command
      reference: lx-anonymizer pyright initially 0 errors/8 warnings; later rerun blocked by 20 concurrent
        legacy example-test errors; Endoreg pyright environment incomplete, focused runtime tests passed
    note: Reporttasks run on the pipeline queue. ReportReader probes the configured provider model list
      at execution and sets use_llm=true only when a usable model is reachable; explicit LLM_ENABLED=false
      skips probing. Selection is structured-logged and no service/model is auto-started.
    assessed_by: codex-report-spacy-fallback
    assessed_at: '2026-08-27T08:21:19.756497Z'
- id: canonical_import_attempt_contract
  category: requirements
  title: Alle produktiven Importpfade verwenden einen kanonischen Importversuch
  acceptance:
  - Video, Report, API, Watcher, Transfer und voranonymisierter Import besitzen einen persistierten, typisierten
    Versuch mit eindeutiger Medienart, Quellgeneration, Owner, Status und Attempt-ID.
  - Direkte Service- und Kommandoaufrufe umgehen Lease, Retry, Fencing, Publikation oder Cleanup nicht.
  - Der Vertrag benennt explizit, welche lokalen Locks nur Optimierungen und welche Datenbankzustände
    autoritative Cluster-Ownership sind.
  - Queued video reservations and running deliveries have distinct owner identities; same-task redelivery
    and legacy live owners cannot share or steal an execution epoch.
  - Busy Celery deliveries retry until lease expiry or completion without consuming the upload processing
    retry budget; completion is checked under the lease-acquisition row lock.
  - Database outages and identified runtime/schema mismatches preserve import ownership and sources, retry
    with capped backoff without consuming the processing budget, and never become duplicate-content success.
  required: true
  verification:
    kind: manual
    instructions: Alle Call-Sites von VideoImportService und ReportImportService inventarisieren und gegen
      den kanonischen Attempt-Vertrag prüfen.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/import_files/video_import_service.py; endoreg_db/services/hub/ingest.py; docs/video_import_concurrency_contract.md
    - kind: test
      reference: PYTHONPATH=/lx-data-models:/endoreg-db .devenv/state/venv/bin/pytest tests/services/test_video_import_service_unit.py
        tests/services/test_hub_ingest_import_job_contract.py -q (57 passed)
    - kind: code
      reference: endoreg_db/services/report_import_state_machine.py; endoreg_db/services/report_import_fencing.py;
        endoreg_db/services/hub/upload_job_state_machine.py; endoreg_db/services/hub/upload_job_import_lease.py
    - kind: code
      reference: endoreg_db/services/jobs/report_llm_jobs.py; endoreg_db/services/hub/upload_job_state_machine.py;
        endoreg_db/services/report_import_state_machine.py
    - kind: code
      reference: endoreg_db/services/jobs/report_llm_jobs.py; endoreg_db/services/jobs/video_reimport_jobs.py;
        endoreg_db/services/hub/ingest.py; endoreg_db/services/media_integrity.py
    - kind: code
      reference: endoreg_db/services/hub/ingest.py; endoreg_db/services/hub/upload_job_import_lease.py
    - kind: test
      reference: tests/services/test_watcher_storage_import.py
    - kind: command
      reference: 'Kombinierte Lifecycle-/Watcher-Lane: 171 passed, 3 subtests passed, 2 warnings'
    - kind: test
      reference: '2026-09-07: all-enabled SQLite HLS/import/lease/dispatch lane 69 passed; final impacted
        lane 29 passed; task retry configuration 3 passed'
    - kind: document
      reference: 'docs/video_storage_normalization.md: Import reservation and delivery recovery'
    - kind: test
      reference: tests/services/test_hub_ingest_import_job_contract.py::TestVideoImportJobHandoff::test_database_outage_preserves_import_source_lease_and_retry_budget;
        tests/test_tasks.py::test_database_outage_retries_import_and_hls_delivery; tests/services/test_database_recovery.py
    - kind: command
      reference: '2026-09-07 final full Pyright: 0 errors, 0 warnings. SQLite database-recovery/task/import-finalization/lease/video-import
        suite: 117 passed, 2 warnings; original focused recovery/backfill suite: 96 passed, 2 warnings.'
