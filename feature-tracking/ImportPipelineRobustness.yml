schema_version: '1.0'
id: import_pipeline_robustness
name: Robuste Import-Pipeline
description: Einheitlicher, fail-closed und wiederanlauffähiger Importvertrag für Video-, Report-, UploadJob-,
  Watcher-, Transfer- und voranonymisierte Pfade. Die Aufgabe bündelt die schrittweise Härtung von Ownership,
  Publikation, Erfolgsevidenz und Reconciliation, ohne bestehende Medienpfade vorzeitig als atomar oder
  produktionsreif zu bewerten.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/video_import_concurrency_contract.md
  disposition: reference
  note: Definiert Lease, Heartbeat, Fencing und versuchseigene Publikationsrechte für Videoimporte.
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Definiert kanonischen Master, HLS-Generationen, atomare Veröffentlichung und Cleanup-Gates.
- path: docs/hub_ingest_operations.md
  disposition: reference
  note: Beschreibt Upload-, Watcher-, Transfer-, Quarantäne- und Wiederanlaufpfade.
- path: docs/wiki/hub_ingest_current_state.md
  disposition: reference
  note: Inventarisiert die bestehenden Ingest-Eingangsgrenzen und UploadJob-Orchestrierung.
