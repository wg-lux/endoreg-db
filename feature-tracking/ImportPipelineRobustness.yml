- id: report_extraction_outcome_rust_authority
  category: data_integrity
  title: Report success distinguishes extraction outcomes through Rust-authoritative state transitions
  acceptance:
  - Distinguish successful extraction with findings, successful extraction without findings, an explicitly
    permitted deterministic fallback, and provider or extraction failure as typed evidence; an empty dictionary
    or Celery True return is not completion evidence.
  - Rust remains the single source of truth for lifecycle states, event validation and deterministic transitions
    through the existing native lifecycle core and typed bindings. Python orchestrates fenced persistence
    and side effects; lx-dtypes validates exchanged evidence, and neither defines a competing state machine
    or success flag.
  - Reuse the existing report import lifecycle adapter and canonical persisted attempt. Extend the native
    contract first if new transition semantics are required, and fail closed on a missing or incompatible
    required native core rather than introducing a Python production fallback.
  - Preserve the explicit spaCy/regex policy in report_spacy_fallback_without_llm. If a provider fails
    after readiness selection, record actual backend and failure evidence; completion requires a permitted
    fallback that itself passed validation, otherwise use the existing Rust-authorized failure/retry path
    without publishing apparent success.
  - Artifact parsing, hash validation, metadata validation, ownership fencing and publication evidence
    remain required independently of extraction outcome; task results, monitoring and API projections
    derive completion from the canonical persisted attempt after the Rust-authorized transition.
  - Native and Python integration regressions cover findings, valid empty extraction, permitted fallback,
    provider failure after a successful readiness probe, fallback failure, invalid artifacts, stale ownership,
    retry and duplicate delivery without contradictory completion projections.
  required: true
  verification:
    kind: manual
    instructions: Review against LongRunningServiceStateMachines.yml rust_transition_core and the native
      lifecycle contract; run native transition tests, strict Pyright, report import/state-machine/fencing
      tests and packaged-worker failure injection. Verify that one persisted attempt determines all completion
      projections.
    timeout_seconds: 900
