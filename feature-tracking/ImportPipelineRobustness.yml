- id: canonical_import_attempt_contract
  category: requirements
  title: Alle produktiven Importpfade verwenden einen kanonischen Importversuch
  acceptance:
  - Video, Report, API, Watcher, Transfer und voranonymisierter Import besitzen einen persistierten, typisierten
    Versuch mit eindeutiger Medienart, Quellgeneration, Owner, Status und Attempt-ID.
  - Direkte Service- und Kommandoaufrufe umgehen Lease, Retry, Fencing, Publikation oder Cleanup nicht.
  - Ein einmal aufgelöstes Importzentrum bleibt über seinen stabilen Schlüssel zwischen Upload-Auftrag
    und Medienverarbeitung gebunden, auch wenn sich die lokale Zentrumsauswahl inzwischen ändert.
  - Wiederverwendete Videos bestimmen den Anonymisierungsprozessor aus ihrer kanonischen Zuordnung; Kontext
    und Maskierung dürfen keinen abweichenden Prozessor verwenden. Prozessor-Defaults haben eine gemeinsame
    Auflösung und werden nicht als gerätespezifischer Kontext-Default dupliziert.
  - Fehlerbehandlung und Bereinigung beziehen sich auf dieselbe aktuelle Medienreferenz wie die Verarbeitung;
    widersprüchliche Kontextreferenzen werden abgelehnt oder ausschließlich abgeleitet.
  - Explizit angeforderte Wiederverarbeitung und aus Fehlerhistorie erkannte Wiederholung haben eine eindeutige
    Semantik ohne konkurrierende veränderbare Retry-Werte. Regressionen prüfen diese Fälle sowie Zentrumwechsel,
    Prozessorabweichungen und den Wechsel der aktuellen Medienreferenz.
  - Der Vertrag benennt explizit, welche lokalen Locks nur Optimierungen und welche Datenbankzustände
    autoritative Cluster-Ownership sind.
  - Queued video reservations and running deliveries have distinct owner identities; same-task redelivery
    and legacy live owners cannot share or steal an execution epoch.
  - Busy Celery deliveries retry until lease expiry or completion without consuming the upload processing
    retry budget; completion is checked under the lease-acquisition row lock.
  - Database outages and identified runtime/schema mismatches preserve import ownership and sources, retry
    with capped backoff without consuming the processing budget, and never become duplicate-content success.
  required: true
  verification:
    kind: manual
    instructions: Alle Call-Sites von VideoImportService und ReportImportService inventarisieren und gegen
      den kanonischen Attempt-Vertrag prüfen.
    timeout_seconds: 600
