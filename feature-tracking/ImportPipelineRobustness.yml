schema_version: '1.0'
id: import_pipeline_robustness
name: Robuste Import-Pipeline
description: Einheitlicher, fail-closed und wiederanlauffähiger Importvertrag für Video-, Report-, UploadJob-,
  Watcher-, Transfer- und voranonymisierte Pfade. Die Aufgabe bündelt die schrittweise Härtung von Ownership,
  Publikation, Erfolgsevidenz und Reconciliation, ohne bestehende Medienpfade vorzeitig als atomar oder
  produktionsreif zu bewerten.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/video_import_concurrency_contract.md
  disposition: reference
  note: Definiert Lease, Heartbeat, Fencing und versuchseigene Publikationsrechte für Videoimporte.
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Definiert kanonischen Master, HLS-Generationen, atomare Veröffentlichung und Cleanup-Gates.
- path: docs/hub_ingest_operations.md
  disposition: reference
  note: Beschreibt Upload-, Watcher-, Transfer-, Quarantäne- und Wiederanlaufpfade.
- path: docs/wiki/hub_ingest_current_state.md
  disposition: reference
  note: Inventarisiert die bestehenden Ingest-Eingangsgrenzen und UploadJob-Orchestrierung.
definition_of_done:
- id: source_identity_deduplication_and_legacy_reconciliation
  category: data_integrity
  title: Preserve source identity and human annotations when reconciling duplicate video imports
  acceptance:
  - Persist the immutable incoming plaintext source SHA-256 (Secure Hash Algorithm, 256-bit) before anonymization,
    normalization, remuxing or encryption. Keep this identity distinct from the anonymized master hash
    and each derivative generation hash; transformed output hashes must never overwrite the original import
    identity.
  - Identical source bytes imported under different names or through concurrent entrypoints resolve to
    one canonical video within the authorized clinical scope. Pre-anonymized inputs explicitly identify
    their input role and preserve verified source lineage when available; their output hash alone must
    not establish equivalence with a raw recording.
  - Different byte hashes with a matching filename, duration or frame count identify only a possible duplicate.
    Require verified source lineage and presentation-timestamp timeline equivalence before consolidation;
    uncertain identity or conflicting clinical links must produce a reviewable blocked result without
    merging or deleting media.
  - Retrospective reconciliation provides a dry-run inventory of all references and selects the record
    carrying human annotations as the canonical candidate. Preserve annotation identifiers, annotators,
    labels, values, timestamps, frame coordinates, segments and validation history. If both records contain
    human work, preserve both annotation tracks and report conflicts rather than overwriting either track.
  - Preserve unique raw sources, the accepted anonymized master, import provenance, clinical references
    and dependent jobs before retiring a redundant record. Reconcile active media leases, queued tasks
    and generation references; do not transfer anonymization acceptance to a different processed generation
    or cascade-delete human work or the only source copy.
  - Consolidation is transactional, idempotent and auditable, with recoverable evidence and explicit failure
    handling across database and encrypted-storage boundaries. Destructive cleanup remains behind the
    existing video-storage validation and approval gates.
  - Ein erneuter Import mit gleichem Quellhash darf bei fehlender oder unlesbarer Rohquelle keinen vorhandenen
    Videodatensatz löschen oder dessen Annotationen, akzeptierten Master und Historie zurücksetzen. Ohne
    nachgewiesenen sicheren Wiederverwendungspfad muss er vor diesen Mutationen mit einem überprüfbaren
    Integritätsfehler abbrechen; Quelle und vorhandene Referenzen bleiben erhalten.
  - Ein zuvor erfolgreich empfangener Hub-Transfer wird bei erneutem Eingang derselben Quellidentität
    im selben Zentrum erkannt. Ohne Rohdateireferenz erfordert die Wiederverwendung einen angewandten
    Transfer mit passendem Zielvideo und typisiertem Empfangsbeleg sowie die aktuelle akzeptierte verarbeitete
    Generation mit passender Klartextgröße und passendem Hash. Fehlende oder widersprüchliche Belege,
    fremde Zentren, geänderte Generationen und unlesbare Artefakte erlauben keinen Duplikaterfolg. Die
    erforderliche verarbeitete HTTP-Live-Streaming-Generation muss bereit sein; die erneut eingegangene
    Rohquelle bleibt auch im verwalteten Importverzeichnis erhalten.
  required: true
  verification:
    kind: manual
    instructions: Add regression coverage for renamed identical sources, concurrent duplicate imports,
      raw versus pre-anonymized input, remuxed or re-encoded candidates with different hashes, missing
      legacy source identity, human annotations on either or both records, unique raw-source retention,
      clinical/timeline conflicts, active jobs, rollback and idempotent replay. Use synthetic fixtures,
      then review a gc-10 dry run; do not delete production records merely to verify this criterion.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: '2026-09-08 gc-10 read-only PostgreSQL inspection: VideoFile 54 and 55, UploadJob source
        hashes, VideoState, Frame, ImageClassificationAnnotation, LabelVideoSegment and VideoHlsArtifact;
        no media or records deleted.'
    - kind: review
      reference: >-
        2026-09-08 gc-10 read-only import-state audit
        (/var/lib/lx-annotate/recovery/import-state-audit-20260908/report.yml): 29 videos and 2,508
        import jobs reviewed; 2,473 import errors covered 32 source hashes, and 2,414 error jobs
        referenced absent upload files. Videos 35, 37 and 42 retain raw files but lack processed output
        and require recovery investigation. Video 12 lacks its raw file but retains processed media and
        29,698 human annotations; annotations and existing media must be preserved. Videos 48 and 52
        retain raw and processed files despite older LOST attempts. Two LOST jobs with retained files
        decrypted successfully and matched their original hashes; one belongs to retired video 55 and
        must not recreate it. Files were checked for existence, not full playback integrity; no videos,
        annotations or import states were changed.
    - kind: code
      reference: endoreg_db/import_files/video_import_service.py::_import_and_anonymize; endoreg_db/import_files/video_import_service.py::_raw_source_identity;
        endoreg_db/services/video_files/queries.py::get_video_by_content_hash
    - kind: command
      reference: '2026-09-08 explicit operator-requested retirement on gc-10: /var/lib/lx-annotate/recovery/video55-retirement-20260908
        contains database-before.dump, psql-evidence-before.json, psql-evidence-after.json, queued-hls-deliveries.json,
        revoke-acknowledgments.json, retirement-plan.json, transaction-evidence.json, retirement-result.json
        and the executed retire-record.py. Root-only host-local evidence; full pg_restore decode passed.
        Dump SHA-256: 4b56e833083a7822d55fc8734d29c593ea2f864aee70636a38eef82278fbc6da.'
    - kind: code
      reference: endoreg_db/services/video_files/_imports.py::_existing_readable_video; endoreg_db/services/hub/media_integrity.py::require_reusable_video_raw_source;
        endoreg_db/services/hub/media_integrity.py::has_verified_processed_video_transfer; endoreg_db/import_files/file_storage/create_video_file.py;
