    - kind: command
      reference: '2026-09-08 Zusatzprüfung nach Anpassung der bestehenden Rohquellen-Testobjekte: .devenv/state/venv/bin/pyright
        tests/services/test_video_import_service.py: 0 errors, 0 warnings; Ruff check und format --check
        bestanden. .devenv/state/venv/bin/pytest tests/services/test_video_import_service.py -m unit -q
        --tb=short: 22 passed, 1 deselected, 2 dependency/plugin warnings in 47.46s. Der zuvor zusätzlich
        gestartete unselektierte Lauf derselben Datei wurde wegen SKIP_EXPENSIVE_TESTS=false im aufwendigen
        vollständigen Videoimport gezielt mit SIGINT beendet (1 passed, Exit 2); dies ist kein abgeschlossener
