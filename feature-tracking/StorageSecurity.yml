definition_of_done:
- id: storage_contract
  category: requirements
  title: Schutz- und Storagevertrag ist über endoreg_db, lx-annotate und LuxNix einheitlich
  acceptance:
  - Python-, native Range- und native Hashleser verwenden denselben strikten Headervertrag; ungültige
    Typen, Längen, Nonces sowie abgeschnittene und inkonsistente Chunks werden abgewiesen.
  - Dateiformat-Probes verwenden ausschließlich den Rust-Magic-Header-Probe über einen typisierten Python-Adapter;
    fehlendes Backend und Lesefehler werden nicht als Klartext oder Python-Fallback behandelt.
  - Video, Bericht, Sidecar, Manifest und temporäres Artefakt haben einen eindeutigen Schutzmodus.
  - Operatorseitiges encryption-off ist kein unterstützter Produktionszustand.
  - storage_mode verwendet ausschließlich typisierte, exhaustive Routingentscheidungen.
  - Der kanonische Dateioperations-Wrapper ist endoreg_db.utils.filesystem.file_operations; abweichende
    Importpfade sind nur als inventarisierte, getestete und befristete Kompatibilität zulässig.
  required: true
  verification:
    kind: manual
    instructions: Cross-Repository-Vertrag gegen Settings, Storage-Backends und Deploymentprofile prüfen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/environment/test_secret_resolution.py; tests/rust_backend/test_encryption_status.py;
        rust/endoreg_rust_backend/src/encryption_state.rs
    - kind: test
      reference: tests/rust_backend/test_encrypted_contract.py; tests/environment/test_secret_resolution.py
        (zweite Secret-Runde, gemeinsame native Header- und Schlüsselverträge)
    note: '2026-09-24: Einheitlicher Rust-Magic-Header-Probe ohne Python-Fallback; gemeinsame private
      Dateileser und Validatoren für Salz, Master-Keys und Django-Signaturschlüssel. Health-Fingerprint
      verwendet den geladenen Schlüssel. Radon load_keyring 22 -> 10, load_identity_salt 11 -> 7. Vollständiger
      Pyright-Lauf: 0 Fehler, 6 bestehende Warnungen. Integrationslane: 133 bestanden; abschließende Native-/Import-/Range-Lane:
      39 bestanden; jeweils 3 Warnungen. Zwei Rust-Unit-Tests bestanden mit explizitem libpython-Link.
      Ruff, cargo fmt und git diff --check bestanden. Native Keyring-/24-Byte-Schlüssel-Divergenz und
      Headerparser-Unterschiede bleiben in docs/secret_rotation.yml dokumentiert. Keine Produktionsfreigabe.

      2026-09-24, zweite Secret-Runde: Gemeinsamer Rust-Headervertrag für Python-, Range- und Hashleser;
      native Einzel-/Batch-Hashleser erhalten einen validierten aktiven/auslaufenden Schlüssel-Snapshot
      und laden keine Secrets selbst. 16/24/32-Byte-Schlüssel, Header-Typen und Größen, abgeschnittene
      Chunk-Längen, kurze Reads sowie leere verschlüsselte Dateien geprüft. Leere Salt-Snapshots bleiben
      stabil; mehrdeutige YAML-Felder und coercierte Kontrollwerte werden abgewiesen; kein Ersatz-Signaturschlüssel
      in Produktionssettings unter pytest. Master-Key-Auflösung Radon B/6 -> A/1, gemeinsamer Resolver
      A/5; Chunk-Index A/5 -> A/4. Vollständiger Pyright: 0 Fehler, 6 bestehende Warnungen. Cargo: 19
      Tests bestanden mit explizitem libpython-Link. Python-Integration über 17 Dateien: 228 bestanden,
      1 übersprungen, 3 Warnungen in 82.63 Sekunden. Der PostgreSQL-Advisory-Lock-Test wurde unter SQLite
      übersprungen; daraus folgt kein PostgreSQL-Parallelitätsnachweis. Ruff, cargo fmt, git diff --check
      und Tracker-Validierung bestanden. Keine Produktionsdaten oder Deployments geändert. LXENC01 benötigt
      gegen den Verlust vollständiger letzter Chunks weiterhin einen unabhängigen Soll-Hash; Details in
      docs/secret_rotation.yml. Produktionsabnahme und PostgreSQL-Nachweis bleiben erforderlich.'
    assessed_by: codex-secret-reliability-20260924
    assessed_at: '2026-09-24T09:26:04.932090Z'
- id: encrypted_at_rest
  category: security
  title: Physischer Datenträgerzugriff ermöglicht keinen Klartextzugriff
  acceptance:
  - Managed Non-Video-Payloads nutzen anwendungsseitig verschlüsselten Storage.
  - Videos liegen innerhalb der freigegebenen verschlüsselten, streambaren Grenze.
  - Start schlägt fehl, wenn erforderliche Schlüssel- oder Storageinvarianten fehlen.
  required: true
  verification:
    kind: manual
    instructions: Datenträger-, Settings- und Startfehlerprüfung im Produktionsprofil durchführen.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: protected_delivery
  category: functionality
  title: Geschützte Medien werden nur autorisiert und proxygeeignet ausgeliefert
  acceptance:
  - Produktionsrouten mounten geschützte Medien nie direkt unter public media.
  - Streaming nutzt authentifizierte API-Prüfung und optional X-Accel-Redirect.
  - Range-, Chunk- und Fehlerverhalten funktionieren mit verschlüsseltem Storage.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_environment_readiness.py
    - tests/views/video/test_video_stream.py
    - tests/views/report/test_report_stream.py
    - -q
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: /endoreg-db/.devenv/state/venv/bin/pytest tests/services/test_environment_readiness.py
        tests/views/video/test_video_stream.py tests/views/report/test_report_stream.py -q (19 passed,
        2 warnings in 93.36s)
    note: Die fokussierte Verifikationslane bestätigt fail-closed Produktions-Readiness, authentifizierte
      Video- und Berichtsauslieferung, Proxy-Offload sowie verschlüsseltes Range-, Chunk- und Fehlerverhalten.
    assessed_by: codex-root-feature-c7f4a9
    assessed_at: '2026-09-02T11:41:27.078817Z'
- id: filesystem_integrity
  category: data_integrity
  title: Alle Mutationen sind atomar, typisiert und strukturiert protokolliert
  acceptance:
  - Produktionscode umgeht endoreg_db.utils.filesystem.file_operations nicht; Cross-Repository-Aufrufer
    verwenden denselben kanonischen Importpfad oder einen explizit dokumentierten Kompatibilitätswrapper.
  - Teilwrites werden nicht als gültige Artefakte sichtbar und Integrität ist hashbar.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/utils/test_file_operations.py
    - tests/services/test_report_artifact_integrity.py
    - -q
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/services/test_video_storage_atomic_migration.py (5 passed)
    - kind: review
      reference: endoreg_db/utils/filesystem/file_operations.py; endoreg_db/services/video_storage/normalization.py
    note: Der Video-Normalisierer verwendet den kanonischen Filesystem-Facade; Teiloutputs werden nicht
      veröffentlicht und Mutationen/Lifecycle sind strukturiert protokolliert. Die repository-weite Migration
      verbleibender Legacy-Imports ist noch offen.
    assessed_by: Codex
    assessed_at: '2026-07-20T10:37:53.499645Z'
- id: migration_and_repair
  category: operations
  title: Bestandsmigration, Rotation, Reparatur und Rollback sind sicher
  acceptance:
  - Migration arbeitet idempotent, prüft freien Speicher und verifiziert Quelle sowie Ziel.
  - Fehler markieren Artefakte nachvollziehbar und führen nicht zu unsafe Auto-Recovery.
  - Key-Rotation und Backup-Restore sind dokumentiert und geprobt.
  required: true
  verification:
    kind: manual
    instructions: Produktionsnahe Migrations-, Abbruch-, Restore- und Rotationsübung durchführen.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: tests/services/test_video_storage_atomic_migration.py (5 passed)
    note: ENOSPC, Unterbrechung, Validierungsfehler und Publikationsfehler sind fail-closed regressionsgetestet.
      Produktionsnahe Restore-, Key-Rotations- und harte Prozessabbruchübung fehlen weiterhin.
    assessed_by: Codex
    assessed_at: '2026-07-20T10:37:54.487849Z'
