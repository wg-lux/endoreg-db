      - tests/views/misc/test_patient_center_contract.py
      - tests/views/report/test_report_llm_status.py
      - tests/views/test_center_access_matrix.py
      - tests/views/media/test_center_scoped_reads.py
      - -q
      working_directory: /endoreg-db
    - command:
