      - --command
      - npm
      - run
      - test:unit
      - --
      - src/components/Anonymizer/__tests__/AnonymizationOverviewComponent.test.ts
      - src/composables/__tests__/useAuthenticatedVideoStream.test.ts
      - --run
      working_directory: /dev/lx-annotate/frontend
    timeout_seconds: 600
  assessment:
