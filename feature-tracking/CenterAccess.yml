- id: deployment_aware_video_reads
  category: functionality
  title: Video discovery and playback enforce the same deployment-aware policy
  acceptance:
  - The anonymization overview does not center-filter authenticated central-hub users, including users
    without a center membership, while non-hub profiles filter by all assigned center IDs.
  - Processed HLS playlists, keys, segments, frames, and timeline endpoints apply the same central-hub
    visibility rule and retain their existing video-read authorization checks.
  - Cross-center discovery and detail responses include only pseudonymous playback metadata and omit patient
    identity, original filenames, filesystem paths, operator names, raw integrity details, and upload
    diagnostics.
  - The central-hub exception requires both a processed artifact and an anonymized, non-error, non-lost
    state; incomplete artifacts remain invisible and forbidden.
  - After anonymization and segment validation, deleting the original raw video does not remove authenticated
    users' cross-center discovery, processed playback, training-manifest access, or training-frame extraction
    from the retained processed artifact.
  - Central-hub training uses the selected dataset's frame identities and validated processed media, including
    transferred annotation rows without extracted caches or exact presentation timestamp ticks. It does
    not depend on original files, estimate new frame coordinates, or grant raw-media export.
  - Raw artifact paths remain center-scoped, and anonymous requests are denied in every deployment profile.
  - Training manifests export typed processed-frame references without cache paths; the lx-ai-core loader
    reads only independently authorized frame IDs, rechecks processed-media gates per read, and propagates
    wrong-key, tamper, decoder and cleanup failures without retaining plaintext frame files.
  - Missing or incomplete center membership fails closed outside the explicitly unrestricted central-hub
    processed-video read boundary.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/views/anonymization/test_anonymization_overview.py
    - tests/views/video/test_hls_stream.py
