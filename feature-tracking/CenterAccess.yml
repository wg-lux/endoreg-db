- id: deployment_access_matrix
  category: requirements
  title: The access contract is explicit for every deployment profile and resource class
  acceptance:
  - The contract distinguishes standalone, site-node, local-study-server, and central-hub behavior.
  - It separately defines access to anonymization overview entries, anonymized processed playback, raw
    media, patients, reports, uploads, exports, administration, and write operations.
  - On a central hub, every authenticated user with the existing video-read permission can discover and
    view anonymized processed videos from every center without a center assignment.
  - Central-hub video visibility does not implicitly grant cross-center access to raw media, patient data,
    reports, uploads, exports, administration, or write operations.
  - Node-authenticated hub transfer routes derive center scope from NetworkNode.owning_center rather than
    a Django user, while debug-only anonymous application routes retain their documented permission contract.
  - Cross-center object reads conceal resource existence consistently, and the regression matrix includes
    hub transfer, FHIR export, report access, and patient creation callsites.
  required: true
  verification:
    kind: command
    commands:
    - command:
      - devenv
      - shell
      - --
      - .devenv/state/venv/bin/pytest
