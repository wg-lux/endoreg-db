- id: identity_center_memberships
  category: functionality
  title: Verified identity claims produce deterministic local center memberships
  acceptance:
  - Center memberships are represented as typed model relationships and support zero, one, or multiple
    centers without relying on the workflow default center.
  - Only verified identity-provider center groups update memberships; unknown or malformed center keys
    fail loudly and do not produce partial assignments.
  - Reauthentication replaces the local membership cache deterministically, and the legacy Examiner.center
    relationship is migrated without silently dropping existing access.
  - Staff and superuser global access remains explicit and is not inferred from missing membership data.
  - Verified empty or absent role claims revoke previous local role grants; user, role, and center synchronization
    commits atomically or rolls back together.
  - A session created from verified claims exposes the application role through auth bootstrap and returns
    only its permitted center overview; reauthentication and revocation change both gates.
  - Browser login preserves verified ID-token center groups when UserInfo omits groups, requires matching
    subjects, and gives an explicit UserInfo groups claim precedence, including empty revocation.
  - Missing groups in every trusted claim source fails authentication without changing cached memberships;
    operators receive an actionable mapper error rather than a successful empty synchronization.
  required: true
  verification:
    kind: command
    command:
    - env
    - TEST_DB_ENGINE=django.db.backends.sqlite3
    - RUN_VIDEO_TESTS=true
    - SKIP_EXPENSIVE_TESTS=false
    - .devenv/state/venv/bin/pytest
    - tests/services/test_center_access.py
    - tests/authz/test_center_group_sync.py
    - -q
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/services/test_center_access.py tests/authz/test_center_group_sync.py
        -q
      note: Exit-Code 0
    - kind: test
      reference: '2026-09-07: TEST_DB_ENGINE=django.db.backends.sqlite3 RUN_VIDEO_TESTS=true SKIP_EXPENSIVE_TESTS=false
        pytest tests/authz/test_center_group_sync.py tests/keycloak/test_auth_bootstrap.py: 13 passed'
    - kind: code
      reference: endoreg_db/authz/auth.py; endoreg_db/authz/backends.py; tests/authz/test_center_group_sync.py
    - kind: test
      reference: '2026-09-14: TEST_DB_ENGINE=django.db.backends.sqlite3 RUN_VIDEO_TESTS=true SKIP_EXPENSIVE_TESTS=false
