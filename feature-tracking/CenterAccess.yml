schema_version: '1.0'
id: center_access
name: Center Access and Central-Hub Video Visibility
description: Production-readiness criteria for identity-backed multi-center assignments and deployment-aware
  video access, including authenticated cross-center viewing of anonymized processed media on a central
  hub while non-hub profiles and sensitive resources remain center-scoped.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/center_access_operations.md
  disposition: reference
  note: Access matrix, identity-provider groups, diagnostics, and rollout and rollback procedures.
definition_of_done:
- id: deployment_access_matrix
  category: requirements
  title: The access contract is explicit for every deployment profile and resource class
  acceptance:
  - The contract distinguishes standalone, site-node, local-study-server, and central-hub behavior.
  - It separately defines access to anonymization overview entries, anonymized processed playback, raw
    media, patients, reports, uploads, exports, administration, and write operations.
  - On a central hub, every authenticated user with the existing video-read permission can discover and
    view anonymized processed videos from every center without a center assignment.
  - Central-hub video visibility does not implicitly grant cross-center access to raw media, patient data,
    reports, uploads, exports, administration, or write operations.
  - Node-authenticated hub transfer routes derive center scope from NetworkNode.owning_center rather than
    a Django user, while debug-only anonymous application routes retain their documented permission contract.
  - Cross-center object reads conceal resource existence consistently, and the regression matrix includes
    hub transfer, FHIR export, report access, and patient creation callsites.
  required: true
  verification:
    kind: command
    commands:
    - command:
      - devenv
      - shell
      - --
      - .devenv/state/venv/bin/pytest
      - tests/views/media/test_hub_transfer_endpoints.py
      - tests/services/test_transfer_job_contract.py
      - tests/services/test_fhir_r4_export.py
      - tests/views/misc/test_patient_center_contract.py
      - tests/views/report/test_report_llm_status.py
      - tests/views/test_center_access_matrix.py
      - tests/views/media/test_center_scoped_reads.py
      - -q
      working_directory: /home/admin/endoreg-db
    - command:
      - nix
      - develop
      - .
      - --command
      - npm
      - run
      - test:unit
      - --
      - src/components/Anonymizer/__tests__/AnonymizationOverviewComponent.test.ts
      - src/composables/__tests__/useAuthenticatedVideoStream.test.ts
      - --run
      working_directory: /home/admin/dev/lx-annotate/frontend
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/center_access_operations.md
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest tests/views/media/test_hub_transfer_endpoints.py
        tests/services/test_transfer_job_contract.py tests/services/test_fhir_r4_export.py tests/views/misc/test_patient_center_contract.py
        tests/views/report/test_report_llm_status.py tests/views/test_center_access_matrix.py tests/views/media/test_center_scoped_reads.py
        -q (80 passed)
    note: The access matrix was extended to cover node-authenticated hub transfers, anonymous debug access,
      FHIR, reports, patient creation, and 404 existence concealment, and was checked against 80 focused tests.
    assessed_by: Codex
    assessed_at: '2026-07-22T12:43:32.411430Z'
- id: identity_center_memberships
  category: functionality
  title: Verified identity claims produce deterministic local center memberships
  acceptance:
  - Center memberships are represented as typed model relationships and support zero, one, or multiple
    centers without relying on the workflow default center.
  - Only verified identity-provider center groups update memberships; unknown or malformed center keys
    fail loudly and do not produce partial assignments.
  - Reauthentication replaces the local membership cache deterministically, and the legacy Examiner.center
    relationship is migrated without silently dropping existing access.
  - Staff and superuser global access remains explicit and is not inferred from missing membership data.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
    - tests/services/test_center_access.py
    - tests/authz/test_center_group_sync.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/pytest tests/services/test_center_access.py tests/authz/test_center_group_sync.py
        -q
      note: Exit-Code 0
    assessed_by: Max
    assessed_at: '2026-07-22T11:46:38.599344Z'
- id: deployment_aware_video_reads
  category: functionality
  title: Video discovery and playback enforce the same deployment-aware policy
  acceptance:
  - The anonymization overview does not center-filter authenticated central-hub users, including users
    without a center membership, while non-hub profiles filter by all assigned center IDs.
  - Processed HLS playlists, keys, segments, frames, and timeline endpoints apply the same central-hub
    visibility rule and retain their existing video-read authorization checks.
  - Cross-center discovery and detail responses include only pseudonymous playback metadata and omit patient
    identity, original filenames, filesystem paths, operator names, raw integrity details, and upload
    diagnostics.
  - The central-hub exception requires both a processed artifact and an anonymized, non-error, non-lost
    state; incomplete artifacts remain invisible and forbidden.
  - Raw artifact paths remain center-scoped, and anonymous requests are denied in every deployment profile.
  - Missing or incomplete center membership fails closed outside the explicitly unrestricted central-hub
    processed-video read boundary.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/pytest
