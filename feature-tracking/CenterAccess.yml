- id: authorization_boundaries
  category: security
  title: Unrestricted hub viewing is narrow, authenticated, and non-transitive
  acceptance:
  - The central-hub exception requires an authenticated principal and the existing video-read permission;
    it is not implemented as staff or superuser promotion.
  - Center group claims are accepted only after identity-token validation and cannot be supplied by request
    payloads or unverified headers.
  - The exception grants no raw-media export and no access to master keys, patient identity, reports,
    transfer administration, or storage mutation.
  - Permission failures disclose no cross-center clinical metadata and fail closed when deployment role,
    identity state, or artifact kind is inconsistent.
  required: true
  verification:
    kind: manual
    instructions: Perform a security review of authentication ordering, permission classes, deployment-role
      resolution, artifact-kind branching, and negative cross-resource authorization tests.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: pyright; 117 focused backend tests
    note: The hub exception and metadata minimization were implemented and tested; the complete manual
      security approval remains outstanding.
    assessed_by: Codex
    assessed_at: '2026-07-22T11:43:01.009171Z'
- id: deployment_and_migration_readiness
  category: operations
  title: Membership migration and deployment rollout are observable and reversible
  acceptance:
  - The schema migration preserves existing Examiner-based center access and has a tested forward and
    reverse operational plan without unsafe automatic recovery.
  - Operators can identify deployment role, effective center memberships, identity synchronization failures,
    and denied access without logging tokens or clinical payloads.
  - Rollout checks verify the central-hub role and restart all affected backend services before declaring
    unrestricted processed-video viewing active.
  - Alerts distinguish identity-provider configuration errors, unknown center claims, missing memberships,
    ordinary permission denials, and unexpected central-hub policy failures.
  - Structured events contain stable reason codes and technical identifiers but no tokens, claim payloads,
    original filenames, filesystem paths, or clinical data.
  required: true
  verification:
    kind: manual
    instructions: Exercise migration, authentication refresh, central-hub rollout, rollback, and failure
      diagnosis in a production-like environment and preserve structured evidence.
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/center_access_operations.md
    note: The runbook and structured events are available; production-like forward and reverse migration,
      alerts, and rollout have not been exercised.
    assessed_by: Codex
    assessed_at: '2026-07-22T11:43:02.376082Z'
- id: administrator_and_operator_documentation
  category: documentation
  title: Administrators and operators can understand assignment and hub visibility behavior
  acceptance:
  - Documentation explains that a standard or default center does not itself grant access and identifies
    the authoritative identity-provider group format for center membership.
  - It explains multi-center membership, membership refresh timing, effective-access diagnosis, and the
    distinction between center-scoped profiles and central-hub processed-video viewing.
  - Django superusers and principals with the exact Keycloak-synchronized center-scope capabilities can
    assign and revoke plural center memberships through an audited backend API; delegated administrators
    remain limited to their own unambiguous center.
  - The runbook states that raw media and unrelated clinical resources remain scoped and provides concrete
    troubleshooting steps for blank lists, forbidden playback, unknown center claims, and stale memberships.
  required: true
