schema_version: '1.0'
id: center_access
name: Center Access and Central-Hub Video Visibility
description: Production-readiness criteria for identity-backed multi-center assignments and deployment-aware
  video access, including authenticated cross-center viewing and training from validated processed media
  retained after original deletion on a central hub while non-hub profiles and sensitive resources remain
  center-scoped.
owners:
- endoreg_db maintainers
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/center_access_operations.md
  disposition: reference
  note: Access matrix, identity-provider groups, diagnostics, and rollout and rollback procedures.
definition_of_done:
- id: local_center_defaults
  category: functionality
  title: Local center setup is independent of studies and does not block valid intake or hub transfers
  acceptance:
  - Local intake works on a migrated database without studies, employee lists, clinical fixtures, or a
    preselected ApplicationSettings center; provision a meaningful Local Center lazily and idempotently.
  - LX-Annotate exposes LX_ANNOTATE_DEFAULT_CENTER and CENTER_NAME as Django settings after environment
    loading; direct Django settings override environment values and templates ship meaningful defaults.
  - Explicit import or study center identity wins; otherwise the operator-selected application center
    wins over the configured local default. No path selects a center by row order or silently replaces
    an unknown or ambiguous explicit identity with the local default.
  - PDF, video, watcher, upload, and SAP intake share local center resolution; no study activation or
    clinical catalogue import is required solely to satisfy center setup.
  - Authenticated hub transfers with no study use NetworkNode.owning_center even when the recipient has
    no local center configured. A recipient default must never replace source provenance; conflicting
    source identities and unauthorized transfers remain rejected.
  - Trusted operator hub-node configuration provisions missing source centers by stable key without studies
    or clinical fixtures; existing names and IDs are preserved, and a node configuration failure rolls
    back new center rows together with the node rows.
  - Center defaults grant no permissions, do not reassign historical records, and remain configurable
    independently of studies; studies can select separately provisioned centers.
  - Tests cover an empty center table, repeated and concurrent provisioning, settings precedence, legacy
    name compatibility, duplicate names, explicit study centers, and hub source/recipient separation.
  required: true
  verification:
    kind: manual
    instructions: Run center-default service tests, PDF/video import and upload regressions, hub-transfer
      endpoint regressions, watcher integration tests, and lx-annotate environment-contract tests. Rehearse
      simultaneous first intake and a no-study source-to-hub transfer with different local defaults. Record
      exact results; local unit tests alone do not establish deployment readiness.
    timeout_seconds: 900
