schema_version: '1.0'
id: backend_idempotency_guarantee
name: Backend Idempotency Guarantee
description: 'Backend-owned guarantee for exact retry, concurrent delivery and crash recovery across the
  video lifecycle. Requested after the lx-annotate frontend readiness implementation. This is a verification
  and implementation handoff, not a claim that database concurrency or deployed acceptance has passed.
  Frontend handoff: /home/admin/dev/lx-annotate/feature-tracking/VideoLifecycleFrontendReadiness.yml.'
owners:
- endoreg_db maintainers
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/video_import_concurrency_contract.md
  disposition: reference
  note: Durable attempt identity, lease ownership, fencing and publication boundaries.
- path: docs/video_storage_normalization.md
  disposition: reference
  note: Canonical media generation, encrypted publication, HLS and cleanup requirements.
definition_of_done:
- id: canonical_operation_identity
  category: requirements
  title: Define one durable identity for each logical lifecycle operation
  acceptance:
  - For each upload, duplicate import, recovery, anonymization approval, segment validation, prediction
    replacement and hub transfer, document the center, resource, source generation and operation inputs
    that form its identity.
  - An exact retry returns the original operation and result without duplicate media, metadata, annotations,
    tasks or transfer rows. Changed content, model configuration, annotator or generation is explicitly
    a new authorized operation or a conflict; it is never silently treated as an exact retry.
  - Every public application programming interface (API), watcher, task redelivery and direct service
    entry point uses the same database-enforced identity contract. Process-local locks are not the guarantee.
  required: true
  verification:
    kind: manual
    instructions: Inventory entry points and database constraints. Review exact replay and changed-payload
      behavior for each operation against the existing import and hub-transfer feature contracts.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/models/hub/upload_job.py; endoreg_db/services/hub/ingest.py; tests/services/test_upload_operation_identity.py
    note: 'Upload: aktive Datenbank-Constraints binden Zentrum, Medientyp und Inhaltshash sowie den Schluessel
      an Quellsystem, Ingest-Modus und Storage-Klasse/-Tier. Geaenderter Inhalt zu einem bestehenden Schluessel
      wird abgelehnt; geplanter Retry behaelt Job und Budget. Noch offen: unveraenderliche generationsgebundene
      Identitaet fuer Approval, Segmentrevision, direkten Prediction-Aufruf und Recovery; terminale Fehler
      koennen weiterhin neue Importzeilen erzeugen.'
    assessed_by: codex-idempotency-20260907-a
    assessed_at: '2026-09-07T11:58:58.898550Z'
- id: durable_success_evidence
  category: functionality
  title: Completion and duplicate detection preserve truthful workflow gates
  acceptance:
  - Duplicate detection and already-completed delivery never grant anonymization approval or segment validation.
    These remain independent persisted review decisions.
  - A success response is supported by the required durable media generation and typed completion evidence.
    Metadata alone, an upload status string or a missing watched source is not proof of completed media
    processing.
  - Repeated state repair converges to the same result, preserves all annotation identities and annotators,
    and reports missing technical or sensitive metadata even when raw media remains available.
  - Recovery clearly distinguishes state reconciliation from actual metadata regeneration. Missing or
    inconsistent media is reported explicitly without unsafe publication or loss of diagnostics.
  required: true
  verification:
    kind: manual
    instructions: Exercise duplicate unapproved video, metadata-only failed upload, retained raw media
      with missing metadata, missing processed generation after a completed ledger status, and repeated
      repair. Compare database and artifact identities before and after.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/services/hub/media_integrity.py; endoreg_db/services/hub/ingest.py; tests/services/test_hub_media_integrity_unit.py
    - kind: code
      reference: endoreg_db/services/video_files/state.py; tests/services/test_video_state_identity.py;
        tests/services/test_upload_job_import_lease_postgresql.py::test_simultaneous_state_creation_preserves_one_state
    note: 'Abgeschlossene Video-Task-Redelivery prueft zentrumsgebundene Medien, lesbare Artefakte, technischen
      und sensitiven Metadatenbestand sowie den Verarbeitungszustand. Fehlende Evidenz wird LOST, ohne
      Quellenloeschung oder automatische Review-Freigabe. get_or_create_video_state liest die autoritative
      Zuordnung unter dem Videozeilenlock: ein alter VideoFile-Cache kann weder eine zweite State-Zeile
      erzeugen noch die aktuelle Zuordnung und deren Review-Flags ersetzen. Offen bleiben vollstaendige
      generationsgebundene Abschlussbelege einschliesslich HTTP Live Streaming und Normalisierung sowie
      ein gemeinsamer Repair-Vertrag. Der Default-Integritaetscheck anderer Duplicate-Einstiegspunkte
      verlangt weiterhin Review.'
    assessed_by: codex-idempotency-20260907-a
    assessed_at: '2026-09-07T12:15:34.177659Z'
- id: concurrent_delivery_fencing
  category: functionality
  title: Only the current execution owner can publish or complete work
  acceptance:
  - Concurrent requests and same-task redelivery have at most one live execution owner; queue reservation
    and execution identity remain distinct.
  - Lease takeover uses database time and a fresh fencing epoch. A stale worker cannot publish, complete,
    release another owner lease or delete another attempt artifacts.
  - Crash and database-commit uncertainty preserve the source and last valid encrypted generation. Recovery
    determines the committed outcome before replaying publication.
  - Dispatch occurs after transaction commit and repeated operator or automatic retry cannot multiply
    active work for the same operation.
  required: true
  verification:
    kind: manual
    instructions: Run separate-process PostgreSQL tests with synchronized concurrent deliveries, expired
      leases, delayed old workers, worker loss and failures immediately before and after database commit.
      Inspect durable rows and publication counts.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: tests/services/test_upload_job_import_lease_postgresql.py; endoreg_db/services/video_temporal_inference.py
    - kind: test
      reference: '2026-09-07, PostgreSQL 16.11, psycopg 3.3.4: alle fuenf Tests in tests/services/test_upload_job_import_lease_postgresql.py
        bestanden innerhalb des 179-Test-Laufs. Zwei synchronisierte Zustellungsrennen (gleicher/verschiedener
        Owner), stale Schreib-/Release-Prozess nach Takeover und zwei am INSERT synchronisierte Constraint-Konflikte
        (identischer/geaenderter Inhalt). Reale unabhaengige Prozesse und Verbindungen; keine SQLite-Row-Lock-Behauptung.
        Commit-Ungewissheit und Prozessabbruch waehrend Dateipublikation bleiben offen.'
    - kind: test
      reference: 'Alle sechs Tests in tests/services/test_upload_job_import_lease_postgresql.py bestanden
        im 191-Test-Lauf: zwei gleichzeitige Zustellungen, stale Schreiber nach Datenbankzeit-Takeover,
        zwei synchronisierte INSERT-Konflikte und gleichzeitige State-Erstellung aus veralteten Video-Instanzen.
        Relation erst nach Videozeilenlock lesen; select_related auf der wartenden Lock-Abfrage hatte
        zwei State-Zeilen erzeugt.'
    note: Unabhaengige PostgreSQL-Prozesse belegen Upload-Lease-/Constraint-Fencing und eindeutige State-Zuordnung.
      Offen bleiben Prozessabbruch an Dateipublikation, Commit-Ungewissheit und vollstaendige Generation-/Prediction-Epochen.
    assessed_by: codex-idempotency-20260907-a
    assessed_at: '2026-09-07T12:52:10.858906Z'
- id: review_and_prediction_replay
  category: functionality
  title: Review replay and prediction replacement preserve annotation identity
  acceptance:
  - Repeating anonymization approval preserves the submitted media identity and does not mutate another
    selected resource.
  - Repeating segment validation for one video, annotator and segment revision creates no duplicate frame
    annotations or cleanup work. An explicit different-annotator restart remains a separate reversible
    track.
  - Repeated prediction replacement for one video and model generation does not mix old and new model
    metadata or duplicate prediction segments. Successful completion includes persisted prediction rows
    when predicted ranges exist.
  required: true
  verification:
    kind: manual
    instructions: Replay identical and changed approval, segment validation and prediction requests concurrently.
      Compare annotation primary keys, annotator principals, processing history identities and prediction
      generation metadata.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/views/anonymization/validate.py; endoreg_db/services/video_temporal_inference.py;
        tests/services/test_video_temporal_inference.py
    note: 'Validation sperrt die explizit adressierte Video-/Reportzeile und prueft den Zentrumzugriff
      innerhalb der Transaktion. Aktive Prediction-Anfragen vergleichen Modell und normalisierte Optionen;
      Abweichungen ergeben einen expliziten Konflikt. Publikation serialisiert Modellmetadaten, Segmente
      und History. Offen: dauerhafte Approval-/Segmentrevision-Identitaet, generationsgebundene Wiederverwendung
      abgeschlossener Prediction-Anfragen und stale Cleanup ohne Zugriff auf Folgeversuche.'
    assessed_by: codex-idempotency-20260907-a
    assessed_at: '2026-09-07T11:59:12.494884Z'
- id: scoped_replay_authorization
  category: security
  title: Every replay rechecks governed capability and center scope
  acceptance:
  - Read, repair, mark, bulk offload, retry and unmark enforce their backend capability and center scope
    independently of frontend visibility.
  - Idempotency keys and content hashes never grant access to another center result. Centerless and unrelated-center
    requests reveal no protected resource state and perform no mutation.
  - Authorization and resource ownership are rechecked under the mutation boundary, including mixed-center
    bulk requests, stored transfer jobs and retried requests after membership changes.
  - Retries preserve encryption at rest, required mutual Transport Layer Security (mTLS), processed-media-only
    export and recipient-bound envelope encryption. No long-lived master key is transmitted or used as
    a transfer credential.
  required: true
  verification:
    kind: manual
    instructions: Run mounted API denials for roleless, centerless and wrong-center users with authorized
      positive controls, mixed-center atomicity checks and permission changes between first request and
      replay.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: endoreg_db/views/anonymization/validate.py; endoreg_db/views/anonymization/overview.py;
        tests/views/anonymization/test_validate_view.py
    note: Standalone-Validation erzwingt EnvironmentAwarePermission und PolicyPermission sowie zentrumsgebundenen
      Zugriff nach dem Zeilenlock. Upload-Zuordnung im Overview und Integritaetscheck verwenden das Quellzentrum
      zusaetzlich zum Hash. Neue Tests pruefen rollenlose, zentrumslose und fremde Zugriffe sowie entzogene
      Mitgliedschaft. Kein vollstaendiger Nachweis fuer Repair, Markierung, Unmarkierung, Bulk-Offload
      und gespeicherte Transferjobs; kryptografische Invarianten wurden nicht veraendert.
    assessed_by: codex-idempotency-20260907-a
    assessed_at: '2026-09-07T11:59:16.603872Z'
- id: generation_and_transfer_replay
  category: data_integrity
  title: Artifact and transfer retries reuse a single verified generation
  acceptance:
  - HTTP Live Streaming (HLS) preparation and repeated playlist requests join or reuse one valid materialization.
    They do not create competing published generations.
  - An exact transfer replay uses the same transfer key, immutable payload and verified processed-media
    digest, including after acknowledgement loss.
  - Changed payload, content hash, source center or recipient identity produces an explicit conflict or
    INCONSISTENT state. Receiver application and sender acknowledgement cannot create duplicate resources.
  - Cleanup waits for the verified receipt and active lease boundaries; repeated cleanup never removes
    the only valid generation or another attempt source.
  required: true
  verification:
    kind: manual
    instructions: Exercise concurrent HLS materialization, exact and changed transfer replay, lost acknowledgement,
      and crash during receipt/application/cleanup. Compare receiver resources, transfer ledgers and encrypted
      artifact generations.
    timeout_seconds: 600
  assessment:
    status: not_assessed
    evidence: []
- id: observable_retry_lifecycle
  category: operations
  title: Recovery remains observable until a trustworthy terminal outcome
  acceptance:
  - Unattached uploads remain visible through pending, processing, retrying, error and lost states with
    stable job identity and safe diagnostics.
  - Automatic retries, exhausted retry budgets and worker-loss recovery expose their current status and
    scheduled next action. A frontend navigation or polling interruption does not alter backend execution.
  - An operational acceptance record identifies host, backend and frontend revisions, installed package
    provenance, database engine, worker queues, timings and outcomes without clinical payloads.
  - Local adapter fixes in lx-annotate are explicitly distinguished from equivalent behavior delivered
    by the endoreg-db package.
  required: true
  verification:
    kind: manual
    instructions: Run a named-host recovery exercise only after its deployment prerequisites are met.
      Verify both the standalone backend overview and mounted lx-annotate route, including a failed unattached
      upload transitioning through retry and processing.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: review
      reference: 'gc-10: systemctl show/list-units; importlib.metadata ueber /var/endoreg-service-user/lx-annotate-wheel/.venv/bin/python;
        tests/views/anonymization/test_anonymization_overview.py'
