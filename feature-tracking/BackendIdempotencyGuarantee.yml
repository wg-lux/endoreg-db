      reference: 'PostgreSQL-Regressionslauf: tests/views/anonymization/test_anonymization_overview.py
        bestanden, einschliesslich pending/processing/retrying/error/lost, stabiler Upload-Identitaet
        und zentrumsgebundener Zuordnung. PostgreSQL-spezifischer Nullable-Join-Lock im UploadJobRetryView
        durch select_for_update(of=(self,)) korrigiert.'
    note: 'Lokale PostgreSQL-Tests belegen sichtbare Upload-Uebergaenge und stabile Jobidentitaet. Vom
      Nutzer benannter Zielhost gc-10 (172.16.255.110), nur lesend geprueft: lx-annotate.service aktiv;
      Pipeline-/ffmpeg-Worker inaktiv; HLS-Backfill failed/exit-code 1; Migration zuletzt inactive/success
      0. Installierte Pakete: endoreg-db 1.0.8.0, lx-annotate 0.9.51, lx-dtypes 0.2.8, psycopg 3.3.4.
