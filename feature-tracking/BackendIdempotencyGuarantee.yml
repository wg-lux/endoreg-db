    deployment approvals remain owned by ImportPipelineRobustness.yml, VideoStorageNormalization.yml,
    ImportMonitoring.yml and HubTransfer.yml.
  - Document identity inputs, exact replay responses, conflict responses, transaction and publication
    boundaries, and which persisted facts prove completion.
  - Link VideoLifecycleFrontendReadiness.yml in lx-annotate and identify its local overview, repair and
    export authorization adapters. Do not claim those application adapters are already implemented in
    the standalone endoreg-db backend.
  - Distinguish source review, unit tests, database concurrency tests and deployed acceptance. Do not
    mark this feature complete from passing frontend tests alone.
  required: true
  verification:
    kind: manual
    instructions: Review the linked contracts and package ownership with backend and frontend maintainers;
      verify evidence provenance and outstanding acceptance before updating readiness.
    timeout_seconds: 600
  assessment:
