- id: terminal_commands
  category: functionality
  title: Small, testable terminal commands cover the workflow
  acceptance:
  - overview, show, validate, check, update, verify, done, reopen, and lock have separate responsibilities.
  - check returns exit code 0 only for a fully verified Definition of Done.
  - Valid active features appear as evaluated when no arguments are provided; done hides them by default.
  - During evaluation, valid feature files with tracking.state set to done are moved atomically from the
    active directory to feature-tracking/done; active files in the done directory remain invalid.
  - Before changes, an agent atomically acquires a time-limited lock for a feature, a criterion, one or more
    repository files, or a combination of these, and releases it after completing the work.
  - Feature-wide, identical criterion, and overlapping file scopes are rejected; independent criterion and
    file scopes may be edited in parallel.
  - Lock status, expiration, renewal, and owner-bound release are explicitly inspectable; expired locks do
    not block new work.
  - Owner-addressed Codex command-line messages support send, inbox, acknowledge, and reply operations with
    optional feature or criterion context; lock acquisition displays unread messages for the same owner.
  - Messages are stored atomically and privately for the owner in the local runtime directory, expire after
    a bounded period, reject terminal control characters, and do not create a parallel readiness or status tracker.
  - Orchestration contracts select exactly one agent for sequential work and permit centralized multi-agent
    execution only for at least two independently executable branches.
  - Each work unit has exactly one responsibility, at most two turns, an explicit token budget, a
    schema-validated result, and atomic idempotent checkpoints.
  - Centralized runs explicitly select native Codex subagents or external codex-exec workers; both backends
    preserve the same hub-and-spoke, lock, budget, result, and checkpoint boundaries.
  required: true
  verification:
    kind: command
    commands:
    - command:
      - .devenv/state/venv/bin/python
      - feature-tracking/tracker.py
      - overview
    - command:
      - .devenv/state/venv/bin/pytest
