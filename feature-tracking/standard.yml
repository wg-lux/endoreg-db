schema_version: '1.0'
id: standard
name: Feature-Tracking-Standard
description: Selbstprüfung des zentralen, YAML-basierten Produktionsreife-Trackers.
owners:
- endoreg_db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: feature-tracking/README.md
  disposition: reference
  note: Bedien- und Governancevertrag des Trackers.
definition_of_done:
- id: defined_structure
  category: requirements
  title: Struktur und Produktionsgate sind strikt definiert
  acceptance:
  - Feature, Kriterien, Verifikation, Bewertung und Evidenz besitzen ein versioniertes Schema.
  - Das Produktionsgate liefert binär produktionsreif oder nicht produktionsreif.
  - Ein Prozentwert kann das binäre Gate nicht ersetzen.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - feature-tracking/tracker.py
    - validate
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/python feature-tracking/tracker.py validate
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-20T14:11:35.220778Z'
- id: terminal_commands
  category: functionality
  title: Kleine, testbare Terminalbefehle decken den Workflow ab
  acceptance:
  - overview, show, validate, check, update, verify, done und reopen haben getrennte Verantwortlichkeiten.
  - check liefert Exit-Code 0 nur bei vollständig verifizierter Definition of Done.
  - Valide aktive Features erscheinen ohne Argumente als evaluiert; done blendet sie standardmäßig aus.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - feature-tracking/tracker.py
    - overview
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: .devenv/state/venv/bin/python feature-tracking/tracker.py overview
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-20T14:11:37.309365Z'
- id: automated_tests
  category: testing
  title: Schema, Ableitung und Updates sind fokussiert getestet
  acceptance:
  - Ungültige Bewertungen, unvollständige Migration und falsche Produktionsfreigabe schlagen fehl.
  - Update und atomarer YAML-Roundtrip sind getestet.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - feature-tracking/test_tracker.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest feature-tracking/test_tracker.py -q
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-23T08:01:22.134957Z'
- id: safe_execution
  category: security
  title: YAML kann keine implizite Shellausführung oder Freigabe einschleusen
  acceptance:
  - Prüfkommandos werden als Argumentlisten ohne Shell ausgeführt.
  - Unbekannte Felder und ungültige Zustände werden strikt abgelehnt.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - feature-tracking/test_tracker.py::test_command_verification_requires_one_command_shape
    - feature-tracking/test_tracker.py::test_verification_working_directory_must_be_absolute
    - feature-tracking/test_tracker.py::test_multi_repository_verification_runs_shell_free_in_order
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: 'feature-tracking/tracker.py: Verification, FeatureDefinition, run_verification'
    - kind: test
      reference: feature-tracking/test_tracker.py
    note: Pydantic-Modelle verbieten unbekannte Felder; Verifikationskommandos sind typisierte Argumentlisten
      und werden mit subprocess.run ohne Shell-Expansion ausgeführt.
    assessed_by: Codex
    assessed_at: '2026-07-23T08:01:37.612032Z'
- id: atomic_updates
  category: operations
  title: Terminalupdates sind atomar und strukturiert protokolliert
  acceptance:
  - Updates verwenden die zentralen Dateioperations-Wrapper.
  - Ein fehlgeschlagener Write hinterlässt keine gültig aussehende Teildatei.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - feature-tracking/test_tracker.py::test_update_and_atomic_save_round_trip
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: devenv shell -- .devenv/state/venv/bin/pytest feature-tracking/test_tracker.py::test_update_and_atomic_save_round_trip
        -q
      note: Exit-Code 0
    assessed_by: Codex
    assessed_at: '2026-07-23T08:01:26.661552Z'
- id: governance_documentation
  category: documentation
  title: Nutzung und Agentenpflichten sind zentral dokumentiert
  acceptance:
  - README erklärt Authoring, Evidenz, Exit-Codes und Updateprozess.
  - AGENTS.md verbietet parallele Markdown-Statustracker.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - feature-tracking/test_tracker.py::test_tracker_governance_documentation_contract
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: feature-tracking/README.md
    - kind: review
      reference: 'AGENTS.md: Feature Readiness Tracking'
    note: README beschreibt Authoring, Evidenz, Exit-Codes, atomare Updates und den Pflegeprozess; AGENTS.md
      erklärt feature-tracking als einzige Statusquelle und verbietet parallele Tracker.
    assessed_by: Codex
    assessed_at: '2026-07-23T08:01:38.520989Z'
