local_remediation:
  owner: codex-endoreg-durable-01a1398f
  implemented_on: '2026-10-15'
  user_clarification: Jede gültige positive Quellbildrate muss angenommen werden; keine Ablehnung oder Quarantäne allein aufgrund von FPS.
  code:
  - path: endoreg_db/services/video_storage/transcoding.py
    change: Quell-FPS-Grenze entfernen und native Zeitstempel erhalten; auch die nachgelagerte Formatprüfung darf keine FPS-Obergrenze für den Eingang erzwingen.
  - path: endoreg_db/services/video_storage/validation.py
    change: Auch nachgelagerte Quell- und Ausgabegrenzen entfernen; max_source_fps bleibt nur als wirkungslose Kompatibilitätseinstellung erhalten.
  - path: ../luxnix/modules/nixos/services/file_mover/default.nix
    change: Keine FPS-Quarantäne; Quellen nach Erfolg atomar beanspruchen, spätere Eingänge und vorhandene Ausgaben erhalten; andere Eingänge weiterverarbeiten und echte Fehler verzögert wiederholen.
  - path: endoreg_db/services/hub/upload_job_import_lease.py
    change: Abgelaufene Rohvideo-Besitzer unter Zeilensperre erneut prüfen, ausfencen und als import_interrupted beenden; keine Medienlöschung oder unbelegte Erfolgsmeldung.
  - path: endoreg_db/services/hub/import_monitoring.py
    change: Begrenzte Reconciliation im vorhandenen periodischen Retry-Dispatcher ausführen.
  - path: endoreg_db/services/hub/upload_job_state_machine.py
    change: Gesperrten aktuellen Unterbrechungsmarker gegen veraltete Übergänge, Broker-Redelivery und generische Retry-Pfade schützen.
  migration: endoreg_db/migrations/0101_upload_job_import_interrupted.py
  verification:
    transcoding: 34 Tests bestanden, keiner übersprungen; echte FFmpeg-Transcodes mit 59.7979, 60, 120 und 240 FPS erhalten vollständige PTS-Folgen und Zeitbasen. Frühere Ablehnungsprüfungen sind überholt.
    normalization: 91 Tests bestanden; native Annahme mit 0.5, 59.8, 240 und 1000 FPS auch bei alter max_source_fps-Einstellung von 1.0. Explizites Annotation-Resampling und Integritätsschutz weiterhin geprüft.
    lease_and_import: 80 ausgewählte Fälle geprüft; 79 im kombinierten PostgreSQL-Lauf, ein korrigierter bestehender Mock-Test im gezielten Wiederholungslauf bestanden. Neue Prozess- und Sperrkonkurrenztests bestanden.
    mover: 36 Tests bestanden, einschließlich echter 59.8- und 120-FPS-Dateien; alte FPS-Ablehnungsberichte erhalten die Quelle zur Wiederholung. Nix-Parse, Struktur, Dokumentation und Tracker bestanden.
    typing: Vollständiger Backend-Pyright-Lauf nach FPS-Korrektur mit 0 Fehlern und 19 Warnungen; fokussierte Prüfungen ohne Fehler oder Warnungen bestanden.
    migration: Django meldet keine fehlenden Migrationen; isolierte PostgreSQL-Testdatenbank wendet 0101 erfolgreich an.
    structure: 65 Backend- und 23 LuxNix-Manifeste gültig; Feature-Tracker gültig.
    documentation: LuxNix docs:check bestanden; Backend-Governance meldet weiterhin den bereits vorhandenen deutschen Bericht docs/implementation_standards_review.md gegen die englische Canonical-Docs-Regel. Keine Richtlinie abgeschwächt.
  preserved:
  - Keine automatische Bildratenänderung; 50 FPS ist keine Eingangsgrenze.
  - Abgelaufene Cancellation ohne Cleanup-Nachweis ist ein expliziter Fehler, nicht erfolgreich cancelled.
  - Auch alte FPS-Ablehnungsberichte führen nicht zur Quarantäne.
  limitations:
  - Kein Deployment und keine Änderung der aufgeführten Live-UploadJobs durchgeführt.
  - Generische Retry- und Reimport-Aktionen entsperren import_interrupted nicht; Wiederaufnahme erfordert gesondert geprüfte Artefakt-, Prozess- und Quellnachweise.
  - Producer müssen weiterhin den Vertrag abgeschlossener Dateieingänge einhalten; Pfadübernahme beweist nicht das Ende bereits offener Schreibdeskriptoren.
  - Nachweis verschlüsselter temporärer Speicherung bleibt vom Quellcodefix unabhängig.
