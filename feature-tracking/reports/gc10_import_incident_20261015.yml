implementation_evidence:
  relevant_code:
  - endoreg_db/services/video_storage/transcoding.py
  - endoreg_db/services/hub/ingest.py
  - endoreg_db/services/hub/upload_job_import_lease.py
  observations:
  - Der gelesene Deployment-Code prüft den Systemstandard nach dem teuren Transcode.
  - Bei target_fps=null werden vollständige Quellzeitstempel erfasst und Timeline-Erhaltung verlangt.
  - Ein Output oberhalb 50 Bildern pro Sekunde scheitert anschließend an der Standardprüfung.
  - Das genaue aufgerufene target_fps und die ursprüngliche Quellmetadatenanalyse sind nicht abschließend rekonstruiert.
  required_regressions:
  - Deterministische Profilablehnung führt nicht zu unbeschränkter erneuter Verarbeitung desselben unveränderten Eingangs.
  - Bekannte unzulässige Quellen werden früh abgelehnt oder in einen expliziten Quarantäneprozess geleitet; andere Eingänge bleiben verarbeitbar.
  - Bildratenänderung verwendet ausschließlich den freigegebenen Resampling-Workflow vor persistierten Frame-/Segmentkoordinaten; kein stilles Herabsetzen des Limits oder ungeprüftes Resampling.
  - Abgelaufene Import-Leases werden mit Fencing und Besitzerprüfung reconciliert; verspätete Worker dürfen nicht publizieren.
  - cancel_requested mit verlorenem Besitzer erhält einen nachgewiesenen Abschluss statt unbegrenztem Zwischenzustand.
  communicated_to: codex-endoreg-durable-01a1398f
