changes:
  - path: endoreg_db/services/case_documents.py
    result: Untersuchungs- und Medienzeilen werden ohne nullable Joins gesperrt; vorhandene SensitiveMeta-Zeilen werden separat gesperrt.
  - path: endoreg_db/services/hub/storage_transfer.py
    result: Cleanup sperrt Verifikationsbeleg und optionalen Transfernachweis getrennt; der Schutz der Nachweisprüfung bleibt erhalten.
  - path: endoreg_db/migrations/0057_patientexamination_multiple_documents.py
    result: Aufgeschobene PostgreSQL-Fremdschlüsselprüfungen werden vor RemoveField ausgeführt. Name, Abhängigkeit, Schemaoperationen und atomare Ausführung bleiben erhalten.
  - path: tests/migrations/conftest.py
    result: Jeder historische Migrationstest arbeitet in einem eigenen PostgreSQL-Schema ohne public-Fallback; Teardown entfernt es und prüft den unveränderten Tabellenbestand des Ausgangsschemas.
  - path: tests/migrations/test_case_persistence.py
    result: Fehlende, passende und widersprüchliche Altzuordnungen sowie explizite Konfliktkorrektur und ein injizierter Upgradefehler ohne Wiederherstellung des aktuellen Schemas werden geprüft.
  - path: endoreg_db/services/report_import_fencing.py
    result: Heartbeat verlangt Autocommit und bereinigt ausschließlich seine eigene Thread-Verbindung. Tests prüfen Transaktionsablehnung, Verbindungserhalt und Erhalt des ursprünglichen Fehlers.
  - path: tests/views/media/test_pdf_media_text_visibility.py
    result: TransactionTestCase mit Basiskatalog je Test ersetzt die mit unabhängigen Heartbeat-Verbindungen inkompatible äußere TestCase-Transaktion.
  - path: tests/services/test_transfer_job_contract.py
    result: Reale Datenbank-Constraint-Diagnostik ersetzt SQLite-spezifische simulierte Unique-Verletzungen.
  - path: tests/services/test_transfer_registration_postgresql.py
    result: Zwei synchronisierte PostgreSQL-Verbindungen prüfen identische und abweichende konkurrierende Registrierungen; genau ein Transfer bleibt bestehen.
  - path: quality/clinical_reference_projection.yml
    result: Die erlaubte Delegation an migrate_reference_catalog ist mit Ownership dokumentiert. Der Validator lehnt unbekannte, dynamische und fehlende Delegationen ab.
  - path: tests/services/test_deployment_setup.py
    result: Aktivierungsprüfung verwendet Modul und Version des ausgewählten lx-dtypes-Templates anstelle der veralteten Konstante coloreg@0.2.0.
