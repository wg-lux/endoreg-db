alignment_review:
  assessor: codex-schema-audit-20261012
  source_revision: 2ee454a1789f9d7c1e1502e98691ff96e964d83c
  root_causes:
  - boundary: FrameBoxAnnotationBulkEnvelopePayload
    cause: Historischer 0.2.9-Backport blieb nach der zentralen Migration bestehen. Host behandelte None/leere
      Itemwerte als ausgelassen; shared füllte nur fehlende Schlüssel. Shared Wrapper-Validator konvertierte
      explizites None in den String None.
    alignment: Shared-Vertrag vereinheitlicht Null-/Leerwert-Vererbung und erhält optionale Nullwerte.
      Host-Adapter normalisiert nur Legacy-Listen und Auslassungen; gemeinsame Validatoren übernehmen
      Vererbung, Defaults, Geometrie und Frame-Konsistenz. Falsche Typen werden nicht mehr als leere Werte
      verdeckt.
  - boundary: SetupConfig
    cause: parents[2] verwies auf repository-root data statt endoreg_db/data. Breite Exception-Handler
      ersetzten fehlende oder ungültige Konfiguration mit einer zweiten Python-Defaultimplementierung.
    alignment: Gebündelte YAML als einzige Defaultquelle; shared parse_setup_yaml und SetupConfigDataPayload
      prüfen Syntax, Duplicate Keys und Inhalt. Fehlende/ungültige Dateien schlagen fehl. Gewichtssuche
      verwendet get_runtime_paths().weights vor zusätzlichen YAML-Pfaden; unbekannte Variablen schlagen
      fehl.
  - boundary: SetupConfig.get_model_specific_config
    cause: Selektor-only-Vertrag wurde auf das gesamte ORM-Fixture angewandt. model, setup_config und
      zusätzliche Metadaten wurden extra_forbidden; danach wurde auch fields in den falschen Hint-Vertrag
      gegeben. Fehler wurden zu None verschluckt.
    alignment: JSON-Struktur validieren und Selektoren beziehungsweise setup_config explizit in ihre vorhandenen
      shared Verträge projizieren. Keine neue lokale Payload-Klasse; echte gebündelte Modellhinweise sind
      getestet. Kein Treffer bleibt None; ungültige Daten werfen Fehler.
  - boundary: FHIR
    cause: Host-Exportprofil und shared verlustarmer Clinical-Import haben absichtlich unterschiedliche
      Extra-/Ressourcenregeln; gemeinsame Coding-/Reference-Blätter wurden dennoch kopiert.
    alignment: Gemeinsame primitive Modelle wiederverwenden, strikte Host-Profilkonfiguration behalten;
      Wire-Roundtrips und Ablehnung unbekannter/leerwertiger Felder getestet.
  - boundary: CatalogRecordBase.kind
    cause: Die Dataloader-Migration liest record_type direkt, obwohl nur konkrete discriminated subclasses
      das Feld deklarieren; vollständiges shared Pyright meldete reportAttributeAccessIssue.
    alignment: Wie bei anderen subclass-Feldern dynamisch als object lesen und explizit auf str/ReferenceKind
      prüfen. Kein Any, Ignore oder stiller Default; gültiger konkreter und ungültiger/missing Discriminator
      sind getestet.
  retained_boundaries: Upload-Provenienz, optionale persistierte Transfer-Zwischenstände, vollständige
    Wire-Envelopes, klinische Graph- versus Referenzkatalog-Projektion und Pixel- versus normierte Koordinaten
    bleiben getrennt. Keine Zusammenlegung durch Abschwächung ihrer Validatoren.
  release_blocker:
    finding: Der aktuelle Host importiert FindingExtractionEvidence aus lx_dtypes.models.contracts.finding_extraction;
      die publizierte, weiterhin gepinnte Version 0.4.4 enthält dieses Modul nicht.
    evidence: 'Isolierte Installation von lx-dtypes==0.4.4 nach /tmp/codex-schema-align-runtime044: pytest
