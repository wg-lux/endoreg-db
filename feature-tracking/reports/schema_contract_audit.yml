  - Keine globale Totcodefreiheit bewiesen; dynamische Erreichbarkeit nur für die untersuchten Aufrufer
    und Tests.
  - Keine produktiven Daten, Migrationen oder Deployments verändert.
  - Kein konfigurierter Dead-Code-Guard oder Baseline in lx-data-models; quality:dead-code existiert dort
    nicht.
  - Kein nicht-Python-Scan; keine vollständige Host-Testsuite wegen parallel laufender fremder lx-data-models-Suite.
  - Lokale Schema-Typen ohne semantisch passenden gemeinsamen Vertrag werden nicht allein wegen ähnlicher
    Felder ersetzt.
consolidated:
- path: endoreg_db/schemas/dicom_export.py
  classification: compatibility_contract
  confidence: manual
  finding: Sechs aktive lokale DICOM-Klassen kopierten gemeinsame Vertragsregeln; keine toten öffentlichen
    Klassen.
  action: DicomValidationResult re-exportiert; übrige Modelle erben shared contracts. Nur strengere Host-Skalare
    und verschachtelte Eingangsadapter bleiben lokal.
  retained: Versionierungsfehler, Wrapper-API, kanonischer Digest, strikte bool/int-Prüfung und alle öffentlichen
    Modellnamen.
  consumers:
  - models/interoperability/dicom.py
  - services/interoperability/dicom_import.py
  - services/interoperability/dicom_manifest_backfill.py
  risk: Ein nackter Re-Export aller Modelle würde die strengere Host-Validierung abschwächen; deshalb
    explizite Adapter.
validation_fix:
  path: endoreg_db/services/studies/presets.py:import_study_preset
  finding: Veränderliche KnowledgeBase-/Preset-Instanzen konnten die Konstruktorvalidierung nachträglich
    umgehen.
  action: Verschachtelte lx_dtypes-Verträge vor dem ersten ORM-Zugriff aus model_dump(exclude_unset=True)
    neu validieren; keine zweite lokale Vertragsimplementierung.
  tests: Leere Labelnamen, doppelte Geschlechter und boolesche Labelset-Versionen werden vor reference_catalog_transaction
    abgewiesen; bestehende gültige, atomare und idempotente Importe bleiben getestet.
retained_contracts:
- path: schemas/report_draft.py, schemas/case_resolution.py, schemas/video_metadata.py
  classification: compatibility_contract
  finding: Gemeinsame Typen bereits importiert; Kompatibilitätspfade sind keine unabhängigen Implementierungen.
- path: services/reference_data/catalog.py, services/runtime/deployment_setup.py
  classification: compatibility_contract
  finding: ReferenceCatalogSnapshot/Receipt, DeploymentSetup/Lock und YAML-Parser bereits gemeinsam. Schreibgrenzen
    revalidieren Snapshots beziehungsweise Manifest/Lock. Lokale Pläne enthalten ORM-Abgleich und sind
    Host-Verträge.
- path: services/studies/presets.py:_require_unique
  classification: compatibility_contract
  finding: Shared StudyPreset prüft einzelne Presets; Host prüft zusätzlich kollidierende Identitäten
    über mehrere Presets. Keine redundante Prüfung desselben Geltungsbereichs.
- path: schemas/clinical_reference.py:ClinicalReferenceReceipt
  classification: compatibility_contract
  finding: Gleiche Feldnamen wie ReferenceCatalogReceipt, aber KnowledgeBaseGraphSnapshot/ReferenceBinding
    statt ReferenceCatalogSnapshot/CatalogBinding; unterschiedliche Projektionen.
- path: schemas/fhir_r4.py
  classification: compatibility_contract
  finding: FhirCoding und FhirReference erben jetzt gemeinsame Verträge; Host-Konfiguration bleibt extra=forbid
    mit Whitespace-Normalisierung. Ressourcenprofile und text-only CodeableConcept bleiben absichtlich
    getrennt.
  consumers:
  - services/interoperability/fhir_r4.py
- path: schemas/hub_payloads.py:UploadProvenancePayload
  classification: compatibility_contract
  finding: Host extra=forbid und zusätzliche Felder (u.a. fencing epoch), optionale sidecar_payload/missing_artifacts;
    shared extra=allow und andere Defaults. Keine austauschbaren Verträge.
  consumers:
  - services/hub/upload_job_files.py
  - models/hub/upload_job.py
- path: schemas/persisted_json.py:TransferVideoFileRow, TransferVideoResourceRows, TransferReportResourceRows
  classification: compatibility_contract
  finding: Persistierte Host-Zwischenstände erlauben fehlenden processed_video_hash und optionale Teilzustände;
    gemeinsame Wire-Verträge verlangen vollständige Teilzustände und sind strict/frozen. Host prüft zusätzlich
    Segmentverknüpfungen.
  action: Persistenz- und Transportverträge getrennt halten; keinen vollständigen Wire-Vertrag auf unvollständige
    lokale Zustände erzwingen.
- path: schemas/aidataset_export.py:AIDataSetExportRequestPayload
  classification: compatibility_contract
  finding: Versionierter gespeicherter Request mit optionalen Selektoren und String-Normalisierung; AIDataSetExportCreateContract
    hat erforderliche Selektoren und zusätzliche Scope-Regeln.
- path: schemas/video_jobs.py:VideoCorrectionRoi
  classification: compatibility_contract
  finding: Host-ROI verwendet Pixelkoordinaten als int; PdfRedactionBox verwendet normalisierte float-Koordinaten
    in [0,1] und positive Ausdehnung. Kein austauschbarer Vertrag.
- path: helpers/data_load_orchestrator.py
  classification: compatibility_contract
  finding: Re-exportiert Befehlssequenzierung aus helpers/data_loader.py; keine zweite YAML-Engine. Generische
    utils.dataloader/yaml_model_loader fehlen bereits und sind ausdrücklich stillgelegt.
