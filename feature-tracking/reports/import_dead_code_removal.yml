    Vorhandenen validierten Kontext-Hash unverändert zurückgeben. Nur bei fehlendem
    Hash ctx.file_path über den kanonischen get_file_hash-Helper lesen. Die sensitive_path
    ersetzt diese Quelle nicht. Fehler propagieren ohne Hashzuweisung; bestehende
    Ownership-, Transaktions- und Historiegrenzen bleiben an derselben Stelle.
  typgrenze:
    Der Helper liefert str. Reportanlage und Historie verwenden diesen Rückgabewert,
    statt nach indirekter Mutation eine weiterhin optionale Kontext-Eigenschaft weiterzugeben.
