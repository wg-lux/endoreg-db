limitations:
  - SQL aggregate observations were collected during an active service, not one exported repeatable-read snapshot.
  - No encrypted media payload was decrypted, decoded or independently validated for clinical quality.
  - Nonexistent physical sources, wrong keys and media corruption cannot be concluded from database handles alone.
  - Test data exercises persisted contracts; it does not reproduce a multi-hour OCR run or demonstrate a production recovery.
  - This report is evidence for existing features and does not change their approval assessments.
