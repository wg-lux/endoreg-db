    strengths:
      - Substantial persisted annotation inventory and no contradictory boolean values per frame/label.
      - Existing labels, source relations and explicit attachment helpers can support curation.
    blockers:
      - Hundreds of thousands of frames come from only six videos at one center.
      - Almost all annotations are positive; absence cannot safely establish a negative label.
      - Missing reviewer identity prevents reliable attribution and agreement analysis.
      - Every currently state-eligible video lacks a patient association.
      - Unconfirmed prediction segments coexist with manual/corrected segment memberships.
