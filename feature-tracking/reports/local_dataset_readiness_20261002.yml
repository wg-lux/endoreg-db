required_changes_in_priority_order:
  - priority: 1
    change: Provision sufficient encrypted working capacity and enforce bounded admission before expensive video processing.
    acceptance: Representative imports meet measured peak storage requirements; failed imports preserve sources and never publish incomplete media.
  - priority: 2
    change: Profile the observed OCR bottleneck and calibrate the existing full-pipeline budget on the intended worker.
    acceptance: A representative whole-video import finishes within its admitted soft limit, including finalization and cleanup; wrapped cancellation remains classified as timeout.
  - priority: 3
    change: Reconcile terminal jobs by source identity, current media generation and integrity evidence before any explicit recovery.
    acceptance: Bounded retry is possible for an approved transient failure; LOST remains terminal and stale workers cannot mutate a replacement attempt.
  - priority: 4
    change: Resolve pseudonymous patient/examination linkage for every candidate and create saved patient-grouped splits.
    acceptance: No patient or correlated recording crosses split roles; missing/conflicting associations block plan creation; saved-link drift blocks retrieval.
    note: The current training manifest group_id is a video UUID, not a patient grouping. Existing lx-annotate split services enforce patient links; connect training to those plans before leakage-sensitive evaluation.
  - priority: 5
    change: Curate separate task-specific datasets through existing attachment helpers rather than treating the default video inventory as a labeled release.
    acceptance: Repeated attachment preserves annotation IDs and adds no duplicate relation; only the intended sources and reviewed media enter the training scope.
  - priority: 6
    change: Complete segment review and generation-specific clinical release gates for pending candidates.
    acceptance: Anonymization acceptance, segment review, outside-segment processing and export readiness are independently verified; attachment does not bypass them.
  - priority: 7
    change: Add explicit negatives, preserve unknown-label masks, recover reviewer provenance where evidence exists, and adjudicate disagreements.
    acceptance: Per-label positive/negative/unknown counts are reported by independent patient and video; prediction-only labels do not become ground truth without confirmation.
  - priority: 8
    change: Verify authoritative presentation timestamps and broaden independent patient, center, device and difficult-case coverage before freezing a release.
    acceptance: Segments map to verified source timestamps; release manifests freeze label/content versions and accepted media digests as well as membership; held-out coverage and uncertainty are documented.
