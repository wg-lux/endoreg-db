rating_scale:
  1: Inventory only; no usable attached training labels.
  2: Exploratory dataset with substantial labels but unresolved release blockers.
  3: Reviewed development dataset with adequate cohort coverage and patient-safe splits.
  4: Reproducible independently validated release candidate.
  5: Clinically approved, monitored dataset release with external validation.
  note: Qualitative engineering assessment; not a validated statistical quality score.
