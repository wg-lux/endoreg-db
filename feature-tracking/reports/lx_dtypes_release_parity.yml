schema_version: '1.0'
feature: lx_dtypes_model_standardization
criterion: canonical_boundary_validation
assessor: codex-dtypes-parity-20261013
date: '2026-10-13'
purpose: Candidate 0.5.0 contract/import and validation/persistence parity audit. Feature assessments remain authoritative
  in LxDtypesModelStandardization.yml.
scope:
  candidate_version: 0.5.0
  production_trees:
    endoreg-db: endoreg_db
    lx-annotate: lx_annotate
    lx-anonymizer: lx_anonymizer
  method: AST ImportFrom inventory, including type-checking branches; resolve every distinct import against candidate
    source with isolated dtypes Django test settings. Map contracts package lazy exports to their defining module.
    Attach lx-data-models tests that directly import each contract.
  limits:
  - This is source compatibility evidence; candidate wheels and a coherent installed consumer stack were not verified.
  - Dynamic import strings, frontend handwritten types and transitive adoption are reviewed separately, not claimed
    complete by AST coverage.
  - No direct import is not proof of obsolete code. Private _frame_cache and __init__ are excluded from public-module
    totals.
  - Contract test references identify direct imports, not executed coverage of every field. All repositories contained
    pre-existing edits; evidence describes the working trees.
  dependency_declarations:
    endoreg-db: lx-dtypes==0.5.0
    lx-annotate: lx-dtypes==0.4.4
    lx-anonymizer: lx-dtypes>=0.4.5; lock selects 0.4.5
  edits:
  - 'lx-data-models: lx_dtypes/models/meta/SensitiveMeta.py'
  - 'lx-data-models: lx_dtypes/models/meta/ReportMeta.py'
  - 'lx-data-models: tests/test_sensitive_meta_anonymizer_contract.py'
  - 'endoreg-db: this report, feature-tracking/structure.yml, canonical_boundary_validation assessment evidence'
inventory_summary:
  public_contract_modules: 130
  without_direct_production_imports: 19
  repositories:
    endoreg-db:
      source_files_importing_lx_dtypes: 279
      distinct_imported_symbols: 519
      contract_modules_consumed: 101
      parse_failures: []
      import_resolution_failures: []
    lx-annotate:
      source_files_importing_lx_dtypes: 22
      distinct_imported_symbols: 60
      contract_modules_consumed: 14
      parse_failures: []
      import_resolution_failures: []
    lx-anonymizer:
      source_files_importing_lx_dtypes: 26
      distinct_imported_symbols: 70
      contract_modules_consumed: 9
      parse_failures: []
      import_resolution_failures: []
findings:
- id: metadata_nested_state
  priority: high
  owner: lx_dtypes maintainers
  resolution: fixed_in_candidate
  evidence:
  - 'lx-data-models: lx_dtypes/models/meta/SensitiveMeta.py:344'
  - 'lx-anonymizer: lx_anonymizer/sensitive_meta_interface.py:123'
  finding: safe_update dumped the validated merged model before assigning fields, flattening SensitiveMetaState
    into an untyped dict.
  change: Assign validated attributes directly; retain fill-only behavior and existing invalid-update no-op compatibility.
  verification: Regression checks typed nested state, verified flag retention, and JSON roundtrip.
- id: report_empty_crops
  priority: high
  owner: lx_dtypes maintainers
  resolution: fixed_in_candidate
  evidence:
  - 'lx-data-models: lx_dtypes/models/meta/ReportMeta.py:30'
  - 'lx-data-models: lx_dtypes/models/meta/SensitiveMeta.py:216'
  - 'lx-anonymizer: lx_anonymizer/report_reader/reader.py:257'
  finding: 'ReportMeta() rejected its own default: inherited normalization replaced empty cropped_regions with None.'
  change: Preserve the empty mapping using the existing VideoMeta empty-container policy. Consumer workaround remains
    untouched.
  verification: Parameterized omitted, empty and null crop mapping JSON roundtrips pass.
- id: annotate_dependency_window
  priority: high
  owner: lx-annotate maintainers
  evidence:
  - 'lx-annotate: pyproject.toml:63'
  - 'lx-annotate: lx_annotate/views/study_setup_import.py:9'
  - 'lx-annotate: lx_annotate/services/study_setup_import.py:18'
  finding: Pinned published 0.4.4 wheel lacks StudySetupImportRequest/Receipt/Result and content_sha256 used by
    current study import. Local distribution metadata says 0.4.4 while imports resolve editable candidate source,
    masking clean-install failure.
  required_action: Update the tested release pin and lock together after the candidate artifact exists; verify study-import
    routes from installed wheels.
- id: annotate_endoreg_stack
  priority: high
  owner: lx-annotate and endoreg_db maintainers
  evidence:
  - 'lx-annotate: lx_annotate/services/study_setup_import.py:15'
  - 'lx-annotate: lx_annotate/api_urls.py:58'
  finding: Installed EndoReg 1.5.2 lacks models.other.study_setup_import. Eager route registration breaks unrelated
    URL resolution.
  required_action: Test a coherent candidate EndoReg/dtypes/annotate stack before publication; retain endpoint import
    smoke tests.
- id: persisted_owner_identity
  priority: high
  owner: endoreg_db maintainers
  evidence:
  - 'endoreg-db: endoreg_db/models/medical/patient/patient_examination.py:149'
  - 'endoreg-db: endoreg_db/models/report/patient_examination_report.py:145'
  - 'endoreg-db: endoreg_db/models/medical/patient/examination_revision.py:49'
  - 'endoreg-db: endoreg_db/services/reports/structured_records.py:80'
  - 'endoreg-db: endoreg_db/services/cases/examination_revisions.py:59'
  finding: Real model clean() calls accept examination/report JSON belonging to another patient, examination and
    KB pair. Revision clean checks patient/examination but permits a different KB pair. Services impose stronger
    checks, so direct model saves do not offer parity.
  verification: Reproduced using real model clean() with DATABASES={} and generic AppConfigs; no save or database
    mutation. PatientExamination.save invokes clean, which validates shape without owner comparisons.
  required_action: Centralize host owner/provenance checks used by model and service boundaries; define historical
    revision semantics explicitly; add direct create/save, API, transaction rollback and roundtrip tests.
- id: falsy_knowledge_base_identity
  priority: medium
  owner: endoreg_db maintainers
  evidence:
  - 'endoreg-db: endoreg_db/services/reports/structured_records.py:70'
  finding: Host coercion converts False and 0 KB identifiers to None. The canonical parser rejects the same payload
    with string_type errors, while the host accepts it.
  required_action: Normalize only documented legacy empty strings; retain invalid types for canonical rejection.
    Test false, zero, partial pairs and valid identities.
- id: startup_registry_ownership
  priority: medium
  owner: lx-annotate maintainers
  evidence:
  - 'lx-annotate: lx_annotate/apps.py:93'
  - 'lx-data-models: docs/guides/django-host-integration.md'
  finding: Django startup still calls service.provision(), contrary to the candidate bootstrap-before-startup contract.
  required_action: Move provisioning to explicit package CLI bootstrap; make startup validate installed identities
    without repair.
- id: explicit_host_adapter_fallback
  priority: medium
  owner: lx-annotate maintainers
  evidence:
  - 'lx-annotate: lx_annotate/settings/settings_base.py:98'
  finding: An unavailable explicitly configured host model module is replaced with a default, hiding integration
    configuration errors.
  required_action: Reject invalid explicit adapter configuration and cover the failure path with settings/startup
    tests.
- id: frontend_generated_contracts
  priority: medium
  owner: lx-annotate maintainers
  evidence:
  - 'lx-annotate: lx_annotate/api_urls.py:61'
  - 'lx-annotate: lx_annotate/api_urls.py:84'
  - 'lx-annotate: openapi/endoreg-api.json'
  - 'lx-annotate: frontend/openapi/endoreg-api.json'
  finding: Registered setup-import and saved-cohort routes are absent from committed OpenAPI and generated frontend
    types; handwritten types do not provide generated parity.
  required_action: Generate specs/types from the coherent candidate stack and run frontend transport normalization
    tests.
- id: malformed_report_dates
  priority: medium
  owner: lx_dtypes and lx-anonymizer maintainers
  evidence:
  - 'lx-data-models: lx_dtypes/models/meta/ReportMeta.py:516'
  finding: ReportMeta and ReportPatientInfo normalize malformed nonblank DOB to None, whereas SensitiveMeta rejects
    it. Existing extraction policy remains permissive.
  required_action: Define extraction-versus-persistence policy; require strict validation before host persistence
    rather than silently treating malformed input as missing.
- id: anonymizer_candidate_window
  priority: medium
  owner: lx-anonymizer maintainers
  evidence:
  - 'lx-anonymizer: pyproject.toml:66'
  - 'lx-anonymizer: uv.lock:1742'
  finding: Locked CI selects 0.4.5, so ordinary CI does not certify 0.5.0; unconstrained upper versions also permit
    unreviewed future minor contracts.
  required_action: Choose a tested compatibility window, refresh the lock, and run producer and host roundtrips
    against installed candidate wheels.
- id: host_guide_version_window
  priority: medium
  owner: lx_dtypes maintainers
  evidence:
  - 'lx-data-models: docs/guides/django-host-integration.md'
  finding: Host guide still instructs strict consumers to require >=0.2.1,<0.3 although candidate source is 0.5.0.
  required_action: Document the current tested minor window and release coordination/backfill requirements.
positive_evidence:
- All inventoried imported symbols resolve against candidate source.
- EndoReg hub provenance and medical-ledger receipts validate persisted JSON; the inspected receipt backfill validates
  before QuerySet.update.
- EndoReg revision service uses transactions, row locks and optimistic versions.
- Annotate reuses cohort contracts and validates typed study-import receipts on replay.
- Anonymizer remains compute-only; durable persistence, publication and retry authority stay with EndoReg.
verification:
- repository: lx-data-models
  command: uv run pyright
  result: 0 errors, 0 warnings, 0 informations after fixes
- repository: lx-data-models
  command: uv run pytest tests/unit/lx_dtypes/models/contracts tests/unit/lx_dtypes/models/ledger/medical tests/test_structure.py
    -q
  result: 558 passed, 132 warnings before metadata fixes; taxonomy and pytest temporary-directory cleanup warnings
    observed
- repository: lx-data-models
  command: uv run pytest tests/test_sensitive_meta_anonymizer_contract.py tests/unit/lx_dtypes/test_lazy_exports.py
    -q --disable-warnings
  result: 18 passed after fixes
- repository: lx-anonymizer
  command: PYTHONPATH=/home/admin/lx-data-models:/home/admin/lx-anonymizer .devenv/state/venv/bin/python -m pytest
    tests/test_sensitive_meta_interface.py tests/test_report_reader_contract.py tests/test_processing_strands.py
    tests/test_llm_provider_contracts.py -q --disable-warnings
  result: 85 passed after fixes; pytest cleanup warnings for pre-existing temporary directories
- repository: lx-annotate
  command: tests/system/test_installed_video_segments_contract.py and tests/contracts/test_frontend_backend_api_contract.py
    with existing interpreter
  result: '12 passed, 3 failed: missing node executable and two URL imports failing on absent installed EndoReg
    study_setup_import module'
- repository: all
  command: repository scripts/lint_structure.py with available Python environment
  result: Passed in all four repositories; EndoReg 65 manifests
- repository: endoreg-db
  command: full host pytest lane
  result: 'Not run: prescribed interpreter absent; an unrelated EndoReg pytest process already running. Database/migration
    parity remains unverified.'
publication_requirements:
- Resolve host identity/coercion gaps with negative direct-model and service tests.
- Install the candidate wheel together with matching EndoReg and annotate wheels in a clean environment; run imports,
  startup, API/OpenAPI and producer/consumer roundtrips.
- Run host PostgreSQL validation, transaction, concurrency, migration and backfill checks on synthetic fixtures.
- Review permissive extraction policies and document the current dependency compatibility window.
