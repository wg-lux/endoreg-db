changes:
- Both consumers now require lx-dtypes>=0.7.1 for the new package-kind and deployment setup contracts.
- 'Editor Python support matches its mandatory core dependency: >=3.12,<3.13.'
- Editor wheel data-file mappings preserve YAML library subdirectories and relative imports.
- Core lock identity updated from 0.6.8 to 0.7.1 without unrelated dependency changes.
- Core and backend release notes describe deployment setup v2 migration; editor README no longer claims
  an undeclared sibling source override.
- 'Delegated takeover: explicitly confirmed processed-ordinal recovery now reaches strict validation when
  segments exist without frame rows; automatic recovery remains blocked. Existing regression case extended
  but not executed.'
