blockers:
- Registry resolution only offers lx-dtypes<=0.7.0. Publish reviewed 0.7.1 core artifacts before regenerating
  consumer uv.lock files; their existing locks remain stale and must not be used for this candidate.
- Normal backend Pyright must be rerun after installing matching published dependencies; candidate-wheel
  type check passes but does not update or verify the frozen consumer environments.
- No behavioral, integration, browser, database migration, or deployment verification was performed; static
  checks and successful builds are not production approval.
- Working trees contain substantial pre-existing staged and unstaged changes. The video timeline scope
  was taken over by a subagent at user request; final backend rebuild includes its code fix.
release_order:
- Review and commit the candidate source trees, including the delegated timeline work; retain all existing
  user changes.
- Rebuild artifacts from final source revisions and review artifact hashes.
- Publish lx-dtypes 0.7.1 first.
- Run uv lock in endoreg-db and lx-terminology-editor, then review and commit resulting locks.
- Install matching dependencies in the release environment and rerun static checks; resolve remaining
  feature gates before production.
- Publish backend and editor candidates only after the remaining gates are satisfied.
limits:
- No commits, tags, pushes, uploads, deployments, or database writes performed.
- Artifact checks describe local working-tree snapshots, not immutable release revisions.
- Source review concentrated on cross-repository contracts, metadata, packaging and static diagnostics;
  no claim of exhaustive behavioral review.
