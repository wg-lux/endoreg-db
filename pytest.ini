# filepath: /home/admin/dev/endo-ai/endoreg-db/pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = endoreg_db.config.settings.test
; Coverage flags live in the full test profile so local/PR runs can stay fast.
addopts = --reuse-db --log-disable=faker
python_files = tests.py test_*.py *_test.py
testpaths = tests/
pythonpath= .
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
env =
    D:PYTEST_XDIST_WORKER = main
    LX_ANNOTATE_ENCRYPTED_DATA_DIR = data/tests/workers/{PYTEST_XDIST_WORKER}/protected_runtime
    STORAGE_DIR = data/tests/workers/{PYTEST_XDIST_WORKER}/protected_runtime/storage
    DATA_DIR = data/tests/workers/{PYTEST_XDIST_WORKER}/runtime
    PROTECTED_MEDIA_ROOT = data/tests/workers/{PYTEST_XDIST_WORKER}/protected_runtime/storage
    DRF_THROTTLE_USER = 100000/hour
    DRF_THROTTLE_ANON = 100000/hour
    DJANGO_DEBUG = true
    DJANGO_SETTINGS_MODULE = endoreg_db.config.settings.test

# Configure logging for pytest. Opt into live/debug logs per run when needed.
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Disable specific loggers to reduce noise
log_level = WARNING
# logging_level = DEBUG

# Performance and test categorization markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    expensive: marks computationally expensive tests
    video: marks tests that require video processing
    pipeline: marks tests that run full video pipeline
    ai: marks tests that require AI inference
    ffmpeg: marks tests that require FFmpeg
    integration: marks integration tests
    unit: marks unit tests
    api: marks API endpoint tests

# Suppress verbose logging and warnings from specific modules
filterwarnings = 
    ignore:.*faker.*
    ignore::UserWarning:faker
    ignore::DeprecationWarning:faker

# Pytest logging configuration
# This completely disables faker logging
[pytest.logging]
disable = faker
