[project]
name = "lx-ai-core"
version = "0.1.0"
description = "Standalone local AI runtime core for LX medical model workflows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "WG Lux" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = [
  "numpy>=2.2",
  "pillow>=11.0",
  "torch>=2.5,<3",
]
dev = [
  "pytest>=8.3",
  "numpy>=2.2",
  "pillow>=11.0",
  "torch>=2.5,<3",
]

[project.scripts]
lx-ai-core = "lx_ai_core.cli:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/lx_ai_core_native/Cargo.toml"
module-name = "lx_ai_core._native"
bindings = "pyo3"
python-source = "src"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
