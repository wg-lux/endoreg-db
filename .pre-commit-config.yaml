default_stages:
  - commit
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: ["--fix", "endoreg_db", "tests"]
        pass_filenames: false
      - id: ruff-format
        args: ["endoreg_db", "tests"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: route-matrix-contract
        name: route matrix contract (backend vs frontend)
        entry: python scripts/check_route_matrix.py --warn-on-missing-backend
        language: system
        pass_filenames: false
        files: ^(endoreg_db/(urls|views)/.*\.py|endoreg_db/authz/policy\.py|docs/frontend_agent_url_contract\.md)$
      - id: pyright
        name: pyright type check
        entry: .devenv/state/venv/bin/pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: django-startup-smoke
        name: django startup smoke
        entry: .devenv/state/venv/bin/python scripts/check_django_startup_imports.py
        language: system
        pass_filenames: false
      - id: deployment-settings-contract
        name: deployment settings contract
        entry: pytest tests/deployment/test_prod_settings_contract.py -q
        language: system
        pass_filenames: false
      - id: pytest-expensive
        name: pytest expensive suite
        entry: pytest -m "expensive or pipeline or slow"
        language: system
        pass_filenames: false
        stages: [manual]
      - id: deploy-django
        name: deploy check for django resolve
        entry: python manage.py check --deploy
        language: system
        pass_filenames: false
      - id: resolve-django
        name: resolve all check_django_startup_imports
        entry: pytest tests/test_resolve.py
        language: system
        pass_filenames: false
