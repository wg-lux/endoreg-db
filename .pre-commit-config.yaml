default_stages:
  - pre-commit
default_install_hook_types:
  - pre-commit
  - commit-msg
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.9
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint changed Python files
        entry: .devenv/state/venv/bin/ruff check
        language: system
        types_or: [python, pyi]
        files: ^(endoreg_db|tests)/
      - id: ruff-format
        name: ruff format changed Python files
        entry: .devenv/state/venv/bin/ruff format
        language: system
        types_or: [python, pyi]
        files: ^(endoreg_db|tests)/
      - id: uv-lock
        name: check committed dependency lock (offline)
        entry: uv lock --check --offline
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: repository-structure
        name: hierarchical agent context paths
        entry: .devenv/state/venv/bin/python scripts/lint_structure.py
        language: system
        pass_filenames: false
        files: (^|/)structure\.yml$
      - id: canonical-type-contracts
        stages: [manual]
        name: canonical type ownership and contract boundaries
        entry: python scripts/check_lx_dtypes_contract_boundaries.py
        language: system
        pass_filenames: false
        files: '^(endoreg_db/.*\.pyi?|quality/lx_dtypes_contract_policy\.yml|scripts/check_lx_dtypes_contract_boundaries\.py)$'
      - id: route-matrix-contract
        stages: [manual]
        name: route matrix contract (backend vs frontend)
        entry: python scripts/check_route_matrix.py --warn-on-missing-backend
        language: system
        pass_filenames: false
        files: ^(endoreg_db/(urls|views)/.*\.py|endoreg_db/authz/policy\.py|docs/frontend_agent_url_contract\.md)$
      - id: pyright
        stages: [manual]
        name: pyright type check
        entry: pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: rust-tests
        stages: [manual]
        name: rust native backend unit tests
        entry: scripts/run_rust_tests.sh
        language: system
        pass_filenames: false
        files: ^(rust/endoreg_rust_backend/|scripts/run_rust_tests\.sh$)
      - id: state-mutation-owners
        stages: [manual]
        name: every status/state write has a reviewed owner
        entry: .devenv/state/venv/bin/python scripts/check_state_mutation_owners.py
        language: system
        pass_filenames: false
        files: ^(endoreg_db/.*\.py|quality/state_mutation_owners\.yml|scripts/check_state_mutation_owners\.py)$
      - id: documentation-governance
        stages: [manual]
        name: documentation governance inventory
        entry: python scripts/check_documentation_governance.py --repository endoreg-db
        language: system
        pass_filenames: false
        files: ^(README\.md|AGENTS\.md|docs/.*|quality/documentation_governance\.yml|scripts/check_documentation_governance\.py|tests/scripts/test_check_documentation_governance\.py)$
      - id: django-startup-smoke
        stages: [manual]
        name: django startup smoke
        entry: python scripts/check_django_startup_imports.py
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-expensive
        name: pytest expensive suite
        entry: pytest -m "expensive or pipeline or slow"
        language: system
        pass_filenames: false
        stages: [manual]
      - id: deploy-django
        stages: [manual]
        name: deploy check for django resolve
        entry: env DJANGO_SETTINGS_MODULE=endoreg_db.config.settings.test .devenv/state/venv/bin/python manage.py check --deploy
        language: system
        pass_filenames: false
