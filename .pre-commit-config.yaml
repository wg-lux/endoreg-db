repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: ["--fix", "endoreg_db", "tests"]
        pass_filenames: false
      - id: ruff-format
        args: ["endoreg_db", "tests"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: route-matrix-contract
        name: route matrix contract (backend vs frontend)
        entry: python scripts/check_route_matrix.py --warn-on-missing-backend
        language: system
        pass_filenames: false
        files: ^(endoreg_db/(urls|views)/.*\.py|endoreg_db/authz/policy\.py|docs/frontend_agent_url_contract\.md)$
      - id: mypy
        name: mypy type check
        entry: .devenv/state/venv/bin/mypy --config-file pyproject.toml
        language: system
        types: [python]
      - id: django-startup-smoke
        name: django startup smoke
        entry: python scripts/check_django_startup_imports.py
        language: system
        pass_filenames: false
      - id: pytest-expensive
        name: pytest expensive suite
        entry: pytest -m "expensive or pipeline or slow"
        language: system
        pass_filenames: false
        stages: [manual]
