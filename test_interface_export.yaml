    desai_use_2024:
      created_at: '2026-03-16T15:19:58.096849Z'
      uuid: ba261e89-898f-489b-b5a6-454c9a57f141
      tags: ''
      name: desai_use_2024
      name_de: unknown
      name_en: unknown
      description: 'INTRODUCTION: Adenoma per colonoscopy (APC) has recently been
        proposed as a quality measure for colonoscopy. We evaluated the impact of
        a novel artificial intelligence (AI) system, compared with standard high-definition
        colonoscopy, for APC measurement.

        METHODS: This was a US-based, multicenter, prospective randomized trial examining
        a novel AI detection system (EW10-EC02) that enables a real-time colorectal
        polyp detection enabled with the colonoscope (CAD-EYE). Eligible average-risk
        subjects (45 years or older) undergoing screening or surveillance colonoscopy
        were randomized to undergo either CAD-EYE-assisted colonoscopy (CAC) or conventional
        colonoscopy (CC). Modified intention-to-treat analysis was performed for all
        patients who completed colonoscopy with the primary outcome of APC. Secondary
        outcomes included positive predictive value (total number of adenomas divided
        by total polyps removed) and adenoma detection rate.

        RESULTS: In modified intention-to-treat analysis, of 1,031 subjects (age:
        59.1 ± 9.8 years; 49.9% male), 510 underwent CAC vs 523 underwent CC with
        no significant differences in age, gender, ethnicity, or colonoscopy indication
        between the 2 groups. CAC led to a significantly higher APC compared with
        CC: 0.99 ± 1.6 vs 0.85 ± 1.5, P = 0.02, incidence rate ratio 1.17 (1.03-1.33,
        P = 0.02) with no significant difference in the withdrawal time: 11.28 ± 4.59
        minutes vs 10.8 ± 4.81 minutes; P = 0.11 between the 2 groups. Difference
        in positive predictive value of a polyp being an adenoma among CAC and CC
        was less than 10% threshold established: 48.6% vs 54%, 95% CI -9.56% to -1.48%.
        There were no significant differences in adenoma detection rate (46.9% vs
        42.8%), advanced adenoma (6.5% vs 6.3%), sessile serrated lesion detection
        rate (12.9% vs 10.1%), and polyp detection rate (63.9% vs 59.3%) between the
        2 groups. There was a higher polyp per colonoscopy with CAC compared with
        CC: 1.68 ± 2.1 vs 1.33 ± 1.8 (incidence rate ratio 1.27; 1.15-1.4; P \textless
        0.01).

        DISCUSSION: Use of a novel AI detection system showed to a significantly higher
        number of adenomas per colonoscopy compared with conventional high-definition
        colonoscopy without any increase in colonoscopy withdrawal time, thus supporting
        the use of AI-assisted colonoscopy to improve colonoscopy quality ( ClinicalTrials.gov
        NCT04979962).'
