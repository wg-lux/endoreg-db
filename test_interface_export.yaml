        vs 35.2%, RR 1.15, 95% CI 1.01-1.32) but not 6 retrospective (35.7% vs 36.2%,
        RR 1.12, 95% CI 0.92-1.36) studies. Among 6 studies with APC data, APC rate
        ratio with vs without CADe was 1.12 (95% CI 0.95-1.33). In 4 studies with
        GI Genius (Medtronic), there was no difference in ADR with vs without CADe
        (RR 0.96, 95% CI 0.85-1.07).

        DISCUSSION: ADR, but not APC, was slightly higher with vs without CADe among
        all available real-world studies. This difference was attributed to the results
        of prospective but not retrospective studies. The discrepancies between these
        findings and those of randomized controlled trials call for future research
        on the true impact of current AI technology on colonoscopy quality and the
        subtleties of human-AI interactions.'
