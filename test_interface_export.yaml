    dannhauser_antinociceptive_2020:
      created_at: '2026-03-16T15:19:58.096728Z'
      uuid: 71301123-8cf4-495f-8c1a-5d6c4b97feb6
      tags: adhesion-GPCR,mechanosensory physiology,nociception
      name: dannhauser_antinociceptive_2020
      name_de: unknown
      name_en: unknown
      description: Adhesion-type GPCRs (aGPCRs) participate in a vast range of physiological
        processes. Their frequent association with mechanosensitive functions suggests
        that processing of mechanical stimuli may be a common feature of this receptor
        family. Previously, we reported that the Drosophila aGPCR CIRL sensitizes
        sensory responses to gentle touch and sound by amplifying signal transduction
        in low-threshold mechanoreceptors (Scholz et al., 2017). Here, we show that
        Cirl is also expressed in high-threshold mechanical nociceptors where it adjusts
        nocifensive behaviour under physiological and pathological conditions. Optogenetic
        in vivo experiments indicate that CIRL lowers cAMP levels in both mechanosensory
        submodalities. However, contrasting its role in touch-sensitive neurons, CIRL
        dampens the response of nociceptors to mechanical stimulation. Consistent
        with this finding, rat nociceptors display decreased Cirl1 expression during
        allodynia. Thus, cAMP-downregulation by CIRL exerts opposing effects on low-threshold
        mechanosensors and high-threshold nociceptors. This intriguing bipolar action
        facilitates the separation of mechanosensory signals carrying different physiological
        information.
      kb_module_name: citations
      citation_key: dannhauser_antinociceptive_2020
      title: Antinociceptive modulation by the adhesion GPCR CIRL promotes mechanosensory
        signal discrimination
