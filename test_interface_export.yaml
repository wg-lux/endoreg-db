    shaukat_computer-aided_2022:
      created_at: '2026-03-16T15:19:58.099650Z'
      uuid: 19d3572c-ca92-42ce-a3e4-c3571c449950
      tags: ''
      name: shaukat_computer-aided_2022
      name_de: unknown
      name_en: unknown
      description: 'BACKGROUND & AIMS: Colonoscopy for colorectal cancer screening
        is endoscopist dependent, and colonoscopy quality improvement programs aim
        to improve efficacy. This study evaluated the clinical benefit and safety
        of using a computer-aided detection (CADe) device in colonoscopy procedures.

        METHODS: This randomized study prospectively evaluated the use of a CADe device
        at 5 academic and community centers by US board-certified gastroenterologists
        (n = 22). Participants aged ≥40 scheduled for screening or surveillance (≥3
        years) colonoscopy were included; exclusion criteria included incomplete procedure,
        diagnostic indication, inflammatory bowel disease, and familial adenomatous
        polyposis. Patients were randomized by endoscopist to the standard or CADe
        colonoscopy arm using computer-generated, random-block method. The 2 primary
        endpoints were adenomas per colonoscopy (APC), the total number of adenomas
        resected divided by the total number of colonoscopies; and true histology
        rate (THR), the proportion of resections with clinically significant histology
        divided by the total number of polyp resections. The primary analysis used
        a modified intention-to-treat approach.

        RESULTS: Between January and September 2021, 1440 participants were enrolled
        to be randomized. After exclusion of participants who did not meet the eligibility
        criteria, 677 in the standard arm and 682 in the CADe arm were included in
        a modified intention-to-treat analysis. APC increased significantly with use
        of the CADe device (standard vs CADe: 0.83 vs 1.05, P = .002; total number
        of adenomas, 562 vs 719). There was no decrease in THR with use of the CADe
        device (standard vs CADe: 71.7% vs 67.4%, P for noninferiority \textless .001;
        total number of non-neoplastic lesions, 284 vs 375). Adenoma detection rate
        was 43.9% and 47.8% in the standard and CADe arms, respectively (P = .065).

        CONCLUSIONS: For experienced endoscopists performing screening and surveillance
        colonoscopies in the United States, the CADe device statistically improved
        overall adenoma detection (APC) without a concomitant increase in resection
        of non-neoplastic lesions (THR).

        CLINICALTRIALS: gov registration: NCT04754347.'
