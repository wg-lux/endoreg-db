    tiankanon_improvement_2024:
      created_at: '2026-03-16T15:19:58.100048Z'
      uuid: 8fe39f19-6edb-4084-aaf4-7332d29e2bb2
      tags: ''
      name: tiankanon_improvement_2024
      name_de: unknown
      name_en: unknown
      description: 'BACKGROUND: This study aimed to evaluate the benefits of a self-developed
        computer-aided polyp detection system (SD-CADe) and a commercial system (CM-CADe)
        for high adenoma detectors compared with white-light endoscopy (WLE) as a
        control.

        METHODS: Average-risk 50-75-year-old individuals who underwent screening colonoscopy
        at five referral centers were randomized to SD-CADe, CM-CADe, or WLE groups
        (1:1:1 ratio). Trainees and staff with an adenoma detection rate (ADR) of
        ≥35% were recruited. The primary outcome was ADR. Secondary outcomes were
        the proximal adenoma detection rate (pADR), advanced adenoma detection rate
        (AADR), and the number of adenomas, proximal adenomas, and advanced adenomas
        per colonoscopy (APC, pAPC, and AAPC, respectively).

        RESULTS: The study enrolled 1200 participants. The ADR in the control, CM-CADe,
        and SD-CADe groups was 38.3%, 50.0%, and 54.8%, respectively. The pADR was
        23.0%, 32.3%, and 38.8%, respectively. AADR was 6.0%, 10.3%, and 9.5%, respectively.
        After adjustment, the ADR and pADR in both intervention groups were significantly
        higher than in controls (all P\textless0.05). The APC in the control, CM-CADe,
        and SD-CADe groups was 0.66, 1.04, and 1.16, respectively. The pAPC was 0.33,
        0.53, and 0.64, respectively, and the AAPC was 0.07, 0.12, and 0.10, respectively.
        Both CADe systems showed significantly higher APC and pAPC than WLE. AADR
        and AAPC were improved in both CADe groups versus control, although the differences
        were not statistically significant.

        CONCLUSION: Even in high adenoma detectors, CADe significantly improved ADR
        and APC. The AADR tended to be higher with both systems, and this may enhance
        colorectal cancer prevention.'
