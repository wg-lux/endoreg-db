        by the high cost of manual annotations. Here, we show that a weakly supervised
        AI can be trained on data from a clinical routine database to learn visual
        patterns of GI diseases without any manual labeling or annotation. We trained
        a deep neural network on a dataset of N = 29,506 gastroscopy and N = 18,942
        colonoscopy examinations from a large endoscopy unit serving patients in Germany,
        the Netherlands and Belgium, using only routine diagnosis data for the 42
        most common diseases. Despite a high data heterogeneity, the AI system reached
        a high performance for diagnosis of multiple diseases, including inflammatory,
        degenerative, infectious and neoplastic diseases. Specifically, a cross-validated
        area under the receiver operating curve (AUROC) of above 0.70 was reached
        for 13 diseases, and an AUROC of above 0.80 was reached for two diseases in
        the primary data set. In an external validation set including six disease
        categories, the AI system was able to significantly predict the presence of
        diverticulosis, candidiasis, colon and rectal cancer with AUROCs above 0.76.
        Reverse engineering the predictions demonstrated that plausible patterns were
        learned on the level of images and within images and potential confounders
        were identified. In summary, our study demonstrates the potential of weakly
        supervised AI to generate high-performing classifiers and identify clinically
        relevant visual patterns based on non-annotated routine image data in GI endoscopy
        and potentially other clinical imaging modalities.
