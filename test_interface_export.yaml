    gimeno-garcia_usefulness_2023:
      created_at: '2026-03-16T15:19:58.097048Z'
      uuid: 858fe2b1-4f82-4100-aff6-9dd14c4bf50b
      tags: ''
      name: gimeno-garcia_usefulness_2023
      name_de: unknown
      name_en: unknown
      description: 'BACKGROUND AND AIMS: Artificial intelligence-based computer-aid
        detection (CADe) devices have been recently tested in colonoscopies, increasing
        the adenoma detection rate (ADR), mainly in Asian populations. However, evidence
        for the benefit of these devices in the occidental population is still low.
        We tested a new CADe device, namely, ENDO-AID (OIP-1) (Olympus, Tokyo, Japan),
        in clinical practice.

        METHODS: This randomized controlled trial included 370 consecutive patients
        who were randomized 1:1 to CADe (n = 185) versus standard exploration (n =
        185) from November 2021 to January 2022. The primary endpoint was the ADR.
        Advanced adenoma was defined as ≥10 mm, harboring high-grade dysplasia, or
        with a villous pattern. Otherwise, the adenoma was nonadvanced. ADR was assessed
        in both groups stratified by endoscopist ADR and colon cleansing.

        RESULTS: In the intention-to-treat analysis, the ADR was 55.1% (102/185) in
        the CADe group and 43.8% (81/185) in the control group (P = .029). Nonadvanced
        ADRs (54.8% vs 40.8%, P = .01) and flat ADRs (39.4 vs 24.8, P = .006), polyp
        detection rate (67.1% vs 51%; P = .004), and number of adenomas per colonoscopy
        were significantly higher in the CADe group than in the control group (median
        [25th-75th percentile], 1 [0-2] vs 0 [0-1.5], respectively; P = .014). No
        significant differences were found in serrated ADR. After stratification by
        endoscopist and bowel cleansing, no statistically significant differences
        in ADR were found.

        CONCLUSIONS: Colonoscopy assisted by ENDO-AID (OIP-1) increases ADR and number
        of adenomas per colonoscopy, suggesting it may aid in the detection of colorectal
        neoplastic lesions, especially because of its detection of diminutive and
        flat adenomas. (Clinical trial registration number: NCT04945044.).'
