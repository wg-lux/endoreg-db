    lux_regional_2019:
      created_at: '2026-03-16T15:19:58.098510Z'
      uuid: 362b09dc-8a1d-43ec-84f0-15c2d4beb8f6
      tags: ''
      name: lux_regional_2019
      name_de: unknown
      name_en: unknown
      description: The nervous system is shielded by special barriers. Nerve injury
        results in blood–nerve barrier breakdown with downregulation of certain tight
        junction proteins accompanying the painful neuropathic phenotype. The dorsal
        root ganglion (DRG) consists of a neuron-rich region (NRR, somata of somatosensory
        and nociceptive neurons) and a ﬁbre-rich region (FRR), and their putative
        epi-/perineurium (EPN). Here, we analysed blood–DRG barrier (BDB) properties
        in these physiologically distinct regions in Wistar rats after chronic constriction
        injury (CCI). Cldn5, Cldn12, and Tjp1 (rats) mRNA were downregulated 1 week
        after traumatic nerve injury. Claudin-1 immunoreactivity (IR) found in the
        EPN, claudin-19-IR in the FRR, and ZO-1-IR in FRR-EPN were unaltered after
        CCI. However, laser-assisted, vessel speciﬁc qPCR, and IR studies conﬁrmed
        a signiﬁcant loss of claudin-5 in the NRR. The NRR was three-times more permeable
        compared to the FRR for high and low molecular weight markers. NRR permeability
        was not further increased 1-week after CCI, but signiﬁcantly more CD68+ macrophages
        had migrated into the NRR. In summary, NRR and FRR are diﬀerent in naïve rats.
        Short-term traumatic nerve injury leaves the already highly permeable BDB
        in the NRR unaltered for small and large molecules. Claudin-5 is downregulated
        in the NRR. This could facilitate macrophage invasion, and thereby neuronal
        sensitisation and hyperalgesia. Targeting the stabilisation of claudin-5 in
        microvessels and the BDB barrier could be a future approach for neuropathic
        pain therapy.
