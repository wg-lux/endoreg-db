    ahmad_evaluation_2023:
      created_at: '2026-03-16T15:19:58.095608Z'
      uuid: d5bfb83b-29af-4b34-af14-701426d0891c
      tags: ''
      name: ahmad_evaluation_2023
      name_de: unknown
      name_en: unknown
      description: 'BACKGROUND: Polyp detection and resection during colonoscopy significantly
        reduce long-term colorectal cancer risk. Computer-aided detection (CADe) may
        increase polyp identification but has undergone limited clinical evaluation.
        Our aim was to assess the effectiveness of CADe at colonoscopy within a bowel
        cancer screening program (BCSP).

        METHODS: This prospective, randomized controlled trial involved all eight
        screening-accredited colonoscopists at an English National Health Service
        (NHS) BCSP center (February 2020 to December 2021). Patients were randomized
        to CADe or standard colonoscopy. Patients meeting NHS criteria for bowel cancer
        screening were included. The primary outcome of interest was polyp detection
        rate (PDR).

        RESULTS: 658 patients were invited and 44 were excluded. A total of 614 patients
        were randomized to CADe (n = 308) or standard colonoscopy (n = 306); 35 cases
        were excluded from the per-protocol analysis due to poor bowel preparation
        (n = 10), an incomplete procedure (n = 24), or a data issue (n = 1). Endocuff
        Vision was frequently used and evenly distributed (71.7 % CADe and 69.2 %
        standard). On intention-to-treat (ITT) analysis, there was a borderline significant
        difference in PDR (85.7 % vs. 79.7 %; P = 0.05) but no significant difference
        in adenoma detection rate (ADR; 71.4 % vs. 65.0 %; P = 0.09) for CADe vs.
        standard groups, respectively. On per-protocol analysis, no significant difference
        was observed in these rates. There was no significant difference in procedure
        times.

        CONCLUSIONS: In high-performing colonoscopists in a BCSP who routinely used
        Endocuff Vision, CADe improved PDR but not ADR. CADe appeared to have limited
        benefit in a BCSP setting where procedures are performed by experienced colonoscopists.'
