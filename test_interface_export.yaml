    penz_impact_2020:
      created_at: '2026-03-16T15:19:58.099059Z'
      uuid: 9add9643-6c72-4413-a5af-cc9f2b48b42d
      tags: ''
      name: penz_impact_2020
      name_de: unknown
      name_en: unknown
      description: 'Background and Aims

        Adenoma detection rate (ADR) is the best established quality parameter for
        screening colonoscopy. Guidelines recommend a target ADR \textgreater25% because
        previous studies have shown that patients of endoscopists with higher ADRs
        have a lower risk of postcolonoscopy interval cancers. However, studies have
        shown that improvement in ADR mainly results in increased detection of clinically
        irrelevant nonadvanced adenomas (NAAs). The impact of ADR on the detection
        of advanced adenomas (AAs) as well as adverse event rates has yet to be determined.

        Methods

        A total of 218,193 screening colonoscopies performed between 2007 and 2010
        by 262 endoscopists within the Austrian quality assurance program were analyzed.
        We divided endoscopists into quintiles based on ADRs and calculated mean advanced
        ADRs (AADRs), NAA detection rates (NAADRs), and adverse event rates for each
        quintile. Spearman rank-order was used to calculate overall correlations between
        ADRs and AADRs as well as adverse event rates. Endoscopists with an ADR \textless25%
        were compared with those with an ADR \textgreater25%.

        Results

        Fifty-one percent of patients were women. Mean ADR was 23.03% (95% confidence
        interval [CI], 21.93-24.13), AADRs 7.72% (95% CI, 7.19-8.25), and NAADRs 15.31%
        (95% CI, 14.36-16.27). Overall, there was a significant correlation between
        ADR and AADR (rho = .51; P \textless .001). When ADR was divided into quintiles,
        mean AADR increased with increasing ADR. Even in the highest ADR group (ADR,
        31.36%-52.27%) there was a further increase in AADR with a mean of 10.75%
        (95% CI, 9.31-12.19). Importantly, NAADRs increased continuously with improvement
        in ADRs but never dissociated from a simultaneous improvement in AADRs. However,
        there was also a significant correlation of ADRs and endoscopic adverse events
        (rho = .26, P \textless .001), even if the perforation rate of .028% (95%
        CI, .004-.052) in the highest ADR group still remained within the accepted
        limits based on guidelines.

        Conclusions

        Increasing ADR is associated with improved detection of AAs and therefore
        is likely to prevent more cases of colorectal cancer. However, higher ADR
        was also associated with a higher rate of adverse events, although the adverse
        event rate was low.'
