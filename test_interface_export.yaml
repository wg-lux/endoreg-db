    lux_pilot_2022:
      created_at: '2026-03-16T15:19:58.098381Z'
      uuid: 33c3a163-4e46-4bbc-962e-f00b9937375a
      tags: ''
      name: lux_pilot_2022
      name_de: unknown
      name_en: unknown
      description: 'Purpose Computer-aided polyp detection (CADe) systems for colonoscopy
        are already presented to increase adenoma detection rate (ADR) in randomized
        clinical trials. Those commercially available closed systems often do not
        allow for data collection and algorithm optimization, for example regarding
        the usage of different endoscopy processors. Here, we present the first clinical
        experiences of a, for research purposes publicly available, CADe system.

        Methods We developed an end-to-end data acquisition and polyp detection system
        named EndoMind. Examiners of four centers utilizing four different endoscopy
        processors used EndoMind during their clinical routine. Detected polyps, ADR,
        time to first detection of a polyp (TFD), and system usability were evaluated
        (NCT05006092).

        Results During 41 colonoscopies, EndoMind detected 29 of 29 adenomas in 66
        of 66 polyps resulting in an ADR of 41.5%. Median TFD was 130 ms (95%-CI,
        80–200 ms) while maintaining a median false positive rate of 2.2% (95%-CI,
        1.7–2.8%). The four participating centers rated the system using the System
        Usability Scale with a median of 96.3 (95%-CI, 70–100).

        Conclusion EndoMind’s ability to acquire data, detect polyps in real-time,
        and high usability score indicate substantial practical value for research
        and clinical practice. Still, clinical benefit, measured by ADR, has to be
        determined in a prospective randomized controlled trial.'
