        intensivmedizinische Versorgung erfordern. Vom Abdominellen Aortenaneurysma
        über HELLP-Syndrom und Sepsis bis hin zur Zyanose erfahren Intensivpflegekräfte
        und Pflegende in der Weiterbildung, alphabetisch geordnet, alles über - Definition
        und gängige Synonyme des Krankheitsbilds - Ursachen, Symptome, Diagnostik
        und Therapie - Hinweise zur Pflege, z.B. Patientenbeobachtung und spezielle
        Pflegehandlungen - Wichtige Zusatzinformationen und HinweiseZusätzlich enthalten
        die Checklisten eigene Kapitel zu speziellen Pflegemaßnahmen in der Intensivpflege
