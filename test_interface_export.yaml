    foroutan_computer_2025:
      created_at: '2026-03-16T15:19:58.096945Z'
      uuid: b5e99ac9-2617-4a81-a158-b115cb99e91b
      tags: Adult,Aged,Artificial Intelligence,Colonic Polyps,Colonoscopy,Colorectal
        Neoplasms,Computer-Assisted,Diagnosis,Early Detection of Cancer,Female,Humans,Male,Middle
        Aged,Practice Guidelines as Topic
      name: foroutan_computer_2025
      name_de: unknown
      name_en: unknown
      description: 'CLINICAL QUESTION: In adult patients undergoing colonoscopy for
        any indication (screening, surveillance, follow-up of positive faecal immunochemical
        testing, or gastrointestinal symptoms such as blood in the stools) what are
        the benefits and harms of computer-aided detection (CADe)?

        CONTEXT AND CURRENT PRACTICE: Colorectal cancer (CRC), the third most common
        cancer and the second leading cause of cancer-related death globally, typically
        arises from adenomatous polyps. Detection and removal of polyps during colonoscopy
        can reduce the risk of cancer. CADe systems use artificial intelligence (AI)
        to assist endoscopists by analysing real-time colonoscopy images to detect
        potential polyps. Despite their increasing use in clinical practice, guideline
        recommendations that carefully balance all patient-important outcomes remain
        unavailable. In this first iteration of a living guideline, we address the
        use of CADe at the level of an individual patient.

        EVIDENCE: Evidence for this recommendation is drawn from a living systematic
        review of 44 randomised controlled trials (RCTs) involving more than 30 000
        participants and a companion microsimulation study simulating 10 year follow-up
        for 100 000 individuals aged 60-69 years to assess the impact of CADe on patient-important
        outcomes. While no direct evidence was found for critical outcomes of colorectal
        cancer incidence and post-colonoscopy cancer incidence, low certainty data
        from the trials indicate that CADe may increase positive endoscopy findings.
        The microsimulation modelling, however, suggests little to no effect on CRC
        incidence, CRC-related mortality, or colonoscopy-related complications (perforation
        and bleeding) over the 10 year follow-up period, although low certainty evidence
        indicates CADe may increase the number of colonoscopies performed per patient.
        A review of values and preferences identified that patients value mortality
        reduction and quality of care but worry about increased anxiety, overdiagnosis,
        and more frequent surveillance.

        RECOMMENDATION: For adults who have agreed to undergo colonoscopy, we suggest
        against the routine use of CADe (weak recommendation).

        HOW THIS GUIDELINE WAS CREATED: An international panel, including three patient
        partners, 11 healthcare providers, and seven methodologists, deemed by MAGIC
        and The BMJ to have no relevant competing interests, developed this recommendation.
        For this guideline the panel took an individual patient approach. The panel
        started by defining the clinical question in PICO format, and prioritised
        outcomes including CRC incidence and mortality. Based on the linked systematic
        review and microsimulation study, the panel sought to balance the benefits,
        harms, and burdens of CADe and assumed patient preferences when making this
        recommendation UNDERSTANDING THE RECOMMENDATION: The guideline panel found
        the benefits of CADe on critical outcomes, such as CRC incidence and post-colonoscopy
        cancer incidence, over a 10 year follow up period to be highly uncertain.
        Low certainty evidence suggests little to no impact on CRC-related mortality,
        while the potential burdens-including more frequent surveillance colonoscopies-are
        likely to affect many patients. Given the small and uncertain benefits and
        the likelihood of burdens, the panel issued a weak recommendation against
        routine CADe use.The panel acknowledges the anticipated variability in values
        and preferences among patients and clinicians when considering these uncertain
        benefits and potential burdens. In healthcare settings where CADe is available,
        individual decision making may be appropriate.

        UPDATES: This is the first iteration of a living practice guideline. The panel
        will update this living guideline if ongoing evidence surveillance identifies
        new CADe trial data that substantially alters our conclusions about CRC incidence,
        mortality, or burdens, or studies that increase our certainty in values and
        preferences of individual patients. Updates will provide recommendations on
        the use of CADe from a healthcare systems perspective (including resource
        use, acceptability, feasibility, and equity), as well as the combined use
        of CADe and computer aided diagnosis (CADx). Users can access the latest guideline
        version and supporting evidence on MAGICapp, with updates periodically published
        in The BMJ.'
