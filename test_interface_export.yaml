    van_toledo_serrated_2022:
      created_at: '2026-03-16T15:19:58.100176Z'
      uuid: bc32a1d0-b9ae-4d06-9e8d-7be3414efda4
      tags: Adenoma,Colonic Polyps,Colonoscopy,Colorectal Neoplasms,Early Detection
        of Cancer,Humans
      name: van_toledo_serrated_2022
      name_de: unknown
      name_en: unknown
      description: 'BACKGROUND: Adenoma detection rate (ADR) is a well-established
        quality indicator for colonoscopy and is inversely associated with the incidence
        of interval post-colonoscopy colorectal cancer. However, interval post-colonoscopy
        colorectal cancers frequently develop from serrated polyps, which are not
        included in the ADR. Therefore, the proximal serrated polyp detection rate
        (PSPDR) has been proposed as a quality indicator, but its association with
        interval post-colonoscopy colorectal cancer has not been studied. We aimed
        to evaluate this potential association based on data collected in the Dutch
        colorectal cancer screening programme.

        METHODS: In this population-based study, using colonoscopy data from the Dutch
        faecal immunochemical test-based colorectal cancer screening programme and
        cancer data from the Netherlands Cancer Registry, we evaluated the association
        between endoscopists'' individual PSPDR and their patients'' risk of interval
        post-colonoscopy colorectal cancer with a shared frailty Cox proportional-hazard
        regression analysis. Participants in the screening programme who were eligible
        for inclusion were aged 55-76 years, had a positive faecal immunochemical
        test (cutoff 15 μg Hb/g faeces at start and changed mid-2014 to 47 μg Hb/g
        faeces), were asymptomatic, and underwent a colonoscopy between Jan 1, 2014,
        and Dec 31, 2020. The PSPDR was defined as the proportion of colonoscopies
        in which at least one serrated polyp proximal to the descending colon was
        detected, confirmed by histopathology. The ADR was defined as the proportion
        of all colonoscopies in which at least one conventional adenoma was detected,
        confirmed by histopathology. Detection rates were determined for each endoscopist
        individually. We additionally evaluated the risk of interval post-colonoscopy
        colorectal cancer for endoscopists with a PSPDR and ADR above the median versus
        endoscopists with either one or both parameters below the median. This study
        is registered with the Netherlands Trial Registry, NL8350.

        FINDINGS: During the study period, 329 104 colonoscopies were done, of which
        277 555, done by 441 endoscopists, were included in the PSPDR calculations.
        The median PSPDR was 11·9% (IQR 8·3-15·8) and median ADR was 66·3% (61·4-69·9).
        The correlation between the PSDPR and ADR was moderate (r=0·59; p\textless0·0001).
        During a median follow-up of 33 months (IQR 21-42), 305 interval post-colonoscopy
        colorectal cancers were detected. For each percentage point increase in PSPDR,
        the adjusted interval post-colonoscopy colorectal cancer hazard was 7% lower
        (hazard ratio [HR] 0·93, 95% CI 0·90-0·95; p\textless0·0001). Compared with
        endoscopists with a PSPDR greater than 11·9% and ADR greater than 66·3%, the
        HR of interval post-colonoscopy colorectal cancer for endoscopists with a
        low PSPDR and high ADR was 1·79 (95% CI 1·22-2·63), for endoscopists with
        a high PSPDR and low ADR was 1·97 (1·19-3·24), and for endoscopists with a
        low PSPDR and low ADR was 2·55 (1·89-3·45).

        INTERPRETATION: The PSPDR of an endoscopist is inversely associated with the
        incidence of interval post-colonoscopy colorectal cancer. Implementation of
        PSPDR monitoring, in addition to ADR monitoring, could optimise colorectal
        cancer prevention.

        FUNDING: None.'
