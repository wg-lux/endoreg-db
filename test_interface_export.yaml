      description: Background Tandem colonoscopy studies have found that about one
        in five adenomas are missed at colonoscopy. It remains debatable whether the
        combination of a computer-aided polyp detection (CADe) system with a computeraided
        quality improvement (CAQ) system for real-time monitoring of withdrawal speed
