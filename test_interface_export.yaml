    zhao_magnitude_2019:
      created_at: '2026-03-16T15:19:58.100921Z'
      uuid: ce3242c0-f1bf-4d93-af94-41ee949fa46f
      tags: ''
      name: zhao_magnitude_2019
      name_de: unknown
      name_en: unknown
      description: 'Background & Aims

        We performed a systematic review and meta-analysis to comprehensively estimate
        adenoma miss rate (AMR) and advanced AMR (AAMR) and explore associated factors.

        Methods

        We searched the PubMed, Web of Science, and Ovid EMBASE databases for studies
        published through April 2018 on tandem colonoscopies, with AMR and AAMR as
        the primary outcomes. We performed meta-regression analyses to identify risk
        factors and factors associated with outcome. Primary outcomes were AMR and
        AAMR and secondary outcomes were AMR and AAMR for different locations, sizes,
        pathologies, morphologies, and populations.

        Results

        In a meta-analysis of 43 publications and more than 15,000 tandem colonoscopies,
        we calculated miss rates of 26% for adenomas (95% confidence interval [CI]
