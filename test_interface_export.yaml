        a visible instrument). The test dataset included 10 full-colonoscopy videos
        that were analyzed for the recognition of visible instruments and detections
        by a commercially available CADe system (GI Genius, Medtronic). Results The
        test dataset contained 153,623 images, 8.84% of those presented visible instruments
        (12 interventions, 19 instruments used). The convolutional neuronal network
        reached an overall accuracy in the detection of visible instruments of 98.59%.
        Sensitivity and specificity were 98.55% and 98.92%, respectively. A mean of
        462.8 frames containing distracting CADe detections per colonoscopy were avoided
        using the convolutional neuronal network. This accounted for 95.6% of all
        distracting CADe detections. Conclusions Detection of endoscopic instruments
        in colonoscopy using artificial intelligence technology is reliable and achieves
        high sensitivity and specificity. Accordingly, the new convolutional neuronal
        network could be used to reduce distracting CADe detections during endoscopic
        procedures. Thus, our study demonstrates the great potential of artificial
        intelligence technology beyond mucosal assessment.
