[package]
name = "endoreg_rust_backend"
version = "0.1.0"
edition = "2021"
description = "Native performance and integrity primitives for endoreg-db"
license = "GPL-3.0-only"
homepage = "https://info.coloreg.de"
documentation = "https://github.com/wg-lux/endoreg-db/tree/main/docs"
repository = "https://github.com/wg-lux/endoreg-db"

[lib]
name = "endoreg_rust_backend"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
libc = "0.2"
pyo3 = { version = "0.22", features = ["extension-module"] }
pyo3-stub-gen = { version = "0.6", default-features = false }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
